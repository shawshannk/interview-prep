fu:[{q:"For 'run this cron job on only one of four instances', what would you use?",a:"Usually a scheduler that runs it once (EventBridge Scheduler triggering one task), which avoids the problem entirely. If it must be in-app, a DB lock or a lease in DynamoDB with a conditional write, and the job itself made idempotent in case two runs overlap."}],
rf:["Treats a Redis lock as a correctness guarantee","Releases a lock without checking ownership","No TTL, so a crash holds the lock forever"]},

{id:"A044",skill:"Distributed Fundamentals",level:"Intermediate",type:"Scenario",
q:"An audit timeline merges events from several services ordered by timestamp, and users see effects before their causes. What's wrong, and how do you fix it?",
a:`<p>Wall clocks on different machines drift and are corrected by NTP, so skew of milliseconds (or worse on a misconfigured host) is normal. Timestamps from different machines can't establish ordering, and causally related events can appear reversed.</p>
<p><b>Fixes, depending on what you need:</b></p>
<ul>
<li><b>Order within one entity:</b> use a sequence or version assigned by the entity's owner in the same transaction as the change.</li>
<li><b>Causal order across services:</b> carry the cause's ID or version in the effect event (<code>causationId</code>), and order by that relationship. Logical clocks (Lamport, or hybrid logical clocks) encode it more generally.</li>
<li><b>A single total order:</b> append everything to one ordered log (one partition), at the cost of throughput.</li>
<li>For display, a timestamp is fine as long as you also show ties and causal links consistently.</li>
</ul>`,
keys:["Clock skew is normal","Per-entity sequence from the owner","Causation IDs or logical clocks","Total order only via a single log"],
trade:["A single ordered log gives a total order but limits throughput","Hybrid logical clocks keep timestamps human-readable while respecting causality, at implementation cost"],
fu:[{q:"Does using UTC solve it?",a:"No. UTC removes time-zone confusion, but different machines still disagree about the current UTC time by their skew."}],
rf:["\"Use DateTime.UtcNow everywhere\" as the fix","Assumes NTP gives perfect sync"]},

{id:"A045",skill:"Distributed Fundamentals",level:"Intermediate",type:"Concept",
q:"Why do consensus-based systems (Kafka KRaft, etcd, ZooKeeper) run 3 or 5 nodes and not 4? What is split brain?",
a:`<p>Consensus protocols such as Raft need a <b>majority quorum</b> to elect a leader and commit writes. With n nodes, they tolerate ⌊(n−1)/2⌋ failures: 3 nodes tolerate 1, 4 nodes still tolerate only 1 (a majority of 4 is 3), and 5 tolerate 2. An even count adds cost and coordination without adding fault tolerance.</p>
<p><b>Split brain</b> is when a network partition leaves two groups that each believe they're in charge and accept conflicting writes. A majority quorum prevents it: only one side can hold a majority, so the minority side refuses to make progress. That is the "C over A during a partition" choice from CAP, made concretely.</p>`,
keys:["Majority quorum","Failures tolerated formula","Even counts add no tolerance","Split brain defined","Quorum prevents it by sacrificing minority availability"],
fu:[{q:"Why not run 7 or 9 nodes for more safety?",a:"Every write must reach a majority, so more nodes mean more latency and more network traffic per commit. 3 or 5 is the usual balance; 5 when you want to survive one failure during maintenance on another."}],
rf:["Thinks more nodes always improves availability linearly","Can't explain why 4 isn't better than 3"]},

{id:"A046",skill:"API Design",level:"Intermediate",type:"Architecture",
q:"REST, gRPC or GraphQL: how do you choose for an API?",
a:`<ul>
<li><b>REST over HTTP/JSON:</b> the default for public and partner APIs. Universal tooling, HTTP caching, easy debugging. Weakness: over- and under-fetching for varied clients.</li>
<li><b>gRPC:</b> strong fit for internal service-to-service calls. A Protobuf contract with codegen, compact binary payloads, HTTP/2 multiplexing, and streaming. Weaknesses: browsers need gRPC-Web or a proxy, payloads are harder to inspect, and HTTP caching doesn't apply.</li>
<li><b>GraphQL:</b> fits client-driven aggregation across many resources, especially when several frontends need different shapes. Costs: N+1 resolver problems (needs DataLoader-style batching), query cost limiting and depth limits for security, harder HTTP caching, and authorization at field level.</li>
</ul>
<p>Common combination: REST or GraphQL at the edge for clients, gRPC or events internally.</p>`,
keys:["Fit by consumer: public, internal, multi-client","gRPC browser limitation","GraphQL N+1 and query-cost security","Caching differences","Combinations are normal"],
trade:["REST: simple and cacheable, chatty for complex screens","gRPC: fast and typed, poorer for browsers and ad-hoc debugging","GraphQL: flexible for clients, more server-side complexity and security work","It depends on: who the clients are, payload diversity, team familiarity"],
fu:[{q:"What security issues are specific to GraphQL?",a:"Deeply nested or very wide queries that are expensive to resolve (denial of service), introspection exposing the schema in production, and authorization that has to be enforced per field or per resolver rather than per endpoint. Mitigate with depth and cost limits, persisted queries, and resolver-level authz."}],
rf:["\"GraphQL replaces REST\"","Proposes gRPC directly to browsers with no mention of gRPC-Web","No mention of N+1 for GraphQL"]},

{id:"A047",skill:"API Design",level:"Intermediate",type:"Concept",
q:"How should an API report errors so clients can handle them consistently?",
a:`<p>Use <b>Problem Details</b> (RFC 9457, which replaced RFC 7807): a JSON body with <code>type</code>, <code>title</code>, <code>status</code>, <code>detail</code> and <code>instance</code>, plus extension fields such as a machine-readable <code>errorCode</code>, field-level validation errors, and a <code>traceId</code>.</p>
<ul>
<li>Use status codes for the category: 400 validation, 401 not authenticated, 403 not allowed, 404, 409 conflict, 412 precondition, 422 semantic error, 429 throttled, 5xx server faults.</li>
<li>Clients branch on <code>errorCode</code>, never on message text.</li>
<li>Never return stack traces or internal details. Log them server-side under the trace ID.</li>
</ul>
<p>In ASP.NET Core, <code>AddProblemDetails()</code> (.NET 7+) standardises error output, and .NET 8's <code>IExceptionHandler</code> maps exceptions to Problem Details in one place.</p>`,
keys:["RFC 9457 Problem Details","Stable machine-readable error codes","Correct status code categories","Trace ID for support","No internals leaked"],
fu:[{q:"401 or 403 when a user requests another user's private resource?",a:"403 is correct if they're authenticated but not allowed. Many APIs return 404 instead, so the response doesn't reveal that the resource exists. Choose deliberately and be consistent."}],
rf:["200 with an error flag in the body","Different error shapes per endpoint","Exception messages or stack traces returned to clients"]},

{id:"A048",skill:"API Design",level:"Intermediate",type:"Scenario",
q:"An endpoint generates a report that takes about 3 minutes, and clients are timing out. How do you redesign it?",
a:`<p>Make it an <b>asynchronous operation</b>:</p>
<ol>
<li><code>POST /reports</code> validates the request, enqueues a job and returns <code>202 Accepted</code> with a <code>Location</code> header pointing to <code>/reports/{id}</code>. Accept an idempotency key so a retried POST doesn't start a second job.</li>
<li>A worker (SQS + Lambda or an ECS worker) generates the report and stores it in S3.</li>
<li>The client <b>polls</b> <code>GET /reports/{id}</code> for status (<code>queued</code>, <code>running</code>, <code>succeeded</code>, <code>failed</code>), with a <code>Retry-After</code> hint. Or the server <b>pushes</b> completion via a webhook, WebSocket or push notification.</li>
<li>On success the status resource returns a time-limited pre-signed S3 URL for download.</li>
</ol>
<p>Also support cancellation and job expiry, and cap concurrent jobs per user so one client can't flood the workers.</p>`,
keys:["202 + status resource","Idempotency key on creation","Worker + queue + object storage","Poll vs push trade-off","Pre-signed URL, limits and cancellation"],
trade:["Polling is simple and firewall-friendly but adds request load","Webhooks/push are efficient but need delivery retries, signatures and a reachable client","It depends on: client type (mobile, browser, partner backend) and how quickly completion must be noticed"],
fu:[{q:"Why not just raise the timeouts to 5 minutes?",a:"Load balancers, gateways (API Gateway's integration timeout is limited) and mobile networks will cut long requests anyway. A retry then starts the work again, and you hold server resources for the whole duration. It fails under load."}],
rf:["Increase every timeout","No idempotency, so retries create duplicate jobs","Streams the report through the API server instead of object storage"]},

{id:"A049",skill:"Rate Limiting & Scaling",level:"Intermediate",type:"Concept",
q:"Compare rate-limiting algorithms: fixed window, sliding window and token bucket. What does .NET give you out of the box?",
a:`<ul>
<li><b>Fixed window:</b> N requests per clock window. Cheap, but allows a burst of 2N across a window boundary.</li>
<li><b>Sliding window:</b> a log of timestamps (exact, memory-heavy) or weighted counters of the current and previous window (approximate, cheap). It smooths the boundary problem.</li>
<li><b>Token bucket:</b> tokens refill at a steady rate up to a capacity, and each request spends one. It allows controlled bursts up to the capacity while enforcing the average rate. AWS API Gateway throttling uses this model.</li>
<li><b>Leaky bucket:</b> processes at a constant output rate, smoothing bursts by queueing them.</li>
</ul>
<p>ASP.NET Core (.NET 7+) ships rate-limiting middleware: <code>AddRateLimiter</code> with fixed window, sliding window, token bucket and concurrency limiters, and partitioning by key (user, API key, IP). Its state is <b>in-process</b>, so on several instances each enforces its own limit.</p>`,
keys:["Boundary burst in fixed window","Token bucket allows bounded bursts","Partition key choice","Built-in limiter is per instance"],
fu:[{q:"What should a throttled response look like?",a:"429 Too Many Requests with a Retry-After header, and optionally headers telling clients their limit and remaining quota. Clients should back off with jitter rather than retry immediately."}],
rf:["Doesn't know the boundary problem","Assumes the in-process limiter is global across instances"]},

{id:"A050",skill:"Rate Limiting & Scaling",level:"Intermediate",type:"Scenario",
q:"Your API runs on 10 instances and must enforce 100 requests per minute per user. The built-in limiter lets users exceed it. How do you implement a global limit?",
a:`<p>Each instance counts separately, so a user spread across 10 instances can get up to 10× the limit. Options:</p>
<ul>
<li><b>Shared counter in Redis:</b> an atomic operation per request. A Lua script that increments and sets expiry for a fixed window, or maintains a sorted set or weighted counters for a sliding window. This adds one Redis round trip per request.</li>
<li><b>At the edge:</b> API Gateway usage plans with API keys, or AWS WAF rate-based rules, enforce limits before traffic reaches your instances. They suit coarse per-key or per-IP limits.</li>
<li><b>Approximate local limits:</b> limit ÷ instance count, with sticky routing by user. Cheap, but inaccurate as instances scale.</li>
</ul>
<p>Decide <b>fail-open or fail-closed</b> when Redis is unavailable. For abuse protection, failing open (serving traffic) is usually right; for paid quota enforcement you may fail closed. Return 429 with <code>Retry-After</code>.</p>`,
keys:["Explains why per-instance limits multiply","Atomic shared counter (Lua/INCR+EXPIRE)","Edge enforcement options","Fail-open vs fail-closed decision","Per-user key choice"],
trade:["Redis gives accuracy at the cost of latency and a dependency","Edge limits are cheap and protect your compute, but are coarse and not user-aware unless keyed","It depends on: whether the limit is for abuse protection or billing, and accuracy needed"],
fu:[{q:"Why must the Redis increment be atomic?",a:"A GET-then-SET from two instances can both read 99 and both allow the request. INCR is atomic, and a Lua script keeps multi-step logic (increment, set expiry, check) atomic in one round trip."}],
rf:["Doesn't realise in-process limits don't add up","GET then SET in Redis without atomicity","No decision on Redis failure behaviour"]},

{id:"A051",skill:"Event-Driven",level:"Advanced",type:"Scenario",
q:"Your outbox table has grown to 30 million rows, the relay is 20 minutes behind, and database CPU is high. Diagnose it and fix it.",
a:`<p>Likely causes, roughly in order of frequency:</p>
<ul>
<li><b>No cleanup.</b> Sent rows are never deleted, so the table and its indexes keep growing and the "pending" query scans more and more.</li>
<li><b>Poor polling query.</b> <code>WHERE sent_at IS NULL ORDER BY id</code> without a filtered or partial index on unsent rows does a large scan on every poll.</li>
<li><b>Relay concurrency.</b> Several relay instances fight over the same rows with row locks, or one relay publishes one message at a time with a synchronous round trip each.</li>
<li><b>Large transactions</b> marking rows as sent, which hold locks against the business writes inserting new outbox rows.</li>
</ul>
<p><b>Fixes:</b></p>
<ul>
<li>Add a partial index (PostgreSQL <code>WHERE sent_at IS NULL</code>) or a filtered index (SQL Server).</li>
<li>Claim batches with <code>FOR UPDATE SKIP LOCKED</code> (PostgreSQL) or <code>READPAST, UPDLOCK</code> (SQL Server), so relay instances don't block each other.</li>
<li>Publish batches asynchronously and await them together.</li>
<li>Delete sent rows in small batches on a schedule, or partition the table by day and drop old partitions.</li>
<li>If volume justifies it, move to CDC (Debezium outbox event router), which removes polling load entirely.</li>
</ul>
<p>Meanwhile, publish lag is now a data-freshness incident for every downstream consumer, so communicate it.</p>`,
keys:["Cleanup/retention as root cause","Index for the pending query","SKIP LOCKED / READPAST for concurrent relays","Batch async publishing","CDC as the structural fix with its cost"],
trade:["Several relays with SKIP LOCKED increase throughput but weaken global ordering; keep per-aggregate order by partitioning claims","Partition-drop cleanup is cheap but needs partitioning set up","CDC removes polling but adds Kafka Connect/Debezium operations"],
fu:[{q:"How do you keep per-aggregate order with parallel relays?",a:"Assign each relay a subset of aggregates (hash of aggregate ID modulo relay count, or an outbox partition column), so a given aggregate's events are always published by one relay in sequence."}],
rf:["\"Add more relay instances\" without a locking strategy","Deletes millions of rows in one transaction","Doesn't treat the lag as a consumer-facing incident"]},

{id:"A052",skill:"Event-Driven",level:"Advanced",type:"Architecture",
q:"A consumer must capture a payment by calling a provider API that has no idempotency support. How do you design it so redelivery never double-charges?",
a:`<p>If the provider can't deduplicate, your side must make the outcome of every attempt knowable before any retry.</p>
<ol>
<li><b>Record intent first.</b> In your DB, create a capture record keyed by the business ID (order ID) with a unique constraint, in state <code>PENDING</code>, and generate a merchant reference you send to the provider.</li>
<li><b>Call the provider.</b> On a clear success, set <code>SUCCEEDED</code> with the provider's transaction ID. On a clear rejection, set <code>FAILED</code>.</li>
<li><b>On an ambiguous result</b> (timeout, 5xx, crash mid-call), do <b>not</b> retry the capture. Set <code>UNKNOWN</code>, then <b>query the provider by merchant reference</b> to learn what happened. Retry only once the provider confirms no charge exists.</li>
<li><b>Redelivery</b> of the event finds the existing record and follows its state instead of calling again.</li>
<li><b>Reconciliation:</b> a scheduled job compares your records with the provider's settlement reports and alerts on mismatches.</li>
</ol>`,
keys:["Durable intent record before the external call","Unique business key","Ambiguous outcome handled by lookup, not retry","State machine drives redelivery behaviour","Reconciliation as the backstop"],
trade:["Lookup-before-retry adds latency and depends on the provider having a search API; if it doesn't, route UNKNOWN to manual review","Strict sequential handling per order reduces throughput but avoids racing attempts"],
fu:[{q:"What if the provider has no way to look up a charge?",a:"Then you can't safely automate retries of ambiguous attempts. Park them for human review, rely on settlement-file reconciliation, and push the provider (or switch provider) for idempotency keys. Say this plainly to stakeholders: the risk is in the dependency."}],
rf:["Retries on timeout","Relies on Kafka exactly-once to protect an external API","No reconciliation process"]},

{id:"A053",skill:"Event-Driven",level:"Advanced",type:"Scenario",
q:"In an orchestrated checkout saga, payment succeeded but inventory reservation timed out. Meanwhile another order reserved the last unit. What went wrong, and how do you design against it?",
a:`<p>Sagas have <b>no isolation</b> between steps. Other transactions can see and act on intermediate state, which causes lost updates and dirty reads at the business level. Here, payment was taken before stock was secured, and the timeout left the outcome ambiguous.</p>
<p><b>Design responses:</b></p>
<ul>
<li><b>Order steps by risk.</b> Do the step most likely to fail and cheapest to compensate first: reserve stock (with an expiry), then capture payment. Authorise rather than capture until the end.</li>
<li><b>Semantic locks:</b> represent in-progress state explicitly (<code>RESERVED_PENDING</code>) so other sagas see it and act accordingly.</li>
<li><b>Ambiguous step outcome:</b> the orchestrator queries the inventory service for the reservation's real status before deciding to compensate. The reservation may have succeeded late.</li>
<li><b>Compensation:</b> void the authorisation, or refund if captured. Notify the user with a clear status. Compensations are idempotent and retried.</li>
<li><b>Timeouts</b> are explicit saga states with defined next steps, not exceptions.</li>
</ul>`,
keys:["Saga lack of isolation named","Step ordering by failure likelihood and compensation cost","Authorise vs capture","Semantic lock / pending states","Resolve ambiguous outcomes before compensating"],
trade:["Reservation expiries free stock but can cancel slow customers","Authorise-then-capture reduces refunds but authorisations expire (often days), so the saga needs a deadline","It depends on: stock contention, payment provider capabilities, customer experience priorities"],
fu:[{q:"Why not hold a database lock across the saga?",a:"The steps span services and possibly seconds to minutes. Locks across that span kill throughput and can't be held across service boundaries anyway. Sagas accept the lack of isolation and handle it with countermeasures."}],
rf:["Suggests a distributed transaction","Compensates immediately on timeout without checking status","Captures payment as the first step by default"]},

{id:"A054",skill:"Event-Driven",level:"Advanced",type:"Architecture",
q:"Design notification fan-out for a social app: when someone posts in a private group, up to 5,000 members get an in-app notification and a push notification.",
a:`<p>Flow:</p>
<ol>
<li>The post service writes the post and an outbox event <code>PostCreated(groupId, postId, authorId)</code>.</li>
<li>A <b>fan-out worker</b> consumes it, pages through group membership in batches of 500, and emits one <b>notification job per batch</b> to a queue. It does not create 5,000 messages synchronously in one handler.</li>
<li><b>Batch workers</b> apply each recipient's preferences (muted group, quiet hours), write in-app notification rows in bulk, and send push via the provider's batch API (FCM, APNs through SNS, or a provider like OneSignal).</li>
<li>Deduplicate by <code>(recipientId, postId)</code> so retries don't double-notify.</li>
</ol>
<p>Concerns to cover:</p>
<ul>
<li><b>Priority:</b> direct messages go to a separate, faster queue than group posts, so a big group doesn't delay DMs.</li>
<li><b>Very large groups:</b> for in-app, store the notification once per group and resolve it on read (fan-out on read) rather than 5,000 writes.</li>
<li><b>Provider limits:</b> respect push rate limits, and clean up invalid device tokens from provider responses.</li>
<li><b>Aggregation:</b> "12 new posts in Design Club" instead of 12 pushes.</li>
</ul>`,
keys:["Async fan-out in batches, not one giant handler","Preference filtering in workers","Idempotency per recipient","Priority separation","Fan-out on write vs read for large groups","Token hygiene and aggregation"],
trade:["Fan-out on write: fast reads, write amplification for big groups","Fan-out on read: cheap writes, more expensive reads and harder per-user read state","Hybrid by group size is common","It depends on: group size distribution, read/write ratio, latency target for notifications"],
fu:[{q:"How do you handle a user who is in the group but just blocked the author?",a:"Apply block and mute rules at delivery time in the batch worker, not at fan-out start, since state may change between the two. The same check runs again when rendering in-app notifications."}],
rf:["Loops over 5,000 members inside the post request","No dedup, so retries spam users","DMs and group posts share one queue"]},

{id:"A055",skill:"Event-Driven",level:"Advanced",type:"Concept",
q:"A team proposes publishing CDC (Debezium) change events straight from their tables for other teams to consume. What are the risks, and what would you recommend?",
a:`<p>Raw table CDC exposes the <b>internal schema as a public contract</b>. Renaming a column, splitting a table or changing a type now breaks other teams. Row changes also lack business meaning: consumers reconstruct "order was cancelled" from a status column flip, and logic leaks into every consumer. A single business operation spanning several tables arrives as several unrelated row events. PII in columns flows everywhere by default.</p>
<p><b>Recommendation:</b> use CDC as the <i>transport</i> for an <b>outbox</b>. The service writes explicit domain events to its outbox table in the same transaction, and Debezium's outbox event router publishes them. Consumers get stable, intentional, versioned events with zero-polling latency. Raw table CDC is fine for internal uses that the owning team controls: replication into its own analytics, a search index it owns, or cache invalidation.</p>`,
keys:["Internal schema becomes a contract","Loss of business intent","Multi-table operations split apart","PII leakage","Outbox + CDC as the combined answer"],
fu:[{q:"When is raw CDC to other teams acceptable?",a:"For a data platform ingesting into a lake or warehouse, where the consumer explicitly accepts schema drift and handles it in a staging layer, with the source team notified of changes. Not for operational services reacting to business events."}],
rf:["\"CDC is free events, ship it\"","Doesn't see the coupling problem","Doesn't know outbox + CDC can be combined"]},

{id:"A056",skill:"Event-Driven",level:"Advanced",type:"Scenario",
q:"You need to emit OrderReadyToShip only when both OrderPaid and AddressVerified have arrived for an order. They come from different topics, in any order, sometimes hours apart. How do you build it?",
a:`<p>This is a <b>stateful join</b> across streams. Two practical approaches:</p>
<ul>
<li><b>Database-backed aggregator (common in .NET):</b> a consumer for each topic upserts into a <code>order_readiness</code> row keyed by orderId: <code>paid_at</code>, <code>address_verified_at</code>, and the source event versions. In the same transaction, if both are set and <code>ready_emitted = false</code>, flip it and write <code>OrderReadyToShip</code> to the outbox. Upserts must be idempotent and ignore stale versions.</li>
<li><b>Stream processor:</b> Kafka Streams, ksqlDB or Flink, with a keyed state store and a join window. Very scalable, but Kafka Streams is JVM-only (Streamiz is a .NET port of varying maturity), and windowed joins need a defined window length. "Hours apart" means a large window and a lot of state.</li>
</ul>
<p>Either way, decide what happens if the second event never arrives: a timeout that emits <code>OrderStuck</code> for operations or customer follow-up.</p>`,
keys:["Recognises a stateful join","Keyed state with idempotent, version-aware upserts","Emit-once guard in the same transaction (outbox)","Window/timeout for the missing event","Picks tooling for the stack honestly"],
trade:["DB aggregator: simple, transactional, uses existing skills; limited by DB write throughput","Stream processor: high throughput and built-in state, but new runtime and expertise","It depends on: volume, team skills, how long the join window must be"],
fu:[{q:"Two consumers for the two topics update the same row at the same time. Is that safe?",a:"Only if the check-and-emit is atomic. Use a conditional update (UPDATE … SET ready_emitted = true WHERE order_id = @id AND ready_emitted = false AND paid_at IS NOT NULL AND address_verified_at IS NOT NULL) and emit only if one row was affected, or rely on row locking with SELECT … FOR UPDATE."}],
rf:["Keeps the join state in process memory","Emits twice when both handlers see 'both present'","No plan for a missing event"]},

{id:"A057",skill:"Kafka",level:"Advanced",type:"Concept",
q:"How do you get exactly-once results when a Kafka consumer writes to PostgreSQL or SQL Server?",
a:`<p>Kafka transactions don't cover an external database. The standard technique is to <b>store the consumed offsets in the same DB transaction</b> as the business write, and treat the database, not Kafka, as the source of truth for progress:</p>
<pre><code>// on partition assignment: resume from the DB, not from Kafka's committed offset
.SetPartitionsAssignedHandler((c, parts) =&gt;
    parts.Select(tp =&gt; new TopicPartitionOffset(tp, offsetStore.GetNext(tp))))

// per record
await using var tx = await db.Database.BeginTransactionAsync();
await ApplyAsync(cr.Message.Value);                       // business change
await offsetStore.SaveAsync(cr.TopicPartition, cr.Offset.Value + 1); // same tx
await tx.CommitAsync();</code></pre>
<p>A crash before commit rolls back both, and the record is reprocessed. A crash after commit resumes past it. Alternatively use an idempotent upsert keyed by a natural ID with version checks, which gives the same effect without managing offsets. You can still commit to Kafka for lag monitoring, but it isn't authoritative.</p>`,
keys:["Kafka EOS doesn't extend to external DBs","Offsets stored atomically with the write","Seek on assignment from the DB","Idempotent upsert as an alternative"],
fu:[{q:"What breaks if you forget the assignment handler?",a:"The consumer resumes from Kafka's committed offset, which may be ahead of (lost records) or behind (reprocessing) what the DB recorded, so the guarantee disappears exactly when partitions move: during rebalances and restarts."}],
rf:["\"Enable Kafka transactions\" for a DB sink","Commits Kafka offsets and DB separately and calls it exactly-once"]},

{id:"A058",skill:"Kafka",level:"Advanced",type:"Concept",
q:"How do Kafka transactions work internally, and what does 'zombie fencing' mean?",
a:`<p>A transactional producer has a <code>transactional.id</code>. On <code>InitTransactions</code>, the <b>transaction coordinator</b> (a broker owning that ID's slice of the <code>__transaction_state</code> log) bumps the producer's <b>epoch</b>. The producer then writes to several partitions and can add consumed offsets (<code>SendOffsetsToTransaction</code>). On commit or abort, the coordinator writes <b>control markers</b> into each partition involved.</p>
<p>Consumers with <code>isolation.level=read_committed</code> only read up to the <b>last stable offset</b>, skipping aborted data. So an open transaction delays downstream visibility.</p>
<p><b>Zombie fencing:</b> if an old instance (for example one paused by GC and replaced) wakes up and writes with the same transactional ID, its epoch is older, so the broker rejects it. That stops two instances believing they own the same work.</p>
<p>Costs: extra round trips per transaction, added end-to-end latency for read_committed consumers, and the need for stable transactional IDs per logical producer.</p>`,
keys:["Coordinator and transaction log","Epoch-based fencing","Control markers","read_committed and last stable offset","Latency costs"],
fu:[{q:"What happens to read_committed consumers if a producer opens a transaction and hangs?",a:"Consumers can't read past the last stable offset on those partitions until the transaction completes or times out (transaction.timeout.ms), and then it is aborted. Long transactions directly increase consumer lag."}],
rf:["Thinks transactions make consumers' DB writes atomic","No idea what fencing protects against"]},

{id:"A059",skill:"Kafka",level:"Advanced",type:"Scenario",
q:"A broker died during peak traffic. Some producers got NotEnoughReplicas errors, and an audit later found a few acknowledged messages missing. Explain both.",
a:`<p><b>NotEnoughReplicas:</b> producers using <code>acks=all</code> with <code>min.insync.replicas=2</code> on RF=3 partitions whose ISR had already shrunk (one replica lagging) lost a second replica with the broker. ISR fell below 2, so writes were refused. That is the intended behaviour: durability over availability.</p>
<p><b>Missing acknowledged messages:</b> look for</p>
<ul>
<li>Producers or topics using <code>acks=1</code> (or older clients with that default). The leader acked, then died before followers copied the data, and a follower became leader without it.</li>
<li><code>unclean.leader.election.enable=true</code> letting an out-of-sync replica become leader.</li>
<li><code>min.insync.replicas=1</code>, which makes <code>acks=all</code> behave like <code>acks=1</code> once the ISR shrinks.</li>
</ul>
<p><b>Metrics to check:</b> <code>UnderReplicatedPartitions</code>, <code>UnderMinIsrPartitionCount</code>, <code>OfflinePartitionsCount</code>, and ISR shrink and expand rates before the failure. A lagging follower before the crash is the real early warning.</p>`,
keys:["Explains NotEnoughReplicas as correct behaviour","acks=1 / unclean election / min ISR=1 as data-loss paths","Pre-failure ISR shrink as the warning sign","Names the broker metrics"],
trade:["Strict durability (acks=all, min ISR 2) refuses writes during double failures","Relaxed settings stay writable but lose acknowledged data","It depends on: which topics carry money or audit data vs telemetry; set per topic"],
fu:[{q:"How should producers handle NotEnoughReplicas?",a:"It is retriable. Let the producer retry within delivery.timeout.ms, and if it still fails, surface the error to the caller or buffer to a durable local fallback. Never drop silently. Alert on the error rate."}],
rf:["Blames Kafka as 'losing data' without checking configs","Suggests lowering min ISR to stop the errors"]},

{id:"A060",skill:"Kafka",level:"Advanced",type:"Scenario",
q:"One tenant generates 60% of traffic. Keyed by tenantId, its partition is permanently lagging while the others idle. What are your options?",
a:`<ol>
<li><b>Re-examine the ordering requirement.</b> Usually order is needed per <i>entity</i> (order, account), not per tenant. Key by <code>tenantId:entityId</code> and the big tenant spreads across all partitions with per-entity order intact.</li>
<li><b>Dedicated topic</b> for the big tenant, with its own partitions and consumer group. This isolates noisy neighbours and lets you scale it independently.</li>
<li><b>Custom partitioner</b> that spreads known large tenants over a set of partitions by sub-key. It works, but adds hidden logic that every producer must share.</li>
<li><b>Faster consumer</b> for that partition: batch writes, or parallelise per entity within the consumer. This buys time; it doesn't fix the skew.</li>
</ol>
<p>Whatever you choose, changing keys on a live topic breaks per-key ordering during the transition. Drain or cut over deliberately, for example by starting a new topic and migrating consumers.</p>`,
keys:["Challenges the key choice first","Entity-level vs tenant-level ordering","Tenant isolation via dedicated topic","Partitioner option and its cost","Cutover impact on ordering"],
trade:["Compound key: fixes skew cheaply but loses tenant-wide ordering","Dedicated topic: strong isolation, more topics and config to manage","It depends on: true ordering scope, number of large tenants, contractual isolation (SLA tiers)"],
fu:[{q:"How would you detect skew before it becomes an incident?",a:"Monitor bytes-in and lag per partition, not just per topic, and alert when one partition's share deviates from the mean by a large factor. Review key cardinality and distribution when onboarding big tenants."}],
rf:["\"Add partitions\" (the hot key still maps to one)","Random key, losing all ordering without checking requirements"]},

{id:"A061",skill:"Kafka",level:"Advanced",type:"Architecture",
q:"The business wants Kafka-based services to survive a full AWS region outage. Design the multi-region approach.",
a:`<p>First agree <b>RPO and RTO</b>. Cross-region replication is asynchronous, so some recent data can be lost (RPO > 0) unless you accept synchronous cross-region latency on every write.</p>
<p><b>Active-passive</b> (most common): replicate topics to the standby region with MirrorMaker 2 or Amazon MSK Replicator. On failover, producers and consumers switch to the standby. The hard part is <b>consumer offsets</b>: offsets differ between clusters, so you need offset translation (MM2 checkpoints, or the replicator's offset sync) or else consumers resume from a timestamp and rely on idempotency for duplicates.</p>
<p><b>Active-active:</b> both regions take writes. Topics are prefixed by origin region to avoid replication loops, and consumers read local plus remote topics. Ordering and conflicts across regions become an application problem. Only worth it with a hard availability requirement and region-aware data ownership.</p>
<p>Also replicate schemas (registry), ACLs and configs, and <b>rehearse failover</b>. An untested runbook is not a DR plan.</p>`,
keys:["Starts from RPO/RTO","Async replication implies data loss window","Offset translation as the hard part","Active-active loop avoidance and conflict ownership","Schemas/ACLs and failover drills"],
trade:["Active-passive: simpler, idle cost, recovery takes minutes, small data loss","Active-active: no failover pause, but conflict handling, double cost and complex consumers","It depends on: RTO/RPO, regulatory needs, budget, whether data can be partitioned by region"],
fu:[{q:"How do consumers avoid reprocessing too much after failover?",a:"Use translated offsets where available. Otherwise reset to a timestamp slightly before the failure and accept duplicates, which idempotent consumers absorb. Measure how long that catch-up takes as part of the drill."}],
rf:["Assumes replication is synchronous","Ignores consumer offsets","No failover testing"],
verify:"MSK Replicator capabilities (offset sync, supported cluster types) evolve; confirm current feature set before quoting."},

{id:"A062",skill:"Kafka",level:"Advanced",type:"Concept",
q:"Producers need to send events with 5–20 MB payloads (images, documents). How do you handle large messages in Kafka?",
a:`<p>Kafka's default maximum message size is about 1 MB (broker <code>message.max.bytes</code>, producer <code>max.request.size</code>, and topic <code>max.message.bytes</code>). You can raise them, but large messages hurt broker memory, replication, and consumer fetch sizes, and they slow everyone sharing the partition.</p>
<p>The standard answer is the <b>claim check</b> pattern: upload the payload to S3, then publish an event containing the object key, size, content type and checksum. Consumers fetch from S3 when they need the bytes. Use S3 lifecycle rules for retention that matches the topic's, and make sure consumers have read permissions.</p>
<p>For payloads only slightly over the limit, compression (<code>zstd</code> or <code>lz4</code>) or trimming fields may be enough. Chunking a message across several records is possible but complicates ordering and reassembly, so I avoid it.</p>`,
keys:["Knows the ~1 MB default and the configs involved","Claim check with object storage","Retention alignment and access control","Compression as a small-overage fix","Avoids chunking unless forced"],
fu:[{q:"What new failure modes does claim check introduce?",a:"The event can arrive before the object is readable, or after it has expired, and S3 becomes a dependency of every consumer. Upload before publishing, set lifecycle rules longer than topic retention plus replay needs, and handle missing objects explicitly."}],
rf:["Raises the limits to 50 MB everywhere","Base64-encodes files into events"]},

{id:"A063",skill:"SQS",level:"Advanced",type:"Scenario",
q:"A FIFO queue processes orders far below expected throughput, and sometimes everything seems to stop for minutes. What's going on?",
a:`<p>FIFO delivers messages within a <b>message group</b> one batch at a time: while one is in flight, the rest of that group waits. Likely causes:</p>
<ul>
<li><b>Too few message groups</b>, for example a single constant group ID, or one per tenant when one tenant dominates. Throughput then equals a single consumer's speed.</li>
<li><b>A failing message at the head of a group</b> blocks that group for the whole visibility timeout on each attempt, until maxReceiveCount sends it to the DLQ. With few groups, that looks like everything stopped.</li>
<li><b>Long visibility timeout</b> combined with crashed consumers: the message stays invisible and its group is blocked until the timeout ends.</li>
<li><b>Quota limits:</b> high-throughput mode isn't enabled, or you aren't batching.</li>
</ul>
<p><b>Fixes:</b> use a finer-grained group ID (per order or per account), tune visibility timeout to real processing time and extend it while working, keep maxReceiveCount low enough that poison messages leave quickly, and enable high-throughput FIFO (per-message-group dedup scope and throughput limit).</p>`,
keys:["Ordering unit = message group = concurrency unit","Head-of-line blocking per group","Visibility timeout interaction","High-throughput mode","Group ID granularity as the main lever"],
trade:["Finer groups increase parallelism but narrow the ordering guarantee","Short visibility timeouts recover faster from crashes but risk duplicates on slow processing"],
fu:[{q:"Would switching to a Standard queue fix it?",a:"It would fix throughput but drop ordering and add duplicates. That's right only if consumers can handle both, for example with version checks per entity. Often a finer group ID gets the throughput while keeping the order you actually need."}],
rf:["Adds more consumers expecting it to help with one group","Doesn't know ordering is per group"]},

{id:"A064",skill:"SQS",level:"Advanced",type:"Concept",
q:"How do you make an SQS consumer effectively exactly-once when its side effect is a DynamoDB update?",
a:`<p>Combine the dedup record and the business update in one <b>DynamoDB transaction</b>, so either both happen or neither does:</p>
<pre><code>TransactWriteItems:
  1. Put   { pk: "MSG#" + messageId, ttl: now + 7d }
           ConditionExpression: attribute_not_exists(pk)
  2. Update { pk: "ACCOUNT#" + accountId }
           SET balance = balance + :amt, version = version + 1
           ConditionExpression: version = :expected   (optional)</code></pre>
<p>If the message ID already exists, the transaction is cancelled with a condition failure: treat it as already processed, delete the message and move on. Use the producer's business event ID, not the SQS <code>MessageId</code>, if the producer may send the same event twice.</p>
<p>TTL deletion isn't immediate (it can lag considerably), so the TTL only reclaims space. Correctness comes from the condition. Keep the TTL longer than the possible redelivery window. A DynamoDB transaction can include up to 100 items and costs double the write capacity of plain writes.</p>`,
keys:["Dedup record + update atomically","attribute_not_exists condition","Business event ID vs SQS MessageId","TTL is cleanup, not correctness","Transaction cost awareness"],
fu:[{q:"Why not just make the update itself idempotent, like SET status = 'PAID'?",a:"When the operation is naturally idempotent (setting a value), that is better and cheaper, with no dedup table needed. The dedup record is for non-idempotent operations like increments or appends."}],
rf:["Uses SQS MessageId for business dedup with a duplicating producer","Separate writes for dedup and update","Relies on TTL timing"]},

{id:"A065",skill:"Microservices",level:"Advanced",type:"Scenario",
q:"A dependency was down for 10 minutes. When it recovered, it immediately fell over again, and this repeated three times. What's happening, and how do you break the cycle?",
a:`<p>A <b>thundering herd</b> or retry storm. During the outage, clients queued work, kept retrying, and circuit breakers all opened. On recovery, every client's half-open probe and backlog hit the service at once, often with cold caches and cold connection pools. It falls over again, and the cycle repeats.</p>
<p><b>Breaking it now:</b> shed or block traffic at the edge (gateway throttle, WAF rule, scale callers down), restore traffic gradually, warm caches and pools first, and pause queue consumers or cap their concurrency, then ramp up.</p>
<p><b>Structural fixes:</b></p>
<ul>
<li><b>Jittered backoff</b> everywhere, so retries spread out instead of synchronising.</li>
<li><b>Retry budgets:</b> for example, retries at most 10% of requests. Plus circuit breakers whose half-open state admits only a few probes.</li>
<li><b>Server-side load shedding</b> (concurrency limits returning 503 early), so the service stays partly up rather than collapsing.</li>
<li><b>Queue consumers</b> with capped concurrency, so backlogs drain at a controlled rate.</li>
</ul>`,
keys:["Names thundering herd / synchronised retries","Cold caches and pools on recovery","Gradual traffic restoration","Jitter, retry budgets, limited half-open probes","Server-side shedding"],
trade:["Retry budgets reduce success during brief blips but prevent amplification","Load shedding rejects some users to keep the rest served"],
fu:[{q:"Why does jitter matter if everyone already uses exponential backoff?",a:"Clients that failed at the same moment back off by the same intervals and retry in synchronised waves. Random jitter spreads the attempts over time. Full jitter (a random delay between zero and the backoff ceiling) is a common choice."}],
rf:["\"Scale the dependency\" alone","Unbounded retries in clients","Doesn't recognise the synchronisation"]},

{id:"A066",skill:"Microservices",level:"Advanced",type:"Architecture",
q:"You're building a B2B SaaS on microservices. How do you isolate tenants: data, compute and noisy neighbours?",
a:`<p>There are three isolation models, usually mixed by tier:</p>
<ul>
<li><b>Pool:</b> shared services and databases, with a tenant ID on every row. Cheapest and simplest to operate. Isolation depends entirely on code: every query filters by tenant. Back that with database enforcement such as PostgreSQL row-level security tied to a session variable, so a missed filter can't leak data.</li>
<li><b>Bridge:</b> shared compute, separate schema or database per tenant. Stronger data isolation, per-tenant backup and restore, but migrations run N times and connection management gets harder.</li>
<li><b>Silo:</b> a dedicated stack per tenant, for enterprise tiers or regulatory needs. Strongest isolation, highest cost and operational effort.</li>
</ul>
<p>Cross-cutting needs:</p>
<ul>
<li>Tenant context is taken from the authenticated token and propagated through calls and events, never from client-supplied input.</li>
<li>Per-tenant rate limits and quotas.</li>
<li>Per-tenant metrics, so you can spot the noisy neighbour.</li>
<li>Tests that try to read across tenants.</li>
</ul>`,
keys:["Pool/bridge/silo and tiering","Tenant context from identity, propagated","DB-level enforcement (RLS) as a backstop","Noisy neighbour controls and per-tenant metrics","Operational cost of each model"],
trade:["Pool: low cost, highest blast radius for bugs","Bridge: better isolation, N× migration effort","Silo: strongest isolation and simplest compliance story, highest cost","It depends on: tenant size distribution, compliance, pricing tiers"],
fu:[{q:"How does PostgreSQL row-level security fit with connection pooling?",a:"Set the tenant in a session variable at the start of each transaction (SET LOCAL app.tenant_id = …), with policies referencing current_setting('app.tenant_id'). SET LOCAL scopes it to the transaction, so a pooled connection never carries another tenant's value into the next request."}],
rf:["Relies only on developers remembering WHERE tenant_id","Takes tenant ID from a request header","One model for every customer regardless of tier"]},

{id:"A067",skill:"Microservices",level:"Advanced",type:"Concept",
q:"How do you protect a service when it hits saturation, so it degrades gracefully instead of falling over?",
a:`<p>Past saturation, accepting more work makes <i>every</i> request slower until all of them time out. The goal is to keep serving some requests well by rejecting the excess early.</p>
<ul>
<li><b>Concurrency limits:</b> cap in-flight requests per instance (ASP.NET Core's concurrency limiter, or an adaptive limiter that adjusts to latency). Excess gets a fast <code>503</code> with <code>Retry-After</code>.</li>
<li><b>Bounded queues:</b> short internal queues. Drop requests that have already waited longer than the client's timeout, since nobody is waiting for that answer.</li>
<li><b>Prioritisation:</b> shed low-value traffic first (analytics, prefetch, batch) and protect critical paths (checkout, login).</li>
<li><b>Degraded modes:</b> feature flags that turn off expensive features (recommendations, live counts) under load.</li>
<li><b>Deadline propagation:</b> stop work whose caller has already given up (cancellation tokens through the stack).</li>
</ul>`,
keys:["Rejecting early beats slow failure","Concurrency limits over rate limits for saturation","Drop already-expired work","Priority-based shedding","Cancellation propagation"],
fu:[{q:"Why is a concurrency limit often better than a requests-per-second limit for self-protection?",a:"Capacity depends on how expensive requests are right now. A fixed RPS limit is wrong when requests get slower (a DB slowdown), while a concurrency limit adapts automatically: slow requests hold slots longer, so fewer are admitted."}],
rf:["Unbounded queues","Relies only on autoscaling","No distinction between critical and optional traffic"]},

{id:"A068",skill:"Microservices",level:"Advanced",type:"Scenario",
q:"A distributed trace shows 400 ms of unexplained gap between service A's outgoing span and service B's incoming span under load. Nothing is logged. What could it be, and how do you find it?",
a:`<p>The gap is time spent <i>before</i> B's handler span starts, or before A's HTTP call actually leaves. Candidates:</p>
<ul>
<li><b>Thread pool starvation</b> in A or B (.NET), from sync-over-async (<code>.Result</code>, <code>.Wait()</code>) or blocking calls. Queued work waits for threads. Check <code>dotnet-counters monitor</code> for ThreadPool queue length and thread count growth.</li>
<li><b>Connection pool waits:</b> A's HTTP handler has no free connection to B. Check <code>MaxConnectionsPerServer</code>, connection lifetime, and the System.Net.Http metrics.</li>
<li><b>New connections each time:</b> DNS, TCP and TLS handshakes from disposing <code>HttpClient</code> per call, or keep-alive disabled.</li>
<li><b>Load balancer or sidecar queueing:</b> ALB target response time vs app time. ALB access logs split request, target and response processing times.</li>
<li><b>GC pauses</b> (look at gen2 GC counts and pause time), or CPU throttling from container CPU limits.</li>
</ul>
<p>Approach: compare A's client-side timing with B's server-side timing and the LB logs to find which side the gap belongs to. Then use runtime counters on that side.</p>`,
keys:["Locates the gap side by side (client, LB, server)","Thread pool starvation and sync-over-async","Connection pool exhaustion / handshake churn","Uses dotnet-counters and LB logs","Container CPU throttling"],
trade:["Raising the minimum thread count masks starvation briefly; removing blocking calls fixes it","Larger connection pools help until the downstream is the real limit"],
fu:[{q:"How do you confirm thread pool starvation in production?",a:"dotnet-counters shows ThreadPool Queue Length rising and the thread count climbing slowly (the pool injects threads gradually). A dump (dotnet-dump) shows many threads blocked in .Result or Wait on async code."}],
rf:["\"Network latency\" with no evidence","Increases the HttpClient timeout","Doesn't know about thread pool starvation"]},

{id:"A069",skill:"Microservices",level:"Advanced",type:"Architecture",
q:"Teams want a shared NuGet package with common domain models (Order, Customer) used by all services. What's your view?",
a:`<p>Sharing <b>domain models</b> across services couples them. A change to the shared <code>Order</code> class forces coordinated upgrades, every service sees fields that don't concern it, and you drift toward a distributed monolith. Each bounded context should own its model of "Order", even if the names match.</p>
<p>What I would share:</p>
<ul>
<li><b>Platform concerns</b> as a thin "service chassis": logging and OpenTelemetry setup, auth middleware, resilience defaults, health checks, configuration conventions.</li>
<li><b>Contracts</b> (event and API schemas), generated from the schema source of truth (Protobuf, Avro, OpenAPI), versioned and backward compatible.</li>
</ul>
<p>Even the chassis needs discipline: semantic versioning, no forced simultaneous upgrades, minimal dependencies (so it doesn't pin everyone's framework version), and an owning team.</p>`,
keys:["Shared domain models = coupling","Bounded contexts own their models","Share platform concerns and generated contracts","Versioning and dependency-pinning risks of the chassis"],
trade:["A shared chassis gives consistency and speed but can pin framework versions and create upgrade waves","Duplicated small types cost a little repetition but buy independent evolution","It depends on: number of teams, platform team capacity, release cadence"],
fu:[{q:"How do you roll out a security fix in the chassis to 30 services?",a:"Automated dependency updates (Dependabot or Renovate) opening PRs, CI that verifies them, a deadline tracked per service, and a tool listing which services are on which version. If the chassis is truly thin, the upgrade is usually a non-event."}],
rf:["Shares entity classes with EF mappings across services","Mandatory lockstep upgrades","No owner for shared libraries"]},

{id:"A070",skill:"Distributed Fundamentals",level:"Advanced",type:"Concept",
q:"What's the difference between linearizability and serializability? Why does it matter in practice?",
a:`<p><b>Serializability</b> is a property of <i>transactions</i>: concurrent transactions produce a result equal to <i>some</i> serial order. That order needn't match real time. A transaction that committed earlier can appear to come later.</p>
<p><b>Linearizability</b> is a property of <i>single operations on single objects</i>: each operation appears to take effect instantly at some point between its start and end, in a way consistent with real time. Once a write completes, every later read sees it.</p>
<p><b>Strict serializability</b> combines both. It's what people often assume they have.</p>
<p>In practice: reading from an async replica isn't linearizable even if the primary is serializable. A "check balance, then withdraw" across two requests isn't protected by per-statement atomicity. Distributed locks and leader election need linearizable storage (etcd, ZooKeeper), not an eventually consistent cache. And "SERIALIZABLE" isolation in a database doesn't make your replicas or caches linearizable.</p>`,
keys:["Transactions vs single-object operations","Real-time ordering is the linearizability addition","Strict serializability","Practical traps: replicas, caches, locks"],
fu:[{q:"Is SQL Server SNAPSHOT isolation serializable?",a:"No. Snapshot isolation allows write skew: two transactions read overlapping data, write different rows, and both commit, breaking an invariant. SERIALIZABLE isolation (or explicit locking) is needed for that class of problem. PostgreSQL's SERIALIZABLE uses SSI to detect it."}],
rf:["Uses the two words as synonyms","Thinks a serializable primary makes replica reads current"]},

{id:"A071",skill:"Distributed Fundamentals",level:"Advanced",type:"Scenario",
q:"Your service writes to PostgreSQL and then updates an OpenSearch index. Over weeks, search results drift from the database: missing items, stale prices. How do you fix it properly?",
a:`<p>This is the dual-write problem again. The index update fails after the DB commit, or two updates for the same document arrive out of order and an older version overwrites a newer one.</p>
<p><b>Fix the write path:</b></p>
<ul>
<li>Drive indexing from the DB's changes: outbox events or CDC feeding an indexer consumer. Never write to the index inline in the request.</li>
<li>Make index writes <b>version-aware</b>. Pass the row version and use OpenSearch external versioning (<code>version_type=external</code>), so an older update is rejected instead of overwriting a newer one.</li>
<li>Handle deletes explicitly (tombstone events).</li>
</ul>
<p><b>Fix the drift that already exists:</b> run a <b>reconciliation job</b> that compares IDs and versions or checksums between DB and index, and reindexes the differences. For a large drift, rebuild into a new index and swap an alias.</p>`,
keys:["Names dual write and reordering","Outbox/CDC-driven indexing","External versioning to reject stale writes","Reconciliation job as ongoing safety net","Alias swap for full rebuild"],
trade:["Async indexing adds seconds of search staleness in exchange for correctness","Reconciliation costs compute but catches drift from any cause","It depends on: how fresh search must be (inventory vs blog posts)"],
fu:[{q:"How do you rebuild a large index with zero downtime?",a:"Create a new index with the right mappings, bulk load from the DB while also applying live change events to it, wait until it catches up, then atomically switch the read alias to it. Keep the old index until you're sure."}],
rf:["\"Wrap both in a try/catch and retry\"","Last-write-wins with no versioning","No plan for existing drift"]},

{id:"A072",skill:"Distributed Fundamentals",level:"Advanced",type:"Concept",
q:"Explain quorum reads and writes (N, R, W). Does R + W > N guarantee you always read the latest write?",
a:`<p>In leaderless (Dynamo-style) replication, each item is on N replicas. A write succeeds when W replicas acknowledge, and a read queries R replicas and takes the newest version. If <b>R + W &gt; N</b>, the read and write sets overlap in at least one replica, so a read should see the latest successful write. Typical setting: N=3, W=2, R=2.</p>
<p>It is <b>not</b> a full guarantee of linearizability:</p>
<ul>
<li><b>Sloppy quorums / hinted handoff:</b> writes accepted by nodes outside the usual N break the overlap.</li>
<li><b>Concurrent writes</b> resolved by last-write-wins timestamps can drop one write (and clocks skew).</li>
<li>A write that fails on some replicas but succeeded on fewer than W isn't rolled back, so it may surface later.</li>
<li>A read concurrent with a write may or may not see it.</li>
</ul>
<p>Tuning: lower R or W for latency and availability, higher for consistency. Managed services hide most of this. DynamoDB, for example, offers eventually consistent or strongly consistent reads.</p>`,
keys:["Overlap reasoning for R+W>N","Typical N=3/W=2/R=2","Sloppy quorum and LWW caveats","Not equal to linearizability","Latency/availability tuning"],
fu:[{q:"Why choose W=1, R=3 or W=3, R=1?",a:"W=3, R=1 makes reads fast but any replica outage blocks writes. W=1, R=3 makes writes fast and available but reads slow and fragile. You tune toward the operation that must stay available or fast."}],
rf:["Says R+W>N gives strong consistency with no caveats","Can't explain the overlap argument"]},

{id:"A073",skill:"Distributed Fundamentals",level:"Advanced",type:"Scenario",
q:"During an Aurora or RDS primary failover, the API returned errors for about 40 seconds, and afterwards a few orders were duplicated. Explain both and harden the system.",
a:`<p><b>The errors:</b> during failover the old primary stops accepting connections and in-flight transactions are rolled back. Clients hold dead pooled connections and keep resolving the cluster endpoint's DNS to the old host until the TTL expires and their resolver refreshes. Failover itself typically takes tens of seconds; DNS and pool behaviour add to it.</p>
<p><b>The duplicates:</b> some commits succeeded just before the failover, but the client got a connection error instead of the acknowledgement (an ambiguous outcome), and the client or the user retried. A naive retry of the whole operation creates a second order.</p>
<p><b>Hardening:</b></p>
<ul>
<li>Use idempotency keys or natural unique constraints for order creation, so a retry finds the existing order.</li>
<li>In EF Core, enable retry on transient failures (<code>EnableRetryOnFailure</code>) and wrap explicit transactions in the execution strategy, so the whole unit retries.</li>
<li>Use the AWS JDBC/ODBC wrappers or RDS Proxy, which handle failover faster than DNS. For .NET, RDS Proxy is the practical option.</li>
<li>Run failover drills (Aurora can fail over on command) and measure the real impact.</li>
</ul>`,
keys:["Rolled-back in-flight transactions and stale connections","DNS TTL effect","Ambiguous commit → duplicate on retry","Idempotency/unique constraints","EF Core execution strategy + RDS Proxy + drills"],
trade:["RDS Proxy shortens failover impact and pools connections, with added cost and a small latency hop","Automatic retries reduce errors but require idempotent operations to be safe"],
fu:[{q:"Why must EF Core's retry wrap the whole transaction?",a:"If only the failing statement were retried, earlier statements in the same transaction would already have been rolled back by the failover. The execution strategy re-runs the entire delegate, which is why it refuses user-initiated transactions unless you wrap them in strategy.ExecuteAsync."}],
rf:["Calls it an AWS bug","Retries without idempotency","Never tests failover"]},

{id:"A074",skill:"API Design",level:"Advanced",type:"Concept",
q:"You're adding outbound webhooks for partners. What makes a webhook system reliable and secure?",
a:`<ul>
<li><b>Security:</b> sign every payload with HMAC-SHA256 over the timestamp plus body, using a per-endpoint secret. Receivers verify with a constant-time comparison and reject old timestamps (for example older than 5 minutes) to stop replays. Only allow HTTPS endpoints, and validate endpoint URLs against SSRF (no internal IPs).</li>
<li><b>Delivery:</b> send from a queue, not inline. Retry non-2xx responses and timeouts with exponential backoff over hours, then mark the endpoint failing and notify the partner. Auto-disable endpoints that fail persistently.</li>
<li><b>Semantics:</b> at-least-once delivery, an event ID in every payload so receivers deduplicate, no ordering guarantee (include a version or timestamp), and short timeouts (receivers should ack fast and process async).</li>
<li><b>Operability:</b> a delivery log partners can see, manual redelivery, secret rotation supporting two active secrets, and an events API to fetch missed events.</li>
</ul>`,
keys:["HMAC with timestamp and replay window","SSRF protection on partner URLs","Queue-based delivery with backoff and disabling","At-least-once with event IDs","Secret rotation and delivery logs"],
fu:[{q:"A partner says they missed events during their outage. How should the system help?",a:"Retries over a long enough window cover short outages. For longer ones, provide a list-events endpoint with a cursor so they can backfill, plus manual redelivery from the delivery log."}],
rf:["Sends webhooks synchronously in the request path","No signature, or signature without timestamp","Promises exactly-once or ordering"]},

{id:"A075",skill:"API Design",level:"Advanced",type:"Scenario",
q:"Clients want flexible filtering and sorting on a large list endpoint. A previous attempt exposed generic query parameters, and someone's query took down the database. How do you design it?",
a:`<p>Generic filtering (passing arbitrary fields and operators straight into LINQ or SQL, or a wide-open OData endpoint) lets any client build an unindexed query. The fix is to design the query surface deliberately:</p>
<ul>
<li><b>Allowlist</b> filterable and sortable fields and operators. Each one is backed by an index or a search engine.</li>
<li><b>Mandatory narrowing:</b> require a selective filter (tenant, date range with a maximum span) for expensive collections.</li>
<li><b>Cap page size</b> and use cursor pagination. No unbounded "export everything" through the list API.</li>
<li><b>Sparse fieldsets</b> (<code>?fields=id,name</code>) to cut payload size, without letting clients request expensive joins.</li>
<li><b>Server-side protection:</b> statement timeouts and a read replica for list queries. Monitor slow queries by endpoint and parameters.</li>
<li>For genuinely ad-hoc search, route to OpenSearch, not the transactional DB.</li>
</ul>`,
keys:["Allowlisted, index-backed filters","Required selective filters and max ranges","Page size caps and cursors","Query timeouts and replicas","Search engine for ad-hoc needs"],
trade:["A tight allowlist protects the DB but needs product negotiation for each new filter","Search engine flexibility costs a second store and eventual consistency"],
fu:[{q:"A client needs a full export of 2 million rows. What do you offer?",a:"An async export job (202 + status resource) that streams results to a file in S3 and returns a pre-signed URL, run against a replica, rather than paging through the online API."}],
rf:["Exposes IQueryable or raw OData to the internet","No page size limit","Relies on clients behaving"]},

{id:"A076",skill:"Rate Limiting & Scaling",level:"Advanced",type:"Scenario",
q:"Marketing will launch a campaign expected to bring 10× normal traffic in the first 15 minutes. Autoscaling is configured. Are you ready? What do you do?",
a:`<p>Not necessarily. Autoscaling is reactive and slow relative to a 15-minute spike: a target-tracking alarm needs a few minutes of breached metrics, tasks take time to pull images, start and pass health checks, and the database doesn't autoscale at that speed. By the time capacity arrives, the spike may already have caused failures.</p>
<p><b>Preparation:</b></p>
<ul>
<li><b>Load test</b> the critical journeys at 10× and find the first bottleneck. It is usually the DB, a third-party API, or connection limits, not the app tier.</li>
<li><b>Pre-scale:</b> scheduled scaling to raise minimum capacity before launch, and pre-warm caches.</li>
<li><b>Protect the DB:</b> cache hot reads (landing pages, product data, or CDN for anything cacheable), and add read replicas or RDS Proxy.</li>
<li><b>Buffer non-critical work</b> through queues (emails, analytics).</li>
<li><b>Degradation plan:</b> feature flags to switch off expensive features, plus rate limits per client.</li>
<li><b>Check quotas</b> (Lambda concurrency, API Gateway, third-party limits).</li>
<li>Staff the launch window with dashboards ready.</li>
</ul>`,
keys:["Autoscaling lag vs spike duration","Load test to find the real bottleneck","Scheduled pre-scaling and cache warming","DB and third-party limits","Degradation flags and quota checks"],
trade:["Pre-scaling costs money for capacity that may go unused, which is cheap insurance against a failed launch","Aggressive caching risks showing stale prices; agree what may be cached"],
fu:[{q:"How do you know the load test is realistic?",a:"Model it from real traffic: the same endpoint mix, real data volume, cache hit ratios, and think-time, from production logs or analytics. Testing one endpoint with uniform requests usually misses the real bottleneck."}],
rf:["\"Autoscaling will handle it\"","Only scales the app tier","No load test"]},

{id:"A077",skill:"Rate Limiting & Scaling",level:"Advanced",type:"Architecture",
q:"What metric should you autoscale on for an HTTP API service versus a queue worker on ECS, and why?",
a:`<p><b>HTTP API:</b> scale on a signal that tracks load per task. <code>ALBRequestCountPerTarget</code> is good when requests have similar cost. CPU utilisation works for CPU-bound services. For I/O-bound services, CPU stays low while latency climbs, so add a latency-based step policy or use concurrency per task. Keep scale-in slow and scale-out fast.</p>
<p><b>Queue worker:</b> CPU and queue depth alone are misleading. The useful metric is <b>backlog per task</b>: <code>ApproximateNumberOfMessagesVisible</code> ÷ running tasks, compared with how many messages one task can process within your latency target. Publish it as a custom CloudWatch metric and target-track it. Also watch <code>ApproximateAgeOfOldestMessage</code> as the SLO signal.</p>
<p>For workers running long jobs, use ECS task scale-in protection so scale-in doesn't kill tasks mid-job, and handle SIGTERM to finish or release the current message.</p>`,
keys:["Requests per target vs CPU vs latency for APIs","Backlog per task for workers","Age of oldest message as SLO","Asymmetric scale-out/in","Scale-in protection and SIGTERM handling"],
trade:["CPU is easy but misses I/O-bound saturation","Backlog per task needs a custom metric but matches the real goal (drain time)","It depends on: request cost uniformity, job length, latency SLO"],
fu:[{q:"Why is raw queue depth a poor target?",a:"A depth of 1,000 is fine with 50 tasks and a crisis with 2. Target tracking needs a value that scales inversely with task count, which backlog per task does, so the policy can compute how many tasks it needs."}],
rf:["Scales workers on CPU only","Same policy for API and workers","No handling for in-flight work on scale-in"]},

/* ================= LEAD ================= */
{id:"A078",skill:"Event-Driven",level:"Lead",type:"Architecture",
q:"A senior engineer proposes making the whole platform event-driven, with every service communicating only through Kafka. How do you evaluate the proposal, and what do you decide?",
a:`<p>I'd treat it as a hypothesis to test against our actual problems, not a style to adopt wholesale.</p>
<ol>
<li><b>What problem does it solve for us?</b> Cascading failures from sync chains, teams blocked on each other, or a need for replay and audit are good reasons. "It's more modern" isn't.</li>
<li><b>Which interactions fit?</b> Fact broadcasts (order placed, user signed up) and long-running workflows fit well. Queries and user-facing request/response, where the user waits for an answer, usually don't. Forcing them through Kafka adds request-reply plumbing and latency.</li>
<li><b>Are we ready to run it?</b> Distributed tracing across topics, schema governance, consumer idempotency as a team habit, on-call skills for lag and rebalances, and a budget for MSK or Confluent. If those aren't in place, the first incidents will be painful.</li>
<li><b>Pilot:</b> pick one bounded flow with a clear benefit, define success metrics (failure isolation, lead time for adding a consumer), and review after a quarter.</li>
</ol>
<p>The likely decision: <b>events for integration between bounded contexts, synchronous calls for queries and user-facing commands</b>, written up as an ADR with the criteria, so future choices don't need to be argued from scratch.</p>`,
keys:["Ties the decision to concrete problems","Distinguishes which interactions fit events","Assesses operational readiness, not just design","Pilot with success metrics","Records the decision rule (ADR)"],
trade:["All-in event-driven: maximum decoupling, highest operational and cognitive cost","Hybrid: matches tool to interaction, needs a clear rule so it doesn't become arbitrary","It depends on: team experience with async systems, observability maturity, domain shape"],
fu:[{q:"The engineer is passionate and feels you're blocking innovation. How do you handle that?",a:"Give them ownership of the pilot with the success criteria they help define, so the outcome is decided by evidence rather than by seniority. Make clear that a well-run pilot that shows limits is also a success. If it works, they lead the wider rollout."}],
rf:["Approves or rejects based on preference","No operational readiness check","All-or-nothing framing"]},

{id:"A079",skill:"Event-Driven",level:"Lead",type:"Scenario",
q:"After two years there are 140 topics, unclear ownership, undocumented payloads, and consumers regularly break when producers change events. How do you bring order without killing team autonomy?",
a:`<p>The aim is guardrails that are automatic and cheap to follow, not a central committee that approves every event.</p>
<ul>
<li><b>Inventory and ownership first:</b> map every topic to an owning team using producer client IDs, ACLs and traffic. Topics with no producer for months are candidates for deletion after notice.</li>
<li><b>Contracts in a schema registry</b> with compatibility enforced in CI. A breaking change then fails the build instead of breaking a consumer at 2 am.</li>
<li><b>Discoverability:</b> an event catalogue (AsyncAPI specs or the registry UI) listing owner, purpose, schema, retention and known consumers.</li>
<li><b>A light standard</b> covering naming, an envelope with event ID, type, version, time, trace context and producer, PII rules, and a deprecation process with notice periods.</li>
<li><b>Make the paved road easy:</b> a template or library that already sets up the envelope, registry and tracing.</li>
</ul>
<p>Roll it out by fixing the topics that cause incidents first, so teams see the value before being asked to change. Measure consumer breakages per month before and after.</p>`,
keys:["Ownership inventory before rules","Automated enforcement (registry + CI) over meetings","Catalogue for discoverability","Envelope standard incl. trace context and PII","Incremental rollout with a measurable outcome"],
trade:["Strict gates prevent breakage but slow teams if tooling is clumsy","Pure autonomy keeps speed until breakages cost more than the coordination","It depends on: number of teams, incident cost, platform team capacity"],
fu:[{q:"A team refuses to adopt the registry because it slows them down. What do you do?",a:"Find out what specifically slows them and fix the tooling if it's a fair complaint. If they're producing events others consume, compatibility checking isn't optional, and I'd make that call explicitly with their manager, framed around the incidents it prevents. Purely internal topics can be exempt."}],
rf:["Creates an architecture review board approving every event","Big-bang mandate across all teams","No measure of whether it worked"]},

{id:"A080",skill:"Event-Driven",level:"Lead",type:"Architecture",
q:"For .NET messaging, would you build on raw client libraries (Confluent.Kafka, AWS SDK) or adopt a framework like MassTransit or NServiceBus? How do licensing changes affect that call?",
a:`<p>Frameworks give you, on day one, things teams otherwise rebuild badly: retries and redelivery, outbox and inbox, sagas and state machines, consistent serialisation, and test harnesses. Raw clients give full control and one fewer abstraction, but every team reinvents error handling.</p>
<p>How I decide:</p>
<ul>
<li><b>Scope:</b> one or two simple consumers → raw client with a small internal wrapper. Many services with sagas and outbox → a framework pays for itself.</li>
<li><b>Abstraction fit:</b> frameworks sometimes hide Kafka specifics (partitions, offsets, keys) that you need to reason about. Check they don't fight your model.</li>
<li><b>Licensing and vendor risk:</b> the .NET ecosystem has seen widely used libraries move to commercial licences, including MediatR and AutoMapper in 2025 and MassTransit's next major version. Check the licence terms, cost at your scale, and support model, and keep the framework behind your own thin interfaces so a future switch is bounded work.</li>
<li><b>Team skills:</b> who can debug it at 2 am?</li>
</ul>
<p>Make this an ADR with a review date. Licences and roadmaps change.</p>`,
keys:["Concrete list of what frameworks provide","Scope-based decision","Abstraction leakage risk","Licensing/vendor risk handled deliberately","Isolation behind own interfaces + ADR"],
trade:["Framework: faster delivery and consistency, plus dependency, licence cost and abstraction risk","Raw client: control and no licence risk, plus rebuilding resilience per team","It depends on: number of services, saga needs, budget, team expertise"],
fu:[{q:"Your codebase uses MediatR heavily and the licence changed. What do you do?",a:"Assess it first: does our organisation fall under the free tier or need a paid licence, and what does that cost against the effort of replacing it? Options are paying, pinning the last open-source version (accepting no future fixes), or replacing it with a small in-house mediator, since the core pattern is simple. I'd present the cost and risk of each rather than react immediately."}],
rf:["Chooses on popularity alone","Unaware of licence changes in common .NET libraries","Leaks framework types throughout the domain"],
verify:"Exact licensing terms and free-tier thresholds for MediatR, AutoMapper and MassTransit v9 change; check current terms before citing specifics."},

{id:"A081",skill:"Kafka",level:"Lead",type:"Architecture",
q:"A 15-engineer company is choosing between self-managed Kafka, Amazon MSK (provisioned or serverless), Confluent Cloud, and not using Kafka at all. How do you decide?",
a:`<p>Start with whether the requirements need Kafka at all. Do we need replay, many independent consumers of the same stream, per-key ordering at high throughput, or stream processing? If the real need is "background jobs and some fan-out", SNS+SQS or EventBridge cover it with almost no operations. For a 15-person company that is often the right answer.</p>
<p>If Kafka is justified:</p>
<ul>
<li><b>Self-managed (EC2/Kubernetes):</b> cheapest infrastructure and the most expensive in people. Upgrades, broker failures, rebalancing partitions and security patching are all yours. Rarely right at this size.</li>
<li><b>MSK provisioned:</b> AWS runs the brokers, you size and scale them. A good middle ground if you're AWS-native.</li>
<li><b>MSK Serverless:</b> no sizing, but per-cluster and per-partition limits and some feature gaps. Fine for moderate, spiky workloads.</li>
<li><b>Confluent Cloud:</b> most managed, with the richest ecosystem (schema registry, connectors, ksqlDB, Flink). Usually the highest bill, and a second vendor relationship.</li>
</ul>
<p>Compare the <b>total</b> cost: infrastructure plus engineer time plus the cost of incidents. Choose the option that lets a small team run it without a dedicated Kafka expert.</p>`,
keys:["Questions whether Kafka is needed","Total cost of ownership including people","Managed options' real differences and limits","Ecosystem needs (registry, connectors) as a factor","Sized to the organisation"],
trade:["Self-managed: control and lower infrastructure cost, highest people cost and risk","Fully managed: lowest effort, highest bill and some lock-in","It depends on: throughput, ecosystem needs, in-house skills, cloud commitment"],
fu:[{q:"How would you make the decision reversible?",a:"Keep producers and consumers behind a thin internal messaging interface, use standard Kafka protocol features rather than vendor extensions where possible, and keep schemas in a portable format. Then moving between MSK and Confluent is mostly configuration and migration work, not a rewrite."}],
rf:["Self-hosts Kafka 'because it's cheaper' with no ops capacity","Chooses Kafka because it's on everyone's CV","Ignores engineer time in cost"],
verify:"MSK Serverless and MSK Express broker limits and features evolve; check current quotas before relying on them."},

{id:"A082",skill:"Kafka",level:"Lead",type:"Scenario",
q:"A team wants to use Kafka as the system of record: infinite retention, compacted topics, and services building state only from Kafka, with no database. What's your position?",
a:`<p>It can work. Some companies run it successfully with compacted topics and stream processors holding state. But I'd push back unless the team can answer these:</p>
<ul>
<li><b>Querying:</b> how do support, reporting and ad-hoc investigations ask "show me all orders for customer X"? You will build a queryable store anyway.</li>
<li><b>Correcting bad data:</b> an immutable log needs compensating events and rebuilds for every fix, rather than an UPDATE.</li>
<li><b>Erasure:</b> GDPR deletes against an infinite log need crypto-shredding or tombstones on compacted topics, designed in from day one.</li>
<li><b>Operations:</b> infinite retention costs storage (tiered storage helps), and rebuilding state for a new service from years of events takes time.</li>
<li><b>Backup and DR:</b> Kafka replication isn't a backup. Accidental topic deletion or a bad producer is unrecoverable without archives.</li>
</ul>
<p>My usual position: the database is the system of record for current state, and Kafka is the system of record for <i>what happened</i>, connected by an outbox. If the team has a domain where the event log genuinely is the business record and they've answered the above, I'd support a scoped trial.</p>`,
keys:["Doesn't dismiss outright; tests against concrete concerns","Query, correction, erasure, backup gaps","Kafka replication ≠ backup","Clear default position plus conditions for exceptions"],
trade:["Log as source of truth: full history and replay, but hard querying, correction and erasure","DB + outbox: familiar operations and queries, with events derived from state changes","It depends on: audit needs, team stream-processing skill, compliance"],
fu:[{q:"How do you disagree without simply overruling a capable team?",a:"Turn the concerns into acceptance criteria. If they can show how they'd handle a GDPR delete, a data fix and a support query in a prototype, the risk is addressed. That keeps the decision about evidence and leaves them ownership."}],
rf:["\"Kafka isn't a database\" with no reasoning","Accepts without considering erasure or backup"]},

{id:"A083",skill:"SQS",level:"Lead",type:"Scenario",
q:"A workflow built from 12 chained SQS queues with state in DynamoDB has become hard to change, and retry bugs keep appearing. Someone proposes rewriting it on Step Functions. How do you decide?",
