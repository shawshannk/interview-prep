<script>
const LEVELS=["Basic","Intermediate","Advanced","Lead"];
const TYPES=["Concept","Scenario","Architecture","Behavioral"];
const PARTS="Complete: all 4 parts loaded.";

const QS=[
/* ================= BASIC ================= */
{id:"A001",skill:"Event-Driven",level:"Basic",type:"Concept",
q:"What is the difference between an event, a command and a message? Why does the distinction matter in a design?",
a:`<p>A <b>command</b> expresses intent and is addressed to one owner (<code>ReserveStock</code>). It can be rejected, and its schema is owned by the receiver. An <b>event</b> records a fact that already happened (<code>OrderPlaced</code>). It is immutable, broadcast to zero or more subscribers, and its schema is owned by the publisher, who does not know who consumes it. A <b>message</b> is just the envelope on the wire that carries either one.</p>
<p>The distinction drives coupling. With commands the sender depends on the receiver. With events the dependency is inverted: consumers depend on the publisher's contract. It also drives failure handling. A failed command is the sender's problem; a failed event handler is the consumer's problem, and the publisher should never roll back because a subscriber failed.</p>`,
keys:["Command = intent, one handler, can be rejected; event = past-tense fact, many handlers","Who owns the schema differs","Coupling direction is inverted","Publisher is not responsible for consumer failure"],
fu:[{q:"Should an event carry the full entity state or just an ID?",a:"Thin events (ID only) keep the contract small but force consumers to call back, which reintroduces runtime coupling and load on the source. Fat events (event-carried state transfer) let consumers work offline but enlarge the contract, expose more data (watch PII) and can be stale. A common middle ground: carry the fields consumers actually need plus a version."},
{q:"Can you send commands over Kafka?",a:"Yes, but treat the topic as point-to-point: one owning consumer group, a topic named for the receiver, and a reply or status event if the sender needs an outcome. Many teams keep commands on queues (SQS) and events on Kafka to keep the semantics obvious."}],
rf:["Uses the three words interchangeably","Says a publisher should retry or roll back when a consumer fails","Names events in the imperative (\"UpdateInventory\")"]},

{id:"A002",skill:"Event-Driven",level:"Basic",type:"Concept",
q:"What do you gain and what do you pay when you move from synchronous service calls to event-driven communication?",
a:`<p><b>Gains:</b> temporal decoupling (the consumer can be down without failing the producer), load levelling through the broker, independent scaling, and extensibility, since new consumers subscribe without changing the producer.</p>
<p><b>Costs:</b> eventual consistency that the product has to accept, duplicate and out-of-order delivery that every consumer must handle, schema evolution across teams, harder debugging (you need correlation IDs and distributed tracing to follow a flow), and a broker to operate.</p>
<p>I keep a call synchronous when the caller needs the answer to continue (payment authorisation before confirming an order), when the user is waiting on the result, or when the interaction is simple CRUD where a broker only adds moving parts.</p>`,
keys:["Temporal decoupling and load levelling","Eventual consistency is a product decision, not just a tech one","Idempotency and ordering become every consumer's job","Observability cost: tracing and correlation IDs","Clear criteria for staying synchronous"],
fu:[{q:"How do you trace a request that crosses three services and two topics?",a:"Propagate W3C trace context (traceparent) in message headers as well as HTTP headers, and use OpenTelemetry instrumentation for the producer and consumer so spans link across the broker. Log the correlation ID on every line. Without header propagation the trace breaks at the first topic."}],
rf:["Only lists benefits","Claims event-driven is always more scalable","Doesn't mention duplicates or ordering"]},

{id:"A003",skill:"Event-Driven",level:"Basic",type:"Concept",
q:"Explain at-most-once, at-least-once and exactly-once delivery. Which do you actually build for?",
a:`<p><b>At-most-once:</b> acknowledge (or commit the offset) before processing. A crash loses the message, but there are no duplicates. <b>At-least-once:</b> acknowledge after processing. A crash between processing and ack causes redelivery, so duplicates are possible but nothing is lost. <b>Exactly-once:</b> only achievable inside a closed system that controls both the read and the write. Kafka transactions do this for read-process-write from Kafka to Kafka.</p>
<p>In practice I build for <b>at-least-once delivery plus idempotent processing</b>, which gives "effectively once" side effects. That holds across any broker and any downstream store.</p>`,
keys:["Ack before vs after processing","Exactly-once is scoped to a closed system","At-least-once + idempotency is the realistic default","Knows external side effects (email, payment) aren't covered by broker guarantees"],
fu:[{q:"Does Kafka give you exactly-once?",a:"Kafka EOS combines the idempotent producer, transactions and consumers reading with isolation.level=read_committed. It guarantees exactly-once only when input, output and offsets all live in Kafka. Writing to SQL Server or calling an API from the consumer is outside the transaction, unless you store the consumed offsets in the same DB transaction as the write."},
{q:"Does SQS FIFO remove the need for idempotency?",a:"No. FIFO deduplicates sends with the same deduplication ID within a 5-minute window. If processing exceeds the visibility timeout, or the consumer crashes before deleting the message, it is received again. Consumers still need to be idempotent."}],
rf:["\"We use Kafka, so we have exactly-once\"","Thinks FIFO means no duplicates ever","Can't explain where the duplicate comes from"]},

{id:"A004",skill:"Event-Driven",level:"Basic",type:"Scenario",
q:"A consumer handles OrderPlaced and sends a confirmation email. Some customers get two emails. Why, and how do you fix it?",
a:`<p>The likely cause is at-least-once redelivery. The consumer sent the email, then crashed or timed out before committing the offset or deleting the message. Other causes: a rebalance mid-batch, an SQS visibility timeout shorter than processing time, or the producer publishing twice (retry after an ambiguous timeout, or a dual-write bug).</p>
<p><b>Fix:</b> make the handler idempotent on the event ID. Record processed IDs in a table with a unique constraint, in the same transaction as any DB side effect:</p>
<pre><code>INSERT INTO processed_messages (message_id, handler, processed_at)
VALUES (@id, 'SendConfirmation', SYSUTCDATETIME());
-- unique violation =&gt; already handled, ack and skip</code></pre>
<p>Email is an external side effect, so the DB transaction can't cover it. Either pass an idempotency key to the email provider if it supports one, or record "sending" state first and accept a rare duplicate on a crash in that narrow window. Also check the producer: if it publishes after the DB commit, fix that with an outbox.</p>`,
keys:["Identifies redelivery and producer duplicates as separate causes","Idempotency keyed on a stable event ID, not on payload","Unique constraint, not check-then-insert","Acknowledges the external side effect can't be made perfectly exactly-once"],
trade:["Dedup table retention vs storage: keep IDs longer than the maximum redelivery window","Provider idempotency keys are cleanest but not every provider has them","For low-stakes side effects a rare duplicate may be acceptable; for payments it is not"],
fu:[{q:"Why not just check \"have I seen this ID?\" before processing?",a:"Check-then-act races: two consumers (or a redelivery during a slow first attempt) can both pass the check. The unique constraint or a conditional write makes the database arbitrate atomically."}],
rf:["\"Make the consumer faster\" as the only fix","Deduplicating on message content instead of an ID","No mention of the producer side"]},

{id:"A005",skill:"Kafka",level:"Basic",type:"Concept",
q:"Explain topics, partitions, offsets and consumer groups in Kafka.",
a:`<p>A <b>topic</b> is a named stream, split into <b>partitions</b>. Each partition is an ordered, append-only log, and each record gets an <b>offset</b> that is its position in that partition. Ordering is guaranteed only within a partition.</p>
<p>A <b>consumer group</b> shares the work: each partition is assigned to exactly one consumer in the group, so the maximum parallelism of a group equals the partition count. Different groups read the same topic independently, each with its own committed offsets (stored in the internal <code>__consumer_offsets</code> topic). The record key decides the partition (by hash by default), so records with the same key stay in order.</p>`,
keys:["Ordering is per partition only","One partition → one consumer per group","Parallelism capped by partition count","Groups are independent readers","Key → partition → per-entity ordering"],
fu:[{q:"What happens if you run more consumers than partitions?",a:"The extras sit idle with no assignment. They only help as hot standbys that take over during a rebalance."},
{q:"Can you increase the partition count later?",a:"Yes, but the hash-to-partition mapping changes for existing keys, so new records for a key may land on a different partition than older ones. That breaks per-key ordering across the change. Size partitions up front with headroom, or plan a migration to a new topic."}],
rf:["Thinks Kafka guarantees global ordering","Believes adding consumers always adds throughput","Confuses consumer groups with partitions"]},

{id:"A006",skill:"Kafka",level:"Basic",type:"Concept",
q:"How is Kafka different from a traditional queue like SQS or RabbitMQ, and how do you choose?",
a:`<p>Kafka is a <b>retained log</b>. Records stay for the retention period (time or size based) whether or not anyone has read them. Consumers track their own offsets, so they can replay, and many groups can read the same data. A classic queue <b>deletes on acknowledgement</b>. Consumers compete for messages, each message is acked individually, and replay isn't built in.</p>
<p>I choose Kafka for high-throughput streams, multiple independent consumers of the same events, per-key ordering, and replay (rebuilding a read model, backfilling a new service). I choose SQS for task queues where each job is handled once with per-message retry and a DLQ, especially on serverless, where there is nothing to operate. Kafka has no per-message DLQ; you build retry and dead-letter topics yourself.</p>`,
keys:["Retained log vs delete-on-ack","Replay and multiple consumer groups","Per-message ack and DLQ are queue strengths","Operational cost difference (MSK/Confluent vs fully managed SQS)"],
fu:[{q:"What is log compaction and when would you use it?",a:"Compaction keeps at least the latest record per key instead of deleting by age. A record with a null value (a tombstone) eventually removes the key. Use it for changelog or state topics, such as the latest profile per user, so a new consumer can rebuild current state without reading the full history."},
{q:"What changed with ZooKeeper?",a:"Kafka moved metadata management into Kafka itself with KRaft (a Raft-based controller quorum). Kafka 4.0 removed ZooKeeper support entirely, so new clusters and upgrades past 3.x must run in KRaft mode."}],
rf:["\"Kafka is just a faster queue\"","Doesn't know retention is independent of consumption","Assumes Kafka has a built-in DLQ"]},

{id:"A007",skill:"Kafka",level:"Basic",type:"Concept",
q:"What do acks, replication factor and min.insync.replicas control, and what's a sensible durable setup?",
a:`<p><b>Replication factor</b> is how many copies of each partition exist. The <b>ISR</b> (in-sync replicas) are those caught up with the leader. <b>acks</b> is how long the producer waits: <code>0</code> means no wait, <code>1</code> means the leader has written it, and <code>all</code> means all current ISR members have it. <b>min.insync.replicas</b> works with <code>acks=all</code>: if the ISR shrinks below that number, writes fail with <code>NotEnoughReplicas</code> rather than silently becoming less durable.</p>
<p>A typical durable setup is RF=3, <code>min.insync.replicas=2</code>, <code>acks=all</code>, which tolerates one broker loss without losing acknowledged writes. Since Kafka 3.0 the producer defaults to <code>acks=all</code> and <code>enable.idempotence=true</code>.</p>`,
keys:["acks=all waits for ISR, not all replicas","min.insync.replicas turns shrinking ISR into a visible failure","RF=3 / min ISR=2 reasoning","Knows the 3.0 default change"],
fu:[{q:"What is unclean leader election?",a:"If enabled, a replica that is not in sync can become leader when no ISR member is available. That restores availability but loses the records it was missing. It is off by default, and should stay off for anything where losing acknowledged data matters."}],
rf:["Thinks acks=all with RF=3 and min ISR=1 is safe","Confuses replication factor with partition count"]},

{id:"A008",skill:"Kafka",level:"Basic",type:"Scenario",
q:"Events for the same order must be processed in order, but you also need parallelism across orders. How do you set this up?",
a:`<p>Use <code>orderId</code> as the message key, so all events for an order land on one partition and are read in order. Parallelism then comes from the partition count: with 12 partitions, up to 12 consumers work in parallel, each owning a subset of orders.</p>
<p>Inside a consumer, if I want more concurrency than partitions allow, I can fan work out to in-process workers, but only keyed by orderId (one worker per key bucket). Offsets must be committed only up to the lowest record that has fully finished. I also make sure the producer keeps per-key order, which the idempotent producer does by default.</p>`,
keys:["Key by the entity that needs ordering","Partition count = parallelism ceiling","In-consumer concurrency must stay per-key","Offset commits must not skip unfinished work"],
trade:["More partitions = more parallelism but more open files, longer rebalances and more end-to-end latency on small clusters","A very hot key (one huge customer) still serialises on one partition"],
fu:[{q:"What if one key is extremely hot?",a:"Ordering forces it onto one partition, so it caps that key's throughput. Options: check whether strict ordering is really needed for all event types; split the key into finer-grained sub-entities; or keep ordering and scale that consumer vertically. Salting the key breaks the ordering guarantee, so only do it if order doesn't matter."}],
rf:["Suggests a single partition for everything","Uses a random key and expects ordering","Parallel thread pool inside the consumer with no per-key control"]},

{id:"A009",skill:"SQS",level:"Basic",type:"Concept",
q:"Compare SQS Standard and FIFO queues. When do you pick each?",
a:`<p><b>Standard:</b> at-least-once delivery, best-effort ordering, very high throughput. Duplicates and reordering can occur. <b>FIFO:</b> strict ordering within a <b>message group ID</b>, deduplication of sends within a 5-minute window (by explicit deduplication ID or content-based hashing), and lower throughput quotas (higher with high-throughput mode and batching).</p>
<p>I pick Standard for independent jobs where order doesn't matter and consumers are idempotent. I pick FIFO when per-entity order matters, and I use the entity ID as the message group ID so different entities still process in parallel.</p>`,
keys:["Ordering scope is the message group","Dedup window is 5 minutes and applies to sends","Throughput trade-off","Group ID choice drives parallelism"],
fu:[{q:"What happens in FIFO when one message keeps failing?",a:"Its message group is blocked: later messages in that group are not delivered until it succeeds or moves to the DLQ after maxReceiveCount. Other groups keep flowing. A badly chosen single group ID turns this into a full queue stall."}],
rf:["Thinks Standard is unordered and FIFO is exactly-once end to end","Uses one message group ID for the whole queue without realising it serialises everything"],
verify:"Exact FIFO throughput quotas change over time; check current AWS quotas before quoting numbers."},

{id:"A010",skill:"SQS",level:"Basic",type:"Concept",
q:"Explain visibility timeout and dead-letter queues in SQS. How do you set the timeout for a Lambda consumer?",
a:`<p>When a consumer receives a message, SQS hides it for the <b>visibility timeout</b> (default 30 seconds, maximum 12 hours). If the consumer doesn't delete it before the timeout ends, the message becomes visible again and is redelivered. The timeout must comfortably exceed processing time; long jobs can extend it with <code>ChangeMessageVisibility</code>.</p>
<p>A <b>redrive policy</b> moves a message to a <b>DLQ</b> after it has been received <code>maxReceiveCount</code> times. That stops a poison message from looping forever. You alarm on DLQ depth, and once the bug is fixed you redrive the messages back.</p>
<p>For a Lambda event source mapping, AWS recommends setting the queue's visibility timeout to at least six times the function timeout, so retries and batching don't cause early redelivery.</p>`,
keys:["Timeout too short → duplicate processing","maxReceiveCount + DLQ to contain poison messages","Alarm on DLQ depth","Lambda 6× guidance"],
fu:[{q:"With Lambda and a batch of 10, one message fails. What happens?",a:"By default the whole batch is treated as failed and all 10 become visible again, including the 9 that succeeded. Enable ReportBatchItemFailures and return only the failed message IDs so just those retry."}],
rf:["No DLQ, or a DLQ nobody monitors","Sets maxReceiveCount to 1 (any transient error dead-letters)","Doesn't know about partial batch failures"]},

{id:"A011",skill:"Microservices",level:"Basic",type:"Concept",
q:"What makes something a microservice, and how do you decide where service boundaries go?",
a:`<p>A microservice is <b>independently deployable</b>, <b>owns its data</b> (no other service reads its tables), and is aligned to a business capability. Size is a side effect, not the definition.</p>
<p>For boundaries I start from DDD bounded contexts: where the language and the model change. I then check them against team ownership (Conway's law), change cadence (things that always change together belong together), and consistency needs. Data that must be updated atomically should usually live in one service rather than be split and stitched back with a saga.</p>
<p>Signs the boundaries are wrong: services that always deploy together, chatty synchronous call chains to complete one request, or a shared database.</p>`,
keys:["Independent deployability + data ownership","Bounded contexts as starting point","Team ownership and change cadence","Transactional consistency keeps things together","Can name smells of bad boundaries"],
fu:[{q:"Is a shared database between services ever acceptable?",a:"As a transitional step while strangling a monolith, or for a read-only reporting replica, yes. As a steady state it couples schemas and deployments, so you get the operational cost of microservices without the independence."}],
rf:["Defines microservices by lines of code or \"one table per service\"","Splits by technical layer (an auth DB service, a validation service)","No mention of data ownership"]},

{id:"A012",skill:"Microservices",level:"Basic",type:"Architecture",
q:"Monolith, modular monolith or microservices: how do you choose for a new product?",
a:`<p>For a new product with one or two teams I default to a <b>modular monolith</b>. It is one deployable, but modules have explicit boundaries: separate schemas or table ownership, no cross-module table access, and communication through in-process interfaces or in-process events. You get fast iteration and simple transactions, and the boundaries are already drawn if you need to extract services later.</p>
<p>I move to <b>microservices</b> when specific pressures appear: teams blocking each other on releases, components with very different scaling or availability needs, or a compliance boundary. Even then I extract only the module under pressure. A plain <b>monolith</b> with no internal boundaries is fine for a prototype, but it becomes hard to split.</p>`,
keys:["Choice driven by team size and organisational pressure, not fashion","Modular monolith as a deliberate default","Extraction triggers named concretely","Recognises the distributed-systems tax"],
trade:["Microservices buy team autonomy and independent scaling at the cost of network failures, eventual consistency and platform overhead","A modular monolith needs discipline (architecture tests, e.g. NetArchTest/ArchUnit) or boundaries erode","It depends on: team count, deployment frequency, scaling asymmetry, regulatory isolation"],
fu:[{q:"How do you stop module boundaries eroding in a modular monolith?",a:"Enforce them in CI: architecture tests that fail when one module references another's internals, separate projects with internal visibility, and per-module schemas. Code review alone doesn't hold the line at scale."}],
rf:["\"Microservices from day one so we can scale\"","Treats monolith as a dirty word","Can't name a concrete trigger for extraction"]},

{id:"A013",skill:"Microservices",level:"Basic",type:"Concept",
q:"What does an API gateway do, and how is it different from a service mesh?",
a:`<p>An <b>API gateway</b> handles <b>north-south</b> traffic, from clients into the system: routing, TLS termination, authentication and token validation, rate limiting, request shaping, and sometimes aggregation (a backend-for-frontend). Examples: AWS API Gateway, YARP, Kong.</p>
<p>A <b>service mesh</b> handles <b>east-west</b> traffic between services, usually with sidecar or node-level proxies: mutual TLS, retries and timeouts, traffic shifting for canaries, and uniform telemetry, without changing application code. Examples: Istio, Linkerd, AWS App Mesh (being retired in favour of ECS Service Connect).</p>
<p>They overlap on features but solve different problems. Many teams on ECS need a gateway but not a mesh.</p>`,
keys:["North-south vs east-west","Gateway concerns: auth, rate limit, routing, BFF","Mesh concerns: mTLS, retries, traffic shifting, telemetry","Doesn't add a mesh by default"],
fu:[{q:"What is the BFF pattern and when do you use it?",a:"A backend-for-frontend is a thin API layer per client type (mobile, web) that aggregates and shapes calls for that client. Use it when clients need very different payloads or call patterns; for a mobile app it cuts round trips. The risk is business logic leaking into it, so keep it to composition."}],
rf:["Puts business logic in the gateway","Thinks a mesh is required for microservices"],
verify:"AWS App Mesh end-of-support date: AWS announced retirement (Sept 2026) with ECS Service Connect as the recommended path; confirm current status before citing."},

{id:"A014",skill:"Microservices",level:"Basic",type:"Concept",
q:"Explain timeout, retry, circuit breaker and bulkhead. How do you apply them in .NET?",
a:`<p><b>Timeout</b> bounds how long you wait. <b>Retry</b> handles transient faults, with exponential backoff and jitter, and only for idempotent operations. <b>Circuit breaker</b> stops calling a failing dependency once the failure rate crosses a threshold (open), fails fast for a while, then lets a trial request through (half-open). <b>Bulkhead</b> isolates resources, for example a separate connection or concurrency limit per dependency, so one slow dependency can't exhaust everything.</p>
<p>In .NET 8 the standard route is <code>Microsoft.Extensions.Http.Resilience</code>, built on Polly v8:</p>
<pre><code>builder.Services.AddHttpClient&lt;PaymentsClient&gt;(c =&gt;
        c.BaseAddress = new Uri(config["Payments:Url"]!))
    .AddStandardResilienceHandler(o =&gt;
    {
        o.AttemptTimeout.Timeout = TimeSpan.FromSeconds(2);
        o.TotalRequestTimeout.Timeout = TimeSpan.FromSeconds(6);
        o.Retry.MaxRetryAttempts = 2;
    });</code></pre>
<p>Order matters: the total timeout sits outside retries, and the per-attempt timeout sits inside them.</p>`,
keys:["Retry only idempotent calls, with backoff + jitter","Breaker states and fail-fast purpose","Bulkhead as resource isolation","Per-attempt vs total timeout","Knows .NET 8 resilience package or Polly"],
fu:[{q:"How can retries make an outage worse?",a:"Retries multiply load on a dependency that is already struggling. Three layers each retrying three times can turn one request into 27 calls. Retry at one layer only, use backoff with jitter, cap retries with a budget, and let the circuit breaker stop the traffic."}],
rf:["Retries POSTs blindly","No jitter","Uses the default 100-second HttpClient timeout","Circuit breaker described as a retry"]},

{id:"A015",skill:"Distributed Fundamentals",level:"Basic",type:"Concept",
q:"Explain the CAP theorem, and what's commonly misunderstood about it.",
a:`<p>CAP says that during a <b>network partition</b> a distributed data store must choose between <b>consistency</b> (linearizability: every read sees the latest write) and <b>availability</b> (every request to a non-failed node gets a non-error response). Partitions aren't optional on real networks, so the real choice is what to give up when one happens.</p>
<p>Common misunderstandings: "pick any two of three" (you can't opt out of P); treating it as a permanent system label (many stores are tunable per operation); and ignoring normal operation. <b>PACELC</b> covers that: Else, without a partition, you trade <b>latency</b> against consistency. DynamoDB is an example: reads are eventually consistent by default, and you can ask for strongly consistent reads at higher cost and latency.</p>`,
keys:["Choice is only forced during a partition","C in CAP = linearizability, not ACID C","PACELC adds latency vs consistency","Tunable consistency per operation"],
fu:[{q:"Give a product example where you'd choose availability over consistency.",a:"A social feed or like counts: showing a slightly stale count is fine, and refusing to load the feed is not. Account balance or stock reservation goes the other way. You'd rather reject or queue the request than double-spend."}],
rf:["\"MongoDB is CP, Cassandra is AP\" as the whole answer","Confuses CAP consistency with ACID consistency","Says you can pick CA for a distributed system"]},

{id:"A016",skill:"Distributed Fundamentals",level:"Basic",type:"Concept",
q:"What does eventual consistency mean for the user, and how do you design around it?",
a:`<p>Eventual consistency means replicas or read models converge once writes stop, but a read right after a write may return old data. The user-visible symptom is "I saved it and it disappeared", which breaks <b>read-your-writes</b>.</p>
<p>Design techniques:</p>
<ul>
<li>Return the written resource in the write response and update the UI optimistically.</li>
<li>Route the user's own reads to the primary for a short window after they write (session stickiness).</li>
<li>Return a version or timestamp and have the client wait until the read model reaches it.</li>
<li>Be explicit in the UX for long-running work: "Processing", then a push update.</li>
</ul>
<p>Other users seeing a change a second later is usually fine. The author not seeing their own change is what generates bug reports.</p>`,
keys:["Names read-your-writes and monotonic reads","Concrete UX/API techniques","Separates author vs other viewers","Treats staleness tolerance as a product decision"],
fu:[{q:"In a CQRS setup, the read model lags by 2 seconds after a command. What do you do?",a:"Return enough from the command response for the UI to render immediately. If needed, return the event version and let the query endpoint accept a minimum-version parameter that waits briefly or falls back to the write model."}],
rf:["Says eventual consistency means data might be wrong forever","Only fix offered is \"add a delay\""]},

{id:"A017",skill:"API Design",level:"Basic",type:"Concept",
q:"Which HTTP methods are safe and which are idempotent? How do you make a POST safe to retry?",
a:`<p><b>Safe</b> (no state change): GET, HEAD, OPTIONS. <b>Idempotent</b> (repeating has the same effect as once): the safe methods plus PUT and DELETE. POST is not idempotent, and PATCH isn't guaranteed to be. DELETE is still idempotent even though the second call may return 404: the server state is the same.</p>
<p>To make a POST retry-safe, the client sends an <b>Idempotency-Key</b> header (a pattern Stripe popularised; there is an IETF draft for it). The server stores key + request fingerprint + response. A repeat with the same key returns the stored response. The same key with a different payload is rejected (422). A concurrent duplicate while the first is still running gets 409. Keys expire after a TTL.</p>`,
keys:["Correct safe/idempotent sets","Idempotent ≠ same response code","Idempotency key with stored response","Handles payload mismatch and in-flight duplicates"],
fu:[{q:"Where do you store idempotency keys and for how long?",a:"In a store with an atomic insert-if-absent: a unique-keyed table in the same database as the write (so it can share the transaction), or Redis SET NX. Keep them at least as long as clients may retry, typically 24 hours for payment-style APIs."}],
rf:["Says PUT and POST are interchangeable","Thinks idempotent means the response must be identical","No handling for concurrent retries"]},

{id:"A018",skill:"API Design",level:"Basic",type:"Concept",
q:"Offset pagination vs cursor (keyset) pagination: which do you use for a feed, and why?",
a:`<p><b>Offset</b> (<code>OFFSET 2000 LIMIT 20</code>) is simple and supports "jump to page N". But the database still reads and discards all skipped rows, so deep pages get slow, and inserts while the user scrolls shift rows, causing duplicates or gaps.</p>
<p><b>Keyset</b> pagination seeks from the last item seen, using an index:</p>
<pre><code>SELECT id, created_at, body
FROM posts
WHERE (created_at, id) &lt; (@lastCreatedAt, @lastId)
ORDER BY created_at DESC, id DESC
LIMIT 20;   -- index on (created_at DESC, id DESC)</code></pre>
<p>It costs the same at any depth and stays stable under inserts. For a feed I use keyset, with an opaque, encoded cursor so clients don't depend on its structure. The cost is no random page access, which a feed doesn't need. (The row-value comparison above works in PostgreSQL; in SQL Server you expand it into <code>created_at &lt; @c OR (created_at = @c AND id &lt; @id)</code>.)</p>`,
keys:["Offset cost grows with depth","Instability under concurrent inserts","Keyset needs a unique tie-breaker and a matching index","Opaque cursor","Picks per use case (admin grid vs feed)"],
fu:[{q:"Why include id in the cursor?",a:"created_at isn't unique. Without a tie-breaker, rows with the same timestamp are skipped or repeated at page boundaries. The cursor must be a total order."}],
rf:["Uses offset for infinite scroll at scale","Cursor on a non-unique column","No supporting index"]},

/* ================= INTERMEDIATE (part 1) ================= */
{id:"A019",skill:"Kafka",level:"Intermediate",type:"Scenario",
q:"A Kafka consumer group keeps rebalancing and throughput collapses. What are the likely causes, and how do you fix them?",
a:`<p>Diagnostic order:</p>
<ol>
<li><b>Processing too slow between polls.</b> If handling a batch exceeds <code>max.poll.interval.ms</code> (default 5 minutes), the consumer is evicted. Look for "poll timeout exceeded" in client logs. Fix: lower <code>max.poll.records</code> (default 500), speed up the handler, or raise the interval deliberately.</li>
<li><b>Missed heartbeats.</b> Long GC pauses, CPU throttling in containers, or network issues exceed <code>session.timeout.ms</code> (default 45s since Kafka 3.0).</li>
<li><b>Membership churn.</b> Rolling deploys, autoscaling, or crash-looping pods each trigger a rebalance. Fix: static membership (<code>group.instance.id</code>) so restarts within the session timeout don't rebalance.</li>
<li><b>Eager rebalancing.</b> The old protocol stops every consumer. Use the cooperative-sticky assignor, or the new consumer group protocol (KIP-848, GA in Kafka 4.0), which rebalances incrementally.</li>
</ol>
<p>Metrics to check: rebalance rate and join time from consumer metrics, consumer lag per partition, and pod restarts.</p>`,
keys:["max.poll.interval.ms vs session.timeout.ms distinction","Static membership","Cooperative / incremental rebalancing","Container CPU throttling or GC as a hidden cause","Uses lag and rebalance metrics, not guesses"],
trade:["Raising max.poll.interval.ms hides stuck consumers for longer","Smaller batches lower throughput per poll","Static membership delays reassignment when a consumer really is dead"],
fu:[{q:"Can you move processing to a background thread and keep polling?",a:"Yes, but then you must pause() the partitions, keep polling to stay in the group, and commit offsets only for records that have finished. Done carelessly, it commits offsets for unfinished work and loses messages on a crash."}],
rf:["\"Add more consumers\" as the fix","Doesn't distinguish the two timeouts","Turns on auto-commit with async processing"]},

{id:"A020",skill:"Kafka",level:"Intermediate",type:"Concept",
q:"How does Kafka's idempotent producer work, and how could ordering break on retries without it?",
a:`<p>Without idempotence, a producer with several in-flight requests can lose ordering. Batch 1 fails transiently, batch 2 succeeds, then batch 1 is retried and lands after batch 2. A retry after a lost ack can also write a duplicate.</p>
<p>With <code>enable.idempotence=true</code>, the broker assigns the producer an ID, and each batch carries a per-partition sequence number. The broker rejects duplicates and out-of-sequence batches, so retries neither duplicate nor reorder, with up to 5 in-flight requests per connection. Since Kafka 3.0 it is on by default, provided you haven't set conflicting configs such as <code>acks=1</code>.</p>
<p>Its scope is one producer session and one partition. It doesn't dedupe across producer restarts (that needs transactions with a <code>transactional.id</code>), and it doesn't stop your application from publishing the same business event twice.</p>`,
keys:["Explains the reorder-on-retry mechanism","Producer ID + sequence numbers","max.in.flight ≤ 5","Scope limits: session and partition","Default since 3.0, with conflicting-config caveat"],
fu:[{q:"Before idempotence, how did people keep order?",a:"They set max.in.flight.requests.per.connection=1, which keeps order but cuts throughput because only one request per connection is outstanding."}],
rf:["Thinks idempotent producer gives end-to-end exactly-once","Doesn't know retries can reorder"]},

{id:"A021",skill:"Event-Driven",level:"Intermediate",type:"Architecture",
q:"Explain the transactional outbox pattern. Why not just publish to the broker right after the database commit?",
a:`<p>"Save, then publish" is a <b>dual write</b>. If the process dies between the commit and the publish, the state changed but no event exists. Publishing first and then committing is worse: the event exists for a change that may roll back. You can't wrap a DB and a broker in one transaction (no 2PC in practice).</p>
<p><b>Outbox:</b> in the same DB transaction as the business change, insert the event into an <code>outbox</code> table. A separate relay reads the outbox and publishes, marking rows sent.</p>
<pre><code>await using var tx = await db.Database.BeginTransactionAsync();
order.Place();
db.Outbox.Add(OutboxMessage.From(new OrderPlaced(order.Id, order.Total)));
await db.SaveChangesAsync();
await tx.CommitAsync();
// relay: SELECT pending rows ORDER BY id → publish → mark sent</code></pre>
<p>Two relay styles: <b>polling</b> the table (simple, adds latency and DB load) or <b>CDC</b> (Debezium reading the transaction log, low latency, more infrastructure). Both give at-least-once publishing, so consumers must be idempotent. Libraries like MassTransit and NServiceBus ship outbox implementations.</p>`,
keys:["Names the dual-write failure precisely","Event written in the same transaction","Relay gives at-least-once → consumer idempotency","Polling vs CDC trade-off","Cleanup/retention of outbox rows"],
trade:["Polling: easy, works anywhere, but adds latency and DB load and needs care for ordering with multiple relay instances","CDC: near-real-time and no polling load, but adds Debezium/Kafka Connect to operate and couples to the DB log format","It depends on: event volume, latency needs, whether Kafka Connect is already run"],
fu:[{q:"How do you keep event order with several relay instances?",a:"Either run a single active relay (leader election or a lock), or partition the outbox by aggregate ID and have each relay own a partition. Kafka keys on aggregate ID then preserve order per entity."},
{q:"What's the inbox pattern?",a:"The consumer-side mirror: record each incoming message ID in an inbox table in the same transaction as the handler's DB changes, so redeliveries are detected and skipped."}],
rf:["\"Wrap it in a TransactionScope\" with the broker","Publishes inside the DB transaction before commit","Assumes the relay delivers exactly once"]},

{id:"A022",skill:"Event-Driven",level:"Intermediate",type:"Architecture",
q:"Choreography vs orchestration for a saga, such as order → payment → inventory → shipping. How do you choose?",
a:`<p>A <b>saga</b> replaces a distributed transaction with a sequence of local transactions, each with a <b>compensating action</b> (refund the payment, release the stock) for when a later step fails.</p>
<p><b>Choreography:</b> each service reacts to events and emits its own. There is no central coordinator and coupling is low, but the overall flow exists only implicitly across services. It gets hard to see, change and debug past three or four steps, and cyclic event dependencies creep in.</p>
<p><b>Orchestration:</b> a coordinator (AWS Step Functions, Temporal, a MassTransit state machine) sends commands and tracks state. The flow is explicit, timeouts and compensation live in one place, and the status is easy to query. The cost is a central component that knows every step.</p>
<p>I use choreography for simple fan-out reactions ("order placed → send email, update analytics"). I use orchestration for business processes with ordering, timeouts and compensation, like checkout.</p>`,
keys:["Saga = local transactions + compensations, not rollback","Choreography's visibility problem","Orchestrator owns state, timeouts, compensation","Picks by process complexity","Names a real orchestrator"],
trade:["Choreography: loose coupling, no single point of failure, poor visibility","Orchestration: explicit flow and easy monitoring, but central coupling and one more thing to run","Compensations aren't perfect undos (an email can't be unsent), so you design semantic compensation","It depends on: number of steps, need for timeouts, who owns the process"],
fu:[{q:"What do you do when a compensation itself fails?",a:"Compensations must be idempotent and retried until they succeed. If retries are exhausted, park the saga in a failed state with an alert and a manual-resolution path. You can't compensate the compensation, so make it as simple as possible."}],
rf:["Proposes 2PC across services","Assumes compensation restores the exact previous state","Can't say how to find where a choreographed order is stuck"]},

{id:"A023",skill:"Microservices",level:"Intermediate",type:"Scenario",
q:"Service A calls B, which calls C. C slows down, and soon A is timing out and its instances look exhausted. Walk through what's happening and how you'd fix it.",
a:`<p>This is a <b>cascading failure</b>. C's latency holds B's outbound calls open. B's connection pool, thread pool or concurrency limit fills, so B slows down. Then the same thing happens to A. Callers retry, which adds load to C exactly when it is struggling.</p>
<p><b>Immediate:</b> confirm with traces where the time goes, then shed load. Open the circuit to C, or switch on a degraded fallback such as cached data or hiding a widget.</p>
<p><b>Structural fixes:</b></p>
<ul>
<li>Timeouts at every hop, set from a budget. A's deadline must exceed B's, which must exceed C's, and the deadline should be propagated.</li>
<li>Circuit breaker and bulkhead around C in B, so C can't consume all of B's capacity.</li>
<li>Retries at one layer only, with backoff, jitter and a retry budget.</li>
<li>In .NET, use <code>IHttpClientFactory</code>. Creating a new <code>HttpClient</code> per call exhausts sockets, and a single static client ignores DNS changes. Avoid sync-over-async (<code>.Result</code>), which starves the thread pool.</li>
<li>Ask whether A needs C synchronously at all. Can it be async or cached?</li>
</ul>`,
keys:["Explains the propagation mechanism (pools fill, retries amplify)","Timeout budgets decreasing down the chain","Breaker + bulkhead placement","Fallback or degradation","Questions whether the sync dependency should exist"],
trade:["Tight timeouts fail fast but raise error rates under normal tail latency; set them from measured p99, not guesses","Fallbacks show stale data; acceptable for a feed, not for a balance"],
fu:[{q:"How do you pick the timeout value?",a:"From the dependency's measured latency distribution (for example p99 plus a margin), constrained by the caller's own SLO budget. Revisit when the dependency's performance changes. Defaults like HttpClient's 100 seconds are almost always wrong for service-to-service calls."}],
rf:["\"Scale C up\" as the only answer","Adds retries at every layer","No mention of timeouts"]},

{id:"A024",skill:"API Design",level:"Intermediate",type:"Concept",
q:"How do you version and evolve a public or mobile-facing API without breaking clients?",
a:`<p>First, avoid needing a new version. Make changes <b>additive</b>: new optional fields, new endpoints, new enum values documented as possible. Write clients as <b>tolerant readers</b> that ignore unknown fields and handle unknown enum values. Never rename, remove, or change the meaning or type of a field in place.</p>
<p>For genuinely breaking changes, introduce a new version. URL versioning (<code>/v2/</code>) is the most visible and cache-friendly. Header or media-type versioning keeps URLs clean but is harder to test and route. I pick one and apply it consistently. Run old and new side by side, measure traffic per version, and announce deprecation with the <code>Deprecation</code> and <code>Sunset</code> response headers plus a dated plan.</p>
<p>Mobile apps make this harder because old builds live for months. Keep server-side compatibility for the supported app versions, and have a minimum-supported-version check that forces an upgrade as the last resort.</p>`,
keys:["Additive change and tolerant reader first","Clear list of what counts as breaking","One consistent versioning scheme","Measure usage before removal","Mobile long-tail and forced upgrade"],
fu:[{q:"Is adding a value to an enum a breaking change?",a:"It can be. Clients that switch exhaustively or deserialize into a strict enum may crash on the unknown value. Document enums as open from day one and make clients map unknown values to a default."}],
rf:["Versions every endpoint on every change","Considers removing a field non-breaking because \"nobody uses it\" without data","Ignores old mobile builds"]},

{id:"A025",skill:"Distributed Fundamentals",level:"Intermediate",type:"Scenario",
q:"Two users edit the same record at the same time and one silently overwrites the other. How do you prevent lost updates across the API and the database?",
a:`<p>This is the lost-update problem: both read version 5, both write, and the last write wins. Fix it with <b>optimistic concurrency</b> end to end:</p>
<ul>
<li><b>API:</b> return an <code>ETag</code> (the row version) on GET. Require <code>If-Match</code> on PUT or PATCH. If it doesn't match, return <code>412 Precondition Failed</code>; if it is missing, return <code>428 Precondition Required</code>.</li>
<li><b>Database:</b> make the update conditional on the version. In EF Core, a concurrency token does this and throws <code>DbUpdateConcurrencyException</code> when zero rows match.</li>
</ul>
<pre><code>public class Order
{
    public Guid Id { get; set; }
    [Timestamp] public byte[] RowVersion { get; set; } = default!; // SQL Server rowversion
}
// UPDATE ... WHERE Id = @id AND RowVersion = @original</code></pre>
<p>On PostgreSQL with Npgsql, a <code>uint</code> concurrency token maps to the <code>xmin</code> system column. In DynamoDB, use a <code>ConditionExpression</code> on a version attribute. On conflict, show the user the newer data and let them merge or retry. Use pessimistic locking (<code>SELECT … FOR UPDATE</code> / <code>UPDLOCK</code>) only when conflicts are frequent and the critical section is short.</p>`,
keys:["Names lost update and last-write-wins","ETag/If-Match with 412","Conditional update on a version","Conflict UX, not just an exception","Optimistic vs pessimistic choice by contention"],
trade:["Optimistic: no locks held, scales well, but users hit conflicts under high contention","Pessimistic: no conflicts, but blocking, deadlock risk and lock duration tied to user think-time if misused","It depends on: contention rate, cost of a retry, length of the critical section"],
fu:[{q:"Two requests both decrement stock from 1. Is optimistic concurrency enough?",a:"Yes, if the version check or an atomic conditional update guards it: UPDATE ... SET qty = qty - 1 WHERE id = @id AND qty >= 1, then check rows affected. The atomic conditional statement is often simpler than a version round-trip for counters."}],
rf:["\"Use a transaction\" (default isolation doesn't stop lost updates in a read-modify-write across requests)","Holds DB locks while the user edits a form","No API-level contract (ETag)"]},

/* ================= INTERMEDIATE (part 2) ================= */
{id:"A026",skill:"Event-Driven",level:"Intermediate",type:"Scenario",
q:"One malformed record makes a Kafka consumer throw on every attempt. Lag on that partition keeps growing while the others are fine. What do you do now, and what do you build so it doesn't happen again?",
a:`<p>This is a <b>poison message</b>. Kafka has no per-message ack, so the consumer can't move past the record without committing its offset, and the whole partition stalls behind it.</p>
<p><b>Now:</b> find the offset from logs. Either ship a hotfix that tolerates it, or skip it deliberately: copy it somewhere safe, then commit past it (or reset the group's offset to <code>offset+1</code> while the group is stopped). Never skip without keeping a copy.</p>
<p><b>Then build failure classification into the consumer:</b></p>
<ul>
<li><b>Permanent errors</b> (deserialization, validation): send straight to a <b>dead-letter topic</b> with headers for the error, original topic, partition and offset, then continue.</li>
<li><b>Transient errors</b> (DB timeout): retry in place with backoff a few times. If they persist, either block (keeps order, stalls the partition) or route to <b>retry topics</b> with increasing delays (<code>orders.retry.1m</code>, <code>orders.retry.10m</code>), then to the DLT.</li>
<li>Alert on DLT growth, and have a tool to inspect and replay DLT records.</li>
</ul>
<p>The Confluent .NET client has no built-in retry or DLT, so you write this wrapper yourself (or use a framework such as MassTransit's Kafka rider).</p>`,
keys:["Explains why one record blocks a partition","Separates permanent from transient failures","DLT with diagnostic headers","Retry topics break ordering; blocking retries keep it","Never silently drops data"],
trade:["Non-blocking retry topics keep throughput but process the failed record out of order relative to later records for the same key","Blocking retries keep order but one bad dependency stalls the partition","It depends on: whether per-key ordering is a business requirement for this event type"],
fu:[{q:"How do you replay from the DLT once fixed?",a:"A small tool or job reads the DLT, optionally filters by error type, and republishes to the original topic (or a retry topic). Consumers must be idempotent, because the record may have partially succeeded the first time."}],
rf:["\"Catch and log the exception, then commit\" (silent data loss)","Infinite in-place retry with no alert","Doesn't realise retry topics affect ordering"]},

{id:"A027",skill:"Event-Driven",level:"Intermediate",type:"Concept",
q:"How do you evolve event schemas when producers and consumers deploy independently?",
a:`<p>Treat events as a public contract with compatibility rules, enforced by tooling rather than by convention:</p>
<ul>
<li><b>Allowed:</b> add optional fields with defaults.</li>
<li><b>Breaking:</b> remove or rename a field, change a type, change the meaning of a field, or make an optional field required.</li>
<li><b>Schema registry</b> (Confluent Schema Registry, AWS Glue Schema Registry) with Avro, Protobuf or JSON Schema checks compatibility at publish or CI time. Confluent's default mode is <code>BACKWARD</code>: a consumer on the new schema can read data written with the old one, so you upgrade consumers first.</li>
<li>For a genuinely breaking change, publish a new event type or version (<code>OrderPlaced.v2</code>, or a new topic), dual-publish for a period, migrate consumers, then retire v1.</li>
</ul>
<p>Because Kafka retains data, remember that a consumer replaying from the start reads <i>old</i> schemas too. Compatibility has to cover what is still in the log, not only the current producer.</p>`,
keys:["Additive vs breaking changes listed concretely","Registry + compatibility mode, checked in CI","Knows what BACKWARD implies for deploy order","New event type/version for breaking changes","Replay reads old schemas"],
fu:[{q:"JSON with no registry: how do you stay safe?",a:"Version field in the envelope, tolerant-reader consumers that ignore unknown fields, contract tests in CI against example payloads from each version, and a written rule that fields are never removed or retyped. It works, but nothing enforces it except discipline and tests."}],
rf:["\"We just update producers and consumers together\"","Renames fields in place","Unaware of compatibility modes"]},

{id:"A028",skill:"Event-Driven",level:"Intermediate",type:"Scenario",
q:"A consumer receives OrderShipped before OrderPaid and puts the order in an invalid state. Why can this happen, and how do you make the consumer robust?",
a:`<p><b>Why:</b> the events come from different services or topics, or are keyed differently, so they land on different partitions with no ordering between them. Other causes: a retry topic delivered one late, or two producer instances raced.</p>
<p><b>Making it robust:</b></p>
<ul>
<li>Put a <b>per-aggregate version or sequence number</b> on events. The consumer stores the last version applied per aggregate and ignores anything older (stale or duplicate).</li>
<li>Model the consumer's view as a <b>state machine that tolerates arrival order</b>. Record "shipped" and "paid" as independent facts and derive the status from both, rather than requiring Paid → Shipped transitions.</li>
<li>If a step truly needs its predecessor, <b>park</b> the early event (a pending table with retry) and reprocess when the prerequisite arrives, with a timeout and alert.</li>
<li>If strict order really matters across these events, publish them from one producer keyed by orderId on one topic.</li>
</ul>`,
keys:["Ordering only exists within a partition of one topic","Version numbers to drop stale events","Order-tolerant state modelling","Parking with timeout as a fallback","Fix at the source when order is truly required"],
trade:["Parking adds state and timeouts to manage","A single topic for all order events keeps order but couples event types and consumers","It depends on: whether the domain truly needs order or only needs the final state right"],
fu:[{q:"Can't you just sort by event timestamp?",a:"Timestamps from different machines are subject to clock skew and don't give a reliable order. Use a sequence assigned by the aggregate's owner (for example a version column incremented in the same transaction as the change)."}],
rf:["Assumes Kafka orders across topics","Sorts by wall-clock timestamp","Throws and retries forever until the earlier event arrives"]},

{id:"A029",skill:"Event-Driven",level:"Intermediate",type:"Concept",
q:"What's the difference between event-driven architecture and event sourcing? When is event sourcing worth it?",
a:`<p><b>Event-driven architecture</b> is about <i>communication</i>: services publish events so others can react. Each service still stores current state however it likes.</p>
<p><b>Event sourcing</b> is about <i>persistence</i>: the event log <i>is</i> the source of truth for an aggregate. Current state is rebuilt by replaying its events, usually with snapshots for speed. Read models (projections) are built from the same stream.</p>
<p>It is worth it when the history itself is a requirement: audit (finance, healthcare, compliance), temporal queries ("what did this look like on 1 March?"), or complex domains where the business thinks in events. It is usually not worth it for CRUD-shaped domains. The costs are real: event schema versioning forever, projections to rebuild, eventual consistency on reads, harder ad-hoc querying, and GDPR erasure against an immutable log (often handled by crypto-shredding).</p>`,
keys:["Communication vs persistence distinction","Snapshots and projections","Concrete fit criteria (audit, temporal queries)","Honest costs incl. versioning and erasure"],
fu:[{q:"How do you handle a GDPR erasure request in an event-sourced system?",a:"Commonly crypto-shredding: encrypt personal data in events with a per-subject key stored elsewhere, and delete the key on erasure. Alternatively keep PII out of events and reference it by ID from a store that can be deleted. Rewriting history is possible but painful."}],
rf:["Uses the two terms as synonyms","Recommends event sourcing for every service","Doesn't know about snapshots"]},

{id:"A030",skill:"Event-Driven",level:"Intermediate",type:"Architecture",
q:"When would you separate read and write models (CQRS), and what does it cost you?",
a:`<p>CQRS separates the model that handles commands (validation, invariants, a normalised store) from the models that serve queries (denormalised, shaped for each screen or search).</p>
<p>It pays off when reads and writes have very different shapes or scale: a social feed read thousands of times per write, search over OpenSearch while writes go to PostgreSQL, or dashboards that would need ten-way joins on the write model.</p>
<p>The cost is that projections are updated asynchronously from events, which brings eventual consistency (read-your-writes needs handling), projection rebuild tooling, more infrastructure, and more code paths to test. A lighter version — separate query classes or a read-only DB replica with the same schema — often gets most of the benefit. Using MediatR commands and queries in one database is a code-organisation pattern, not CQRS's scaling benefit.</p>`,
keys:["Different shapes/scale of read vs write as the trigger","Projections fed by events","Eventual consistency cost","Lighter variants (replica, query services)","Doesn't confuse MediatR with CQRS"],
trade:["Big win for read-heavy or search-heavy domains","Pure overhead for simple CRUD","It depends on: read/write ratio, query complexity, tolerance for stale reads"],
fu:[{q:"A projection has a bug and contains wrong data. How do you fix it?",a:"Fix the projection code, then rebuild it by replaying events into a new table or index (blue-green). Switch reads over once it catches up, then drop the old one. This is why you keep the event history or the ability to re-derive it."}],
rf:["\"CQRS means two databases\" (it doesn't have to)","Applies CQRS everywhere","No plan for projection rebuilds"]},

{id:"A031",skill:"Kafka",level:"Intermediate",type:"Scenario",
q:"Consumer lag on a topic has been rising steadily for an hour. How do you diagnose and fix it?",
a:`<p>Lag means producers are writing faster than the group is committing. Find which side changed:</p>
<ol>
<li><b>Produce rate:</b> did inbound traffic spike (a campaign, a backfill job)? Check bytes-in and messages-in per topic.</li>
<li><b>Lag per partition:</b> <code>kafka-consumer-groups.sh --describe --group g</code>, or MSK's <code>MaxOffsetLag</code>/<code>SumOffsetLag</code> metrics. If lag sits on one or two partitions, you have a <b>hot key</b> or a stuck consumer. If it is spread across all of them, the group as a whole is too slow.</li>
<li><b>Consumer health:</b> rebalances, restarts, errors and retries in the handler.</li>
<li><b>Handler latency:</b> usually the real cause is a downstream system (DB writes, an API call) getting slower.</li>
</ol>
<p><b>Fixes, in order:</b> fix the slow downstream (batch writes, add an index, add a cache). Scale consumers, but only up to the partition count. Process in batches. Fix the hot key. Add partitions only as a planned change, because it remaps keys.</p>`,
keys:["Produce-side vs consume-side diagnosis","Per-partition lag to find skew","Downstream latency as the usual cause","Knows scaling stops at partition count","Lag tooling/metrics named"],
trade:["Adding partitions increases ceiling but breaks key→partition mapping for existing keys","Batching writes improves throughput but widens the reprocessing window on failure"],
fu:[{q:"How would you alert on lag?",a:"Alert on lag growth or time-lag (how old the oldest unprocessed record is) rather than a raw message count, since a fixed count means different things at different throughputs. Pair it with the consumer's processing rate so you can tell 'slow' from 'stopped'."}],
rf:["Adds consumers beyond partitions","Doesn't look at per-partition lag","Restarts consumers as the fix"]},

{id:"A032",skill:"Kafka",level:"Intermediate",type:"Concept",
q:"How should a .NET consumer commit offsets to get at-least-once processing? What goes wrong with the defaults?",
a:`<p>In the Confluent .NET client, <code>EnableAutoCommit</code> defaults to true (committing every 5 seconds) and <code>EnableAutoOffsetStore</code> also defaults to true. The offset is stored as soon as <code>Consume()</code> returns, before your handler has run. If the process crashes after the background commit but before processing finishes, that message is lost.</p>
<p>The standard pattern keeps background auto-commit but stores offsets only after processing:</p>
<pre><code>var config = new ConsumerConfig
{
    GroupId = "order-projector",
    EnableAutoCommit = true,
    EnableAutoOffsetStore = false   // we decide what is "done"
};
while (!ct.IsCancellationRequested)
{
    var cr = consumer.Consume(ct);
    await handler.HandleAsync(cr.Message, ct);   // idempotent
    consumer.StoreOffset(cr);                    // committed on next auto-commit
}</code></pre>
<p>Alternatively, call <code>Commit()</code> explicitly after each batch: synchronous commits are safer but slower. Either way, a crash replays the uncommitted tail, so the handler must be idempotent.</p>`,
keys:["Default auto offset store marks messages before processing","StoreOffset after handling","Commit frequency vs replay window","Idempotency still required"],
fu:[{q:"What should happen to offsets on graceful shutdown or rebalance?",a:"Commit what has been processed before releasing partitions: call Close() on shutdown (which commits and leaves the group cleanly), and handle the partitions-revoked callback to finish or abandon in-flight work before the partition moves."}],
rf:["Assumes auto-commit means at-least-once in .NET","Commits before processing","Never calls Close(), so every deploy causes a session-timeout rebalance"]},

{id:"A033",skill:"Kafka",level:"Intermediate",type:"Scenario",
q:"A bug corrupted a read model for the last three days. You need to reprocess those events. How?",
a:`<ol>
<li><b>Check retention</b> covers the window (and that compaction hasn't removed what you need).</li>
<li><b>Fix and deploy</b> the handler first.</li>
<li><b>Choose the replay mechanism:</b>
  <ul>
  <li>Reset the existing group: stop all its consumers, then <code>kafka-consumer-groups.sh --reset-offsets --to-datetime &lt;ts&gt; --group g --topic t --execute</code>. Resets only work while the group is inactive.</li>
  <li>Or start a <b>new consumer group</b> from that timestamp, writing to a new table or index, then switch reads when it catches up. This is safer, since live processing continues untouched.</li>
  </ul></li>
<li><b>Guard side effects.</b> A replay must not resend emails or re-charge cards. Either the handler is a pure projection, or you run it with side effects disabled.</li>
<li>Rely on <b>idempotency</b> for the overlap between replayed and live events.</li>
</ol>`,
keys:["Retention check first","Reset requires the group to be stopped","New group + blue-green read model as the safer option","Side-effect suppression during replay","Idempotency for overlap"],
trade:["Reset in place: simplest, but live processing pauses and the corrupted model is visible during catch-up","New group + new store: no downtime, but needs double storage and a switch-over"],
fu:[{q:"What if the events have expired from Kafka?",a:"Rebuild from the source of truth (the write database, or an archive such as an S3 sink of the topic). This is why teams archive important topics to S3 with Kafka Connect: Kafka retention isn't a backup."}],
rf:["Replays through handlers that send emails","Tries to reset offsets while consumers are running","Assumes Kafka keeps data forever"]},

{id:"A034",skill:"Kafka",level:"Intermediate",type:"Concept",
q:"How do you decide how many partitions a topic needs?",
a:`<p>Start from throughput and parallelism:</p>
<ul>
<li><b>Throughput:</b> partitions ≥ target throughput ÷ what one partition sustains, taking the slower of producer and consumer. Usually the <i>consumer</i> is the limit, because the handler does real work (DB writes).</li>
<li><b>Parallelism:</b> you can never run more active consumers per group than partitions. Size for peak consumer count, not the average.</li>
<li><b>Growth:</b> adding partitions later remaps keys, so provision headroom (for example 2–3× today's need) for keyed topics.</li>
</ul>
<p>The cost of too many: more files and memory on brokers, more metadata, slower rebalances and leader elections, smaller batches that hurt compression and throughput, and per-broker partition limits on managed services like MSK. For most business-event topics, 6–24 partitions is typical. Hundreds is for genuinely high-volume streams.</p>`,
keys:["Throughput / per-partition throughput","Consumer is usually the bottleneck","Partitions cap consumer parallelism","Headroom because increase remaps keys","Costs of over-partitioning"],
fu:[{q:"Can you reduce partitions?",a:"No. Kafka can't decrease a topic's partition count. You'd create a new topic and migrate producers and consumers, which is another reason to size deliberately."}],
rf:["\"As many as possible\"","Doesn't know increasing partitions affects key ordering","Ignores consumer-side throughput"]},

{id:"A035",skill:"SQS",level:"Intermediate",type:"Scenario",
q:"A Lambda function consuming an SQS queue scales out during a backlog and exhausts the RDS connection limit, taking down the main API. How do you fix it?",
a:`<p>Lambda scales SQS pollers up with queue depth, and each concurrent execution opens its own DB connections. A backlog turns into a connection storm against the shared database.</p>
<p><b>Fixes:</b></p>
<ul>
<li>Set <b>maximum concurrency</b> on the SQS event source mapping. This caps concurrent invocations for that queue; excess messages simply wait in the queue.</li>
<li>Put <b>RDS Proxy</b> in front of the database to pool and multiplex connections across Lambda executions.</li>
<li>Tune <b>batch size</b> and write in bulk, so each invocation does more work per connection.</li>
<li>Isolate workloads: give background jobs their own connection budget or a read/write path that can't starve the API.</li>
</ul>
<p>Avoid using <b>reserved concurrency</b> alone as the cap. When Lambda is throttled, the poller's messages return to the queue and their receive count rises, which can push healthy messages into the DLQ. The event source maximum concurrency setting exists to solve exactly this.</p>`,
keys:["Explains the scaling → connection storm mechanism","Event source maximum concurrency","RDS Proxy","Why reserved concurrency alone backfires","Workload isolation"],
trade:["Capping concurrency protects the DB but increases backlog drain time; check message retention covers worst-case drain","RDS Proxy adds cost and a little latency but makes Lambda + RDS sane"],
fu:[{q:"How do you know the cap is right?",a:"Size it from the DB's safe connection budget divided by connections per invocation, then verify with load tests and CloudWatch: queue age (ApproximateAgeOfOldestMessage), DB connections, and Lambda throttles."}],
rf:["\"Increase max_connections\"","Reserved concurrency as the only control","Doesn't consider message retention while draining"]},

{id:"A036",skill:"SQS",level:"Intermediate",type:"Concept",
q:"SQS, SNS, EventBridge or Kafka: how do you choose for a given messaging need on AWS?",
a:`<ul>
<li><b>SQS:</b> a work queue. One logical consumer per message, per-message retry and DLQ, buffering and load levelling.</li>
<li><b>SNS:</b> simple pub/sub fan-out. Push to many subscribers. The common pattern is <b>SNS → multiple SQS queues</b>, so each consumer gets its own buffered, retryable copy.</li>
<li><b>EventBridge:</b> event bus with <b>content-based routing rules</b>, many AWS and SaaS sources, schema discovery, and archive and replay. Better than SNS when routing logic depends on event content or crosses accounts. It has higher latency than SNS/SQS and per-target throughput quotas.</li>
<li><b>Kafka (MSK) or Kinesis:</b> ordered, retained, replayable streams at high throughput with many independent readers. More to run, but the only option here with long retention and per-key ordering at scale.</li>
</ul>
<p>I pick by the delivery semantics needed: one consumer vs fan-out, routing complexity, ordering, replay, throughput, and how much operational burden the team can carry.</p>`,
keys:["Queue vs topic vs bus vs log","SNS→SQS fan-out pattern","EventBridge routing rules and replay","Kafka/Kinesis for ordered high-throughput replay","Decision criteria, not brand preference"],
fu:[{q:"Why put SQS behind SNS instead of subscribing a Lambda to SNS directly?",a:"The queue gives each consumer its own buffer, retry policy and DLQ, and protects it from bursts. A direct SNS-to-Lambda subscription has limited retry control and no backlog you can inspect."}],
rf:["Uses SNS as if it stores messages","Picks Kafka for a simple job queue","Doesn't know EventBridge content filtering"]},

{id:"A037",skill:"SQS",level:"Intermediate",type:"Scenario",
q:"After a bad deploy, 40,000 messages are sitting in a DLQ. The fix is out. How do you redrive them safely?",
a:`<ol>
<li><b>Confirm the root cause</b> by sampling DLQ messages and checking they fail for the reason you fixed. Some may be genuinely invalid and should not be redriven.</li>
<li><b>Check idempotency.</b> Some of these may have partially succeeded before failing.</li>
<li><b>Check freshness.</b> Are three-hour-old "send reminder" or "price update" messages still valid? Add a business-level staleness check if not.</li>
<li><b>Redrive at a controlled rate</b> with the SQS DLQ redrive (<code>StartMessageMoveTask</code> with a messages-per-second limit), so you don't recreate a backlog spike or overload downstream systems.</li>
<li><b>Watch</b> error rate, the DLQ refilling, and downstream latency during the redrive.</li>
</ol>
<p>Check retention too. For standard queues, a message's expiry is based on its <i>original</i> enqueue time, so a DLQ needs longer retention than its source queue or messages expire while you investigate.</p>`,
keys:["Sample and confirm before redrive","Idempotency and staleness checks","Rate-limited redrive","Monitoring during redrive","DLQ retention vs original enqueue time"],
fu:[{q:"What alerting should have caught this sooner?",a:"An alarm on DLQ depth above zero (or above a small threshold), plus error-rate alarms on the consumer, tied to deploys. A DLQ nobody watches is just slower data loss."}],
rf:["Redrives everything at full speed immediately","Doesn't sample or check why they failed","DLQ retention equal to or shorter than the source queue"]},

{id:"A038",skill:"Microservices",level:"Intermediate",type:"Scenario",
q:"You're extracting an Orders service from a monolith, but its tables are read and written by other monolith code. How do you move data ownership without downtime?",
a:`<p>Do it in phases, so every step is reversible:</p>
<ol>
<li><b>Find every access path</b> to the tables (queries, reports, ETL jobs). Usually more exist than you expect.</li>
<li><b>Route access through one seam.</b> Monolith code stops touching the tables directly and calls an Orders module interface, later backed by the service's API.</li>
<li><b>Create the new store</b> and keep it in sync. Backfill, then sync ongoing changes from the old tables via CDC (or dual writes, but CDC avoids dual-write inconsistency).</li>
<li><b>Switch reads</b> to the new service gradually behind a feature flag, comparing results in shadow mode first.</li>
<li><b>Switch writes</b> so the service becomes the source of truth. Reverse the sync direction if legacy readers (reports) still need the old tables for a while.</li>
<li><b>Remove</b> the old tables once nothing reads them.</li>
</ol>
<p>The hard part is usually the reports and joins across the boundary. Those need an event-fed copy or an API rather than a SQL join.</p>`,
keys:["Inventory of all access paths","Single seam before moving data","Backfill + CDC sync","Reads before writes, behind flags","Plan for cross-boundary joins and reports"],
trade:["CDC avoids dual-write bugs but adds infrastructure","Dual writes are simpler but can diverge on partial failure","Shadow reads cost compute but catch mapping bugs before users do"],
fu:[{q:"How do you know the new store is correct before switching?",a:"Shadow reads: serve from the old path while calling the new one and logging mismatches. Also run reconciliation jobs comparing counts and checksums per entity. Switch only when the mismatch rate is zero or explained."}],
rf:["Big-bang migration over a weekend","Leaves the monolith reading the service's tables","No rollback path"]},

{id:"A039",skill:"Microservices",level:"Intermediate",type:"Concept",
q:"How do services find and load-balance across each other on AWS ECS? Compare the options.",
a:`<ul>
<li><b>Internal ALB per service:</b> server-side discovery. Callers use a stable DNS name, and the ALB health-checks and balances across tasks. Simple and well understood, but it adds a hop and per-ALB cost.</li>
<li><b>AWS Cloud Map:</b> DNS or API-based registry that ECS updates as tasks start and stop. Callers resolve task IPs directly (client-side). DNS caching and TTLs can send traffic to stopped tasks briefly.</li>
<li><b>ECS Service Connect:</b> builds on Cloud Map namespaces and adds a managed proxy per task, giving retries, timeouts, outlier detection and per-connection metrics. It is AWS's recommended path for service-to-service traffic on ECS today.</li>
</ul>
<p>For a small number of services I'd use internal ALBs or Service Connect. On Kubernetes, the built-in Service objects plus cluster DNS do this job.</p>`,
keys:["Client-side vs server-side discovery","ALB, Cloud Map, Service Connect trade-offs","DNS TTL / stale endpoint issue","Health checks drive registration"],
fu:[{q:"Why can DNS-based discovery send traffic to dead tasks?",a:"Clients and resolvers cache records for the TTL, and some runtimes cache longer than that. A task can stop before every caller re-resolves. Short TTLs, client retries on connection failure, and graceful draining on shutdown reduce the window."}],
rf:["Hard-coded IPs or config files of hosts","Doesn't know how ECS updates registration","Assumes DNS changes are instant"],
verify:"ECS Service Connect is AWS's current recommendation over App Mesh; confirm feature set (e.g. outlier detection) for your region and version."},

{id:"A040",skill:"Microservices",level:"Intermediate",type:"Scenario",
q:"A screen needs data from five services, and the composed endpoint has a p99 of 1.8 seconds. How do you bring it down?",
a:`<p>First, trace it. Are the calls sequential? Which call dominates the tail?</p>
<ul>
<li><b>Parallelise independent calls</b> (<code>Task.WhenAll</code>). Sequential calls add latencies together; parallel calls cost the slowest one.</li>
<li><b>Fan-out amplifies the tail.</b> If each call has a 1% chance of hitting its p99, a five-way fan-out hits at least one slow call about 5% of the time. So reduce fan-out and set per-call timeouts with partial responses: render the screen without the reviews widget rather than wait.</li>
<li><b>Cache</b> slow-changing pieces (product details, user profile) with a sensible TTL.</li>
<li><b>Precompute a read model.</b> If this screen is hot, maintain a denormalised view fed by events, so the request is one read instead of five calls.</li>
<li>Check each service's own slow path (N+1 queries, cold starts).</li>
</ul>`,
keys:["Trace before fixing","Sequential vs parallel latency","Tail-latency amplification in fan-out","Partial responses with timeouts","Read model or cache for hot screens"],
trade:["A precomputed read model is fastest but adds eventual consistency and another projection to maintain","Partial responses need product agreement on which parts are optional"],
fu:[{q:"How do you serve partial data without confusing clients?",a:"Make optional sections explicitly nullable in the contract, and include a per-section status (ok, unavailable) so the client can render a placeholder instead of an error. Decide with product which sections are must-have."}],
rf:["\"Add more instances\"","Doesn't know parallel calls are still bounded by the slowest","No measurement step"]},

{id:"A041",skill:"Microservices",level:"Intermediate",type:"Architecture",
q:"How do you handle authentication and authorization across microservices: user identity and service-to-service?",
a:`<p><b>User identity:</b> the client gets an access token (JWT) from the identity provider. The gateway validates it, but each service <b>also validates</b> it (signature, issuer, audience, expiry), so a compromised internal network doesn't mean full trust. Pass the original token, or exchange it for a narrower downstream token (OAuth token exchange), rather than inventing internal headers like <code>X-User-Id</code> that any caller could forge.</p>
<p><b>Authorization:</b> coarse checks (scopes, roles) can happen at the gateway. Resource-level checks ("can this user edit <i>this</i> group?") belong in the service that owns the data, because only it has the context.</p>
<p><b>Service-to-service:</b> workloads authenticate as themselves via the OAuth client-credentials flow, mutual TLS, or cloud identity (IAM roles with SigV4 on AWS). Each service then authorises which callers may use which operations.</p>`,
keys:["Validate in every service (zero trust)","Don't trust forgeable identity headers","Resource-level authz in the owning service","Separate workload identity for service calls","Token exchange or audience scoping"],
trade:["Validating JWTs everywhere costs a little CPU but removes the 'trusted network' assumption","Passing the user token everywhere is simple but gives each service the token's full scope; token exchange limits it at the cost of an extra call","It depends on: number of services, compliance needs, identity provider support"],
fu:[{q:"How do you revoke access quickly if JWTs are stateless?",a:"Keep access-token lifetimes short (minutes) and rely on refresh tokens, which can be revoked server-side. For urgent cases, keep a small deny-list of token IDs or user IDs checked by services, accepting the extra lookup."}],
rf:["Gateway validates, services trust everything behind it","Uses a user-id header with no signature","Long-lived access tokens with no revocation story"]},

{id:"A042",skill:"Microservices",level:"Intermediate",type:"Scenario",
q:"You need to change a field in a service contract that three other services consume. How do you roll it out without breaking anyone?",
a:`<p>Use <b>expand and contract</b> (parallel change):</p>
<ol>
<li><b>Expand:</b> the provider adds the new field alongside the old one and populates both. Nothing breaks.</li>
<li><b>Migrate:</b> each consumer switches to the new field in its own release, on its own schedule.</li>
<li><b>Verify:</b> confirm nobody reads the old field, using logs, metrics on field usage, or contract tests.</li>
<li><b>Contract:</b> remove the old field.</li>
</ol>
<p><b>Consumer-driven contract tests</b> (Pact, for example) make step 3 reliable. Each consumer publishes what it actually uses, and the provider's CI fails if a change breaks a consumer. The same approach applies to event payloads, with the schema registry enforcing compatibility.</p>`,
keys:["Expand/contract with independent deploys","Never assumes lockstep deploys","Evidence of no remaining usage before removal","Consumer-driven contract tests"],
trade:["Expand/contract takes several releases and temporarily duplicates data","Contract tests need buy-in from every consumer team to be useful"],
fu:[{q:"Who should own the contract test, provider or consumer?",a:"The consumer writes the expectations (it knows what it uses), and the provider runs them in its pipeline (it's the one who can break them). A broker such as Pact Broker shares them between repos."}],
rf:["\"Coordinate a release where all four deploy together\"","Removes the old field as soon as the new one ships","No way to know who uses the field"]},

{id:"A043",skill:"Distributed Fundamentals",level:"Intermediate",type:"Concept",
q:"When do you need a distributed lock, how would you implement one, and why are they risky?",
a:`<p>You need mutual exclusion across processes for things like a scheduled job that must run on only one instance, or serialised access to an external resource.</p>
<p>A common implementation is Redis <code>SET key token NX PX 30000</code>, with release only if the token still matches (a Lua compare-and-delete). The risk: a lock with a TTL is a <b>lease</b>. If the holder pauses (GC, network delay) longer than the TTL, the lock expires, another process takes it, and now two believe they hold it. Redlock across several Redis nodes doesn't fix the pause problem.</p>
<p>The safe pattern is a <b>fencing token</b>: an increasing number issued with the lock that the protected resource checks, rejecting writes from older tokens. Better still, avoid the lock. Use a DB unique constraint or conditional write, give one partition to a single consumer (Kafka assignment), or use a DB-level lock (<code>sp_getapplock</code> in SQL Server, <code>pg_advisory_lock</code> in PostgreSQL) when the work is in that database anyway.</p>`,
keys:["Locks with TTL are leases","Process pause breaks correctness","Fencing tokens","Prefer constraints, conditional writes or partition ownership","Knows DB advisory locks"],
