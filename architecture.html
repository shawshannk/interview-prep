a:`<p>The symptoms suggest the workflow logic is implicit: spread across queue handlers, with retries and state transitions reimplemented in each one. An orchestrator makes the flow explicit, with built-in retries, timeouts, catch and compensation, and a visual history of every execution. That fits the pain.</p>
<p>Before agreeing to a rewrite, I'd check:</p>
<ul>
<li><b>Cost model:</b> Standard workflows bill per state transition. At high volume with many steps that can exceed the SQS cost by a lot. Express workflows are cheaper per execution but run at most 5 minutes with at-least-once semantics. Model it with real volumes.</li>
<li><b>Fit:</b> waits for human approval, long timers and branching fit Standard well. Very high-throughput, short pipelines may not.</li>
<li><b>Migration risk:</b> migrate <b>incrementally</b>, starting with the steps that cause the most incidents, with an orchestrator calling the existing handlers (now as Lambdas or ECS tasks). In-flight executions finish on the old path.</li>
<li><b>Alternatives:</b> Temporal, or a framework state machine (MassTransit), if you want the logic in code and portable.</li>
</ul>
<p>Decision criteria: fewer incidents, faster changes, and cost within budget, measured for the first migrated slice before committing to the rest.</p>`,
keys:["Diagnoses implicit workflow as the root problem","Real cost modelling (transitions vs duration)","Standard vs Express semantics","Incremental migration, not big-bang rewrite","Measured success criteria"],
trade:["Step Functions: visibility and built-in retries, AWS lock-in and per-transition cost","Temporal/code-based: portable and testable in code, more infrastructure","Keep and refactor SQS: lowest change risk, keeps implicit flow","It depends on: volume, workflow duration, team preference for code vs config"],
fu:[{q:"How do you handle executions in flight when you switch?",a:"Route only new workflows to the new path behind a flag, and let existing ones drain through the old queues. Keep the old handlers until the last in-flight execution finishes or times out, then remove them."}],
rf:["Approves a full rewrite without cost modelling","Doesn't know the Standard vs Express differences","No plan for in-flight work"]},

{id:"A084",skill:"Microservices",level:"Lead",type:"Architecture",
q:"Leadership says: 'Split the monolith into microservices so we can move faster.' How do you respond?",
a:`<p>I'd agree with the goal and question whether the proposed means fits. Microservices speed teams up only when the bottleneck is <b>coordination between teams</b>, not when it's code quality, test speed or deployment process.</p>
<ol>
<li><b>Measure first:</b> the DORA metrics (deploy frequency, lead time, change failure rate, recovery time), plus where lead time actually goes. Is it waiting on other teams' releases, a slow test suite, manual QA, or merge conflicts?</li>
<li><b>Fix what the data shows.</b> Often that's CI speed, test reliability and deployment automation, which help immediately and are needed for microservices anyway.</li>
<li><b>If coupling between teams is the bottleneck,</b> go to a modular monolith with enforced boundaries, then extract the one or two modules where independent deployment or scaling clearly pays off.</li>
<li>Present the <b>costs</b> honestly: platform work, observability, on-call, data consistency. Agree success metrics before the first extraction.</li>
</ol>`,
keys:["Identifies the real bottleneck before choosing the solution","Uses DORA-style metrics","Lower-cost fixes first","Incremental, selective extraction","Communicates costs and success criteria to leadership"],
trade:["Microservices: team autonomy, at the price of distributed-systems cost","Modular monolith: most of the boundary benefit, little of the operational cost","It depends on: team count, coupling evidence, platform maturity"],
fu:[{q:"Leadership has already announced it publicly. Now what?",a:"Support the direction while shaping the execution: propose a first extraction with clear metrics, and sequence the enabling work (CI, observability) as part of the programme. Report results honestly, including if the data says to slow down."}],
rf:["Agrees immediately and plans a full rewrite","Refuses without data","No success metrics"]},

{id:"A085",skill:"Microservices",level:"Lead",type:"Scenario",
q:"You join a team of 15 engineers running 40 microservices. Changes routinely touch five services, local development is painful, and incidents are hard to trace. What do you do?",
a:`<p>The symptoms point to service boundaries that don't match how the product changes. The organisation pays the full distributed-systems cost without the autonomy benefit.</p>
<ol>
<li><b>Gather evidence:</b> which services change together (commit and deploy co-occurrence), which call each other synchronously per request, and which teams own what. Services that always change together and share one owner are merge candidates.</li>
<li><b>Fix the urgent pain first:</b> distributed tracing and correlation IDs so incidents can be followed, and a local dev setup (compose files, or test environments with shared dependencies).</li>
<li><b>Consolidate deliberately:</b> merge the most tightly coupled clusters into a few larger services aligned to bounded contexts, one cluster at a time, with data ownership merged too.</li>
<li><b>Communicate it</b> as an improvement grounded in data, not a reversal of someone's past decision. The people who built it often feel the pain most.</li>
</ol>
<p>Target ownership of maybe a handful of services per team, with success measured by change lead time and incident resolution time.</p>`,
keys:["Uses change-coupling data to find merge candidates","Observability and dev experience first","Consolidation is a legitimate move","Careful communication about past decisions","Measurable outcomes"],
trade:["Merging reduces operational overhead but creates larger deployables to manage","Leaving it as-is avoids migration risk but keeps the drag on every change","It depends on: team growth plans, change patterns, scaling differences between services"],
fu:[{q:"An engineer who designed the original split strongly objects. How do you handle it?",a:"Bring them in to analyse the data together, since they know the history and may know why boundaries were drawn where they were. Frame it as the system's needs having changed, not their decision being wrong. Their input often makes the consolidation better."}],
rf:["Proposes more services to fix it","Rewrites everything at once","Blames the previous team"]},

{id:"A086",skill:"Microservices",level:"Lead",type:"Architecture",
q:"How much should you standardise across teams (language, frameworks, deployment, observability) versus leaving choices to each team?",
a:`<p>I'd split decisions into three tiers:</p>
<ul>
<li><b>Non-negotiable</b> (they affect everyone or carry risk): security baseline (authentication, secrets handling, dependency scanning), observability conventions (OpenTelemetry, trace propagation, log format), deployment through the standard pipeline, API and event contract standards, and data protection rules.</li>
<li><b>Paved road</b> (default, strongly supported, deviation allowed with justification): language and framework (.NET or Node), service template, database choices, messaging library. Make it the easiest path, with templates and platform support.</li>
<li><b>Team choice:</b> internal code structure, test frameworks, internal tooling.</li>
</ul>
<p>Deviation from the paved road requires a short ADR covering who supports it and what the exit plan is. Revisit the standards yearly, since today's deviation may be tomorrow's better default. The test for a standard: does deviating impose cost on <i>other</i> teams (on-call, hiring, platform support)? If not, leave it to the team.</p>`,
keys:["Tiered approach with clear criteria","Paved road made the easiest option","Deviation via ADR with ownership","Test: cost to other teams","Periodic review"],
trade:["Heavy standardisation: easier hiring, mobility and support, slower adoption of better tools","High autonomy: local optimisation and innovation, fragmented operations and on-call","It depends on: organisation size, platform team capacity, regulatory requirements"],
fu:[{q:"A team wants to write one service in Go for performance. How do you decide?",a:"Ask for the evidence that .NET can't meet the requirement (benchmarks, not intuition), who will maintain it when the author moves on, and how it fits the pipeline and observability standards. If the case holds and there's a support plan, approve it as a documented exception."}],
rf:["Mandates everything centrally","No standards at all","Approves exceptions with no support plan"]},

{id:"A087",skill:"Distributed Fundamentals",level:"Lead",type:"Architecture",
q:"Product insists every screen must be real-time and fully consistent. How do you handle that requirement?",
a:`<p>I'd turn the blanket requirement into specific decisions per flow, because the costs differ by orders of magnitude.</p>
<ol>
<li><b>List the flows</b> and ask, for each: what goes wrong for the user, or the business, if this is 2 seconds or 2 minutes stale? Balance, stock and permissions often need strong consistency. Likes, feeds, analytics and search usually don't.</li>
<li><b>Price the options:</b> strong consistency typically means synchronous paths, primary-only reads, locks or conditional writes, which cost latency, availability and infrastructure. "Real-time" means push infrastructure (WebSockets), which costs connections and operations.</li>
<li><b>Show examples</b> of what slight staleness looks like in their own product. It's often invisible to users.</li>
<li><b>Agree a consistency budget per flow</b> and write it into the requirements and SLOs, so it becomes testable rather than a vague promise.</li>
</ol>
<p>The outcome is usually: strong consistency for the few flows where money, safety or trust is at stake, read-your-writes for a user's own actions, and eventual consistency elsewhere.</p>`,
keys:["Refuses a blanket rule, works per flow","Ties consistency to user and business impact","Puts cost on each option","Makes the outcome testable (SLOs)","Common outcome pattern"],
trade:["Strong everywhere: simplest mental model, worst latency, availability and cost","Per-flow budget: efficient, requires clear documentation and team discipline","It depends on: domain risk, scale, latency targets"],
fu:[{q:"Product pushes back: 'Users will notice and complain.' What now?",a:"Run a small experiment: ship a flow with read-your-writes guaranteed and slight staleness elsewhere, then measure complaints and behaviour. Data from our own users settles it faster than argument."}],
rf:["Says yes to everything","Says no without offering a path","Speaks only in CAP jargon to product"]},

{id:"A088",skill:"Distributed Fundamentals",level:"Lead",type:"Scenario",
q:"A postmortem finds that a race condition caused incorrect balances for a small number of accounts for about a year. How do you lead the response and prevent this class of bug?",
a:`<p><b>Immediate:</b></p>
<ol>
<li>Fix the race, with a conditional update or the right isolation, and verify the fix under concurrency.</li>
<li>Size the blast radius with data: which accounts and amounts, back to the start.</li>
<li>Repair the data with an audited, reviewed script, and agree customer communication with business, legal and compliance.</li>
</ol>
<p><b>Preventing the class:</b></p>
<ul>
<li><b>Invariant checks and reconciliation:</b> a scheduled job that recomputes balances from source records and alerts on mismatch. The bug went unseen for a year because nothing checked the invariant.</li>
<li><b>Design review checklist</b> for money and state changes: what happens with two concurrent requests? Is the operation idempotent? What is the isolation level?</li>
<li><b>Tests:</b> concurrency tests that hammer the same entity in parallel. Property-based tests on invariants where practical.</li>
<li><b>Patterns:</b> standard library code or templates for safe counters and transfers, so teams don't reimplement them.</li>
</ul>
<p>Run it blameless: the system allowed a subtle bug to pass review and testing and go undetected, and that's what needs changing.</p>`,
keys:["Fix, blast radius, audited repair, communication","Detection gap as a key finding","Reconciliation and invariant monitoring","Review checklist and concurrency tests","Blameless framing with systemic fixes"],
trade:["Reconciliation jobs cost compute and maintenance but catch unknown bugs too","Stricter isolation prevents races at some throughput cost; apply it to money paths, not everywhere"],
fu:[{q:"Leadership wants to know whether other bugs like this exist. What do you tell them?",a:"Honestly, we can't prove there are none, but we can bound the risk. Add invariant checks for the critical data (balances, inventory, entitlements), review the money and state paths with the new checklist, and report findings. That turns an open question into a monitored state."}],
rf:["Fixes the line of code and closes it","Blames the engineer","No detection improvement"]},

{id:"A089",skill:"API Design",level:"Lead",type:"Architecture",
q:"Your public API has 200 partner integrations and needs a breaking redesign. Plan the transition.",
a:`<ol>
<li><b>Justify the break.</b> Confirm the change can't be made additively. Every breaking change costs every partner real engineering time.</li>
<li><b>Know who uses what:</b> per-partner usage telemetry by endpoint and field, so you know the actual impact and can segment partners.</li>
<li><b>Ship v2 alongside v1,</b> ideally with v1 implemented as an adapter over v2 internals, so you maintain one core.</li>
<li><b>Make migration cheap:</b> a migration guide with field-by-field mapping, updated SDKs, a sandbox, and a compatibility checker.</li>
<li><b>Timeline and communication:</b> an announced deprecation date (often 6–12 months for partners, or per contract), <code>Deprecation</code> and <code>Sunset</code> headers, reminders, and direct outreach to the top partners by traffic.</li>
<li><b>Track progress</b> partner by partner, and escalate the long tail through account managers. Expect to extend for a few large partners. Decide up front who can approve an extension.</li>
<li><b>Retire</b> v1 in stages: brownouts (short scheduled outages) to surface forgotten integrations, then shutdown.</li>
</ol>`,
keys:["Challenges whether the break is necessary","Usage telemetry per partner","v1 as an adapter over v2","Migration tooling and SDKs","Timeline, brownouts and long-tail management"],
trade:["Long support windows protect partners but double maintenance cost","Short windows cut cost but risk churn and contract issues","It depends on: partner contracts, revenue concentration, team capacity"],
fu:[{q:"Your largest partner says they can't migrate for 18 months. What do you do?",a:"Quantify the cost of keeping v1 for them and compare it with their revenue and relationship value. Options: an extended paid support arrangement, our engineers helping them migrate, or a narrowed v1 supporting only the endpoints they use. It's a business decision I'd bring to leadership with numbers."}],
rf:["Announces a cutoff with no telemetry","Maintains two separate codebases","No plan for the long tail"]},

{id:"A090",skill:"API Design",level:"Lead",type:"Architecture",
q:"Eight teams build APIs and every one looks different: naming, errors, pagination, auth. How do you get consistency without creating a bottleneck?",
a:`<ul>
<li><b>Write a short API style guide,</b> starting from a published one (Zalando's or Microsoft's REST guidelines) rather than from scratch. It covers naming, versioning, error format (Problem Details), pagination (cursor), idempotency keys, dates and time zones, and auth scopes.</li>
<li><b>Automate it:</b> OpenAPI-first design with a linter (Spectral, with custom rules) in CI. Most consistency comes from the build failing, not from review comments.</li>
<li><b>Provide building blocks:</b> shared middleware for errors, pagination helpers, and service templates, so the right thing is the easy thing.</li>
<li><b>Lightweight review</b> only for new public or partner-facing APIs: a short design review with a rotating group of senior engineers from different teams, not a standing committee.</li>

/* ---------- state ---------- */
const KEY="arch-bank-reviewed-v1";
let reviewed={};
try{reviewed=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){reviewed={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(reviewed))}catch(e){}}

const state={text:"",skill:"all",status:"all",levels:new Set(),types:new Set()};
const $=s=>document.querySelector(s);

/* ---------- controls ---------- */
const skills=[...new Set(QS.map(x=>x.skill))];
$("#skill").innerHTML=`<option value="all">All skills</option>`+skills.map(s=>`<option value="${s}">${s}</option>`).join("");
function chipRow(el,items,set){
  el.innerHTML=items.map(i=>`<button type="button" class="chip" aria-pressed="false" data-v="${i}">${i}</button>`).join("");
  el.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;const v=b.dataset.v;
    if(set.has(v)){set.delete(v);b.setAttribute("aria-pressed","false")}else{set.add(v);b.setAttribute("aria-pressed","true")}render()});
}
chipRow($("#levels"),LEVELS,state.levels);
chipRow($("#types"),TYPES,state.types);
$("#q").addEventListener("input",e=>{state.text=e.target.value.trim().toLowerCase();render()});
$("#skill").addEventListener("change",e=>{state.skill=e.target.value;render()});
$("#status").addEventListener("change",e=>{state.status=e.target.value;render()});
let allOpen=false;
$("#toggleAll").addEventListener("click",()=>{allOpen=!allOpen;
  document.querySelectorAll("details.ans").forEach(d=>d.open=allOpen);
  $("#toggleAll").textContent=allOpen?"Close all answers":"Open all answers"});

/* ---------- stats ---------- */
function count(key,vals){return vals.map(v=>`${v} <b>${QS.filter(x=>x[key]===v).length}</b>`).join(" · ")}
$("#stats").innerHTML=`<span><b>${QS.length}</b> questions loaded</span><span>${count("level",LEVELS)}</span><span>${count("type",TYPES.filter(t=>t!=="Behavioral"))}</span><span>${PARTS}</span>`;

/* ---------- render ---------- */
const strip=h=>h.replace(/<[^>]+>/g," ");
function matches(x){
  if(state.skill!=="all"&&x.skill!==state.skill)return false;
  if(state.levels.size&&!state.levels.has(x.level))return false;
  if(state.types.size&&!state.types.has(x.type))return false;
  if(state.status==="done"&&!reviewed[x.id])return false;
  if(state.status==="todo"&&reviewed[x.id])return false;
  if(state.text){const hay=(x.id+" "+x.q+" "+x.skill+" "+strip(x.a)+" "+(x.keys||[]).join(" ")+" "+(x.fu||[]).map(f=>f.q+" "+f.a).join(" ")).toLowerCase();
    if(!hay.includes(state.text))return false}
  return true;
}
const ul=arr=>`<ul>${arr.map(i=>`<li>${i}</li>`).join("")}</ul>`;
function item(x,i){
  const done=!!reviewed[x.id];
  return `<li class="q${done?" done":""}" id="${x.id}">
    <div class="qhead"><span class="num">${x.id}</span><div>
      <p class="qtext">${x.q}</p>
      <div class="tags"><span class="tag">${x.skill}</span><span class="tag lv lv-${x.level}">${x.level}</span><span class="tag">${x.type}</span>${x.verify?`<span class="tag verify">VERIFY</span>`:""}
        <label class="check"><input type="checkbox" data-id="${x.id}" ${done?"checked":""}> Reviewed</label></div>
    </div></div>
    <div class="body">
      <details class="ans"><summary>Model answer, key points and red flags</summary><div class="dbody">
        ${x.a}
        <h4>What the interviewer listens for</h4>${ul(x.keys)}
        ${x.trade?`<h4>Trade-offs and "it depends on"</h4>${ul(x.trade)}`:""}
        <h4 class="rf">Red flags</h4>${ul(x.rf)}
        ${x.verify?`<p class="note">[VERIFY] ${x.verify}</p>`:""}
      </div></details>
      ${(x.fu||[]).map(f=>`<details class="fu ans"><summary><span class="fl">FOLLOW-UP</span><span>${f.q}</span></summary><div class="dbody"><p>${f.a}</p></div></details>`).join("")}
    </div></li>`;
}
function render(){
  const list=QS.filter(matches);
  $("#list").innerHTML=list.length?list.map(item).join(""):`<li class="empty">No questions match these filters.</li>`;
  if(allOpen)document.querySelectorAll("details.ans").forEach(d=>d.open=true);
  const n=QS.filter(x=>reviewed[x.id]).length;
  $("#ptext").textContent=`${n} / ${QS.length} reviewed · ${list.length} shown`;
  $("#pfill").style.width=(QS.length?n/QS.length*100:0)+"%";
}
$("#list").addEventListener("change",e=>{const c=e.target.closest("input[data-id]");if(!c)return;
  const id=c.dataset.id;if(c.checked)reviewed[id]=1;else delete reviewed[id];save();
  c.closest("li.q").classList.toggle("done",c.checked);
  const n=QS.filter(x=>reviewed[x.id]).length;const shown=document.querySelectorAll("li.q").length;
  $("#ptext").textContent=`${n} / ${QS.length} reviewed · ${shown} shown`;$("#pfill").style.width=(n/QS.length*100)+"%";});
try{const m=location.hash.match(/^#q=([^&]+)/);if(m){const v=decodeURIComponent(m[1]);$("#q").value=v;state.text=v.trim().toLowerCase();}}catch(e){}
render();
</script>

</html>
