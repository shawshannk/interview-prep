{id:"N078",skill:"C# & Runtime",level:"Lead",type:"Architecture",
q:"Your organisation runs 30 services across .NET 6, 8 and 9. How do you set an upgrade policy and get everyone onto a supported version?",
a:`<p><b>Facts the policy rests on:</b> Microsoft ships a major version every November. Even-numbered releases are <b>LTS</b> (3 years of support); odd-numbered are <b>STS</b> (support recently extended from 18 to 24 months). .NET 6 is already out of support, and <b>.NET 8 (LTS) and .NET 9 (STS) both reach end of support in November 2026</b>. .NET 10, the LTS released in November 2025, is the target for most services right now. Running out-of-support runtimes means no security patches, which is a compliance finding in most audits.</p>
<p><b>Policy I'd propose:</b></p>
<ul>
<li>Production services run a supported version, defaulting to the latest LTS. STS is allowed for teams that want new features and commit to upgrading within its window.</li>
<li>Upgrade within 6 months of a new LTS. No service more than one LTS behind.</li>
<li>Monthly patch updates (runtime and base images) are automatic through dependency bots and image rebuilds.</li>
</ul>
<p><b>Execution:</b></p>
<ul>
<li>An inventory dashboard of each service's runtime and end-of-support date.</li>
<li>Upgrade the shared libraries and service template first.</li>
<li>Upgrade services in risk order (internet-facing first), with integration tests and a canary per service.</li>
<li>Track progress weekly, and reserve capacity explicitly in team plans. An upgrade nobody plans for doesn't happen.</li>
</ul>`,
keys:["Knows LTS/STS cadence and current end-of-support dates","Supported-runtime policy with timelines","Inventory and visibility","Shared libraries/template first; risk-ordered rollout","Capacity explicitly planned"],
trade:["Always-latest gets features and performance sooner but means more frequent upgrade work","LTS-only reduces churn but delays improvements and creates bigger jumps","It depends on: team capacity, regulatory pressure, how much services share code"],
fu:[{q:"A team says their service is 'stable, nobody touches it, why upgrade?'",a:"Because an unsupported runtime gets no security fixes, and the next forced upgrade gets harder the longer it waits. Make the risk visible (open CVEs, audit findings) and make the upgrade cheap: shared tooling, a template, and help from someone who has done it already."}],
rf:["Doesn't know current support dates","No inventory","\"Upgrade when something breaks\""],
verify:"Confirm current .NET support dates and the STS support-length change on the official .NET support policy page."},

{id:"N079",skill:"C# & Runtime",level:"Lead",type:"Scenario",
q:"A junior engineer's PR has .Result calls, async void, missing cancellation tokens and a static mutable list. It works in their tests. How do you handle the review, and what do you change so the team stops shipping these patterns?",
a:`<p><b>The review itself:</b></p>
<ul>
<li>Separate <b>must-fix</b> items from style. Async void and the static mutable list are correctness bugs (crashes, races). <code>.Result</code> risks thread-pool starvation under load. Missing tokens waste resources. Explain the <i>why</i> for each with a concrete failure scenario rather than only rules.</li>
<li>Offer a short pairing session to fix the first instance together, and let them do the rest.</li>
<li>Acknowledge what's good in the PR, so the feedback is about the code, not the person.</li>
</ul>
<p><b>Team-level changes,</b> because if one junior made these mistakes, the system let them through:</p>
<ul>
<li><b>Analyzers as build errors:</b> threading analyzers (Microsoft.VisualStudio.Threading.Analyzers catches async void and blocking waits), the CA rules (for example CA2016 for forwarding cancellation tokens), and an <code>.editorconfig</code> committed to the repo.</li>
<li>A short "async in our codebase" guide with examples.</li>
<li>Load tests in CI that would surface starvation.</li>
<li>Reviewers rotated, so juniors see good patterns too.</li>
</ul>`,
keys:["Prioritises correctness over style in feedback","Explains failure scenarios, not just rules","Pairing / coaching approach","Systemic fixes via analyzers and docs","Treats it as a process gap, not a person problem"],
trade:["Strict analyzers catch issues early but can overwhelm an existing codebase; enable on new code first, then burn down","Detailed review comments teach, but too many at once demoralise; prioritise"],
fu:[{q:"The junior pushes back: 'It works, and the deadline is tomorrow.' What do you do?",a:"Agree that shipping matters and fix only the correctness items now (async void and the shared list), which are small changes, with a ticket for the rest. Explain the risk concretely: this will crash or corrupt data under production load, which costs far more than an hour today."}],
rf:["Rewrites the code themselves","Leaves 40 comments with no prioritisation","No systemic follow-up"]},

{id:"N080",skill:"C# & Runtime",level:"Lead",type:"Architecture",
q:"Several popular .NET libraries changed to commercial licences recently, and a security scan found vulnerable transitive packages. Design a dependency governance policy for your .NET teams.",
a:`<p><b>Context:</b> since 2025, several widely used .NET libraries moved to commercial or dual licences, including FluentAssertions (v8), MediatR, AutoMapper, and MassTransit's next major version. Teams can become non-compliant just by updating a package. Vulnerabilities often arrive through <i>transitive</i> dependencies nobody chose directly.</p>
<p><b>Policy:</b></p>
<ul>
<li><b>Central Package Management</b> (<code>Directory.Packages.props</code>), so versions are set once per repo and visible.</li>
<li><b>Automated vulnerability checks:</b> NuGet Audit (built into the .NET 8+ SDK) fails or warns the build on known-vulnerable packages, including transitive ones. Dependabot or Renovate opens update PRs.</li>
<li><b>Licence checks in CI:</b> a licence scanner with an allowlist (MIT, Apache-2.0, BSD) and a review step for anything else, re-checked on every version bump, since licences can change between major versions.</li>
<li><b>An SBOM</b> per build for audit and incident response ("are we affected by CVE-X?").</li>
<li><b>Adoption criteria</b> for new dependencies: maintenance activity, licence, transitive footprint, and whether a few lines of our own code would do. Keep core abstractions behind our own interfaces where switching might be needed.</li>
</ul>
<p>For packages that went commercial: decide per package whether to pay, pin the last open-source version temporarily (accepting no fixes), or replace, based on cost and how deeply it's used.</p>`,
keys:["Aware of recent licence changes","Central package management","NuGet Audit / bots for vulnerabilities incl. transitive","Licence scanning on every update; SBOM","Adoption criteria and decision process for commercial switches"],
trade:["Strict allowlists slow adoption of useful packages; a fast review path keeps teams moving","Pinning old open-source versions avoids cost short term but accumulates security risk"],
fu:[{q:"FluentAssertions v8 now requires a paid licence for commercial use. What do you recommend?",a:"For test-only usage, compare the licence cost with migrating to an alternative (Shouldly, AwesomeAssertions, which is a community fork of v7, or plain xUnit asserts). Pinning v7 is fine short term since it's test code with low security exposure, but plan the decision rather than drift."}],
rf:["No visibility of transitive dependencies","Updates packages without licence checks","Bans all third-party packages"],
verify:"Licence terms for FluentAssertions, MediatR, AutoMapper and MassTransit change; check current terms and community forks before recommending."},

{id:"N081",skill:"ASP.NET Core",level:"Lead",type:"Architecture",
q:"A team proposes adopting .NET Aspire for all services. You run on AWS ECS with Terraform. How do you evaluate it?",
a:`<p><b>What Aspire provides:</b></p>
<ul>
<li>An <b>app host</b> that describes services and their dependencies (databases, Redis, queues) in C# and runs them locally with one command.</li>
<li>A <b>local dashboard</b> showing logs, traces and metrics through OpenTelemetry.</li>
<li><b>Service defaults:</b> a shared project wiring up OpenTelemetry, health checks, service discovery and resilience.</li>
<li>Client <b>integrations</b> for common resources.</li>
</ul>
<p>It has expanded to support other languages and has AWS integrations, but its deployment tooling has historically been strongest for Azure and Kubernetes.</p>
<p><b>Evaluation:</b></p>
<ul>
<li><b>Local developer experience:</b> likely a strong win if developers currently juggle compose files and scripts. Measure time from clone to running.</li>
<li><b>Service defaults:</b> valuable as a standard chassis, though you may already have one.</li>
<li><b>Deployment:</b> with Terraform and ECS, decide whether Aspire stays a <b>local and dev-time tool only</b> while Terraform remains the source of truth for infrastructure, or whether you adopt its publishing model. Mixing both without a clear owner causes drift.</li>
<li><b>Cost:</b> learning curve, version churn (it has moved fast), and coupling to its abstractions.</li>
</ul>
<p>Recommendation: pilot it with one team for local development and service defaults, keep Terraform for deployment, review after a quarter with measured onboarding and dev-loop time.</p>`,
keys:["Accurate description of Aspire's parts","Separates dev-time value from deployment story","Infra source-of-truth question with Terraform","Pilot with measurable criteria","Version churn and coupling risks"],
trade:["Big local-dev gains, but risk of two infra definitions if deployment is also adopted","Service defaults standardise observability, but overlap with an existing chassis"],
fu:[{q:"How do you avoid Aspire's local setup drifting from production?",a:"Use the same container images and versions for dependencies locally as in production, keep configuration names identical, and run integration tests in CI using the same app-host definition, so drift shows up as failing tests."}],
rf:["Adopts it everywhere at once","Thinks it replaces Terraform automatically","Dismisses it without trying"],
verify:"Aspire's naming, versioning (it has dropped the '.NET' prefix in recent releases) and AWS deployment support evolve quickly; check current capabilities."},

{id:"N082",skill:"ASP.NET Core",level:"Lead",type:"Scenario",
q:"New .NET 9+ projects no longer include Swashbuckle. Teams are split between keeping Swashbuckle, using Microsoft.AspNetCore.OpenApi, or NSwag. Partners depend on your OpenAPI specs. How do you decide and roll it out?",
a:`<p><b>Background:</b> from .NET 9 the web API templates dropped Swashbuckle, which had become less actively maintained. Microsoft's built-in <code>Microsoft.AspNetCore.OpenApi</code> (<code>AddOpenApi</code>/<code>MapOpenApi</code>) generates the document, can do so at build time, and gained OpenAPI 3.1 in .NET 10. A UI such as Scalar or Swagger UI is added separately.</p>
<p><b>Decision criteria:</b></p>
<ul>
<li>Spec fidelity for your features: polymorphism, nullable handling, examples, auth schemes.</li>
<li>Build-time generation, so the spec can be diffed in CI.</li>
<li>Maintenance outlook, and migration effort for existing customisations (filters, transformers).</li>
<li>Client generation needs (NSwag also generates clients; Kiota is another option).</li>
</ul>
<p><b>Recommendation:</b> standardise on the built-in generator for new services, and migrate existing ones when they're next upgraded unless they depend on Swashbuckle-specific customisations.</p>
<p>What matters most is that the <b>published spec doesn't change unexpectedly</b>:</p>
<ul>
<li>Generate the spec at build time.</li>
<li>Run a spec-diff tool (for example oasdiff) in CI against the last published version, failing on breaking changes.</li>
<li>Have a human compare the old and new spec once during migration, since generators differ in nullability, naming and enum output.</li>
</ul>`,
keys:["Knows the .NET 9 template change and built-in generator","Criteria-based decision","Build-time spec generation and CI diffing","Migration risk to partner-facing specs","Separate UI choice"],
trade:["Built-in generator: first-party and maintained, but may need transformers to match existing output","Keeping Swashbuckle: zero migration now, maintenance risk later","It depends on: customisation depth, partner sensitivity to spec changes"],
fu:[{q:"Why diff the spec in CI rather than rely on code review?",a:"A small code change (renaming a property, making something nullable, changing an enum) can silently change the public contract, and reviewers rarely notice. A spec diff makes contract changes explicit and blocks unintended breaks."}],
rf:["Leaves each team to choose","Migrates without comparing generated specs","No contract-change detection"],
verify:"Confirm current OpenAPI support (3.1, build-time generation) in your .NET version and Swashbuckle's maintenance status."},

{id:"N083",skill:"ASP.NET Core",level:"Lead",type:"Scenario",
q:"An ASP.NET Core service has always run as a single instance. Before you allow autoscaling to 10 instances, what do you review, and how do you decide it's ready?",
a:`<p>The question is whether any state or assumption depends on "there is only one of me". Checklist:</p>
<ul>
<li><b>In-memory state:</b> session state, <code>IMemoryCache</code> holding data that must be consistent, in-memory queues or channels with work that must not be lost, singleton counters or rate limiters. Each must move to a shared store or be acceptable per instance.</li>
<li><b>Data Protection keys:</b> shared and persistent, or cookies and antiforgery tokens break across instances.</li>
<li><b>Scheduled work:</b> timers or hosted services that run "once a day" will run 10 times. They need a lock, leader election or an external scheduler.</li>
<li><b>Local files:</b> uploads or generated files on local disk aren't visible to other instances. Move them to S3.</li>
<li><b>Real-time connections</b> (SignalR or WebSockets): a backplane, and possibly sticky sessions.</li>
<li><b>Downstream limits:</b> 10× the DB connections (pool size × instances against <code>max_connections</code>), and partner API rate limits that are now shared.</li>
<li><b>Graceful shutdown</b> and health checks, since scaling in is now routine.</li>
</ul>
<p><b>Ready means:</b> a load test with several instances plus scale-in and scale-out events during the test, with no errors, no duplicate jobs and no lost work. Have a documented answer for each checklist item.</p>`,
keys:["Systematic statelessness review","Data Protection, sessions, caches","Scheduled jobs duplicating","Local files, real-time connections","Downstream connection/rate multiplication; test with scaling events"],
trade:["Sticky sessions can be a quick bridge but reduce load balancing and still break on instance loss","Moving all state to Redis adds latency and a dependency; keep per-instance caches where inconsistency is acceptable"],
fu:[{q:"Which item is most often missed?",a:"The database connection count. Ten instances with a default pool of 100 means up to 1,000 connections, which can exceed the database's limit during a traffic spike: exactly when you need it. Size pools and use a proxy accordingly."}],
rf:["Turns on autoscaling and watches","Forgets scheduled jobs","No load test with scale events"]},

{id:"N084",skill:"EF Core",level:"Lead",type:"Architecture",
q:"Six teams use EF Core differently. Production incidents keep coming from slow queries and risky migrations. What data-access guidelines do you set, and how do you enforce them without slowing teams down?",
a:`<p><b>Guidelines</b> (short, with examples):</p>
<ul>
<li><b>Reads:</b> project with <code>Select</code> to DTOs, no-tracking by default for queries, no lazy loading, paginate with keyset for large lists, and <code>AsSplitQuery</code> for multiple collection includes.</li>
<li><b>Writes:</b> one <code>DbContext</code> per unit of work, explicit transactions only when needed, bulk operations through <code>ExecuteUpdate</code>/<code>ExecuteDelete</code> or bulk copy, with their interceptor bypass understood.</li>
<li><b>Raw SQL:</b> only through parameterised APIs (<code>FromSql</code>, <code>SqlQuery</code>, Dapper with parameters), kept with the feature that owns it, and covered by integration tests.</li>
<li><b>Migrations:</b> backward-compatible (expand and contract), run as a separate pipeline step, SQL script reviewed in the PR, and no data-destructive changes without a two-release plan.</li>
<li><b>Performance:</b> indexes justified by real query plans, and queries checked against production-sized data for new hot paths.</li>
</ul>
<p><b>Enforcement that doesn't slow teams down:</b></p>
<ul>
<li>Automate: a shared <code>DbContext</code> base configuration (no-tracking default, query logging, slow-query warnings), analyzers where possible, and CI checks (pending model changes, migration scripts generated).</li>
<li>Monitor in production: slow-query and query-count-per-request alerts, attributed to endpoints.</li>
<li>Run monthly reviews of the top slow queries with each team.</li>
</ul>`,
keys:["Concrete read/write/raw SQL/migration rules","Automated defaults and CI checks","Production query monitoring attributed to teams","Light review cadence instead of gatekeeping"],
trade:["Strong defaults prevent common mistakes but occasionally need overriding; allow it explicitly","Centralised review catches more but becomes a bottleneck; automate first"],
fu:[{q:"How do you know the guidelines are working?",a:"Track query-related incidents, the number of slow queries per service, p95 latency of data-heavy endpoints, and failed or rolled-back migrations, before and after. If those don't improve, the guidelines aren't being followed or aren't the right ones."}],
rf:["A 30-page document no one reads","Mandatory DBA approval for every query","No production feedback loop"]},

{id:"N085",skill:"EF Core",level:"Lead",type:"Scenario",
q:"After upgrading EF Core to a new major version, several queries got slower in production and one started failing on an older SQL Server database. How should this have been handled, and how do you recover?",
a:`<p>EF Core majors change query translation, and the breaking-changes page documents it. A known example: EF Core 8 translated <code>Contains</code> over a parameter list into a JSON parameter with <code>OPENJSON</code>. That requires SQL Server compatibility level 130 or higher, so databases at an older compatibility level fail. And the new plans had different cardinality estimates, so some queries got slower. Later versions changed the default translation again and added options to control it.</p>
<p><b>Recovery now:</b></p>
<ul>
<li>Roll back the deploy if impact is severe. EF upgrades are usually code-only, so rollback is clean.</li>
<li>Apply the documented mitigation, for example <code>UseCompatibilityLevel(…)</code> for old databases, or a per-query or global option for collection translation.</li>
<li>Compare the generated SQL and plans for the regressed queries before and after.</li>
</ul>
<p><b>How it should have been handled:</b></p>
<ul>
<li>Read the breaking-changes list as a team task, with an owner.</li>
<li>Capture the top queries' SQL from the old version (by logging, or query-store snapshots) and diff against the new version in CI.</li>
<li>Test on a production-sized database with the real compatibility level.</li>
<li>Roll out with a canary, watching the slow-query metrics.</li>
</ul>`,
keys:["Knows concrete version-specific translation changes","Rollback first if severe","Documented mitigations (compat level, translation options)","SQL/plan diffing, prod-sized tests, canary","Breaking-changes review as owned task"],
trade:["Pinning the old EF version avoids risk short term but blocks runtime upgrades and fixes","Global options restore old behaviour quickly but may forgo improvements elsewhere"],
fu:[{q:"How do you capture 'the top queries' to diff across versions?",a:"Log generated SQL in an integration-test run covering the main endpoints, or use Query Store or pg_stat_statements from production to find top statements by total time. Run the same scenarios on the new version and compare SQL text and plans for those statements."}],
rf:["Upgrades and hopes","Doesn't read breaking-changes notes","Fixes regressions by adding raw SQL everywhere"],
verify:"Exact Contains/parameterised-collection translation defaults differ in EF 8, 9 and 10; check the breaking-changes docs for your versions."},

{id:"N086",skill:"EF Core",level:"Lead",type:"Architecture",
q:"Should your domain model be rich (behaviour and invariants on entities, DDD style) or anemic (data classes with logic in services)? How do you decide for a given service?",
a:`<p><b>Rich domain model:</b> entities and aggregates enforce their own invariants (<code>order.AddLine()</code> checks status, limits and totals), with private setters and constructors that guarantee valid state. Business rules live in one place, are testable without infrastructure, and are hard to bypass. It costs more design effort, needs EF mapping care (backing fields, private constructors, owned or complex types), and is overkill for CRUD.</p>
<p><b>Anemic model with services:</b> simple to write and map, and fine when the domain is mostly data entry and retrieval. The risk is rules scattered across services and endpoints, duplicated and easy to bypass. The domain decays as complexity grows.</p>
<p><b>How I decide, per bounded context:</b></p>
<ul>
<li>How many invariants and state transitions are there? An order lifecycle, lab result verification or pricing benefit from rich models.</li>
<li>How many entry points change the data? With many (APIs, consumers, jobs), protecting invariants in the entity pays off.</li>
<li>Is it mostly CRUD, like reference data or admin settings? Then keep it simple.</li>
</ul>
<p>Different contexts in the same system can choose differently. EF Core supports rich models well enough (field mapping, private constructors, value objects), so the ORM shouldn't drive the decision.</p>`,
keys:["Defines both honestly with costs","Decision criteria: invariants, entry points, CRUD-ness","Per-context choice","EF Core capability to map rich models","Avoids dogma"],
trade:["Rich: rules centralised and safe, more design and mapping work","Anemic: fast for simple domains, rules drift as complexity grows","It depends on: domain complexity, number of writers, team DDD experience"],
fu:[{q:"How do you introduce a richer model into an existing anemic codebase?",a:"Start with the aggregate that causes the most bugs. Move its rules into the entity behind methods, make setters private gradually, and route all writes through those methods. Add tests at the entity level as you go. Don't attempt a codebase-wide refactor."}],
rf:["Insists on DDD everywhere","Can't name a case where anemic is fine","Lets EF limitations dictate the domain design"]},

{id:"N087",skill:"ADO.NET & Dapper",level:"Lead",type:"Scenario",
q:"A legacy system has 600 stored procedures holding most business logic. The team wants to 'move logic into C#'. How do you approach this?",
a:`<p>Start by understanding why the team wants it. Testability, deployment coupling, hiring, a planned database migration? The goal shapes the plan.</p>
<ul>
<li><b>Inventory and classify</b> the procedures: usage frequency (from DMV stats or Query Store), change frequency (from source control), complexity, and type. Types include CRUD wrappers, set-based data processing (bulk updates, reporting), and business rules with branching logic.</li>
<li><b>Keep in SQL</b> what SQL does best: set-based operations over large data, reporting and aggregation. Moving them to C# often means pulling rows into memory and making them slower. They can still be version-controlled, tested (tSQLt) and deployed through migrations.</li>
<li><b>Move to C#</b> the business rules with branching and validation that change often and are hard to test. Do it as part of feature work in those areas, not as a standalone rewrite.</li>
<li><b>Retire dead code:</b> procedures never executed in months are deletion candidates, after verification.</li>
<li><b>Safety net first:</b> characterisation tests capturing current behaviour, through the procedure's interface, before changing anything.</li>
</ul>
<p>Report progress by business outcomes (lead time for changes in those areas, defect rates), not by the procedure count.</p>`,
keys:["Clarifies the goal","Inventory by usage, change frequency, type","Keep set-based logic in SQL","Move volatile business rules incrementally with feature work","Characterisation tests; dead code removal; outcome metrics"],
trade:["Moving logic to C# improves testability and deployment but can hurt performance for set-based work","A full rewrite is tempting but stalls; incremental migration keeps delivery going"],
fu:[{q:"How do you test stored procedure logic you aren't moving?",a:"Keep procedures in source control with migrations, and write tests either in SQL (tSQLt) or as integration tests from C# against a containerised database, asserting on resulting data. That gives a safety net without moving the logic."}],
rf:["Rewrite all 600 in one programme","Moves set-based reporting into C# loops","No characterisation tests"]},

{id:"N088",skill:"Testing (xUnit/Moq)",level:"Lead",type:"Architecture",
q:"You're the tech lead for a team of seven. Define the team's testing strategy: what's tested at which level, what runs where in CI, and the policies around it.",
a:`<p><b>Shape:</b> most tests at unit and service-integration level, few end-to-end. For API services, a "testing trophy" (weighted toward integration tests through <code>WebApplicationFactory</code> plus real dependencies in containers) often finds more real bugs than a pure unit pyramid.</p>
<ul>
<li><b>Unit:</b> domain rules, calculations, validators, edge cases. Fast, run on every commit.</li>
<li><b>Integration:</b> endpoints through the real pipeline with a real database and broker in containers. Cover auth rules, serialisation, queries and migrations. Run on every PR.</li>
<li><b>Contract:</b> API specs and event schemas diffed or verified against consumers. Run on every PR.</li>
<li><b>End-to-end and smoke:</b> a handful of critical journeys in staging after deploy, plus production synthetic checks.</li>
<li><b>Performance:</b> load tests for critical paths, nightly or before major releases.</li>
</ul>
<p><b>Policies:</b></p>
<ul>
<li>Every bug fix comes with a regression test.</li>
<li>Flaky tests are quarantined with an owner and fixed within a sprint, never re-run until green.</li>
<li>PR pipeline under about 10 minutes.</li>
<li>Coverage tracked but not gated; mutation testing on critical modules.</li>
<li>Developers own tests. QA, if present, focuses on exploratory testing and test design, not manual regression.</li>
</ul>
<p>Review the strategy against escaped defects quarterly.</p>`,
keys:["Explicit levels with purpose and cadence","Integration-heavy trophy reasoning for APIs","Contract tests","Policies: regression tests, flaky quarantine, pipeline time","Ownership and feedback loop from escaped defects"],
trade:["More integration tests catch real wiring bugs but run slower; keep them parallel and isolated","E2E tests give confidence but are slow and flaky; keep them few"],
fu:[{q:"How do you handle a team member who doesn't write tests?",a:"Make it part of definition of done and review, pair with them on testing a tricky change, and check whether the test setup itself is painful: if writing an integration test takes an hour of setup, fix the tooling. Persistent refusal is then a performance conversation."}],
rf:["\"100% coverage\" as the strategy","Mostly manual QA regression","No policy for flaky tests"]},

{id:"N089",skill:"Testing (xUnit/Moq)",level:"Lead",type:"Scenario",
q:"Two days before a committed release, the team proposes skipping tests for the last few features to make the date. Product supports it. What do you do?",
a:`<p>I wouldn't say a flat yes or no. I'd make the risk explicit and find the smallest safe option.</p>
<ol>
<li><b>Clarify what "skipping tests" means:</b> not writing new automated tests, skipping the regression suite, or skipping review? Skipping the existing regression suite or code review is a hard no. They're the safety net for everything else.</li>
<li><b>Assess risk per feature:</b> what breaks if it's wrong, and how many users does it touch? Payment or data-changing features need tests now. A low-risk UI tweak behind a feature flag can ship with manual checks.</li>
<li><b>Offer options:</b>
  <ul>
  <li>Ship the risky features behind <b>flags</b>, off by default, and enable them after tests land next week.</li>
  <li>Cut scope: ship the tested features on the date, the rest a few days later.</li>
  <li>Write focused tests only for the critical paths of the risky features.</li>
  </ul></li>
<li><b>If we accept some risk:</b> record it, add monitoring and alerts for those features, schedule the missing tests as committed work for the next sprint, and make sure there's a rollback plan.</li>
</ol>
<p>Make the trade-off explicit with product, so the decision is shared and informed rather than a quiet erosion of standards.</p>`,
keys:["Clarifies what is being skipped","Non-negotiables (regression suite, review)","Risk-based per-feature decision","Options: flags, scope cut, targeted tests","Recorded risk, monitoring, committed follow-up"],
trade:["Hitting the date preserves trust with stakeholders; shipping a serious defect damages it more","Feature flags reduce release risk but add flag debt to clean up"],
fu:[{q:"This happens every release. What's the deeper fix?",a:"The planning is the problem, not the testing. Include testing in estimates, track how often scope is squeezed at the end, and use that data in planning conversations. Smaller, more frequent releases reduce the end-of-cycle crunch."}],
rf:["Agrees silently","Refuses with no alternative","Skips the regression suite"]},

{id:"N090",skill:".NET Performance & Diagnostics",level:"Lead",type:"Scenario",
q:"Your API has a p99 latency SLO of 300 ms. Performance regressions keep slipping in, release after release. How do you build performance into the team's process?",
a:`<ul>
<li><b>Make the budget explicit:</b> per critical endpoint, a p99 target and a resource budget (DB queries per request, allocations for hot paths). Put them where developers see them: dashboards and the service README.</li>
<li><b>Catch regressions before production:</b>
  <ul>
  <li>Load tests (k6, NBomber) for critical journeys in CI on a schedule (nightly or per release candidate), against a stable environment, comparing p95/p99 and error rate to a baseline with thresholds that fail the run.</li>
  <li>Integration tests that assert the query count per request, which catches N+1 regressions cheaply on every PR.</li>
  <li>BenchmarkDotNet for hot-path libraries, with tracked results.</li>
  </ul></li>
<li><b>Catch regressions in production fast:</b> canary deploys with automatic rollback on latency SLO burn, and alerts on burn rate rather than raw thresholds.</li>
<li><b>Make ownership clear:</b> performance belongs to the feature team, not a separate group. Regressions found are fixed like bugs, with a test that would have caught them.</li>
<li><b>Review monthly:</b> the slowest endpoints and the trend, with time allocated to the worst offenders.</li>
</ul>`,
keys:["Explicit per-endpoint budgets","Automated load tests with baselines and thresholds","Cheap PR-level checks (query counts)","Canary + SLO burn-rate rollback","Ownership and regular review"],
trade:["Load tests in CI cost infrastructure and time; schedule them rather than per PR","Strict thresholds catch regressions but cause false failures in noisy environments; use stable environments and tolerances"],
fu:[{q:"The nightly load test is noisy: results vary 15% night to night. What do you do?",a:"Stabilise the environment (dedicated, same size and data, no other tenants), warm up before measuring, run longer, and compare against a rolling baseline with a tolerance band. Investigate only sustained changes beyond the noise rather than single-run blips."}],
rf:["Relies on users to report slowness","One-off performance sprint before launch","Load tests with no baseline or thresholds"]}

/* ---------- state ---------- */

let reviewed={};
try{reviewed=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){reviewed={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(reviewed))}catch(e){}}

const state={text:"",skill:"all",status:"all",levels:new Set(),types:new Set()};
const $=s=>document.querySelector(s);

/* ---------- controls ---------- */
const skills=[...new Set(QS.map(x=>x.skill))];
$("#skill").innerHTML=`<option value="all">All skills</option>`+skills.map(s=>`<option value="${s}">${s}</option>`).join("");
function chipRow(el,items,set){
  el.innerHTML=items.map(i=>`<button type="button" class="chip" aria-pressed="false" data-v="${i}">${i}</button>`).join("");
  el.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;const v=b.dataset.v;
    if(set.has(v)){set.delete(v);b.setAttribute("aria-pressed","false")}else{set.add(v);b.setAttribute("aria-pressed","true")}render()});
}
chipRow($("#levels"),LEVELS,state.levels);
chipRow($("#types"),TYPES,state.types);
$("#q").addEventListener("input",e=>{state.text=e.target.value.trim().toLowerCase();render()});
$("#skill").addEventListener("change",e=>{state.skill=e.target.value;render()});
$("#status").addEventListener("change",e=>{state.status=e.target.value;render()});
let allOpen=false;
$("#toggleAll").addEventListener("click",()=>{allOpen=!allOpen;
  document.querySelectorAll("details.ans").forEach(d=>d.open=allOpen);
  $("#toggleAll").textContent=allOpen?"Close all answers":"Open all answers"});

/* ---------- stats ---------- */

$("#stats").innerHTML=`<span><b>${QS.length}</b> questions loaded</span><span>${count("level",LEVELS)}</span><span>${count("type",TYPES.filter(t=>t!=="Behavioral"))}</span><span>${PARTS}</span>`;

    <div class="qhead"><span class="num">${x.id}</span><div>
      <p class="qtext">${x.q}</p>
      <div class="tags"><span class="tag">${x.skill}</span><span class="tag lv lv-${x.level}">${x.level}</span><span class="tag">${x.type}</span>${x.verify?`<span class="tag verify">VERIFY</span>`:""}
        <label class="check"><input type="checkbox" data-id="${x.id}" ${done?"checked":""}> Reviewed</label></div>
    </div></div>
    <div class="body">
      <details class="ans"><summary>Model answer, key points and red flags</summary><div class="dbody">
        ${x.a}
        ${x.tools?`<h4>Tools and metrics to check</h4>${ul(x.tools)}`:""}
        <h4>What the interviewer listens for</h4>${ul(x.keys)}
        ${x.trade?`<h4>Trade-offs and "it depends on"</h4>${ul(x.trade)}`:""}
        <h4 class="rf">Red flags</h4>${ul(x.rf)}
        ${x.verify?`<p class="note">[VERIFY] ${x.verify}</p>`:""}
      </div></details>
      ${(x.fu||[]).map(f=>`<details class="fu ans"><summary><span class="fl">FOLLOW-UP</span><span>${f.q}</span></summary><div class="dbody"><p>${f.a}</p></div></details>`).join("")}
    </div></li>`;
}
function render(){
  const list=QS.filter(matches);
  $("#list").innerHTML=list.length?list.map(item).join(""):`<li class="empty">No questions match these filters.</li>`;
  if(allOpen)document.querySelectorAll("details.ans").forEach(d=>d.open=true);
  const n=QS.filter(x=>reviewed[x.id]).length;
  $("#ptext").textContent=`${n} / ${QS.length} reviewed · ${list.length} shown`;
  $("#pfill").style.width=(QS.length?n/QS.length*100:0)+"%";
}
$("#list").addEventListener("change",e=>{const c=e.target.closest("input[data-id]");if(!c)return;
  const id=c.dataset.id;if(c.checked)reviewed[id]=1;else delete reviewed[id];save();
  c.closest("li.q").classList.toggle("done",c.checked);
  const n=QS.filter(x=>reviewed[x.id]).length;const shown=document.querySelectorAll("li.q").length;
  $("#ptext").textContent=`${n} / ${QS.length} reviewed · ${shown} shown`;$("#pfill").style.width=(n/QS.length*100)+"%";});
try{const m=location.hash.match(/^#q=([^&]+)/);if(m){const v=decodeURIComponent(m[1]);$("#q").value=v;state.text=v.trim().toLowerCase();}}catch(e){}
render();
</script>

</html>
