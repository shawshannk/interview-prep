{id:"N019",skill:"C# & Runtime",level:"Intermediate",type:"Concept",
q:"What does ConfigureAwait(false) do, and does it matter in ASP.NET Core?",
a:`<p>By default, <code>await</code> captures the current <b>SynchronizationContext</b> (or the current non-default TaskScheduler) and resumes the continuation on it. <code>ConfigureAwait(false)</code> says "don't capture it; resume on any thread-pool thread".</p>
<ul>
<li><b>Where it mattered:</b> UI apps (WinForms, WPF) and legacy ASP.NET (System.Web) have a SynchronizationContext. Library code that blocks on async there (<code>.Result</code>) can deadlock, because the continuation needs the context the blocked thread holds. <code>ConfigureAwait(false)</code> in libraries avoids that and skips the context-switch cost.</li>
<li><b>ASP.NET Core has no SynchronizationContext,</b> so in application code it makes no practical difference.</li>
<li><b>Libraries</b> that may be used by UI or legacy apps should still use <code>ConfigureAwait(false)</code> consistently.</li>
</ul>
<p>.NET 8 added <code>ConfigureAwaitOptions</code> (for example <code>SuppressThrowing</code>, <code>ForceYielding</code>) on <code>Task.ConfigureAwait</code> for finer control.</p>`,
keys:["Captured SynchronizationContext explained","Deadlock scenario in UI/legacy ASP.NET","No context in ASP.NET Core","Still recommended in reusable libraries",".NET 8 ConfigureAwaitOptions"],
fu:[{q:"Does ConfigureAwait(false) fix sync-over-async problems in ASP.NET Core?",a:"No. Blocking with .Result still ties up a thread-pool thread for the duration and contributes to thread-pool starvation. The fix is to be async all the way, not to tweak the await."}],
rf:["\"Always use ConfigureAwait(false) in ASP.NET Core controllers or it deadlocks\"","Can't explain what the context is"]},

{id:"N020",skill:"C# & Runtime",level:"Intermediate",type:"Scenario",
q:"A developer added 'fire-and-forget' work using an async void method so the API returns faster. Occasionally the whole process crashes with no clear error. Explain and fix.",
a:`<p><b>async void</b> methods can't be awaited, and an exception thrown inside one is raised directly on the captured context or the thread pool. In ASP.NET Core that is an <b>unhandled exception that terminates the process</b>. Nobody observes completion either, so work can be lost during shutdown. (An unobserved exception from a fire-and-forget <i>Task</i> doesn't crash the process by default, but it's silently lost, which is also a bug.)</p>
<p><code>async void</code> is only appropriate for event handlers.</p>
<p><b>Correct ways to do background work after responding:</b></p>
<ul>
<li>Write a work item to a <code>Channel&lt;T&gt;</code> (bounded) consumed by a <code>BackgroundService</code>. The service handles exceptions, creates a DI scope per item, and drains on shutdown.</li>
<li>For work that must survive restarts, use a durable queue (SQS, Kafka, or an outbox table) rather than in-memory.</li>
<li>Return <code>202 Accepted</code> if the client needs to know the work is pending.</li>
</ul>`,
keys:["async void exceptions crash the process","No completion tracking or shutdown handling","Channel + BackgroundService pattern","Durable queue when loss is unacceptable","DI scope per work item"],
fu:[{q:"What happens to items still in the Channel when the app is shutting down during a deploy?",a:"With an in-memory channel, anything not processed before the host shutdown timeout is lost. Handle the stopping token to drain what you can, but if losing work is unacceptable, the work belongs in a durable queue."}],
rf:["Task.Run(...) without awaiting, using request-scoped services inside","async void outside event handlers","Assumes in-memory background work survives deploys"]},

{id:"N021",skill:"C# & Runtime",level:"Intermediate",type:"Concept",
q:"You call three services in parallel with Task.WhenAll. Two of them fail. What exceptions do you see, and how should cancellation be handled?",
a:`<p><code>await Task.WhenAll(a, b, c)</code> waits for <b>all</b> tasks to finish, then throws only the <b>first</b> exception when awaited. The returned task's <code>Exception</code> property (an <code>AggregateException</code>) holds all of them. To log every failure, keep a reference to the WhenAll task and inspect <code>.Exception.InnerExceptions</code> in the catch block, or inspect each task's status.</p>
<pre><code>var all = Task.WhenAll(t1, t2, t3);
try { await all; }
catch
{
    foreach (var ex in all.Exception!.InnerExceptions) logger.LogError(ex, "Call failed");
    throw;
}</code></pre>
<p><b>Cancellation:</b> pass a <code>CancellationToken</code> to every call. Usually that's <code>HttpContext.RequestAborted</code> combined with a timeout via <code>CancellationTokenSource.CreateLinkedTokenSource</code>. If one failure makes the others pointless, cancel the linked source as soon as the first task faults, so the remaining calls stop instead of running to completion. .NET 9's <code>Task.WhenEach</code> lets you process tasks as they complete.</p>`,
keys:["Await surfaces only the first exception","AggregateException via the task's Exception property","Token propagation, linked tokens with timeout","Cancel siblings on first failure when appropriate"],
fu:[{q:"What's the difference between OperationCanceledException and TaskCanceledException?",a:"TaskCanceledException derives from OperationCanceledException. Catch OperationCanceledException to handle both. HttpClient timeouts surface as TaskCanceledException, and since .NET 5 its InnerException is a TimeoutException, which lets you distinguish a timeout from a caller cancellation."}],
rf:["Thinks all exceptions are thrown together","Never passes cancellation tokens","Uses Task.WaitAll in async code"]},

{id:"N022",skill:"ASP.NET Core",level:"Intermediate",type:"Scenario",
q:"An endpoint starts a Task.Run that uses the injected DbContext to write an audit record after the response. In production it throws ObjectDisposedException intermittently. Why, and what's the fix?",
a:`<p>The <code>DbContext</code> is <b>scoped to the request</b>. When the response completes, the request scope is disposed, along with the context. The background task still holds a reference and uses it later, so it fails if it runs after disposal. That's timing-dependent, hence intermittent. <code>DbContext</code> is also not thread-safe, so using it concurrently with the request's own work is a second bug.</p>
<p><b>Fixes, in order of preference:</b></p>
<ul>
<li>Make the audit write part of the request's own unit of work (same <code>SaveChanges</code>, or an outbox row). It's often simplest and gives consistency.</li>
<li>If it must be asynchronous, enqueue a message (a <code>Channel</code> plus a <code>BackgroundService</code>, or a durable queue) containing <i>data</i>, not services. The consumer creates its own scope with <code>IServiceScopeFactory</code> and resolves its own <code>DbContext</code>.</li>
<li>For short-lived parallel DB work inside a request, use <code>IDbContextFactory&lt;T&gt;</code> to create independent contexts.</li>
</ul>`,
keys:["Request scope disposal explained","DbContext not thread-safe","Pass data, not scoped services, to background work","New scope via IServiceScopeFactory / IDbContextFactory","Consider doing it in the same unit of work"],
fu:[{q:"Two queries need to run in parallel in one request. Can you await two queries on the same DbContext with Task.WhenAll?",a:"No. EF Core throws because a second operation started on the context before the previous one completed. Use separate contexts from IDbContextFactory for parallel queries, or run them sequentially."}],
rf:["Registers DbContext as transient or singleton to 'fix' it","Captures HttpContext in background work","Doesn't recognise the lifetime issue"]},

{id:"N023",skill:"ASP.NET Core",level:"Intermediate",type:"Concept",
q:"How do you implement authentication and authorization in an ASP.NET Core API, including rules like 'only the owner can edit this order'?",
a:`<p><b>Authentication:</b> for APIs, typically JWT bearer tokens from an identity provider (Cognito, Entra ID, Auth0, Keycloak). Configure <code>AddAuthentication().AddJwtBearer(...)</code> with authority and audience. The handler validates signature, issuer, audience and expiry, and builds a <code>ClaimsPrincipal</code>.</p>
<p><b>Authorization</b> at three levels:</p>
<ul>
<li><b>Role or scope checks:</b> <code>[Authorize(Roles = "Admin")]</code>, or <code>RequireAuthorization</code> on minimal API groups.</li>
<li><b>Policies:</b> named requirements registered in <code>AddAuthorization</code> (for example "has scope orders:write and email verified"). They are reusable and testable.</li>
<li><b>Resource-based:</b> ownership depends on the specific resource, so it can't be expressed as an attribute. Load the resource, then call <code>IAuthorizationService.AuthorizeAsync(User, order, "CanEditOrder")</code>, with an <code>AuthorizationHandler&lt;Requirement, Order&gt;</code> comparing <code>order.OwnerId</code> to the user's ID claim.</li>
</ul>
<p>Apply a fallback policy that requires authenticated users by default, so a forgotten attribute doesn't expose an endpoint.</p>`,
keys:["JWT bearer validation parameters","Policies over hard-coded role checks","Resource-based authorization with IAuthorizationService","Fallback policy requiring authentication","Returns 403 vs 404 deliberately"],
fu:[{q:"Why not just check order.OwnerId == userId inline in the endpoint?",a:"It works, but the rule gets duplicated across endpoints and is easy to forget on the next one. A named policy with a handler centralises it, can be unit-tested, and can grow (admins may also edit) in one place."}],
rf:["Trusts a userId from the request body","No default fallback policy","Only role checks, no resource ownership checks"]},

{id:"N024",skill:"EF Core",level:"Intermediate",type:"Scenario",
q:"An EF Core query is fast locally but takes 8 seconds in production. Walk through how you diagnose it.",
a:`<ol>
<li><b>See the SQL:</b> <code>query.ToQueryString()</code>, or enable EF logging (<code>LogTo</code>, or the <code>Microsoft.EntityFrameworkCore.Database.Command</code> category) to capture the generated SQL and its duration. Check that the time is in the database, not in materialisation or the network.</li>
<li><b>Data volume:</b> local has 500 rows, prod has 50 million. Look at the <b>actual execution plan</b> in prod (or on a prod-sized copy): table scans, key lookups, missing indexes on filter or join columns, implicit conversions (an <code>nvarchar</code> parameter against a <code>varchar</code> column prevents index seeks).</li>
<li><b>Query shape:</b>
  <ul>
  <li>N+1 (one query per row).</li>
  <li><b>Cartesian explosion</b> from several collection <code>Include</code>s in one query. Rows multiply; use <code>AsSplitQuery()</code> or a projection.</li>
  <li>Loading whole entities when a <code>Select</code> of a few columns would do.</li>
  <li>Filtering after materialisation (an early <code>ToList()</code>).</li>
  </ul></li>
<li><b>Parameter sniffing:</b> the plan was compiled for an atypical parameter value. Check Query Store for plan variance.</li>
<li><b>Tracking overhead</b> on large result sets. Use no-tracking.</li>
</ol>
<p>Fix the root cause (index, projection, split query, query rewrite), and verify with the plan and timings on prod-sized data.</p>`,
keys:["Get the SQL and confirm where time goes","Actual execution plan on prod-sized data","Implicit conversion / missing index","Cartesian explosion and AsSplitQuery","N+1, projection, early materialisation, parameter sniffing"],
trade:["Split queries avoid row explosion but run several round trips and can see inconsistent data between them without a transaction","Indexes speed reads but slow writes and use storage; add them for real query patterns"],
fu:[{q:"What implicit conversion problem is common with EF Core and SQL Server?",a:"A string property mapped to varchar in the database while EF sends nvarchar parameters (the default for strings) makes SQL Server convert the column side, which prevents index seeks. Fix it by configuring the property as unicode false or with the right column type, so parameters match."}],
rf:["Adds AsNoTracking and hopes","Doesn't look at the generated SQL or plan","Tests on a tiny local database only"]},

{id:"N025",skill:"EF Core",level:"Intermediate",type:"Concept",
q:"What does SaveChanges do transactionally, when do you need an explicit transaction, and what do ExecuteUpdate and ExecuteDelete change?",
a:`<p><code>SaveChanges</code> detects changes in the change tracker, generates INSERT, UPDATE and DELETE statements (batched where the provider allows), and runs them <b>in one transaction</b> by default. Either all changes in that call commit or none do. The <code>DbContext</code> acts as a unit of work.</p>
<p>You need an <b>explicit transaction</b> (<code>BeginTransactionAsync</code>) when:</p>
<ul>
<li>Several <code>SaveChanges</code> calls must succeed or fail together.</li>
<li>You mix EF with raw SQL or Dapper on the same connection.</li>
<li>You need a specific isolation level.</li>
</ul>
<p>With a retrying execution strategy, wrap the transaction in <code>strategy.ExecuteAsync</code>.</p>
<p><b><code>ExecuteUpdate</code>/<code>ExecuteDelete</code></b> (EF Core 7) run set-based UPDATE and DELETE statements directly in the database, without loading entities:</p>
<pre><code>await db.Sessions
    .Where(s =&gt; s.ExpiresAt &lt; now)
    .ExecuteDeleteAsync();</code></pre>
<p>They're far faster for bulk changes, but they <b>bypass the change tracker</b>: already-tracked entities aren't updated, interceptors and <code>SaveChanges</code> overrides (audit fields, soft-delete logic, domain events) don't run, and they execute immediately, outside <code>SaveChanges</code>'s transaction unless you start one.</p>`,
keys:["SaveChanges = one transaction per call","When explicit transactions are needed","Execution strategy wrapping","ExecuteUpdate/Delete benefits","They bypass tracker, interceptors and audit logic"],
fu:[{q:"Your app uses a SaveChanges override to set UpdatedAt and enforce soft delete. A teammate uses ExecuteDelete. What breaks?",a:"The delete is a hard delete and skips the soft-delete logic, and UpdatedAt isn't set by ExecuteUpdate. Either replicate the logic in the bulk call (ExecuteUpdate setting IsDeleted and UpdatedAt) or restrict bulk operations to cases where bypassing it is intended."}],
rf:["Thinks each entity change is its own transaction","Uses ExecuteDelete unaware it bypasses interceptors","Loads 100k entities to update one column"]},
/* ================= INTERMEDIATE (part 2) ================= */
{id:"N026",skill:"C# & Runtime",level:"Intermediate",type:"Concept",
q:"Task vs ValueTask: when should a method return ValueTask, and what are the rules for consuming one?",
a:`<p><code>Task</code> is a reference type, so every asynchronous call that completes asynchronously allocates. <code>ValueTask&lt;T&gt;</code> is a struct that can wrap either a result directly (no allocation when the method completes synchronously) or a <code>Task</code>/<code>IValueTaskSource</code> (which allows pooled, reusable async operations).</p>
<p><b>Use ValueTask</b> on hot paths that <b>usually complete synchronously</b>: a cache hit, buffered stream reads, a channel read with data available. That's why <code>Stream.ReadAsync(Memory&lt;byte&gt;)</code> and <code>ChannelReader.ReadAsync</code> return it. Default to <code>Task</code> everywhere else, because it's simpler and safer.</p>
<p><b>Consumption rules:</b> await a ValueTask <b>exactly once</b>. Don't await it twice, don't await it concurrently, and don't call <code>.Result</code> before it's complete. A pooled source may have been reused by another operation. If you need to do any of those, call <code>.AsTask()</code> once and use the Task.</p>`,
keys:["Allocation motivation","Use when synchronous completion is common","IValueTaskSource pooling","Await-once rules","AsTask() when you need Task semantics"],
fu:[{q:"Should all your service interfaces return ValueTask for performance?",a:"No. Unless profiling shows allocation from synchronously-completing async calls matters on that path, Task is the right default. ValueTask's rules make misuse easy, and the gain is negligible for methods that are truly asynchronous (a DB call)."}],
rf:["Returns ValueTask everywhere by default","Awaits the same ValueTask twice","Can't say why ValueTask exists"]},

{id:"N027",skill:"C# & Runtime",level:"Intermediate",type:"Scenario",
q:"A singleton service caches lookups in a Dictionary<string, Rate>. Under load the API sometimes throws InvalidOperationException, returns wrong values, or a pod pins a CPU at 100% and stops responding. What's wrong and how do you fix it?",
a:`<p><code>Dictionary&lt;K,V&gt;</code> is <b>not thread-safe for concurrent writes</b>, or for reads concurrent with writes. A singleton is shared across every request thread. Concurrent writes can corrupt the internal buckets: you see lost entries, wrong values, and the classic <b>infinite loop</b> in a corrupted bucket chain (100% CPU on one core, a hung request). Modern .NET detects some cases and throws <code>InvalidOperationException</code> instead.</p>
<p><b>Fixes:</b></p>
<ul>
<li>Use <code>ConcurrentDictionary</code> for a shared mutable cache, or <code>IMemoryCache</code> with expiry and a size limit, which is usually what you actually want.</li>
<li>If data is loaded once and read-only after, build it at startup and expose it as a <code>FrozenDictionary</code> (.NET 8) or <code>ImmutableDictionary</code>, so there's no mutation to race.</li>
<li><code>ConcurrentDictionary.GetOrAdd(key, factory)</code> can run the factory <b>more than once</b> under contention. If the factory is expensive or has side effects, store <code>Lazy&lt;Task&lt;T&gt;&gt;</code> values so only one computation runs.</li>
</ul>`,
keys:["Dictionary not safe for concurrent writes","Infinite loop / corruption symptoms","ConcurrentDictionary / IMemoryCache / FrozenDictionary choice","GetOrAdd factory may run multiple times; Lazy wrapper","Singleton = shared across threads"],
trade:["A lock around a Dictionary is simple and correct but serialises access on hot paths","IMemoryCache adds expiry and size limits but per-instance, so data differs between pods"],
fu:[{q:"How would you confirm the infinite-loop theory on a hung pod?",a:"Take a dump (dotnet-dump collect) and run clrstack across threads (clrstack -all, or ~*e !clrstack). You'll see a thread spinning inside Dictionary.FindValue or TryInsert, with the cache service on the stack."}],
rf:["Adds try/catch around the dictionary","Uses lock on every read and write without considering immutable alternatives","Doesn't know GetOrAdd can run factories concurrently"]},

{id:"N028",skill:"C# & Runtime",level:"Intermediate",type:"Concept",
q:"Explain IDisposable, IAsyncDisposable and finalizers. When do you implement each, and what can go wrong?",
a:`<p><b>IDisposable</b> releases unmanaged or expensive resources deterministically (connections, file handles, timers, subscriptions) through <code>using</code> or a <code>using</code> declaration. <b>IAsyncDisposable</b> (<code>await using</code>) is for cleanup that does I/O, such as flushing a stream or closing a network connection, so disposal doesn't block a thread. Implement both on types that need async cleanup but may be disposed synchronously.</p>
<p><b>Finalizers</b> (<code>~Type()</code>) are a last-resort safety net for <b>directly owned unmanaged handles</b>. Most code never needs one: wrap handles in <code>SafeHandle</code> instead. Finalizable objects survive an extra GC cycle and add work to the finalizer thread.</p>
<p><b>What goes wrong:</b></p>
<ul>
<li>Forgetting to dispose: leaked connections, pool exhaustion, timers keeping objects alive.</li>
<li>Disposing something you don't own, such as an injected dependency. The DI container owns disposal for services it created.</li>
<li>Using an object after disposal.</li>
<li>Disposing <code>HttpClient</code> instances per call, which causes socket churn; use <code>IHttpClientFactory</code>.</li>
</ul>`,
keys:["Deterministic cleanup purpose","IAsyncDisposable for I/O cleanup","Finalizers rarely; SafeHandle","Ownership: container disposes what it creates","Common leak patterns"],
fu:[{q:"You resolve a transient IDisposable from the root service provider repeatedly in a singleton. What happens?",a:"The root container tracks disposable transients it creates and holds them until the app shuts down, so they're never released: a memory leak. Resolve them inside a scope that you dispose, or don't make them disposable transients."}],
rf:["Adds finalizers to ordinary classes","Disposes injected services","Doesn't know await using"]},

{id:"N029",skill:"C# & Runtime",level:"Intermediate",type:"Concept",
q:"How do closures work in C#? What problems can captured variables cause?",
a:`<p>When a lambda or local function uses a local variable from its enclosing scope, the compiler <b>hoists the variable into a compiler-generated class</b> (a closure). The lambda and the method share that one variable, not a copy of its value at creation time.</p>
<p><b>Problems:</b></p>
<ul>
<li><b>Loop capture:</b> since C# 5, <code>foreach</code> gets a fresh variable per iteration. A classic <code>for (int i = 0; …)</code> loop still shares one <code>i</code>, so lambdas created in the loop and run later all see the final value. Copy to a local inside the loop.</li>
<li><b>Lifetime extension:</b> a long-lived lambda (an event subscription, a cached delegate, a timer) keeps every captured object alive, including large ones or a <code>this</code> captured implicitly. That causes memory leaks.</li>
<li><b>Allocations on hot paths:</b> each closure creation allocates. Use <code>static</code> lambdas (C# 9), which forbid capture, to catch accidental closures, and pass state explicitly where APIs allow it (for example overloads taking a state argument).</li>
<li><b>Thread-safety:</b> captured variables mutated from parallel lambdas race like any shared field.</li>
</ul>`,
keys:["Variables hoisted to a shared closure object","for vs foreach capture behaviour","Lifetime extension and leaks","Allocation cost; static lambdas","Shared mutable state in parallel code"],
fu:[{q:"How does closure capture interact with async methods?",a:"Locals used across an await are also hoisted, into the async state machine, and live as long as the operation. Capturing a large buffer or DbContext in a long-running async operation keeps it alive until completion."}],
rf:["Thinks lambdas capture values","Unaware of for-loop capture","Doesn't connect closures to memory leaks"]},

{id:"N030",skill:"C# & Runtime",level:"Intermediate",type:"Scenario",
q:"Users close the browser tab on a slow report, but the expensive query keeps running for another minute, and under load the DB fills with orphaned work. How do you make cancellation work end to end?",
a:`<p>Cancellation is cooperative: nothing stops unless every layer passes and honours a <code>CancellationToken</code>.</p>
<ol>
<li><b>Get the request token.</b> Add a <code>CancellationToken</code> parameter to the controller action or minimal API handler. ASP.NET Core binds it to <code>HttpContext.RequestAborted</code>, which fires when the client disconnects.</li>
<li><b>Pass it all the way down:</b> service methods, <code>ToListAsync(ct)</code>, Dapper <code>CommandDefinition(…, cancellationToken: ct)</code>, <code>HttpClient.SendAsync(…, ct)</code>. SqlClient and Npgsql send a cancel to the server, so the query actually stops on the database.</li>
<li><b>Honour it in CPU loops</b> with <code>ct.ThrowIfCancellationRequested()</code> at sensible intervals.</li>
<li><b>Add a timeout</b> by linking with a timer: <code>CancellationTokenSource.CreateLinkedTokenSource(ct)</code> plus <code>CancelAfter</code>. Clients behind proxies may not signal disconnects promptly, so a server-side budget is still needed.</li>
<li><b>Handle the exception:</b> treat <code>OperationCanceledException</code> from a client abort as normal, logged at debug level, not error, and don't return a 500.</li>
</ol>
<p>Also question whether this report should be synchronous at all. A long report is a candidate for an asynchronous job.</p>`,
keys:["RequestAborted binding","Token passed through every layer incl. DB and HTTP","DB driver sends server-side cancel","Linked token with timeout","Cancellation not logged as an error"],
trade:["Cancelling in-flight writes can leave partial work; be careful cancelling non-idempotent operations mid-way and rely on transactions","Proxies and load balancers may delay disconnect detection, so pair with server-side timeouts"],
fu:[{q:"Should you cancel a write operation when the client disconnects?",a:"Often not. If the user submitted an order and their connection dropped, completing the transaction (so a retry finds it via the idempotency key) is better than cancelling mid-way. Use the request token for reads and expensive computation, and use a separate token or none for operations that should finish."}],
rf:["Doesn't know about RequestAborted","Passes CancellationToken.None everywhere","Logs every cancellation as an error"]},

{id:"N031",skill:"ASP.NET Core",level:"Intermediate",type:"Concept",
q:"Filters vs middleware in ASP.NET Core: what's the difference, and when do you use each?",
a:`<p><b>Middleware</b> runs for every request in the pipeline, before an endpoint is chosen or around it. It sees only <code>HttpContext</code>. Use it for cross-cutting HTTP concerns: exception handling, request logging, correlation IDs, security headers, rate limiting.</p>
<p><b>Filters</b> run inside the endpoint invocation and have <b>endpoint context</b>:</p>
<ul>
<li>MVC filters (authorization, resource, action, exception, result) see the bound arguments, model state and action metadata.</li>
<li>Minimal API <b>endpoint filters</b> (.NET 7) see the handler's arguments, and can validate or transform them.</li>
</ul>
<p>Use filters for concerns tied to specific endpoints or their arguments: validating a particular DTO, auditing actions marked with an attribute, or wrapping results.</p>
<p>Rule of thumb: if it needs to know <i>which</i> action and its arguments, use a filter. If it's about the HTTP request in general, use middleware. MVC exception filters only catch exceptions from the MVC part of the pipeline, so global error handling belongs in middleware.</p>`,
keys:["Middleware: every request, HttpContext only","Filters: endpoint context, arguments, metadata","Endpoint filters for minimal APIs","Global error handling in middleware","Choose by needed context"],
fu:[{q:"How would you add an audit log for every action marked [Audited]?",a:"An action filter (or endpoint filter for minimal APIs) that checks for the attribute in endpoint metadata, captures user, action, key arguments and result status after execution, and writes an audit event. It needs endpoint context, so it's a filter, not middleware."}],
rf:["Uses filters for global exception handling only","Thinks they're the same","Puts endpoint-specific logic in middleware with path string matching"]},

{id:"N032",skill:"ASP.NET Core",level:"Intermediate",type:"Scenario",
q:"A public product-catalogue endpoint gets 5,000 requests per second for data that changes a few times an hour. The database is struggling. How do you use caching in ASP.NET Core here, and what must you avoid?",
a:`<p>Several layers, from cheapest to most involved:</p>
<ul>
<li><b>HTTP caching headers</b> (<code>Cache-Control: public, max-age=60</code>, <code>ETag</code>) let the CDN and browsers absorb most requests. For truly public data, a CDN in front is the biggest win.</li>
<li><b>Output caching</b> (.NET 7+, <code>AddOutputCache</code>/<code>CacheOutput</code>): the server stores the full response. It supports varying by query or route values, <b>tag-based eviction</b> (evict the "products" tag when a product changes), and request coalescing, so concurrent misses compute once. By default it only caches GET/HEAD 200 responses, and skips authenticated requests and responses that set cookies. With multiple instances, use the Redis output-cache store (.NET 8) so eviction is shared.</li>
<li><b>Data caching</b> (<code>IMemoryCache</code>/<code>IDistributedCache</code>, or <code>HybridCache</code> in newer .NET) for reused query results with explicit invalidation.</li>
</ul>
<p><b>Avoid:</b></p>
<ul>
<li>Caching personalised responses (user-specific prices, carts) in shared caches.</li>
<li>Unbounded cache keys from arbitrary query strings: restrict which parameters vary the cache.</li>
<li>Forgetting invalidation when data changes.</li>
</ul>`,
keys:["Layered caching (HTTP/CDN, output, data)","Output caching features: vary-by, tags, coalescing","Default exclusions (auth, cookies)","Distributed store for multi-instance eviction","Personalisation and key-explosion risks"],
trade:["CDN caching is cheapest but invalidation is slower and coarse","Output cache per instance is fast but inconsistent across pods without a shared store","Short TTLs reduce staleness at the cost of more origin load"],
fu:[{q:"Output caching vs the older response caching middleware: what's the difference?",a:"Response caching follows HTTP caching headers and is controlled by the client's request headers. Output caching is configured on the server, ignores client cache-control requests, and supports tag eviction and locking. For server-side caching of API responses, output caching is the right tool."}],
rf:["Caches responses for authenticated users globally","Varies by every query parameter","No invalidation strategy"]},

{id:"N033",skill:"ASP.NET Core",level:"Intermediate",type:"Scenario",
q:"An endpoint that accepts 200 MB file uploads and another that serves large exports both cause memory spikes and occasional OOM kills. How do you handle large request and response bodies properly?",
a:`<p><b>Uploads:</b></p>
<ul>
<li>Binding to <code>IFormFile</code> buffers the file (in memory up to 64 KB, then to a temp file on disk), and the whole multipart body is read before your code runs. For large files, <b>stream</b> instead: disable form-value model binding and read sections with <code>MultipartReader</code>, writing each to its destination (S3 multipart upload, a file stream) as it arrives.</li>
<li>Better still for cloud apps: issue a <b>pre-signed S3 URL</b> so the file never passes through the API.</li>
<li>Configure limits deliberately: Kestrel's <code>MaxRequestBodySize</code> (about 28.6 MB by default), <code>[RequestSizeLimit]</code> per endpoint, <code>FormOptions.MultipartBodyLengthLimit</code>. Validate type and size early.</li>
</ul>
<p><b>Downloads and exports:</b></p>
<ul>
<li>Don't build the whole file in a <code>MemoryStream</code> or <code>byte[]</code>, which for large data lands on the LOH.</li>
<li>Stream: <code>Results.Stream</code>/<code>File(stream, …)</code> from a file or S3 stream, or write rows to <code>Response.Body</code> as they're read (<code>IAsyncEnumerable</code> from the DB, a CSV writer flushing periodically).</li>
<li>For exports that take a long time, generate asynchronously to S3 and return a link.</li>
</ul>`,
keys:["IFormFile buffering behaviour","Streaming multipart with MultipartReader","Pre-signed URLs to bypass the API","Request size limits configured explicitly","Stream responses; avoid MemoryStream/LOH for large data"],
trade:["Streaming uploads through the API keeps control (scanning, validation) but ties up server connections; direct-to-S3 scales better but moves validation to post-processing","Streaming exports start fast but a mid-stream error can't change the already-sent status code"],
fu:[{q:"A streamed CSV export fails halfway. What does the client see, and how do you handle it?",a:"Headers and a 200 status were already sent, so the client receives a truncated file. Mitigate by writing a trailer row or checksum the client can verify, or generate the file fully to storage first (async job) when correctness matters more than immediacy."}],
rf:["Raises limits to 1 GB and binds IFormFile","Builds exports in MemoryStream","No size validation"]},

{id:"N034",skill:"ASP.NET Core",level:"Intermediate",type:"Concept",
q:"How do you design health checks for a service running on ECS or Kubernetes? What's the difference between liveness and readiness?",
a:`<p>ASP.NET Core provides <code>AddHealthChecks()</code> with checks for DB, Redis and URLs (AspNetCore.Diagnostics.HealthChecks packages), and <code>MapHealthChecks</code> endpoints filtered by tags.</p>
<ul>
<li><b>Liveness</b> ("is the process healthy, or should it be restarted?"): checks only the process itself, such as whether it responds. It must <b>not</b> check dependencies. If the database goes down and liveness fails, the orchestrator restarts every instance, which doesn't fix the DB and adds restart storms.</li>
<li><b>Readiness</b> ("should this instance receive traffic?"): it can include critical dependencies and warm-up state (caches loaded, migrations verified). A failing readiness check removes the instance from the load balancer without restarting it.</li>
<li><b>Startup</b> (Kubernetes): gives slow-starting apps time before liveness applies.</li>
</ul>
<p>On ECS, the container health check plays the liveness role (an unhealthy container is replaced), and the ALB target group health check plays the readiness role. Keep checks fast and cheap with short timeouts, and don't expose detailed health output publicly.</p>`,
keys:["Liveness excludes dependencies","Readiness gates traffic","Restart storm risk","ECS container vs ALB checks mapping","Fast, cheap, not publicly detailed"],
fu:[{q:"If all instances fail readiness because the DB is down, what happens, and is that desirable?",a:"The load balancer has no healthy targets. ALB then fails open and routes to all targets anyway; Kubernetes would serve no traffic. Often it's better for readiness to exclude shared dependencies, or for the app to serve degraded responses, so a dependency outage doesn't remove the whole fleet."}],
rf:["Liveness pings the database","One /health endpoint for everything","Health endpoint returning connection strings or stack traces publicly"]},

{id:"N035",skill:"ASP.NET Core",level:"Intermediate",type:"Architecture",
q:"How do you structure a .NET Web API codebase: Clean Architecture layers, vertical slices, or something else? Where does MediatR fit?",
a:`<p><b>Clean / onion architecture:</b> projects for Domain, Application, Infrastructure and API, with dependencies pointing inward. It gives a clear separation and a testable core, but small features touch four projects, and it often produces thin pass-through layers and interfaces with one implementation.</p>
<p><b>Vertical slices:</b> organise by feature. Each feature (for example <code>Orders/CreateOrder</code>) contains its endpoint, request and response, validation, handler and data access. Changes stay local, and shared code is extracted only when really shared. A domain project can still hold rich entities and invariants.</p>
<p><b>MediatR</b> is often used to dispatch requests to handlers and add cross-cutting behaviour through pipeline behaviours (validation, logging, transactions). It's convenient, but it adds indirection (harder navigation from endpoint to handler), and since 2025 it's commercially licensed for many organisations. Minimal API endpoint filters or direct handler injection can do the same job.</p>
<p>My usual choice: a feature-folder or vertical-slice API over a small domain core, with Infrastructure separated where it adds real value (external integrations). Consistency across the team matters more than the label.</p>`,
keys:["Honest trade-offs of layered architecture","Vertical slices: locality of change","MediatR role, cost, and licensing change","Alternatives to MediatR","Pragmatic hybrid, consistency"],
trade:["Layered: strong separation, more ceremony and indirection","Slices: fast feature work, risk of duplicated logic without discipline","It depends on: domain complexity, team size, existing conventions"],
fu:[{q:"Do you need an interface for every service to make it testable?",a:"No. Interfaces earn their place at boundaries you want to swap or fake (external APIs, clock, messaging). Internal services with one implementation can be tested directly or through integration tests; interfaces for everything add noise."}],
rf:["Insists one architecture is always right","Can't name downsides of their preferred style","Unaware of MediatR's licence change"],
verify:"MediatR licensing terms (free-tier thresholds) — check current terms before quoting."},

{id:"N036",skill:"ASP.NET Core",level:"Intermediate",type:"Scenario",
q:"Logs cost a lot, are hard to search, and a security review found customer emails and tokens in them. How do you fix logging in a .NET service?",
a:`<ul>
<li><b>Structured logging</b> with message templates, not string interpolation: <code>logger.LogInformation("Order {OrderId} placed by {UserId}", id, userId)</code>. Properties become searchable fields in CloudWatch Logs Insights, OpenSearch or Seq, and the message isn't formatted when the level is disabled. The <code>[LoggerMessage]</code> source generator (.NET 6+) makes hot-path logging allocation-free.</li>
<li><b>Levels by category:</b> Information for business events, Debug for detail (off in production), and overrides that quiet noisy categories (<code>Microsoft.AspNetCore</code>, <code>Microsoft.EntityFrameworkCore.Database.Command</code>) via configuration, changeable without redeploying.</li>
<li><b>Sensitive data:</b> never log raw request bodies, headers like <code>Authorization</code>, or whole entities. Use .NET 8's redaction support (<code>Microsoft.Extensions.Compliance.Redaction</code>) to classify and redact fields, or log only IDs. Make sure EF's <code>EnableSensitiveDataLogging</code> is off outside development.</li>
<li><b>Correlation:</b> include trace and span IDs (OpenTelemetry), so logs join up with traces.</li>
<li><b>Cost:</b> set retention per log group, sample high-volume success logs, and keep errors at 100%.</li>
</ul>
<p>Finally, rotate any credentials that appeared in logs, and purge or restrict the affected log data.</p>`,
keys:["Message templates over interpolation","LoggerMessage source generator","Category level overrides via config","Redaction / no sensitive payloads; EF sensitive logging off","Trace correlation, retention and sampling; rotate leaked secrets"],
trade:["Sampling cuts cost but may drop the one log you need; never sample errors","Logging full payloads helps debugging but creates a sensitive data store"],
fu:[{q:"Why is $\"Order {id}\" in a log call worse than a template?",a:"Interpolation builds the string even when the level is disabled, and it loses structure: the log stores one string instead of a searchable OrderId property. Analyzers (CA2254) flag it."}],
rf:["Logs whole request bodies","Uses string interpolation in all log calls","Doesn't rotate leaked secrets"]},

{id:"N037",skill:"EF Core",level:"Intermediate",type:"Scenario",
q:"An import job inserts 200,000 rows with EF Core and takes 20 minutes. How do you make it fast?",
a:`<p>First find where the time goes. Usually it's the change tracker growing with every entity (DetectChanges gets slower as more entities are tracked), plus many round trips.</p>
<ul>
<li><b>Batch and chunk:</b> add in chunks (for example 2,000), call <code>SaveChanges</code>, then <code>ChangeTracker.Clear()</code> (or use a new context per chunk) so tracking doesn't grow without bound. EF Core already batches statements per <code>SaveChanges</code>.</li>
<li><b>Reduce tracking work:</b> disable <code>AutoDetectChangesEnabled</code> during bulk adds.</li>
<li><b>Use the database's bulk path</b> for large volumes: <code>SqlBulkCopy</code> on SQL Server, or Npgsql's binary <code>COPY</code> import on PostgreSQL. These are often 10–100× faster than row-by-row inserts. Libraries such as EFCore.BulkExtensions wrap them (check their licence).</li>
<li><b>Load into a staging table</b> with bulk copy, then MERGE or upsert into the target with one set-based SQL statement, which handles duplicates and updates efficiently.</li>
<li>Consider indexes and triggers on the target during the load, and run the job off-peak.</li>
</ul>`,
keys:["Change tracker growth as root cause","Chunking with ChangeTracker.Clear","SqlBulkCopy / COPY for volume","Staging table + set-based merge","Indexes/triggers/timing awareness"],
trade:["Bulk copy is fastest but bypasses EF conventions (value converters, interceptors, generated values); map carefully","Staging + MERGE adds steps but gives correct upsert semantics","Chunk size balances memory against round trips; measure"],
fu:[{q:"How do you make the import idempotent if it fails at row 120,000?",a:"Load into a staging table keyed by a batch ID and source row ID, then merge with an upsert keyed on the natural key, so rerunning the whole batch converges to the same result. Track batch status so a rerun knows where it stands."}],
rf:["One SaveChanges per row","One SaveChanges for all 200k with tracking","Doesn't know SqlBulkCopy/COPY"]},

{id:"N038",skill:"EF Core",level:"Intermediate",type:"Concept",
q:"How do you map value objects like Money or Address in EF Core? Compare owned types, complex types, value converters and JSON columns.",
a:`<ul>
<li><b>Value converters</b> map a single-value type to one column, for example a strongly typed <code>OrderId</code> to a Guid, or an enum to a string. Simple and efficient for one-column value objects.</li>
<li><b>Owned types</b> (<code>OwnsOne</code>/<code>OwnsMany</code>) map a multi-property object (Address) to columns in the owner's table, or to a separate table for collections. They're tracked as entities with a hidden key, which causes surprises: identity semantics, and limits on sharing instances between owners.</li>
<li><b>Complex types</b> (EF Core 8, <code>ComplexProperty</code>) are true value semantics. No key or identity, so the same Address instance can be assigned to several properties, and they map to columns in the owner's table. Better than owned types for value objects. Early versions didn't support collections or optional complex types; check the current version.</li>
<li><b>JSON columns</b> (EF Core 7+, <code>ToJson()</code> on owned types) store nested data in one JSON column, queryable in LINQ. Good for variable nested data, but querying and indexing inside JSON is weaker than columns.</li>
</ul>`,
keys:["Converters for single-value types","Owned types have hidden identity","Complex types (EF 8) for real value semantics","JSON column mapping trade-offs","Version awareness"],
fu:[{q:"How would you store Money with currency?",a:"As a complex type (or owned type on older EF) mapping Amount (decimal with explicit precision) and Currency (char(3)) to two columns. Never as a float, and never without the currency."}],
rf:["Stores money as float/double","Unaware owned types have identity","Serialises value objects into strings manually everywhere"],
verify:"Complex type support for collections and optional instances has expanded in newer EF Core releases; check your version."},

{id:"N039",skill:"EF Core",level:"Intermediate",type:"Concept",
q:"How do global query filters work in EF Core, and what are the pitfalls when using them for soft delete or multi-tenancy?",
a:`<p><code>modelBuilder.Entity&lt;Order&gt;().HasQueryFilter(o =&gt; !o.IsDeleted &amp;&amp; o.TenantId == _tenantId)</code> appends that predicate to every query for that entity type, including through navigations and <code>Include</code>. The tenant value can come from a field on the <code>DbContext</code> set per request.</p>
<p><b>Pitfalls:</b></p>
<ul>
<li><b>Bypassed by raw SQL and set-based operations</b> in places you might not expect. Review <code>FromSql</code> queries and stored procedures separately.</li>
<li><b><code>IgnoreQueryFilters()</code></b> removes <i>all</i> filters on the query in older versions. An admin "show deleted" query also drops the tenant filter, which is a cross-tenant leak risk. EF Core 10 added named filters that can be disabled individually.</li>
<li><b>Required navigations to filtered entities</b> can make parents disappear (inner join semantics) or produce inconsistent results.</li>
<li><b>DbContext pooling:</b> the tenant value must be reset per request, or a pooled context carries the previous tenant.</li>
<li><b>Indexes:</b> add <code>IsDeleted</code>/<code>TenantId</code> to indexes, or use filtered indexes, or every query gets slower.</li>
</ul>
<p>For tenant isolation, back the filter with database enforcement (PostgreSQL row-level security), since a single missed path leaks data.</p>`,
keys:["Automatic predicate on all queries/navigations","IgnoreQueryFilters removes all (version-dependent named filters)","Raw SQL bypass","Pooling + tenant state reset","Indexes and DB-level enforcement"],
fu:[{q:"With soft delete, how do you handle a unique index on Email when a deleted user's email is reused?",a:"Use a filtered unique index that only covers non-deleted rows (WHERE IsDeleted = 0 in SQL Server, a partial index in PostgreSQL), so the deleted row doesn't block the new one."}],
rf:["Uses IgnoreQueryFilters in tenant apps casually","Relies only on query filters for tenant isolation","No index consideration"],
verify:"Named/multiple query filters per entity arrived in EF Core 10; confirm the API for your version."},

{id:"N040",skill:"EF Core",level:"Intermediate",type:"Scenario",
q:"A security review flags context.Orders.FromSqlRaw($\"SELECT * FROM Orders WHERE CustomerName = '{name}'\"). Explain the risk and the correct ways to run raw SQL in EF Core.",
a:`<p>That's <b>SQL injection</b>. The interpolated string is built <i>before</i> EF sees it, so <code>FromSqlRaw</code> receives a plain string containing user input. A name like <code>' OR 1=1; --</code> changes the query.</p>
<p><b>Correct options:</b></p>
<ul>
<li><b><code>FromSql($"…{name}")</code></b> (EF Core 7+; <code>FromSqlInterpolated</code> earlier) takes a <code>FormattableString</code> and turns each interpolated value into a <b>parameter</b>. The same syntax is safe here because the method's parameter type is different.</li>
<li><b><code>FromSqlRaw</code> with explicit parameters:</b> <code>FromSqlRaw("… WHERE CustomerName = {0}", name)</code> or <code>SqlParameter</code> objects. Only use string concatenation for values you fully control, such as whitelisted column names for sorting.</li>
<li><b><code>SqlQuery&lt;T&gt;</code></b> (scalars in EF 7, unmapped types in EF 8) for results that aren't entities.</li>
<li><code>ExecuteSql($"…")</code> for non-query commands, also parameterised.</li>
</ul>
<p>Add an analyzer rule or code-review check for <code>FromSqlRaw</code> and <code>ExecuteSqlRaw</code> with interpolated arguments. Ask also why raw SQL is needed: often LINQ can express it.</p>`,
keys:["Explains why interpolation into FromSqlRaw is unsafe","FromSql/FromSqlInterpolated parameterise","Explicit parameters with FromSqlRaw","SqlQuery for unmapped results","Prevent via analyzers/review"],
fu:[{q:"How do you safely support a dynamic ORDER BY column from a query parameter?",a:"Column names can't be parameters. Map the allowed values to known columns with a whitelist (switch or dictionary from \"price\" to the column or LINQ expression), and reject anything else. Never put the raw input into SQL."}],
rf:["Thinks EF always protects against injection","Escapes quotes manually","Puts user input in ORDER BY"]},

{id:"N041",skill:"EF Core",level:"Intermediate",type:"Architecture",
q:"Should you wrap EF Core in a repository pattern? Defend your position.",
a:`<p><code>DbContext</code> already is a unit of work, and each <code>DbSet</code> is effectively a repository. A <b>generic repository</b> (<code>IRepository&lt;T&gt;</code> with <code>GetAll</code>, <code>Find</code>, <code>Add</code>) on top usually <b>hides</b> EF's best features (projections, <code>Include</code>, no-tracking, compiled queries) or leaks <code>IQueryable</code> anyway, and adds a layer with no real abstraction.</p>
<p>When a repository earns its place:</p>
<ul>
<li><b>DDD aggregates:</b> an <code>IOrderRepository</code> with <code>GetAsync(id)</code> that always loads the full aggregate and <code>Add</code>. It enforces aggregate boundaries and keeps the domain free of EF.</li>
<li><b>Several data stores</b> behind one interface, or a real chance of swapping the store for one part of the model.</li>
<li>Query logic reused by many callers, kept in one place.</li>
</ul>
<p>For read-heavy query endpoints, use the <code>DbContext</code> directly in the handler with projections. For tests, use a real database in integration tests rather than mocking repositories.</p>`,
keys:["DbContext already unit of work/repository","Generic repository anti-pattern reasons","Aggregate repositories in DDD as a valid use","Direct DbContext + projections for queries","Testing via real DB"],
trade:["Repositories add explicit boundaries and domain isolation at the cost of indirection and lost EF features","Direct DbContext is simpler and more powerful but couples handlers to EF","It depends on: domain complexity, number of data stores, team conventions"],
fu:[{q:"'Repositories let us swap EF for Dapper later.' How do you respond?",a:"In practice this swap is rare, and leaky abstractions make it expensive anyway. If performance-critical queries need Dapper, add them alongside EF for those paths. That's a smaller and more honest change than designing every data access around a hypothetical replacement."}],
rf:["Generic repository returning IQueryable","Repositories mainly so DbContext can be mocked","Dogmatic either way without trade-offs"]},

{id:"N042",skill:"ADO.NET & Dapper",level:"Intermediate",type:"Architecture",
q:"EF Core or Dapper? Would you use both in one service, and how?",
a:`<p><b>EF Core:</b> change tracking, migrations, LINQ, relationships, and a unit of work. It's productive for domain writes and most queries. <b>Dapper:</b> a thin mapper over SQL you write yourself. Full control of SQL and minimal overhead, good for complex reporting queries, stored-procedure-heavy databases and hot read paths.</p>
<p>Using <b>both</b> is common and reasonable: EF Core for commands and domain persistence, Dapper for read models or heavy queries. Done well:</p>
<ul>
<li>Share the connection when they must be in one transaction: get <code>db.Database.GetDbConnection()</code>, and pass <code>db.Database.CurrentTransaction.GetDbTransaction()</code> to Dapper.</li>
<li>Keep Dapper SQL in one place per feature, parameterised, with integration tests against the real schema, since there's no compile-time check against the model.</li>
<li>Be aware that Dapper reads won't see EF's unsaved tracked changes.</li>
</ul>
<p>Since EF Core 7 and 8 (<code>ExecuteUpdate</code>, <code>SqlQuery</code> for unmapped types, compiled models), the gap is smaller, so I add Dapper when a measured need appears rather than by default.</p>`,
keys:["Strengths of each","Mixing them is legitimate","Sharing connection/transaction","Testing raw SQL against real schema","Narrowing gap in recent EF versions"],
trade:["Dapper: control and speed, more SQL to maintain and no tracking","EF: productivity and safety, occasionally sub-optimal SQL","It depends on: query complexity, performance needs, team SQL skills"],
fu:[{q:"Your Dapper query and an EF SaveChanges must be atomic. Show the approach.",a:"Begin the transaction through EF (await using var tx = await db.Database.BeginTransactionAsync()), run Dapper with connection db.Database.GetDbConnection() and transaction tx.GetDbTransaction(), call SaveChangesAsync, then commit. Wrap it in the execution strategy if retries are enabled."}],
rf:["Opens a separate connection for Dapper inside an EF transaction and expects atomicity","\"Dapper is always faster, so never use EF\"","No tests for raw SQL"]},

{id:"N043",skill:"ADO.NET & Dapper",level:"Intermediate",type:"Scenario",
q:"A Dapper query joins Orders and OrderLines with multi-mapping. The API returns each order several times, once per line, each with a single line. Fix it, and compare the alternatives.",
a:`<p>A join returns one row per order-line combination. Dapper's multi-mapping calls your map function once per row, creating a new <code>Order</code> each time unless you <b>deduplicate</b>.</p>
<pre><code>var lookup = new Dictionary&lt;int, Order&gt;();
await conn.QueryAsync&lt;Order, OrderLine, Order&gt;(sql,
    (o, line) =&gt;
    {
        if (!lookup.TryGetValue(o.Id, out var order))
            lookup.Add(o.Id, order = o);
        order.Lines.Add(line);
        return order;
    },
    new { customerId }, splitOn: "LineId");
return lookup.Values;</code></pre>
<p><code>splitOn</code> must name the first column of the second object; it defaults to <code>Id</code>, a common source of bugs.</p>
<p><b>Alternative:</b> <code>QueryMultipleAsync</code> with two SELECTs (orders, then lines for those orders), stitched in memory. It avoids repeating order columns on every row (less data with wide parents or many lines) and avoids join explosion when there are several child collections.</p>`,
keys:["Explains row multiplication from joins","Dictionary-based dedupe","splitOn default pitfall","QueryMultiple as alternative and when it's better"],
trade:["Single join: one round trip, duplicated parent data per row","QueryMultiple: no duplication and no cartesian growth with several children, slightly more code"],
fu:[{q:"Two child collections (lines and payments) in one join: what goes wrong?",a:"A cartesian product. Rows are lines × payments per order, and both collections get duplicates unless you dedupe each child too. Use QueryMultiple, or separate queries."}],
rf:["Calls a query per order for lines (N+1)","Doesn't know splitOn","Uses DISTINCT to 'fix' duplicates"]},

{id:"N044",skill:"ADO.NET & Dapper",level:"Intermediate",type:"Scenario",
q:"An endpoint filters by a list of IDs using Dapper: WHERE Id IN @ids. With 3,000 IDs on SQL Server it fails, and with 500 it's slow and pollutes the plan cache. What are your options?",
a:`<p>Dapper expands <code>IN @ids</code> into one parameter per item. SQL Server allows at most <b>2,100 parameters</b> per command, so large lists fail. Every different list length is also a different query text, so you get a new cached plan per count, which bloats the plan cache and wastes compilations.</p>
<p><b>Options on SQL Server:</b></p>
<ul>
<li><b>Table-valued parameter:</b> define a table type (<code>CREATE TYPE IdList AS TABLE (Id int PRIMARY KEY)</code>) and pass a DataTable via <code>.AsTableValuedParameter("dbo.IdList")</code>, then join to it. One parameter and a stable plan.</li>
<li><b>JSON or a delimited string:</b> pass one parameter and use <code>OPENJSON(@ids)</code> or <code>STRING_SPLIT</code>. Simple, but cardinality estimates can be poor.</li>
<li><b>Temp or staging table</b> bulk-loaded for very large sets, then joined.</li>
</ul>
<p><b>On PostgreSQL:</b> pass an array and use <code>WHERE id = ANY(@ids)</code>. One parameter, no limit issue.</p>
<p>Also ask why the client sends 3,000 IDs. Often the filter belongs server-side ("orders for this customer").</p>`,
keys:["2,100 parameter limit","Plan cache pollution from varying lists","TVP / OPENJSON / temp table on SQL Server","= ANY(@array) on PostgreSQL","Questions the API design"],
trade:["TVPs give stable plans and good performance but need a schema type","JSON/STRING_SPLIT is easy but can mis-estimate row counts","Temp tables scale furthest but cost an extra step"],
fu:[{q:"EF Core has the same issue with Contains on a list. What did EF Core 8 change?",a:"EF Core 8 translates Contains over a parameter list into a single JSON parameter with OPENJSON on SQL Server (and arrays on PostgreSQL), which avoids parameter explosion and plan-cache pollution, at the cost of cardinality estimates that sometimes needed tuning. Later versions added options to control the translation."}],
rf:["Concatenates IDs into the SQL string","Batches into 2,000-ID chunks without questioning the design","Unaware of plan cache impact"],
verify:"EF Core's Contains translation strategy and configuration options changed across EF 8–10; confirm for your version."},

{id:"N045",skill:"Testing (xUnit/Moq)",level:"Intermediate",type:"Concept",
q:"How do xUnit fixtures and test parallelism work, and how do you share expensive setup safely?",
a:`<p>xUnit creates a <b>new instance of the test class for every test</b>, so constructor setup runs per test and instance fields aren't shared. To share expensive setup:</p>
<ul>
<li><b><code>IClassFixture&lt;T&gt;</code>:</b> one fixture instance shared by all tests in a class (for example a <code>WebApplicationFactory</code>).</li>
<li><b><code>ICollectionFixture&lt;T&gt;</code></b> with <code>[CollectionDefinition]</code>: one fixture shared across classes in the same collection (for example a database container).</li>
<li><b><code>IAsyncLifetime</code></b> for async setup and teardown (starting containers, seeding).</li>
</ul>
<p><b>Parallelism:</b> by default, different test collections run in parallel, while tests within one collection run sequentially. Each class is its own collection unless grouped. Tests sharing mutable state (one database) must either be in the same collection or isolate their data (unique IDs per test, a database reset between tests).</p>
<p>Shared fixtures must be safe for the tests that use them. Never let one test's leftover data be another test's assumption.</p>`,
keys:["New class instance per test","Class vs collection fixtures","IAsyncLifetime for async setup","Parallelism between collections, not within","Data isolation with shared resources"],
fu:[{q:"Integration tests pass alone but fail when the whole suite runs. First suspect?",a:"Shared state across parallel collections: two test classes using the same database or static state at the same time. Put them in one collection, or isolate data per test."}],
rf:["Static fields for shared state","Thinks constructor runs once per class","Doesn't know collections drive parallelism"],
verify:"xUnit v3 changed some fixture and lifetime APIs; check which major version your projects use."},

{id:"N046",skill:"Testing (xUnit/Moq)",level:"Intermediate",type:"Scenario",
q:"The integration test suite uses Testcontainers for SQL Server and now takes 14 minutes in CI. Developers have stopped running it locally. How do you make it fast again?",
a:`<p>Profile first: where's the time? Container start-up, migrations, per-test setup, or slow tests?</p>
<ul>
<li><b>Start containers once per run</b>, not per test class: a collection fixture or assembly-level fixture. Container start-up (especially SQL Server) is the biggest fixed cost.</li>
<li><b>Apply migrations once</b>, then reset data between tests instead of recreating the database. The Respawn library deletes data in dependency order quickly. Alternatively, wrap each test in a transaction and roll back, when the code under test doesn't manage its own transactions.</li>
<li><b>Parallelise safely:</b> run several collections at once, each with its own database (one container, several databases) so they don't interfere.</li>
<li><b>Fix slow tests:</b> remove fixed delays, reduce seeded data to what each test needs, reuse <code>WebApplicationFactory</code> per collection.</li>
<li><b>Balance the pyramid:</b> logic that doesn't need a database moves to unit tests, and integration tests focus on wiring, queries and contracts.</li>
<li>In CI, cache container images and split tests across parallel jobs.</li>
</ul>`,
keys:["Measure where time goes","Shared container per run; migrations once","Respawn or rollback for resets","Parallel collections with separate databases","Rebalance unit vs integration"],
trade:["Transaction rollback is fastest but doesn't test commit behaviour and fails with code that opens its own transactions","Respawn is robust but slower than rollback; still far faster than recreating databases"],
fu:[{q:"Could you use SQLite to speed things up instead?",a:"You could, but it isn't SQL Server: different SQL dialect, types, collations and locking. Tests may pass on SQLite and fail in production. Faster tests that test the wrong thing aren't a good trade for data-access code."}],
rf:["Disables integration tests in CI","Switches to EF in-memory provider","New container per test"]},

{id:"N047",skill:"Testing (xUnit/Moq)",level:"Intermediate",type:"Concept",
q:"How do you test code that calls an external HTTP API, including errors and timeouts?",
a:`<ul>
<li><b>Unit level:</b> put the API behind a typed client interface you own (<code>IPaymentsClient</code>) and fake it in service tests. To test the client class itself (serialisation, headers, error mapping), give <code>HttpClient</code> a fake <code>HttpMessageHandler</code> that returns canned responses: success, 4xx, 5xx, malformed JSON, and delays that trigger timeouts.</li>
<li><b>Integration level:</b> run a stub HTTP server such as <b>WireMock.Net</b> and point the configured base URL at it. This exercises the real <code>HttpClient</code> pipeline: resilience handlers, timeouts, retries, auth handlers. Verify, for example, that retries happen on 503 but not on 400.</li>
<li><b>Contract level:</b> if the provider is internal, consumer-driven contract tests (Pact) ensure your expectations match their API. For external vendors, run a small scheduled suite against their sandbox to catch changes.</li>
</ul>
<p>Don't mock <code>HttpClient</code> itself (it isn't an interface), and don't call real third-party production APIs from CI.</p>`,
keys:["Typed client interface for consumers","Fake HttpMessageHandler for client tests","WireMock.Net to exercise real pipeline incl. resilience","Contract tests / vendor sandbox checks","Error and timeout cases tested explicitly"],
fu:[{q:"How do you test that your timeout and retry policy actually work?",a:"With WireMock.Net, configure the stub to delay longer than the attempt timeout, or to return 503 twice and then 200. Assert on the total attempts and the outcome. Use short timeouts in test config so the suite stays fast."}],
rf:["Calls the real vendor API in tests","Only tests the happy path","Mocks HttpClient via reflection hacks"]},

{id:"N048",skill:".NET Performance & Diagnostics",level:"Intermediate",type:"Scenario",
q:"A .NET service on ECS runs at 85% CPU at modest traffic after a release. How do you find the hot code path in production without guessing?",
a:`<ol>
<li><b>Confirm with counters:</b> <code>dotnet-counters monitor</code> for CPU, GC rate and % time in GC, allocation rate, exception count, thread pool queue length. High % time in GC points to allocation pressure. A high exception rate points to exceptions used as control flow. Otherwise it's compute.</li>
<li><b>Capture a CPU trace:</b> <code>dotnet-trace collect --process-id &lt;pid&gt; --profile cpu-sampling</code> for 30–60 seconds under load, then open it in PerfView, Visual Studio or speedscope (<code>--format speedscope</code>). Look at the hottest stacks.</li>
<li><b>In containers:</b> the diagnostic tools need access to the process's diagnostics port. Options include installing the global tools in a debug image, running <b>dotnet-monitor</b> as a sidecar that exposes traces and dumps over HTTP, or using a continuous profiler (Datadog, Pyroscope, or similar).</li>
<li><b>Compare with the previous release:</b> diff the traces, and check what changed (a regex built per request, serialisation settings recreated per call, a LINQ-heavy loop, logging at a verbose level).</li>
</ol>`,
keys:["Counters first to classify (GC vs exceptions vs compute)","dotnet-trace CPU sampling and viewers","Container access: dotnet-monitor sidecar or continuous profiling","Compare releases, common culprits"],
trade:["Tracing in production adds some overhead; keep sessions short","Continuous profiling costs money but makes regressions visible immediately"],
fu:[{q:"What are common hidden CPU sinks in ASP.NET Core apps?",a:"Regex objects created per request instead of static or source-generated (RegexGenerator in .NET 7+), JsonSerializerOptions created per call (it caches metadata, so reuse it), exceptions thrown on normal paths, excessive logging at Debug level, and synchronous LINQ over large in-memory collections."}],
rf:["Scales up instances without investigating","Reads code looking for 'slow parts'","Doesn't know dotnet-trace / counters"]},

{id:"N049",skill:".NET Performance & Diagnostics",level:"Intermediate",type:"Concept",
q:"How do you benchmark two implementations correctly in .NET, and why isn't a Stopwatch loop good enough?",
a:`<p>A Stopwatch loop is misleading because of JIT warm-up and tiered compilation (first calls run unoptimised code), dynamic PGO changing code as it runs, the compiler or JIT eliminating work whose result isn't used, GC happening at random points, Debug builds, and noise from other processes. You also only get one number, with no variance.</p>
<p><b>BenchmarkDotNet</b> handles this: it runs in Release in separate processes, does warm-up and pilot runs to choose iteration counts, runs many iterations, and reports mean, error and standard deviation. <code>[MemoryDiagnoser]</code> reports allocations per operation. Benchmarks return results so work isn't eliminated, and you can compare runtimes (.NET 8 vs 9) with job attributes.</p>
<pre><code>[MemoryDiagnoser]
public class ParseBench
{
    private readonly string _csv = File.ReadAllText("sample.csv");
    [Benchmark(Baseline = true)] public int Split() =&gt; _csv.Split(',').Length;
    [Benchmark] public int Span() =&gt; CountWithSpan(_csv);
}</code></pre>
<p>Micro-benchmarks show relative cost. Confirm real impact with a load test or profiling of the actual service.</p>`,
keys:["JIT/tiering/PGO, dead code, GC, Debug builds","BenchmarkDotNet methodology","MemoryDiagnoser for allocations","Return values to avoid elimination","Micro vs end-to-end validation"],
fu:[{q:"Your benchmark shows the new method is 3× faster, but the endpoint latency didn't change. Why?",a:"That code wasn't on the critical path, or its share of request time was tiny compared to I/O (database, network). Profile the real request to see where time goes before optimising."}],
rf:["Benchmarks in Debug mode","Single Stopwatch run as proof","Optimises without profiling the real path"]},

{id:"N050",skill:".NET Performance & Diagnostics",level:"Intermediate",type:"Scenario",
q:"You're migrating an API from Newtonsoft.Json to System.Text.Json for performance. After the switch, some clients break. What differences usually cause this, and how do you migrate safely?",
a:`<p>Common behavioural differences:</p>
<ul>
<li><b>Case sensitivity:</b> STJ is case-sensitive by default, although ASP.NET Core's web defaults make it case-insensitive with camelCase naming. Custom <code>JsonSerializerOptions</code> outside ASP.NET often lose this.</li>
<li><b>Enums:</b> serialised as numbers unless <code>JsonStringEnumConverter</code> is configured.</li>
<li><b>Reference loops:</b> Newtonsoft's <code>ReferenceLoopHandling.Ignore</code> vs STJ throwing, unless you set <code>ReferenceHandler.IgnoreCycles</code> (.NET 6+). Better: return DTOs, not entities.</li>
<li><b>Polymorphism:</b> Newtonsoft's <code>TypeNameHandling</code> vs STJ's <code>[JsonDerivedType]</code> (.NET 7+). TypeNameHandling is also a known security risk.</li>
<li><b>Numbers as strings, comments and trailing commas</b> are rejected by default (configurable).</li>
<li><b>Constructors and private setters</b> need <code>[JsonConstructor]</code> or <code>[JsonInclude]</code>.</li>
<li><b>Dates, dictionaries with non-string keys, and custom converters</b> need rewriting.</li>
</ul>
<p><b>Safe migration:</b> capture real request and response samples from production, write golden-file tests that compare old and new serialisation output, configure options to match the old contract, and migrate endpoint by endpoint if needed. For hot paths, add the STJ <b>source generator</b> (<code>JsonSerializerContext</code>) to avoid reflection and enable AOT.</p>`,
keys:["Case sensitivity and naming defaults","Enum, reference loops, polymorphism differences","Constructor/private setter handling","Golden-file comparison tests from real payloads","Source generation for hot paths"],
trade:["STJ is faster and lower-allocation but stricter; matching Newtonsoft behaviour fully may need custom converters","Keeping Newtonsoft for some endpoints is a valid interim state"],
fu:[{q:"Why is Newtonsoft's TypeNameHandling.All dangerous?",a:"It lets the payload choose which .NET type to instantiate, which enables deserialisation gadget attacks (remote code execution) if untrusted input is accepted. STJ's polymorphism only allows explicitly declared derived types."}],
rf:["Swaps the library with no contract tests","Unaware of enum and case differences","Serialises EF entities directly"]},
