<script>
const LEVELS=["Basic","Intermediate","Advanced","Lead"];
const TYPES=["Concept","Scenario","Architecture","Behavioral"];
const PARTS="Complete: all 4 parts loaded.";

const QS=[

/* ================= BASIC ================= */
{id:"N001",skill:"C# & Runtime",level:"Basic",type:"Concept",
q:"Explain value types vs reference types in C#. Is it true that value types live on the stack and reference types on the heap?",
a:`<p>A <b>value type</b> (struct, enum, primitives) holds its data directly; assignment and parameter passing <b>copy</b> the value. A <b>reference type</b> (class, string, array, delegate) holds a reference to an object; assignment copies the reference, so two variables can point to the same object.</p>
<p>"Value types live on the stack" is a simplification that's often wrong. Where a value lives depends on its <i>container</i>: a local <code>int</code> is usually on the stack (or in a register), but an <code>int</code> field of a class lives on the heap inside that object, and locals captured by a lambda or used across an <code>await</code> are hoisted into heap-allocated closures or state machines. The real semantic difference is copy vs reference, plus <b>boxing</b>: converting a value type to <code>object</code> or an interface allocates a heap copy.</p>`,
keys:["Copy semantics vs reference semantics","Storage depends on context, not the type alone","Captured locals and async hoisting","Boxing allocates and copies"],
fu:[{q:"Why should mutable structs be avoided?",a:"Because copies are made silently (reading a struct from a property, a list indexer or a readonly field gives you a copy), so a mutation may change a temporary copy instead of the original. Prefer readonly structs and make changes by creating new values."},
{q:"When would you choose a struct?",a:"Small (roughly 16 bytes or less), immutable, value-like data that is created in large numbers, such as coordinates or money amounts, where avoiding heap allocations matters. For anything larger or with identity, use a class or record."}],
rf:["\"Value types always go on the stack\" stated as fact","Doesn't know what boxing is","Thinks string is a value type because it behaves immutably"]},

{id:"N002",skill:"C# & Runtime",level:"Basic",type:"Concept",
q:"What actually happens when you await an I/O call such as a database query? Does async create a new thread?",
a:`<p>No. <code>async</code>/<code>await</code> does not create threads. The compiler rewrites the method into a state machine. When execution reaches an <code>await</code> on a task that isn't complete, the method registers a continuation and <b>returns to its caller</b>, so the thread goes back to the pool to do other work. For true I/O (sockets, files), no thread is blocked waiting: the OS signals completion, and a thread-pool thread then runs the continuation from where the method left off.</p>
<p>That's why async improves <b>scalability</b> in a web server (fewer threads tied up waiting), not the speed of a single request. CPU-bound work is different: <code>Task.Run</code> does use a thread-pool thread, and wrapping CPU work in <code>Task.Run</code> inside ASP.NET Core usually just moves the work to another thread without benefit.</p>`,
keys:["No thread per await","State machine + continuation","Thread returns to pool during I/O","Scalability, not per-request speed","Task.Run for CPU work, rarely in ASP.NET Core"],
fu:[{q:"If the awaited task is already complete, what happens?",a:"The state machine checks IsCompleted and continues synchronously on the same thread, with no continuation scheduling. That's why cached or already-completed results are cheap to await, and why ValueTask exists for hot paths that often complete synchronously."}],
rf:["\"Async runs the method on a background thread\"","Uses Task.Run around I/O calls to 'make them async'"]},

{id:"N003",skill:"C# & Runtime",level:"Basic",type:"Concept",
q:"Explain IEnumerable vs IQueryable vs List, and what deferred execution means.",
a:`<p><b>List&lt;T&gt;</b> is a materialised, in-memory collection. <b>IEnumerable&lt;T&gt;</b> is a sequence you can iterate; LINQ operators on it run as C# delegates in memory. <b>IQueryable&lt;T&gt;</b> builds an <b>expression tree</b> that a provider (such as EF Core) translates into another language like SQL and executes at the source.</p>
<p><b>Deferred execution:</b> most LINQ operators don't run when called; they run when the sequence is enumerated (<code>foreach</code>, <code>ToList()</code>, <code>Count()</code>, <code>First()</code>). Consequences:</p>
<ul>
<li>Enumerating an <code>IQueryable</code> twice runs the query twice; enumerating an expensive <code>IEnumerable</code> pipeline twice repeats the work.</li>
<li>Calling <code>AsEnumerable()</code> or <code>ToList()</code> too early means later filters run in memory after loading everything.</li>
<li>Captured variables are read at enumeration time, not at definition time.</li>
</ul>`,
keys:["Expression trees vs delegates","Where the filter executes (DB vs memory)","Deferred execution and multiple enumeration","Early materialisation pulls too much data"],
fu:[{q:"A repository returns IEnumerable<Order> from an EF query, and the caller adds .Where(o => o.Total > 100). What runs in SQL?",a:"If the repository returned the EF query typed as IEnumerable, the caller's Where runs in memory: EF executes the query without that filter and loads every row, then filters in C#. Return IQueryable intentionally, or apply filters inside the repository."}],
rf:["Thinks IEnumerable and IQueryable differ only in name","Doesn't know about multiple enumeration","Calls ToList() at the start of every query"]},

{id:"N004",skill:"C# & Runtime",level:"Basic",type:"Concept",
q:"Records, classes and structs: what are the differences, and when do you use records?",
a:`<ul>
<li><b>class:</b> reference type with reference equality by default.</li>
<li><b>record</b> (C# 9, a <code>record class</code>): still a reference type, but the compiler generates <b>value-based equality</b> (two records with equal properties are equal), a readable <code>ToString</code>, deconstruction, and <code>with</code> expressions for non-destructive copies. Positional records give concise immutable types.</li>
<li><b>struct:</b> value type, copied on assignment.</li>
<li><b>record struct</b> (C# 10): a value type with the record conveniences.</li>
</ul>
<p>I use records for <b>immutable data carriers</b>: DTOs, commands, events and value objects, where equality by content is what you want. I avoid them for EF Core entities, which have identity and are tracked and mutated; value equality on an entity breaks the change tracker's identity assumptions and collections.</p>`,
keys:["Records are reference types (unless record struct)","Generated value equality and with-expressions","Good for DTOs, events, value objects","Not for EF entities"],
fu:[{q:"Is a record with a List<string> property deeply immutable and value-equal?",a:"No. Equality compares the list reference, not its contents, so two records with lists of identical contents are not equal. And the list itself can still be mutated. Use immutable collections and custom equality if you need that."}],
rf:["Thinks records are value types","Uses records as EF entities","Assumes record equality is deep"]},

{id:"N005",skill:"C# & Runtime",level:"Basic",type:"Concept",
q:"What do nullable reference types actually do, and how would you enable them in a large existing codebase?",
a:`<p>Nullable reference types (C# 8, on by default in project templates since .NET 6) make nullability part of the declared type: <code>string</code> means "should not be null", <code>string?</code> means "may be null". The compiler runs flow analysis and warns when you might dereference null or assign null to a non-nullable. It's a <b>compile-time</b> feature: nothing changes at runtime, so values from deserialisation, reflection or unannotated libraries can still be null.</p>
<p>For a large codebase: enable it project by project, or file by file with <code>#nullable enable</code>. Start with leaf projects such as shared models. Fix warnings properly rather than scattering the <code>!</code> (null-forgiving) operator. Turn warnings into errors once a project is clean, so it stays clean.</p>`,
keys:["Compile-time only, no runtime checks","Flow analysis warnings","Incremental enablement strategy","Avoid ! as a silencer","Warnings-as-errors once clean"],
fu:[{q:"An incoming JSON request has a missing required field. Does a non-nullable string property protect you?",a:"No. The deserializer can still leave it null. Use validation, or the required modifier (C# 11), which System.Text.Json honours from .NET 7, so a missing property fails deserialisation."}],
rf:["Thinks NRT throws at runtime","Fixes warnings with ! everywhere","Turns it on solution-wide in one PR with thousands of warnings ignored"]},

{id:"N006",skill:"C# & Runtime",level:"Basic",type:"Scenario",
q:"Production logs show exceptions whose stack traces point at a catch block instead of where the error happened. The code has catch (Exception ex) { Log(ex); throw ex; }. What's wrong, and how should exception handling look?",
a:`<p><code>throw ex;</code> rethrows the exception <b>with a new stack trace</b> starting at that line, so the original failing location is lost. <code>throw;</code> rethrows the same exception and preserves the original stack trace. If you need to rethrow later or on another thread, <code>ExceptionDispatchInfo.Capture(ex).Throw()</code> preserves it.</p>
<p>Broader guidance:</p>
<ul>
<li>Don't catch-log-rethrow at every layer. You get the same error logged five times. Catch where you can <b>handle</b> it (retry, fallback, translate), and let a global handler log unhandled exceptions once.</li>
<li>When wrapping, pass the original as <code>InnerException</code>: <code>throw new OrderException("…", ex)</code>.</li>
<li>Catch specific exception types. Catching <code>Exception</code> broadly is for top-level boundaries.</li>
<li>Don't use exceptions for expected control flow, such as "user not found" in a hot path. Return a result instead.</li>
</ul>`,
keys:["throw; vs throw ex;","ExceptionDispatchInfo","Log once at a boundary, not per layer","Wrap with InnerException","Specific catches; exceptions not for flow control"],
fu:[{q:"Where should unhandled exceptions be logged in ASP.NET Core?",a:"In one place: exception-handling middleware (UseExceptionHandler, with an IExceptionHandler in .NET 8+), which logs with the trace ID and returns a safe Problem Details response."}],
rf:["Doesn't know the difference between throw and throw ex","Swallows exceptions silently","Logs and rethrows at every layer"]},

{id:"N007",skill:"ASP.NET Core",level:"Basic",type:"Concept",
q:"Explain the three DI lifetimes in ASP.NET Core and give an example of when to use each.",
a:`<ul>
<li><b>Transient:</b> a new instance every time it's resolved. For lightweight, stateless services, such as a validator or a mapper with no state.</li>
<li><b>Scoped:</b> one instance per scope. In ASP.NET Core a scope is one HTTP request. For anything that holds per-request state or a unit of work. <code>DbContext</code> is registered scoped by default.</li>
<li><b>Singleton:</b> one instance for the app's lifetime, shared across all requests and threads. For expensive, thread-safe, stateless or shared resources: configuration wrappers, caches, a typed client's underlying handler, <code>IHttpClientFactory</code> itself.</li>
</ul>
<p>Rules: a service must not depend on something with a <b>shorter</b> lifetime (a singleton holding a scoped <code>DbContext</code> keeps one context forever, shared across threads). Singletons must be thread-safe. Disposal is handled by the container at the end of the scope or app.</p>`,
keys:["Correct definition of each","Scope = request in ASP.NET Core","DbContext scoped and why","Singletons must be thread-safe","No shorter-lived dependencies in longer-lived services"],
fu:[{q:"You need a scoped service inside a singleton (for example a hosted service). How?",a:"Inject IServiceScopeFactory, create a scope per unit of work (using var scope = factory.CreateScope()), resolve the scoped service from scope.ServiceProvider, and dispose the scope when done."}],
rf:["Registers DbContext as singleton","Thinks transient means 'per request'","Stores request data in a singleton"]},

{id:"N008",skill:"ASP.NET Core",level:"Basic",type:"Concept",
q:"How does the ASP.NET Core middleware pipeline work, and why does the order of middleware matter? Give a correct ordering.",
a:`<p>Each middleware receives the <code>HttpContext</code>, can do work before and after calling <code>next</code>, or can short-circuit by not calling it. Requests go down the pipeline in registration order, and responses come back up in reverse. So order determines what each middleware can see and affect.</p>
<p>A typical order for an API:</p>
<pre><code>app.UseExceptionHandler();      // outermost: catches everything below
app.UseHsts(); app.UseHttpsRedirection();
app.UseRouting();               // pick the endpoint
app.UseCors();                  // needs the endpoint, before auth
app.UseAuthentication();        // who are you
app.UseAuthorization();         // may you (needs endpoint + user)
app.UseRateLimiter();
app.MapControllers();           // endpoints</code></pre>
<p>Common bugs: authorization before authentication (user is always anonymous), CORS after auth (preflight rejected), and the exception handler registered late (exceptions earlier in the pipeline escape it). With .NET 6+ minimal hosting, routing is added implicitly if you don't call it, but explicit order still matters for the rest.</p>`,
keys:["Before/after next, short-circuiting","Reverse order on the response","Exception handler outermost","Routing → CORS → AuthN → AuthZ → endpoints","Can name ordering bugs"],
fu:[{q:"How do you write custom middleware that times every request?",a:"A class with a constructor taking RequestDelegate and an InvokeAsync(HttpContext) method that starts a Stopwatch, awaits next(context) in a try/finally, and records the elapsed time. Register it early so it measures everything below it. In practice OpenTelemetry's ASP.NET Core instrumentation already does this."}],
rf:["Can't explain why order matters","Puts UseAuthorization before UseAuthentication","Thinks middleware only runs on the request path"]},

{id:"N009",skill:"ASP.NET Core",level:"Basic",type:"Concept",
q:"Minimal APIs or controllers: how do you choose for a new service?",
a:`<p><b>Minimal APIs</b> (.NET 6) map endpoints directly to lambdas or methods. They gained route groups and endpoint filters in .NET 7, and support Native AOT in .NET 8. They have less ceremony, slightly lower overhead, and work well for small services and vertical-slice structures where each feature file owns its endpoints.</p>
<p><b>Controllers</b> give conventions out of the box: filters, model binding conventions, <code>[ApiController]</code> automatic validation responses, and familiar structure for large teams and big APIs. Plenty of existing tooling and team knowledge assumes them.</p>
<p>My default for a new small or medium service is minimal APIs with route groups and a feature-folder layout. For a large API surface or a team used to MVC conventions, controllers are perfectly fine. Performance differences are rarely the deciding factor; consistency within the codebase matters more.</p>`,
keys:["Version timeline of minimal API features","Route groups and endpoint filters","AOT support","Team/codebase consistency over micro-performance"],
fu:[{q:"How do you keep a minimal API Program.cs from becoming a 2,000-line file?",a:"Group endpoints per feature in extension methods (app.MapOrders()) or classes, use MapGroup for shared prefixes, filters and auth policies, and keep handlers thin by delegating to services or handlers."}],
rf:["\"Minimal APIs are only for demos\"","Picks purely on benchmark numbers","Everything in one Program.cs"]},

{id:"N010",skill:"ASP.NET Core",level:"Basic",type:"Concept",
q:"How does configuration work in ASP.NET Core, and what's the difference between IOptions, IOptionsSnapshot and IOptionsMonitor?",
a:`<p>Configuration is layered from providers. By default: <code>appsettings.json</code>, then <code>appsettings.{Environment}.json</code>, then user secrets (Development), then environment variables, then command-line arguments. Later sources override earlier ones. Add providers for AWS Parameter Store, Secrets Manager or Azure Key Vault as needed.</p>
<p>The <b>options pattern</b> binds sections to typed classes:</p>
<ul>
<li><b>IOptions&lt;T&gt;:</b> singleton, read once. Changes need a restart.</li>
<li><b>IOptionsSnapshot&lt;T&gt;:</b> scoped, recomputed per request, so it picks up reloaded values. It can't be injected into singletons.</li>
<li><b>IOptionsMonitor&lt;T&gt;:</b> singleton with <code>CurrentValue</code> and change notifications (<code>OnChange</code>). Use it in singletons and background services that must react to changes.</li>
</ul>
<p>Validate options at startup with <code>ValidateDataAnnotations().ValidateOnStart()</code>, so a missing setting fails the deploy instead of the first request.</p>`,
keys:["Provider order and overriding","Secrets not in appsettings","Three interfaces' lifetimes and reload behaviour","ValidateOnStart"],
fu:[{q:"Where should database passwords live in production?",a:"In a secret store (AWS Secrets Manager, Azure Key Vault) loaded through a configuration provider or retrieved at runtime, or replaced entirely by IAM or managed-identity authentication. Never in appsettings files committed to source control."}],
rf:["Commits secrets in appsettings.Production.json","Doesn't know the options interfaces differ","No startup validation"]},

{id:"N011",skill:"ASP.NET Core",level:"Basic",type:"Scenario",
q:"Invalid requests (missing fields, negative quantities) reach the service layer and cause 500 errors and bad data. How do you fix validation properly?",
a:`<p>Validate at the boundary and return <b>400 with details</b> before business logic runs.</p>
<ul>
<li><b>Controllers with <code>[ApiController]</code>:</b> model-state validation runs automatically. Data annotations (<code>[Required]</code>, <code>[Range]</code>) on request DTOs produce a <code>ValidationProblemDetails</code> 400 without extra code.</li>
<li><b>Minimal APIs:</b> historically had no built-in validation, so you used an endpoint filter with FluentValidation or a custom filter. .NET 10 added built-in validation support for minimal APIs.</li>
<li><b>FluentValidation</b> for rules that annotations express poorly: cross-field rules, conditional rules, async checks.</li>
</ul>
<p>Keep two layers distinct. <b>Input validation</b> (shape, ranges, formats) belongs at the API boundary. <b>Business invariants</b> (stock available, order not already shipped) belong in the domain or service, and the API translates their failures into 409 or 422. Use separate request DTOs, never entity classes, as input models, so clients can't set fields like <code>IsAdmin</code> (over-posting).</p>`,
keys:["Validate at the boundary, return 400 with details","[ApiController] automatic behaviour","Minimal API validation options by version","Input validation vs business rules","DTOs to prevent over-posting"],
fu:[{q:"Should the domain re-validate if the API already did?",a:"Yes, for its own invariants. The API validates input shape for this entry point, but the domain may be called from other paths (consumers, jobs), so it must protect its own rules regardless."}],
rf:["Binds directly to EF entities","Lets exceptions from the DB act as validation","Returns 500 for bad input"],
verify:"Built-in minimal API validation shipped in .NET 10 (AddValidation); confirm the exact API surface for the version you use."},

{id:"N012",skill:"EF Core",level:"Basic",type:"Concept",
q:"What's the difference between tracking and no-tracking queries in EF Core, and when do you use each?",
a:`<p>By default, entities returned from a query are <b>tracked</b>: the <code>DbContext</code> keeps a snapshot and an identity map, so changes are detected on <code>SaveChanges</code>, and the same row returns the same instance within that context. That costs memory and CPU.</p>
<p><b><code>AsNoTracking()</code></b> skips the change tracker. It's faster and lighter, but changes to those objects won't be saved unless you attach them. <code>AsNoTrackingWithIdentityResolution()</code> skips tracking but still deduplicates instances for the same key within the query.</p>
<p>My rule: <b>read-only queries</b> (API GETs, reports, projections) use no-tracking, or project with <code>Select</code> to DTOs, which isn't tracked anyway. <b>Load-modify-save</b> flows use tracking. For read-heavy contexts you can set <code>QueryTrackingBehavior.NoTracking</code> as the default and opt in to tracking where needed.</p>`,
keys:["What the change tracker does (snapshot, identity map)","AsNoTracking cost benefit","Projections aren't tracked","Identity resolution variant","Default behaviour configurable"],
fu:[{q:"Why is projecting with Select often better than AsNoTracking on the full entity?",a:"Select generates SQL that fetches only the needed columns, so less data is read and transferred and covering indexes may be used. AsNoTracking still loads every mapped column."}],
rf:["Tracks everything by default in read paths","Modifies no-tracking entities and expects SaveChanges to persist"]},

{id:"N013",skill:"EF Core",level:"Basic",type:"Concept",
q:"Explain eager, explicit and lazy loading in EF Core, and how the N+1 problem shows up.",
a:`<ul>
<li><b>Eager:</b> <code>Include(o =&gt; o.Lines)</code> loads related data in the same query (or in split queries).</li>
<li><b>Explicit:</b> load related data later on demand: <code>context.Entry(order).Collection(o =&gt; o.Lines).LoadAsync()</code>.</li>
<li><b>Lazy:</b> navigation properties load automatically on first access, via proxies (<code>UseLazyLoadingProxies</code> with virtual navigations) or an injected loader. It's off by default in EF Core.</li>
</ul>
<p><b>N+1:</b> one query loads 100 orders, then accessing <code>order.Customer</code> in a loop triggers 100 more queries (with lazy loading, or with explicit loads inside the loop). It looks fine with 5 rows locally and collapses with real data. Fix it with <code>Include</code> or, better, a <code>Select</code> projection that fetches exactly what the endpoint needs. Detect it by logging SQL in development and counting queries per request.</p>`,
keys:["Three loading styles and their mechanics","Lazy loading off by default in EF Core","N+1 mechanism and why it hides locally","Fix via Include or projection","Detect via query logging/counting"],
fu:[{q:"Would you enable lazy loading in a web API?",a:"Generally no. It hides queries inside property access, makes N+1 easy to introduce, and fails after the context is disposed or during serialisation. Explicit Include or projections make the data access visible."}],
rf:["Enables lazy loading to 'avoid Include everywhere'","Doesn't recognise N+1","Includes every navigation by default"]},

{id:"N014",skill:"EF Core",level:"Basic",type:"Scenario",
q:"The team calls context.Database.Migrate() at app startup. With four ECS tasks starting during a deploy, deployments sometimes fail or leave the schema in a strange state. What would you change?",
a:`<p>Running migrations from every app instance means several instances can try to apply the same migration at once, and app start-up becomes coupled to schema changes. If a migration fails, every instance fails to start. Migrations also run with the app's DB user, which then needs DDL permissions.</p>
<p>Better options:</p>
<ul>
<li>Run migrations as a <b>separate deployment step</b>, once, before rolling out new tasks. Use an idempotent SQL script (<code>dotnet ef migrations script --idempotent</code>), reviewed in the PR, or an <b>EF migration bundle</b> (<code>dotnet ef migrations bundle</code>, EF Core 6+), which is a self-contained executable run by the pipeline.</li>
<li>Use a migration-only DB identity with DDL rights. The app's identity gets DML only.</li>
<li>Write <b>backward-compatible</b> migrations (expand and contract), so old tasks still running during a rolling deploy work with the new schema.</li>
</ul>
<p>EF Core 9 added a lock so concurrent <code>Migrate()</code> calls don't run simultaneously, which removes the race but not the other problems.</p>`,
keys:["Concurrency and coupling problems of startup migration","Separate pipeline step with scripts or bundles","Least-privilege DB identities","Backward-compatible migrations for rolling deploys"],
fu:[{q:"A migration renames a column. How do you deploy it without downtime?",a:"Don't rename in one step. Add the new column, write to both (or backfill), deploy code reading the new column, then drop the old column in a later release. A rename while old tasks are running breaks them."}],
rf:["Keeps Migrate() at startup across many instances","Renames or drops columns in the same release that changes code","App DB user has db_owner"],
verify:"EF Core 9 migration locking behaviour; confirm for your provider."},

{id:"N015",skill:"ADO.NET & Dapper",level:"Basic",type:"Concept",
q:"How does connection pooling work with SqlConnection, and what are the rules for using connections and commands safely?",
a:`<p>ADO.NET keeps a <b>pool of physical connections per connection string</b> (per process). <code>Open()</code> takes one from the pool, or creates one up to <code>Max Pool Size</code> (default 100), and <code>Close()</code>/<code>Dispose()</code> returns it. Opening and closing per operation is cheap and is the intended pattern.</p>
<p>Rules:</p>
<ul>
<li>Open late, close early, always in <code>using</code>/<code>await using</code>, so connections return to the pool even on exceptions.</li>
<li>Never hold a connection across slow work (an HTTP call, a user wait).</li>
<li><b>Always parameterise</b> (<code>@id</code> parameters), never concatenate input into SQL. That prevents SQL injection and lets SQL Server reuse plans.</li>
<li>Use async methods in web code.</li>
<li>Different connection strings create separate pools. Building strings dynamically per user fragments pooling.</li>
</ul>
<p>Dapper uses these same connections, so the same rules apply.</p>`,
keys:["Pool per connection string, default max 100","Open/close per operation is intended","using/await using to avoid leaks","Parameterisation for safety and plan reuse","Pool fragmentation from varied strings"],
fu:[{q:"You see 'Timeout expired. The timeout period elapsed prior to obtaining a connection from the pool.' What's going on?",a:"All 100 pooled connections are in use. Either connections are leaking (not disposed), operations hold them too long (slow queries, long transactions), or load exceeds the pool. Check for missing using blocks first, then query durations, before raising Max Pool Size."}],
rf:["Keeps a static open SqlConnection","String-concatenated SQL","Raises Max Pool Size as the first fix for pool timeouts"]},

{id:"N016",skill:"Testing (xUnit/Moq)",level:"Basic",type:"Concept",
q:"How do you structure unit and integration tests for an ASP.NET Core API?",
a:`<p><b>Unit tests</b> cover logic in isolation: domain rules, validators, services with dependencies replaced by fakes or mocks. They're fast, numerous and run on every build.</p>
<p><b>Integration tests</b> run the real application in-process with <code>WebApplicationFactory&lt;Program&gt;</code> (from <code>Microsoft.AspNetCore.Mvc.Testing</code>). They exercise the real middleware, routing, serialisation, DI and auth configuration through an <code>HttpClient</code>. Replace external dependencies selectively in <code>ConfigureTestServices</code>, and use a real database engine, ideally in a container with Testcontainers, rather than EF's in-memory provider, which doesn't behave like SQL.</p>
<pre><code>public class OrdersApiTests(ApiFactory factory) : IClassFixture&lt;ApiFactory&gt;
{
    [Fact]
    public async Task Create_returns_201_with_location()
    {
        var client = factory.CreateClient();
        var res = await client.PostAsJsonAsync("/orders", new { productId = 1, qty = 2 });
        Assert.Equal(HttpStatusCode.Created, res.StatusCode);
        Assert.NotNull(res.Headers.Location);
    }
}</code></pre>`,
keys:["Unit vs integration responsibilities","WebApplicationFactory runs the real pipeline","Real DB via containers over in-memory provider","Selective replacement of externals"],
fu:[{q:"Why avoid the EF Core in-memory provider for tests?",a:"It isn't a relational database: no constraints, no transactions, different query translation and case sensitivity. Tests can pass while the real query fails. SQLite in-memory is closer but still differs from SQL Server or PostgreSQL; a containerised real engine is the most faithful."}],
rf:["Only unit tests with everything mocked","Uses the in-memory provider and trusts query behaviour","No integration tests of auth/serialisation"]},

{id:"N017",skill:"Testing (xUnit/Moq)",level:"Basic",type:"Concept",
q:"When do you use mocks, and how do you avoid tests that are brittle because of mocking?",
a:`<p>Mock at <b>boundaries you don't own or can't run cheaply</b>: payment gateways, email senders, external HTTP APIs, the clock, message publishers. Use Moq's <code>Setup</code> to define behaviour and <code>Verify</code> to assert that an important interaction happened (for example "a refund was requested once").</p>
<p>Brittle tests come from mocking <b>internal collaborators</b> and verifying every call. The test then encodes the implementation, and any refactor breaks it even when behaviour is unchanged. Guidelines:</p>
<ul>
<li>Assert on outcomes (return values, state, published events) rather than call sequences where possible.</li>
<li>Don't mock <code>DbContext</code> or <code>DbSet</code>. Test data access against a real database in integration tests.</li>
<li>Prefer simple hand-written fakes for things used everywhere, such as an in-memory repository or a fake clock using .NET 8's <code>TimeProvider</code> and <code>FakeTimeProvider</code>.</li>
<li>Keep one logical assertion per test, with clear naming.</li>
</ul>`,
keys:["Mock boundaries, not internals","Setup vs Verify purpose","Outcome-based assertions","Don't mock DbContext","Fakes, TimeProvider/FakeTimeProvider"],
fu:[{q:"Moq had a controversy in 2023. What was it, and does it affect tool choice?",a:"Version 4.20.0 shipped SponsorLink, which collected hashed developer email addresses at build time without clear consent. It was removed in a later patch, but some organisations switched to NSubstitute or FakeItEasy. It's a reminder to review dependencies' behaviour and licences, not only their APIs."}],
rf:["Mocks every class including internal ones","Verifies every call order","Mocks DbSet with LINQ"]},

{id:"N018",skill:".NET Performance & Diagnostics",level:"Basic",type:"Concept",
q:"Explain how the .NET garbage collector works at a high level: generations, the large object heap, and workstation vs server GC.",
a:`<p>The GC is generational because most objects die young:</p>
<ul>
<li><b>Gen 0:</b> new allocations, collected often and cheaply.</li>
<li><b>Gen 1:</b> a buffer for survivors.</li>
<li><b>Gen 2:</b> long-lived objects, collected rarely and expensively. Full collections hurt latency.</li>
</ul>
<p>Objects of 85,000 bytes or more go on the <b>Large Object Heap</b>, which is collected only with Gen 2 and isn't compacted by default, so frequent large allocations (big arrays, large strings, buffers) cause Gen 2 collections and fragmentation. <code>ArrayPool&lt;T&gt;</code> and streaming help avoid them.</p>
<p><b>Workstation GC</b> uses one heap and favours low pause times for desktop apps. <b>Server GC</b> uses a heap and GC thread per core for throughput, and is the default for ASP.NET Core apps. It uses more memory, so in small containers that matters. .NET 8 introduced DATAS (dynamic adaptation of heap count to app size), which is on by default for Server GC from .NET 9.</p>`,
keys:["Generational hypothesis and gen 0/1/2","LOH threshold and why it's costly","Server vs workstation trade-off","Container memory implications, DATAS"],
fu:[{q:"How do you reduce GC pressure in a hot path?",a:"Measure allocations first (dotnet-counters, a profiler, BenchmarkDotNet's MemoryDiagnoser), then avoid unnecessary ones: pool buffers (ArrayPool), use Span<T> and stackalloc for short-lived data, avoid LINQ in tight loops, avoid boxing, and stream large payloads instead of buffering."}],
rf:["Calls GC.Collect() to manage memory","Doesn't know the LOH threshold or why it matters","Thinks Server GC is always better in small containers"],
verify:"DATAS default enablement by version (.NET 8 opt-in, .NET 9 default for Server GC); confirm for your runtime version."},
