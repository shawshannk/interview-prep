{id:"N051",skill:"C# & Runtime",level:"Advanced",type:"Concept",
q:"Walk through what the compiler generates for an async method, and what happens at runtime on the first await that doesn't complete synchronously.",
a:`<p>The compiler turns the method into:</p>
<ul>
<li>A <b>state machine type</b> implementing <code>IAsyncStateMachine</code>. It's a struct in Release builds and a class in Debug. Its fields hold the parameters, the locals that live across awaits, the current <code>state</code> integer, the awaiters, and a <b>builder</b> (<code>AsyncTaskMethodBuilder&lt;T&gt;</code>).</li>
<li>A <b>stub method</b> that initialises the struct, calls <code>builder.Start(ref sm)</code> (which runs <code>MoveNext</code> synchronously), and returns <code>builder.Task</code>.</li>
<li><b><code>MoveNext</code></b> containing the original code split at each await into a switch on <code>state</code>.</li>
</ul>
<p>At an <code>await</code>, the code calls <code>GetAwaiter()</code> and checks <code>IsCompleted</code>. If complete, it calls <code>GetResult()</code> and keeps going synchronously. If not, it records <code>state</code>, stores the awaiter, and calls <code>builder.AwaitUnsafeOnCompleted(ref awaiter, ref this)</code>. On that <b>first real suspension</b>, the struct state machine is <b>boxed to the heap</b> (in .NET Core, into an <code>AsyncStateMachineBox</code> that is also the Task), the <code>ExecutionContext</code> is captured, and the continuation is registered. <code>MoveNext</code> then returns, and the thread is free. When the awaited operation completes, <code>MoveNext</code> runs again, jumps to the saved state, calls <code>GetResult()</code> (which rethrows any exception), and continues. At the end, <code>SetResult</code> or <code>SetException</code> completes the task.</p>`,
keys:["State machine struct + builder + MoveNext switch","Awaiter pattern (GetAwaiter/IsCompleted/OnCompleted/GetResult)","Boxing to heap on first real suspension","ExecutionContext capture/flow","Synchronous fast path when already complete"],
fu:[{q:"Why do methods that just 'return await' something cost more than returning the task directly?",a:"The async version allocates a state machine box on suspension and adds an extra continuation hop. Returning the inner task directly avoids that, but changes exception timing and stack traces, and it's wrong inside a using or try block, where the resource would be disposed before the task completes."},
{q:"What is the 'awaiter pattern' that makes any type awaitable?",a:"A GetAwaiter() method (instance or extension) returning a type with an IsCompleted property, an OnCompleted(Action) method (from INotifyCompletion, optionally UnsafeOnCompleted), and GetResult(). The compiler uses these members by pattern, not by interface on the awaitable type."}],
rf:["Says async creates threads","Can't describe the state field or MoveNext","Unaware of the boxing on first suspension"]},

{id:"N052",skill:"C# & Runtime",level:"Advanced",type:"Concept",
q:"What are Span<T> and Memory<T>, why is Span a ref struct, and when must you use Memory instead?",
a:`<p><b><code>Span&lt;T&gt;</code></b> is a view over contiguous memory: part of an array, a <code>stackalloc</code> buffer, or native memory. It's a pointer plus a length, so slicing creates no copy and no allocation. It is a <b><code>ref struct</code></b> because it can point to stack memory, so the compiler must guarantee it never outlives that memory. A <code>Span</code> can't be boxed, stored as a field of a class, captured by a lambda, or (before C# 13) used in an async method or iterator. C# 13 relaxes that slightly: ref struct locals are allowed in async methods as long as they aren't used across an <code>await</code>.</p>
<p><b><code>Memory&lt;T&gt;</code></b> is the heap-storable counterpart. It isn't a ref struct, so you can keep it in fields, pass it across <code>await</code>s, and call <code>.Span</code> when you need to work with it synchronously. That's why async I/O APIs take <code>Memory&lt;byte&gt;</code> (<code>Stream.ReadAsync(Memory&lt;byte&gt;)</code>) while parsing helpers take <code>ReadOnlySpan&lt;char&gt;</code>.</p>
<p>Typical uses: parsing without <code>Substring</code> or <code>Split</code> allocations, formatting into stack buffers, and working on pooled arrays from <code>ArrayPool</code>.</p>`,
keys:["Span = pointer + length over any contiguous memory","ref struct constraints and why","Memory for async/storage, .Span for sync work","Version note on async restrictions","Use cases: parsing, pooling"],
fu:[{q:"Who owns the memory behind a Memory<T> from ArrayPool, and what's the risk?",a:"The renter owns it until it returns the array to the pool. Holding a Memory or Span to it after returning it means reading or writing memory now used by someone else: a silent corruption bug. Use IMemoryOwner<T> (MemoryPool) to make ownership and disposal explicit."}],
rf:["Thinks Span always means stack memory","Stores Span in a class field","Can't say when Memory is required"]},

{id:"N053",skill:"C# & Runtime",level:"Advanced",type:"Scenario",
q:"A log-ingestion endpoint parses 50,000 CSV lines per second. dotnet-counters shows 2 GB/s allocation and frequent gen 0 and gen 1 GCs. Show how you'd reduce allocations.",
a:`<p>Find the allocation sources first (a memory profile, or the allocation-sampling event in <code>dotnet-trace</code>). Typically they are <code>string.Split</code>, <code>Substring</code>, <code>int.Parse(string)</code> on substrings, LINQ, and per-line <code>string</code> creation from the stream.</p>
<p><b>Rewrite the hot path around spans:</b></p>
<pre><code>static bool TryParseLine(ReadOnlySpan&lt;char&gt; line, out Reading r)
{
    r = default;
    int c1 = line.IndexOf(',');            if (c1 &lt; 0) return false;
    var rest = line[(c1 + 1)..];
    int c2 = rest.IndexOf(',');            if (c2 &lt; 0) return false;
    return int.TryParse(line[..c1], out r.DeviceId)
        &amp;&amp; long.TryParse(rest[..c2], out r.Timestamp)
        &amp;&amp; double.TryParse(rest[(c2 + 1)..], CultureInfo.InvariantCulture, out r.Value);
}</code></pre>
<ul>
<li>Read input with <b><code>System.IO.Pipelines</code></b> or pooled buffers instead of <code>ReadLine()</code> per line. Parse UTF-8 bytes directly with <code>Utf8Parser</code> to skip the UTF-16 string conversion.</li>
<li>Rent buffers from <code>ArrayPool&lt;T&gt;.Shared</code>, and make parsed records <code>struct</code>s when they're short-lived.</li>
<li>Use <code>SearchValues&lt;char&gt;</code> (.NET 8) for fast multi-character searches, and <code>string.Create</code> when you really need to build a string.</li>
</ul>
<p>Verify with BenchmarkDotNet's MemoryDiagnoser and production counters. The goal is near-zero allocations per line.</p>`,
keys:["Profiles allocation sources first","Span-based parsing, TryParse on spans","Pipelines / UTF-8 parsing to avoid string conversion","ArrayPool, structs, SearchValues","Measures before and after"],
trade:["Span code is faster but harder to read and maintain; confine it to measured hot paths","Pooling cuts allocations but introduces ownership bugs if buffers escape"],
fu:[{q:"Is this worth doing for an endpoint at 50 requests per second?",a:"Probably not. At that rate the allocation cost is tiny compared to I/O, and readable code matters more. Optimise where profiling shows allocation or GC time is a real share of cost."}],
rf:["Optimises without measuring","Micro-optimises cold code","Returns rented arrays while still holding spans over them"]},

{id:"N054",skill:"C# & Runtime",level:"Advanced",type:"Concept",
q:"Compare System.Threading.Channels, BlockingCollection and TPL Dataflow for producer-consumer pipelines. How do you handle backpressure?",
a:`<ul>
<li><b>Channels</b> (<code>Channel.CreateBounded&lt;T&gt;</code>): async-first, allocation-light, and the default choice in modern .NET. Writers <code>await WriteAsync</code>, readers <code>await foreach (var x in reader.ReadAllAsync(ct))</code>. Options tune for single reader or writer.</li>
<li><b>BlockingCollection</b>: older, built on blocking waits, so it ties up threads while waiting. That's a poor fit for async ASP.NET Core code.</li>
<li><b>TPL Dataflow</b>: blocks (<code>TransformBlock</code>, <code>ActionBlock</code>, <code>BatchBlock</code>) linked into pipelines, with per-block parallelism and bounded capacity. Useful for multi-stage pipelines, but heavier, and a separate package.</li>
</ul>
<p><b>Backpressure</b> comes from <b>bounded</b> capacity. When the channel is full, <code>BoundedChannelFullMode</code> decides what happens:</p>
<ul>
<li><code>Wait</code>: the producer awaits, slowing the upstream. This is real backpressure.</li>
<li><code>DropOldest</code> / <code>DropNewest</code> / <code>DropWrite</code>: for telemetry-like data where loss is acceptable.</li>
</ul>
<p>An <b>unbounded</b> channel has no backpressure: a slow consumer means memory grows until OOM. For HTTP producers, a full channel should translate to 429 or 503 rather than waiting forever.</p>`,
keys:["Channels as async-first default","BlockingCollection blocks threads","Dataflow for multi-stage pipelines","Bounded capacity and FullMode options","Unbounded = no backpressure, OOM risk"],
fu:[{q:"How do you process items in parallel from one channel while keeping per-key order?",a:"Partition by key: hash the key to one of N channels, each with a single consumer. Order is kept per key, and parallelism comes from N. This is the same idea as Kafka partitions, in process."}],
rf:["Uses unbounded channels by default for request-driven work","Uses BlockingCollection in async code","No thought on what happens when the consumer is slow"]},

{id:"N055",skill:"C# & Runtime",level:"Advanced",type:"Scenario",
q:"A service uses SemaphoreSlim(10) to cap concurrent calls to a partner API. After a few hours, every request hangs waiting on the semaphore. What's wrong, and how do you write it correctly?",
a:`<p>The semaphore is <b>leaking permits</b>: some code path acquires without releasing. Common causes:</p>
<ul>
<li><code>Release()</code> not in a <code>finally</code>, so an exception skips it.</li>
<li>The wait is cancelled (<code>WaitAsync(ct)</code> throws) but the code still calls <code>Release()</code>. That over-releases, which throws <code>SemaphoreFullException</code> or, worse, allows more than 10 at once.</li>
<li>A timeout overload (<code>WaitAsync(timeout)</code> returns <code>false</code>) whose result is ignored, so code runs without a permit and then releases one it never took.</li>
</ul>
<pre><code>if (!await _gate.WaitAsync(TimeSpan.FromSeconds(5), ct))
    throw new TimeoutException("Partner API concurrency limit");
try
{
    return await _client.CallAsync(request, ct);
}
finally
{
    _gate.Release();   // only reached when the permit was acquired
}</code></pre>
<p>Diagnose with a dump: check <code>CurrentCount</code> on the semaphore, and count the threads or tasks waiting. Remember that <code>lock</code> can't contain <code>await</code>; <code>SemaphoreSlim(1,1)</code> is the usual async lock. For partner limits, a rate limiter (<code>System.Threading.RateLimiting</code>) or a bulkhead from the resilience pipeline expresses the intent more clearly.</p>`,
keys:["Acquire/release symmetry in try/finally","Cancellation and timeout return value handling","Over-release risk","Diagnose via dump/CurrentCount","Rate limiter/bulkhead alternatives"],
fu:[{q:"Why can't you await inside a lock statement?",a:"Monitor locks are thread-affine: the thread that acquires must release. After an await, the continuation may run on a different thread, so the compiler forbids await inside lock. Async-compatible primitives like SemaphoreSlim aren't thread-affine."}],
rf:["Releases without knowing whether the wait succeeded","Uses Wait() (blocking) in async code","Raises the limit to make the hang go away"]},

{id:"N056",skill:"C# & Runtime",level:"Advanced",type:"Concept",
q:"What is IAsyncEnumerable<T>, how does cancellation flow through it, and where is it useful in a web API?",
a:`<p><code>IAsyncEnumerable&lt;T&gt;</code> is an asynchronous stream: <code>await foreach</code> pulls items one at a time, and each <code>MoveNextAsync</code> may await I/O. You write producers with <code>async</code> iterators (<code>yield return</code> in an <code>async IAsyncEnumerable&lt;T&gt;</code> method).</p>
<p><b>Cancellation:</b> the method can't take the token from <code>GetAsyncEnumerator</code> through an ordinary parameter, so you mark a parameter with <code>[EnumeratorCancellation]</code>. The token passed to <code>WithCancellation(ct)</code> by the consumer then flows into that parameter, combined with one passed directly.</p>
<pre><code>public async IAsyncEnumerable&lt;OrderDto&gt; StreamOrders(
    [EnumeratorCancellation] CancellationToken ct = default)
{
    await foreach (var o in _db.Orders.AsNoTracking().AsAsyncEnumerable().WithCancellation(ct))
        yield return Map(o);
}</code></pre>
<p><b>Uses:</b> EF Core's <code>AsAsyncEnumerable()</code> streams rows without loading everything. ASP.NET Core (.NET 6+) serialises an <code>IAsyncEnumerable</code> return value as a JSON array <b>incrementally</b>, without buffering, so large result sets stream with flat memory. Good for exports and long lists.</p>
<p>Caveat: the DB connection stays open while the client reads, so slow clients hold connections. Use it with timeouts, and for very large exports prefer async jobs.</p>`,
keys:["Pull-based async stream","[EnumeratorCancellation] + WithCancellation","EF AsAsyncEnumerable for streaming","ASP.NET Core unbuffered JSON streaming (.NET 6+)","Connection-held-open caveat"],
fu:[{q:"What happens if the consumer breaks out of await foreach early?",a:"The enumerator's DisposeAsync runs, which executes finally blocks in the iterator, so resources like a DB reader are released. That's why cleanup in async iterators belongs in finally or using blocks."}],
rf:["Calls ToListAsync then wraps in IAsyncEnumerable","Doesn't know about EnumeratorCancellation","Streams over a held DB connection to slow clients without limits"]},

{id:"N057",skill:"C# & Runtime",level:"Advanced",type:"Concept",
q:"What are source generators, and where does modern .NET use them? Why do they matter for performance and AOT?",
a:`<p>Source generators run inside the compiler, inspect your code (syntax and semantic model) and <b>emit additional C# at build time</b>. Work that used to happen at runtime through reflection or dynamic code generation moves to compile time. Modern ones use the incremental generator API for IDE performance.</p>
<p>Built-in examples:</p>
<ul>
<li><b>System.Text.Json</b> (<code>JsonSerializerContext</code>, .NET 6): serialisation metadata and fast-path code without reflection.</li>
<li><b><code>[LoggerMessage]</code></b> (.NET 6): allocation-free logging methods.</li>
<li><b><code>[GeneratedRegex]</code></b> (.NET 7): regex compiled to readable C# at build time, with no startup compile cost.</li>
<li><b>Configuration binding</b> and the minimal API <b>Request Delegate Generator</b> (.NET 8): replace reflection-based binding.</li>
<li><code>[LibraryImport]</code> for P/Invoke marshalling.</li>
</ul>
<p>They matter because reflection and <code>Reflection.Emit</code> are slow at startup, often allocate, and are <b>incompatible with Native AOT and trimming</b>, which can't see or keep code that's only reached reflectively. Generated code is visible to the trimmer and runs fast from the first call.</p>`,
keys:["Compile-time code emission","Built-in generators by version","Replaces reflection/runtime codegen","AOT and trimming compatibility","Startup performance"],
fu:[{q:"What's the difference between a source generator and an analyzer?",a:"Both run in the compiler. Analyzers inspect code and report diagnostics (and may offer code fixes). Generators add new source files to the compilation. They can't modify existing code, only add to it."}],
rf:["Confuses generators with T4 templates or runtime codegen","Unaware of AOT/trimming relevance"]},

{id:"N058",skill:"C# & Runtime",level:"Advanced",type:"Architecture",
q:"Exceptions or Result types for business errors such as 'insufficient stock' or 'order already shipped'? How would you set a convention for a team?",
a:`<p><b>Exceptions</b> are idiomatic in .NET for <i>unexpected</i> failures: bugs, infrastructure faults, violated preconditions. Using them for <i>expected</i> business outcomes has costs. They're invisible in method signatures, so callers forget to handle them. They're expensive when frequent (stack capture), and control flow jumps far from the cause.</p>
<p><b>Result types</b> (<code>Result&lt;T&gt;</code>, or a discriminated-union style like the OneOf or ErrorOr libraries) make expected failures <b>explicit in the signature</b>, force handling, and map cleanly to HTTP responses (409, 422). Costs: more verbose code, propagating results through layers adds noise, and C# lacks built-in unions and exhaustive matching (still a proposal), so libraries fill the gap.</p>
<p><b>A convention I'd propose:</b></p>
<ul>
<li>Domain and application methods return results for <b>expected business outcomes</b>, with a small, stable set of error codes.</li>
<li>Exceptions are for bugs and infrastructure failures, handled globally by middleware into 500 or 503.</li>
<li>The API layer maps result errors to Problem Details in one place.</li>
<li>Write it in an ADR with examples, and enforce it in code review.</li>
</ul>`,
keys:["Expected vs unexpected failure distinction","Costs of exceptions for control flow","Results: explicit, mappable to HTTP","Honest about C# limitations","Team convention with central mapping"],
trade:["Results: explicit and fast, more verbose and needs discipline","Exceptions: concise and familiar, hidden failure paths and costly at high frequency","It depends on: domain complexity, team familiarity, frequency of business failures"],
fu:[{q:"Is throwing an exception really 'expensive'?",a:"Relative to a return value, yes: a throw captures a stack trace and unwinds, which costs microseconds rather than nanoseconds. It only matters at high frequency (thousands per second, such as validation failures under load). The bigger cost is usually clarity, not CPU."}],
rf:["Dogmatic 'never exceptions' or 'only exceptions'","Uses exceptions for validation in hot paths","No mapping strategy to HTTP"]},

{id:"N059",skill:"ASP.NET Core",level:"Advanced",type:"Concept",
q:"What does Native AOT give an ASP.NET Core service, what are its limitations, and when would you adopt it?",
a:`<p><b>Benefits:</b> the app compiles ahead of time into a self-contained native executable, with no JIT at runtime. Start-up is much faster, memory footprint smaller, and images smaller. That matters for <b>Lambda cold starts</b>, scale-to-zero containers and high-density deployments.</p>
<p><b>Limitations</b> (from .NET 8):</p>
<ul>
<li>No runtime code generation, and only trimming-safe reflection. Libraries that rely on reflection or <code>Reflection.Emit</code> (many serializers, older DI or mapping libraries) break or warn.</li>
<li><b>MVC controllers aren't supported</b>; use minimal APIs with the Request Delegate Generator, gRPC, or worker services.</li>
<li>System.Text.Json must use source-generated contexts.</li>
<li>EF Core AOT support has been experimental (precompiled queries arrived in preview form in EF 9), so many data-heavy apps aren't AOT-ready.</li>
<li>Builds are slower and platform-specific. Peak throughput can be slightly lower than JIT with dynamic PGO for long-running services.</li>
</ul>
<p><b>When to adopt:</b> Lambda functions and small services where start-up and memory dominate cost, built from the start with AOT-compatible libraries. For long-running, data-heavy APIs on ECS, JIT plus ReadyToRun is usually the better trade today.</p>`,
keys:["Start-up and memory benefits, Lambda relevance","Trimming/reflection constraints","No MVC; minimal APIs + RDG","STJ source gen; EF Core AOT maturity","Choose by workload; throughput trade-off"],
trade:["AOT wins on cold start and memory; JIT with dynamic PGO can win on long-running peak throughput","Library compatibility constraints can cost real migration effort"],
fu:[{q:"How do you find out whether an existing app can go AOT?",a:"Set PublishAot=true (or just enable the AOT and trim analyzers) and build. The analyzer warnings (IL2xxx/IL3xxx) list incompatible reflection and dynamic code usage. Fix or replace those libraries before committing."}],
rf:["Assumes AOT is free performance","Unaware MVC isn't supported","Ignores library compatibility"],
verify:"EF Core and ASP.NET Core AOT support continue to expand by version; check current status for .NET 9/10."},

{id:"N060",skill:"ASP.NET Core",level:"Advanced",type:"Scenario",
q:"After moving the admin portal from one VM to three ECS tasks, users get logged out randomly and form posts fail antiforgery validation. Single-instance staging works fine. Why?",
a:`<p>ASP.NET Core <b>Data Protection</b> encrypts auth cookies, antiforgery tokens and TempData with a key ring. By default, each app instance generates keys and stores them <b>locally</b> (in a container, often on its ephemeral filesystem). With three tasks, a cookie encrypted by task A can't be decrypted by task B, so the user looks logged out or antiforgery fails whenever the load balancer switches instances. Keys are also lost on every redeploy, logging everyone out.</p>
<p><b>Fix:</b> a <b>shared, persistent key ring</b>:</p>
<pre><code>builder.Services.AddDataProtection()
    .SetApplicationName("admin-portal")              // same across instances
    .PersistKeysToStackExchangeRedis(redis, "dp-keys") // or AWS SSM / S3 / DB
    .ProtectKeysWith...;                             // encrypt keys at rest (e.g. KMS/cert)</code></pre>
<p>Options include Redis, the database (<code>PersistKeysToDbContext</code>), or AWS Systems Manager Parameter Store via Amazon's Data Protection extension. Protect the keys at rest, because anyone with them can forge cookies. Sticky sessions would hide the symptom but not fix redeploy logouts.</p>`,
keys:["Data Protection key ring explained","Per-instance ephemeral keys break multi-instance","Shared persistent store + SetApplicationName","Keys protected at rest","Sticky sessions aren't a fix"],
trade:["Redis is simple if already present, but keys must be persisted durably (Redis eviction or loss means logouts)","Database storage is durable but adds a DB dependency at startup"],
fu:[{q:"What happens to existing cookies when keys rotate?",a:"Data Protection keeps old keys in the ring (by default keys live 90 days) and can still decrypt with them, while new cookies use the newest key. Rotation is transparent as long as the whole ring is shared and not deleted."}],
rf:["Enables sticky sessions and stops there","Doesn't know Data Protection exists","Stores keys unencrypted in a shared bucket"]},

{id:"N061",skill:"ASP.NET Core",level:"Advanced",type:"Architecture",
q:"Design how tenant context flows through a multi-tenant ASP.NET Core application: HTTP requests, EF Core queries, background jobs and outgoing messages.",
a:`<ol>
<li><b>Resolve the tenant once</b> at the edge, in middleware after authentication. Take it from a <b>trusted source</b>: a token claim, or the host name mapped through a tenant registry. Never from a client-supplied header or body. Reject requests with no resolvable tenant.</li>
<li><b>Store it</b> in a scoped <code>ITenantContext</code> (<code>TenantId</code>, plan, region), set by the middleware and injected wherever needed. Avoid static or <code>AsyncLocal</code> ambient state except where unavoidable, since it hides dependencies.</li>
<li><b>Data access:</b> the <code>DbContext</code> takes <code>ITenantContext</code> and applies a global query filter on <code>TenantId</code>, plus a <code>SaveChanges</code> interceptor that stamps and validates <code>TenantId</code> on writes. Back it with database row-level security where possible. With <code>DbContext</code> pooling, set the tenant per lease rather than in the constructor.</li>
<li><b>Background work and messages:</b> every job or message carries <code>TenantId</code> in its envelope or headers. The consumer creates a DI scope, sets <code>ITenantContext</code> from the message <b>before</b> resolving tenant-aware services, and fails closed if it's missing.</li>
<li><b>Observability:</b> add the tenant to log scopes and trace attributes, and apply per-tenant rate limits.</li>
</ol>`,
keys:["Trusted tenant resolution at the edge","Scoped tenant context, avoid hidden ambient state","EF filter + write stamping + RLS","Pooling caveat","Tenant in message envelope; scope set before use; fail closed"],
trade:["Scoped DI context is explicit and testable; AsyncLocal is convenient but implicit and leaks across awaits if misused","Database-per-tenant simplifies isolation but needs a per-request connection resolution strategy"],
fu:[{q:"How do you test that no endpoint leaks data across tenants?",a:"Integration tests that create data for tenant A, then call every list and get endpoint as tenant B and assert nothing from A is returned. Generate the endpoint list from the route table so new endpoints are covered automatically."}],
rf:["Reads tenant from an X-Tenant header","Forgets tenant context in background consumers","Relies only on developers adding WHERE TenantId"]},

{id:"N062",skill:"ASP.NET Core",level:"Advanced",type:"Concept",
q:"How do IHostedService and BackgroundService behave across startup, unhandled exceptions and shutdown? What must a robust worker handle?",
a:`<ul>
<li><b>Startup:</b> the host calls <code>StartAsync</code> on each hosted service in order, before (or around) starting the web server. A slow <code>StartAsync</code> delays start-up. <code>BackgroundService.ExecuteAsync</code> runs as a long-running task; code before its first <code>await</code> runs synchronously during start-up, so yield early (<code>await Task.Yield()</code>) if setup is heavy.</li>
<li><b>Unhandled exceptions:</b> since .NET 6, an exception escaping <code>ExecuteAsync</code> is logged and <b>stops the host</b> by default (<code>BackgroundServiceExceptionBehavior.StopHost</code>). Before that it was silently swallowed and the worker died quietly. A worker loop must catch and handle per-item errors, and decide deliberately which errors are fatal.</li>
<li><b>Shutdown:</b> on SIGTERM, the stopping token passed to <code>ExecuteAsync</code> is cancelled and <code>StopAsync</code> is called. The host waits up to <code>HostOptions.ShutdownTimeout</code> (30 seconds by default in current versions). ECS gives 30 seconds between SIGTERM and SIGKILL by default (<code>stopTimeout</code>).</li>
</ul>
<p>A robust worker:</p>
<ul>
<li>Passes the stopping token everywhere.</li>
<li>Finishes or abandons the current item cleanly (for example, not acknowledging the message, so it's redelivered).</li>
<li>Creates a DI scope per item.</li>
<li>Has backoff on repeated failures.</li>
<li>Exposes health status.</li>
</ul>`,
keys:["Synchronous portion of ExecuteAsync blocks startup","StopHost default since .NET 6","Stopping token and ShutdownTimeout vs ECS stopTimeout","Per-item error handling, scope per item","Ack only after completion for clean redelivery"],
fu:[{q:"Your worker needs 60 seconds to finish its batch, but deploys kill it at 30. What do you change?",a:"Make the unit of work smaller so it finishes within the window, and make processing resumable and idempotent so an interrupted batch is retried safely. If needed, raise ECS stopTimeout and HostOptions.ShutdownTimeout together. Relying on long shutdown windows alone is fragile."}],
rf:["Thinks exceptions in BackgroundService are always swallowed","Ignores the stopping token","Heavy synchronous work at the start of ExecuteAsync"]},

{id:"N063",skill:"ASP.NET Core",level:"Advanced",type:"Scenario",
q:"One ASP.NET Core API must accept JWTs from the mobile app, cookie sessions from the admin portal, and API keys from partners. Requests sometimes authenticate with the wrong scheme or return redirects instead of 401. How do you configure it properly?",
a:`<p>Register each scheme explicitly, and decide per endpoint (or by request shape) which one applies:</p>
<pre><code>builder.Services.AddAuthentication("smart")
    .AddPolicyScheme("smart", "Select scheme", o =&gt;
        o.ForwardDefaultSelector = ctx =&gt;
            ctx.Request.Headers.ContainsKey("X-Api-Key") ? "ApiKey"
          : ctx.Request.Headers.Authorization.ToString().StartsWith("Bearer ") ? JwtBearerDefaults.AuthenticationScheme
          : CookieAuthenticationDefaults.AuthenticationScheme)
    .AddJwtBearer(o =&gt; { /* authority, audience */ })
    .AddCookie(o =&gt; { o.Events.OnRedirectToLogin = c =&gt; { c.Response.StatusCode = 401; return Task.CompletedTask; }; })
    .AddScheme&lt;ApiKeyOptions, ApiKeyHandler&gt;("ApiKey", null);</code></pre>
<ul>
<li>A <b>policy scheme</b> with <code>ForwardDefaultSelector</code> picks the scheme per request, so the default isn't silently the wrong one.</li>
<li>For APIs, override the cookie handler's redirect-to-login and access-denied events to return 401 and 403. The default 302 redirects confuse API clients.</li>
<li>Restrict endpoints to schemes with policies: <code>RequireAuthorization(p =&gt; p.AddAuthenticationSchemes("ApiKey").RequireClaim(...))</code>, so a partner key can't call admin endpoints.</li>
<li>Implement API keys as a proper <code>AuthenticationHandler</code>: hashed keys looked up in a store, mapped to a principal with scopes and a partner ID, rate-limited.</li>
</ul>
<p>Consider whether splitting the admin portal into its own app would be simpler: one scheme per application is easier to secure.</p>`,
keys:["Policy scheme / ForwardDefaultSelector","Cookie redirect → 401/403 for APIs","Endpoint-level scheme restriction via policies","API key as authentication handler with hashed keys","Considers splitting apps"],
trade:["One app with several schemes saves deployment overhead but increases the chance of a misconfigured endpoint","Separate apps cost more infrastructure but give simpler security boundaries"],
fu:[{q:"How should partner API keys be stored and rotated?",a:"Store only a hash (keys are high-entropy, so a fast hash like SHA-256 is acceptable), show the full key once at creation, allow two active keys per partner for rotation, record last-used time, and support revocation."}],
rf:["Stores API keys in plain text","Leaves cookie redirects on API endpoints","Relies on one default scheme for everything"]},

{id:"N064",skill:"ASP.NET Core",level:"Advanced",type:"Concept",
q:"How does parameter binding work in minimal APIs, and how do you customise it for types like a strongly typed ID or a complex query object?",
a:`<p>The minimal API framework infers each handler parameter's source:</p>
<ul>
<li>Route values, query string and headers for simple types.</li>
<li>The JSON body for complex types (one body parameter at most).</li>
<li>Services from DI, plus special types (<code>HttpContext</code>, <code>CancellationToken</code>, <code>ClaimsPrincipal</code>).</li>
</ul>
<p>Attributes (<code>[FromRoute]</code>, <code>[FromQuery]</code>, <code>[FromHeader]</code>, <code>[FromBody]</code>, <code>[FromServices]</code>) make it explicit. With the .NET 8 Request Delegate Generator, the binding code is generated at compile time.</p>
<p><b>Customising:</b></p>
<ul>
<li>A type with a static <b><code>TryParse(string, out T)</code></b> (or <code>IParsable&lt;T&gt;</code>) binds from route or query strings. Ideal for strongly typed IDs like <code>OrderId</code>.</li>
<li>A static <b><code>BindAsync(HttpContext, ParameterInfo)</code></b> gives full control for types built from several sources.</li>
<li><b><code>[AsParameters]</code></b> (.NET 7) binds a class or record's properties as individual parameters: a clean way to model a complex query object (filters, paging, sort).</li>
</ul>
<p>In controllers, the equivalents are custom <code>IModelBinder</code>s or type converters.</p>`,
keys:["Inference rules and explicit attributes","One body parameter","TryParse/IParsable for simple custom types","BindAsync for full control","[AsParameters] for grouped query objects"],
fu:[{q:"A route /orders/{id} uses OrderId (a record struct wrapping Guid). What does it need to bind?",a:"A static TryParse(string, out OrderId) or IParsable<OrderId> implementation. Without it, the framework treats the type as a body-bound complex type and fails or binds wrongly."}],
rf:["Binds everything from body","Reads HttpContext.Request.Query manually in every handler","Doesn't know TryParse binding"]},

{id:"N065",skill:"EF Core",level:"Advanced",type:"Concept",
q:"Walk through how EF Core executes a LINQ query, where query caching happens, and when compiled queries help.",
a:`<ol>
<li>LINQ operators on <code>IQueryable</code> build an <b>expression tree</b>.</li>
<li>On execution, EF Core <b>parameterises</b> the tree: closure-captured values become parameters, and the parameterised tree's shape becomes the <b>query cache key</b>.</li>
<li>On a cache miss, EF runs the query pipeline: navigation expansion, translation of LINQ to a relational representation, SQL generation for the provider, and building a <b>shaper</b> (compiled code that materialises rows into objects). The result is cached.</li>
<li>On a hit, EF skips compilation, binds parameter values, executes, and shapes results.</li>
</ol>
<p><b>What defeats the cache:</b> constants that vary (literal values embedded via dynamically built expressions instead of captured variables), and dynamically composed query shapes with many permutations. Each new shape compiles again, costing CPU and filling the cache.</p>
<p><b>Compiled queries</b> (<code>EF.CompileAsyncQuery((AppDb db, int id) =&gt; db.Orders.Where(o =&gt; o.Id == id))</code>) skip even the cache-key computation and lookup. They help on very hot, simple queries where EF overhead is a measurable share of the total. EF's newer precompiled queries for AOT take this further at build time.</p>`,
keys:["Expression tree → parameterisation → cache key","Translation pipeline and shaper","Cache hits skip compilation","Constants/dynamic shapes cause cache misses","Compiled queries for hot paths"],
fu:[{q:"You build filters dynamically with Expression.Constant for user values. What's the impact?",a:"Each distinct value creates a different query shape and a cache miss, so EF recompiles constantly and SQL Server sees literal values (less plan reuse, more plans). Build expressions that reference a captured variable or parameter instead, so values become SQL parameters."}],
rf:["Thinks EF translates on every execution regardless","Unaware of the cache key concept","Uses compiled queries everywhere without measurement"]},

{id:"N066",skill:"EF Core",level:"Advanced",type:"Concept",
q:"What do DbContext pooling and compiled models solve, and what are their caveats?",
a:`<p><b>DbContext pooling</b> (<code>AddDbContextPool</code> or <code>AddPooledDbContextFactory</code>) reuses context instances instead of constructing one per request. EF resets their state (change tracker and so on) when returned. It saves allocation and setup cost, which shows up in high-throughput APIs with simple queries.</p>
<p>Caveats:</p>
<ul>
<li>The context's constructor runs only once, so <b>per-request state can't be injected through the constructor</b> (tenant ID, current user). Set it after leasing, through a scoped service that configures the leased context, or a pooled factory wrapper.</li>
<li>Custom fields you add to the context aren't reset automatically.</li>
<li>Pooled contexts can't use <code>OnConfiguring</code> with per-request options.</li>
</ul>
<p><b>Compiled models</b> (<code>dotnet ef dbcontext optimize</code>, EF Core 6+) generate the model as code. For large models (hundreds of entity types), building the model at first use takes seconds; a compiled model cuts start-up time sharply, which helps Lambda and autoscaling. The caveat: you must regenerate it whenever the model changes (wire it into the build), and some features had limitations in earlier versions.</p>`,
keys:["Pooling reuses instances with state reset","Constructor runs once: no per-request ctor state","Compiled models for start-up with large models","Regeneration requirement","Measure benefit"],
trade:["Pooling gains throughput, adds subtle bugs with per-request state","Compiled models cut start-up but add a build step that can go stale"],
fu:[{q:"How do you combine pooling with a per-request tenant ID?",a:"Use AddPooledDbContextFactory, then a scoped wrapper that creates a context from the factory and sets the tenant property on it (and resets it on return). Query filters read that property, so each lease has the right tenant."}],
rf:["Turns on pooling with constructor-injected scoped services","Doesn't regenerate compiled models"]},

{id:"N067",skill:"EF Core",level:"Advanced",type:"Architecture",
q:"Design auditing (who changed what, when) and domain event dispatch using EF Core. Where do you hook in, and what are the pitfalls?",
a:`<p><b>Hook point:</b> a <code>SaveChangesInterceptor</code> (<code>SavingChangesAsync</code>), or a <code>SaveChanges</code> override, inspecting <code>ChangeTracker.Entries()</code> before saving.</p>
<p><b>Auditing:</b> for each Added, Modified or Deleted entry, record the entity type, key, changed properties (original vs current values from <code>entry.Properties</code>), the user from an injected <code>ICurrentUser</code>, and a UTC timestamp. Write audit rows as entities in the <b>same SaveChanges</b>, so they commit atomically. Database-generated keys aren't known until after insert, so capture them in <code>SavedChangesAsync</code> or use client-generated keys.</p>
<p><b>Domain events:</b> aggregates collect events in a list. In the interceptor, gather them from tracked aggregates and either:</p>
<ul>
<li>Write them to an <b>outbox table</b> in the same transaction. A relay publishes them later. This is the reliable choice for integration events.</li>
<li>Dispatch in-process handlers <b>after</b> a successful save, for side effects within the service.</li>
</ul>
<p><b>Pitfalls:</b></p>
<ul>
<li><code>ExecuteUpdate</code>/<code>ExecuteDelete</code> and raw SQL bypass interceptors, so audits are silently missing.</li>
<li>Handlers that call <code>SaveChanges</code> again cause re-entrancy and recursion.</li>
<li>Dispatching before commit means a rollback leaves events already sent.</li>
<li>Auditing every property of high-churn tables explodes storage; choose what matters.</li>
</ul>
<p>For compliance-grade history, consider database-level temporal tables (SQL Server; EF Core 6+ supports them) alongside application audit.</p>`,
keys:["Interceptor/ChangeTracker inspection","Audit rows in same transaction","Generated key timing","Outbox vs post-commit in-process dispatch","Bypass and re-entrancy pitfalls; temporal tables"],
trade:["Application-level audit captures user context; DB triggers or temporal tables capture everything but lack user identity unless passed in","Outbox adds a table and relay but guarantees events match committed state"],
fu:[{q:"How do you capture 'who' in a background job with no HTTP user?",a:"ICurrentUser resolves from the job context: the job carries the initiating user ID or a system identity like 'system:nightly-import'. Never leave it null. Audits without an actor are much less useful."}],
rf:["Dispatches integration events before commit","Unaware ExecuteUpdate bypasses audit","Audits in a separate SaveChanges that can fail independently"]},

{id:"N068",skill:"EF Core",level:"Advanced",type:"Scenario",
q:"A background worker injects one DbContext at start-up and reuses it in a loop processing messages. Over days, memory grows, processing slows, and it sometimes acts on stale data. Explain and fix.",
a:`<p>A long-lived <code>DbContext</code> keeps <b>every entity it ever loaded</b> in the change tracker (identity map). Memory grows without bound, and <code>DetectChanges</code> during <code>SaveChanges</code> gets slower with every tracked entity. Because of identity resolution, a tracked entity is <b>not refreshed</b> when queried again: EF returns the tracked instance, so changes made by other processes are invisible. That's the stale data. After a failed <code>SaveChanges</code>, the context also keeps the failed changes, which pollute later saves.</p>
<p><b>Fix:</b> <b>one context per unit of work</b>. For each message, create a DI scope (<code>IServiceScopeFactory</code>) or use <code>IDbContextFactory</code> to create a context, process, save, and dispose. If you really must reuse a context, call <code>ChangeTracker.Clear()</code> between units of work, and use no-tracking queries for reads.</p>`,
keys:["Unbounded change tracker growth","DetectChanges cost grows","Identity map returns stale instances","Failed changes linger","Context per unit of work via scope/factory"],
fu:[{q:"Is DbContext thread-safe if the worker processes messages in parallel?",a:"No. A DbContext must not be used concurrently. Parallel processing needs one context per concurrent unit of work, which context-per-message gives you naturally."}],
rf:["Registers DbContext as singleton for workers","Calls GC.Collect","Uses AsNoTracking everywhere but still saves through the same long-lived context"]},

{id:"N069",skill:"EF Core",level:"Advanced",type:"Scenario",
q:"Three developers each added EF Core migrations on separate branches. After merging, the model snapshot conflicts, and one environment fails with 'There is already an object named…'. How do you resolve it and prevent it?",
a:`<p>Each migration's designer file and the shared <code>ModelSnapshot</code> were generated from different starting states. Merged naively, the snapshot no longer matches the sum of the migrations, and the order of migrations (by timestamp) may not match the order they were applied in each environment.</p>
<p><b>Resolve:</b></p>
<ol>
<li>Pick the migrations already applied in shared environments. Those are fixed history and must not change.</li>
<li>For unapplied migrations on the merged branch: remove them (<code>dotnet ef migrations remove</code>, or delete the files and restore the snapshot from the target branch), then generate <b>one new migration</b> from the merged model, so the snapshot is regenerated correctly.</li>
<li>For the broken environment, compare <code>__EFMigrationsHistory</code> with the migration list, and fix the drift with a script reviewed against the actual schema. Never by editing history rows blindly.</li>
</ol>
<p><b>Prevent:</b></p>
<ul>
<li>Rebase onto main and regenerate the migration before merging. Treat the snapshot as merge-sensitive.</li>
<li>Run a CI check that migrations apply cleanly from empty and from the current production schema, and that the model has no pending changes (EF Core 9 fails <code>Migrate()</code> on pending model changes by default).</li>
<li>Generate the deploy SQL script in CI for review.</li>
</ul>`,
keys:["Snapshot represents cumulative model; conflicts corrupt it","Never rewrite applied migrations","Remove + regenerate unapplied ones","Fix environment drift carefully","CI checks: apply from scratch, pending changes, rebase rule"],
fu:[{q:"Can you just edit the snapshot by hand to resolve the conflict?",a:"Sometimes for trivial conflicts, but it's error-prone, and a wrong snapshot silently produces wrong future migrations. Regenerating from the merged model is safer; verify with a pending-model-changes check."}],
rf:["Edits applied migrations","Deletes rows from __EFMigrationsHistory to make it run","No CI validation of migrations"],
verify:"EF Core 9's PendingModelChangesWarning-as-error behaviour; confirm for your version."},

{id:"N070",skill:"ADO.NET & Dapper",level:"Advanced",type:"Scenario",
q:"Code wraps two repository calls (EF Core and Dapper, separate connections) in a TransactionScope inside async methods. Sometimes it throws about transactions or MSDTC, and sometimes one write commits without the other. Explain and fix.",
a:`<p>Several problems combine:</p>
<ul>
<li><b>Async flow:</b> without <code>TransactionScopeAsyncFlowOption.Enabled</code>, the ambient transaction doesn't flow across <code>await</code>s. Code after an await may run outside the transaction, or the scope throws when disposed on a different thread.</li>
<li><b>Escalation:</b> two connections enlisting in one <code>TransactionScope</code> can escalate to a <b>distributed transaction</b>. On Linux containers that isn't supported (.NET 7 re-added distributed transactions on Windows only), so it throws.</li>
<li><b>Separate connections</b> also mean the two writes may not share the same local transaction at all, which explains the partial commits.</li>
</ul>
<p><b>Fix:</b> avoid ambient distributed transactions. Use <b>one connection and one explicit local transaction</b>: begin it through EF (<code>db.Database.BeginTransactionAsync()</code>), and pass <code>db.Database.GetDbConnection()</code> plus <code>tx.GetDbTransaction()</code> to Dapper. Then <code>SaveChangesAsync</code> and commit. If the writes really target two different databases or services, use an outbox or saga instead of a distributed transaction.</p>`,
keys:["TransactionScopeAsyncFlowOption.Enabled","Escalation to distributed transactions; Linux limitation","Separate connections ≠ one transaction","Single connection + explicit transaction shared with Dapper","Outbox/saga across databases"],
fu:[{q:"If you must keep TransactionScope, what settings matter?",a:"TransactionScopeAsyncFlowOption.Enabled, an explicit isolation level (the default is Serializable, which is usually far too strict and causes blocking), a timeout, and one connection opened inside the scope to avoid escalation."}],
rf:["Doesn't know about async flow option","Assumes MSDTC works in Linux containers","Accepts default Serializable isolation unknowingly"]},

{id:"N071",skill:"ADO.NET & Dapper",level:"Advanced",type:"Concept",
q:"How do you read very large result sets or large binary columns efficiently with ADO.NET or Dapper, without loading everything into memory?",
a:`<ul>
<li><b>Stream rows:</b> use <code>DbDataReader</code> directly, and process each row as it's read. With Dapper, use unbuffered queries (<code>buffered: false</code>, or the unbuffered async APIs in Dapper 2.x returning <code>IAsyncEnumerable</code>). Dapper's default <code>Query</code> buffers everything into a list.</li>
<li><b>Large blobs and text:</b> execute with <code>CommandBehavior.SequentialAccess</code>, then read columns in order and use <code>reader.GetStream(i)</code> or <code>GetTextReader(i)</code> to copy straight to the destination (S3, the HTTP response) in chunks. That avoids materialising a 200 MB <code>byte[]</code> on the LOH.</li>
<li><b>Connection lifetime:</b> streaming holds the connection (and possibly locks, depending on isolation) for the whole read. Keep consumers fast, set command timeouts, and consider snapshot isolation or reading from a replica for long exports.</li>
<li><b>Server-side batching:</b> for jobs, keyset pagination through the table in chunks is often more robust than one giant streamed query, because each chunk can be retried independently.</li>
</ul>`,
keys:["Unbuffered reading (reader / Dapper unbuffered)","SequentialAccess + GetStream for blobs","LOH avoidance","Connection/lock duration trade-off","Keyset chunking alternative"],
trade:["Streaming minimises memory but holds connections longer","Chunking is retryable and gentler on locks, at the cost of more queries"],
fu:[{q:"Should large files be stored in the database at all?",a:"Usually not. Object storage (S3) is cheaper and streams better. Store metadata and the object key in the DB. Keep binaries in the DB only when transactional consistency with rows is a hard requirement and sizes are modest."}],
rf:["Default buffered Dapper query for millions of rows","Reads blobs into byte arrays","Unaware of SequentialAccess"],
verify:"Dapper's unbuffered async API names vary by version (QueryUnbufferedAsync in Dapper 2.x); check the version you use."},

{id:"N072",skill:"Testing (xUnit/Moq)",level:"Advanced",type:"Architecture",
q:"Design the test strategy for an event-driven .NET service: it consumes Kafka events, updates PostgreSQL, and publishes events through an outbox.",
a:`<p><b>Layers:</b></p>
<ul>
<li><b>Unit:</b> domain logic and handlers with fakes. Given an input event and current state, assert the resulting state changes and emitted events. Cover idempotency (the same event twice produces no change the second time), out-of-order and stale versions, and poison inputs.</li>
<li><b>Integration (per service):</b> real PostgreSQL via Testcontainers, and real Kafka via Testcontainers or Redpanda. Tests produce an event, wait for the outcome with a polling helper and a timeout (never fixed sleeps), and assert on DB state and on the outbox or published topic. Include consumer restart (offset handling), redelivery, and DLT routing.</li>
<li><b>Contract:</b> event schemas checked against the registry or consumer contracts in CI, so producers can't break consumers.</li>
<li><b>End-to-end:</b> a few critical flows in a deployed environment, kept small because they're slow and flaky by nature.</li>
</ul>
<p><b>Determinism:</b> inject the clock, use unique keys and topics per test (or reset state), and expose a test hook to await "consumer idle" rather than guessing timing.</p>
<p>The aim is that most correctness is proven in fast unit and integration tests, with contracts preventing cross-team breakage.</p>`,
keys:["Unit tests include idempotency/ordering/poison cases","Real broker + DB in integration tests","Polling assertions, no sleeps","Contract tests for event schemas","Few E2E tests; determinism techniques"],
trade:["Real Kafka in tests catches serialisation and offset bugs but costs start-up time","In-memory bus fakes are fast but miss broker semantics","It depends on: team size, number of event contracts, CI budget"],
fu:[{q:"How do you assert that an event was NOT processed twice?",a:"Send the same event (same ID) twice, wait until the consumer has committed past both (via lag reaching zero or a test hook), then assert that the side-effect count or state version changed exactly once."}],
rf:["Only end-to-end tests","Thread.Sleep(5000) in tests","No idempotency or redelivery tests"]},

{id:"N073",skill:"Testing (xUnit/Moq)",level:"Advanced",type:"Scenario",
q:"Code coverage is 88%, yet regressions keep reaching production. How do you find out whether the tests are actually any good, and what do you change?",
a:`<p>Coverage only measures which lines <i>executed</i>, not whether any assertion would fail if behaviour changed. Teams chasing a coverage target often write tests with weak or no assertions.</p>
<p><b>Measure test effectiveness:</b></p>
<ul>
<li><b>Mutation testing</b> (Stryker.NET) introduces small changes in the code (flip a condition, change a boundary, remove a call) and checks whether tests fail. Surviving mutants show untested behaviour. Run it on critical modules, not the whole codebase each build.</li>
<li><b>Escaped-defect analysis:</b> for each production bug, ask why no test caught it. Was it no test, a wrong level, a missing case, or environment differences?</li>
</ul>
<p><b>Changes that usually follow:</b></p>
<ul>
<li>Assertions on outcomes and edge cases (boundaries, nulls, concurrency), not just "doesn't throw".</li>
<li>Integration tests for the seams where bugs actually appear: SQL, serialisation, config, auth.</li>
<li>A regression test written <b>first</b> for every bug fix.</li>
<li>Drop coverage as a hard target. Track mutation score on critical code and escaped defects instead.</li>
</ul>`,
keys:["Coverage measures execution, not verification","Mutation testing (Stryker.NET)","Escaped-defect root cause analysis","Test at the seams where bugs occur","Regression test per bug; better metrics"],
trade:["Mutation testing is slow; scope it to critical modules or run nightly","Dropping coverage targets can feel like lowering the bar; replace them with better signals rather than none"],
fu:[{q:"A surviving mutant flips '>=' to '>' in a discount rule. What does that tell you?",a:"No test checks the exact boundary value. Add tests at, just below and just above the threshold. Boundary bugs are among the most common in pricing and eligibility rules."}],
rf:["Raises coverage target to 95%","Blames QA","No analysis of escaped bugs"]},

{id:"N074",skill:"Testing (xUnit/Moq)",level:"Advanced",type:"Concept",
q:"How do you test concurrency-sensitive code, such as an inventory reservation that must never oversell?",
a:`<ul>
<li><b>Hammer tests against the real database:</b> run many concurrent attempts with <code>Parallel.ForEachAsync</code> or <code>Task.WhenAll</code> (for example 200 attempts on 10 units), using separate DB contexts and connections. Assert the <b>invariant</b>: exactly 10 succeed, stock is 0, never negative. Repeat the test multiple times, because races are probabilistic.</li>
<li><b>Force interleavings deterministically</b> where possible: inject hooks or barriers (<code>TaskCompletionSource</code>) so test code pauses one operation between read and write while another runs, reproducing the exact race.</li>
<li><b>Property-based testing</b> (FsCheck, CsCheck): generate random sequences of operations and check invariants hold after each, which finds edge cases humans don't write.</li>
<li><b>Test the database mechanism directly:</b> verify the unique constraint, conditional update or row version actually rejects the conflicting write.</li>
<li>Run these in CI against the real engine. In-memory fakes don't reproduce DB locking or isolation behaviour.</li>
</ul>`,
keys:["Invariant-based hammer tests on real DB","Deterministic interleaving via barriers/hooks","Property-based testing","Test DB-level guards directly","Real engine, not fakes"],
fu:[{q:"The hammer test passes 99 times out of 100. Is the code correct?",a:"No. One failure means the race exists. A probabilistic test that passes most of the time is evidence of a bug, not of correctness. Reproduce it deterministically with forced interleaving, then fix it."}],
rf:["Single-threaded tests for concurrent code","Accepts intermittent failures as flakiness","Uses in-memory provider for locking tests"]},

{id:"N075",skill:".NET Performance & Diagnostics",level:"Advanced",type:"Scenario",
q:"An API on ECS tasks with 1 vCPU and 2 GB shows p99 spikes every few seconds. Counters show frequent gen 2 GCs and high % time in GC. How do you tune it?",
a:`<ol>
<li><b>Reduce allocation first.</b> Tuning GC settings treats symptoms. Find large and long-lived allocations (gen 2 and LOH growth) with a memory profile: big buffers, caches that grow, large JSON documents, <code>MemoryStream</code> usage.</li>
<li><b>Check the GC mode for the container size.</b> Server GC (the ASP.NET Core default) creates heaps per core and is tuned for throughput with more memory. With 1 vCPU, .NET sees one processor, so the benefit is small. Options:
  <ul>
  <li>Try <b>Workstation (concurrent) GC</b> for lower pause impact on small containers.</li>
  <li>Keep Server GC with <b>DATAS</b> (default from .NET 9), which adapts heap count to load.</li>
  <li>Set <code>GCHeapCount</code> or <code>GCConserveMemory</code> explicitly.</li>
  </ul></li>
<li><b>Check the memory limit.</b> The GC heap hard limit defaults to 75% of the container limit. If the heap runs near that limit, the GC collects aggressively. Raise the task memory, or cut retained memory.</li>
<li><b>Size the tasks appropriately.</b> Fewer, larger tasks (2 vCPU) sometimes perform better than many tiny ones for GC-heavy .NET apps.</li>
<li><b>Verify each change</b> with p99 latency and % time in GC under the same load test.</li>
</ol>`,
keys:["Allocation reduction before knobs","Server vs Workstation in small containers; DATAS","Heap hard limit vs container memory","Task sizing as a lever","Measure each change under load"],
trade:["Workstation GC lowers pauses on small boxes but may reduce throughput","Bigger tasks improve GC behaviour but reduce bin-packing efficiency and blast-radius isolation"],
fu:[{q:"Which counters tell you GC is the problem rather than something else?",a:"% Time in GC (since last GC) rising, gen 2 collection count climbing, GC heap size near the limit, and LOH or POH size growing. Then correlate GC pause events from a trace (GC/Start and GC/Stop) with the latency spikes."}],
rf:["Calls GC.Collect periodically","Only adds memory without investigating","Changes GC settings without measuring"],
verify:"Default GC settings (DATAS, heap hard limit behaviour) vary by .NET version; confirm for your runtime."},

{id:"N076",skill:".NET Performance & Diagnostics",level:"Advanced",type:"Scenario",
q:"Throughput is low and latency high, yet CPU sits at 30% and the database is idle. Thread count is normal. What in-process issue might this be, and how do you prove it?",
a:`<p>Low CPU, idle database and high latency suggest requests are <b>waiting on something inside the process</b>. A prime suspect is <b>lock contention</b>: a <code>lock</code> around a shared resource (a cache, a static <code>Random</code>, a logger sink, a hand-written connection wrapper) that every request passes through. Requests queue behind it, so the effective parallelism collapses to one.</p>
<p><b>Prove it:</b></p>
<ul>
<li><code>dotnet-counters</code>: <b>Monitor Lock Contention Count</b> rising sharply.</li>
<li><code>dotnet-trace</code> with contention events (or a profiler's "waits" view) shows which lock and which call stacks contend.</li>
<li>A dump during the slowdown shows many threads blocked in <code>Monitor.Enter</code> on the same object.</li>
</ul>
<p><b>Fix:</b></p>
<ul>
<li>Shrink the critical section, so only the shared mutation is under the lock.</li>
<li>Use lock-free or concurrent structures (<code>ConcurrentDictionary</code>, <code>Interlocked</code>).</li>
<li>Shard the lock by key.</li>
<li>Remove shared state (per-request objects, or <code>Random.Shared</code>, which is thread-safe).</li>
</ul>
<p>Also check for synchronous I/O inside a lock, which turns a short critical section into a long one. .NET 9's <code>System.Threading.Lock</code> type is a faster dedicated lock, but it doesn't fix contention.</p>`,
keys:["Low CPU + low DB load → in-process wait","Lock contention counter and trace events","Dump to see blocked threads","Smaller critical sections, concurrent structures, sharding","No I/O inside locks"],
fu:[{q:"Could it be thread-pool starvation instead? How would you tell?",a:"Starvation shows a growing ThreadPool Queue Length and a steadily climbing thread count (the pool injecting threads slowly), with threads blocked on sync-over-async waits. Contention shows a high lock-contention count with threads blocked in Monitor.Enter. Counters and a dump separate the two quickly."}],
rf:["Scales instances without diagnosing","Blames the database","Doesn't know contention counters exist"]},

{id:"N077",skill:".NET Performance & Diagnostics",level:"Advanced",type:"Concept",
q:"Explain tiered compilation, ReadyToRun and dynamic PGO. How do they affect start-up versus steady-state performance, for example on Lambda?",
a:`<ul>
<li><b>Tiered compilation</b> (default since .NET Core 3.0): methods first get a quick, unoptimised JIT (tier 0) for fast start-up. Hot methods (called often, or with loops, through on-stack replacement) are recompiled with full optimisation (tier 1) in the background.</li>
<li><b>Dynamic PGO</b> (on by default in .NET 8): tier 0 code is instrumented to collect runtime profile data (which types appear at call sites, which branches are taken). Tier 1 uses it to devirtualise, inline and lay out code for actual usage. That often gives a significant steady-state speed-up.</li>
<li><b>ReadyToRun</b> (R2R): assemblies are precompiled to native code at publish time, so start-up skips most JIT work. The code is somewhat less optimised, but tiering can still rejit hot methods to tier 1 with PGO. Larger binaries.</li>
<li><b>Native AOT</b> removes the JIT entirely: fastest start-up, no tiering or dynamic PGO.</li>
</ul>
<p><b>On Lambda:</b> cold starts are dominated by start-up, so R2R (or Native AOT where compatible) helps most. SnapStart for .NET (where available) snapshots an initialised environment. For long-running ECS services, the default (tiered with dynamic PGO, optionally R2R for faster scale-out) gives the best steady state.</p>`,
keys:["Tier 0 → tier 1 with OSR","Dynamic PGO default in .NET 8","R2R trade-off: start-up vs code quality","AOT: no JIT, no PGO","Workload-based choice (Lambda vs long-running)"],
fu:[{q:"Why might a benchmark of the first 100 requests after deployment look worse than steady state?",a:"Those requests run tier-0 or R2R code while the JIT is still promoting hot methods, and caches and connection pools are cold. That's why load tests should warm up first, and why scaling out under a traffic spike briefly costs performance."}],
rf:["Thinks the JIT optimises everything fully on first call","Unaware of dynamic PGO","Uses AOT for long-running services without measuring"],
verify:"Lambda SnapStart support for .NET runtimes; check current availability."},
