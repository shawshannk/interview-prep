<li><b>Native backup and restore with log shipping-style catch-up:</b> RDS supports restoring native backups from S3, including differential and log restores with <code>NORECOVERY</code>. Restore the full backup, then apply log backups repeatedly until cutover. At cutover, take a final tail-log backup, restore it with recovery, and switch. This is usually the most reliable path for SQL Server to SQL Server, and the downtime is the final log apply plus switchover.</li>
<li><b>AWS DMS</b> full load plus CDC: works across engines, but for homogeneous SQL Server moves it can miss some objects (it moves data, not every schema object) and has data type caveats. Validate carefully.</li>
</ul>
<p><b>Cutover plan:</b></p>
<ol>
<li>Freeze schema changes.</li>
<li>Pre-create logins, jobs, linked replacements and monitoring.</li>
<li>Run a full rehearsal and time it.</li>
<li>At cutover: stop application writes, final log backup and restore, validation (row counts and checksums on key tables, smoke tests), switch connection strings or DNS, re-enable writes.</li>
<li>Keep the on-prem database read-only as a rollback option for a defined period, with a plan for reverse sync if needed.</li>
</ol>`,
keys:["RDS feature/edition/network assessment","Native backup/restore with log catch-up as primary path","DMS as alternative with caveats","Rehearsed cutover with validation","Rollback plan and schema freeze"],
trade:["Native restore: high fidelity for SQL Server to SQL Server, needs log chain discipline","DMS: flexible and continuous, but needs object-level validation and type checks","It depends on: downtime target, network bandwidth, features in use"],
fu:[{q:"How do you validate that the migrated data matches?",a:"Row counts per table plus checksums or hash aggregates (for example CHECKSUM_AGG over key columns in ranges) on critical tables, application smoke tests on key journeys, and DMS validation if DMS is used. Agree acceptance criteria before cutover."}],
rf:["Single full backup/restore during a long outage","No rehearsal","No rollback option"],
verify:"RDS for SQL Server feature support and native restore capabilities change over time; confirm for your version and edition."},

{id:"Q072",skill:"Schema Evolution & Migrations",level:"Advanced",type:"Scenario",
q:"Your SaaS uses a database per tenant: 300 databases on a few servers. A schema migration must be applied to all of them. Last time, 12 failed halfway and the app broke for those tenants. Design a safer process.",
a:`<ul>
<li><b>Track the version per tenant database</b> (each database's migration history table, plus a central registry of tenant to schema version). The deploy orchestrator knows exactly which tenants are on which version.</li>
<li><b>Backward-compatible migrations only</b> (expand and contract), so the application works with both the old and new schema. A partially rolled-out migration then breaks no tenant. This is the most important rule.</li>
<li><b>Orchestrate in waves:</b> internal and test tenants, then a canary group of small tenants, then the rest in batches with limited parallelism per database server (so you don't saturate shared I/O), and the largest tenants last or in scheduled windows.</li>
<li><b>Make each migration idempotent and safe to retry</b> (<code>IF NOT EXISTS</code> guards, resumable backfills). Run each tenant's migration in a transaction where the DDL allows it.</li>
<li><b>Stop on error thresholds:</b> halt the rollout automatically if failures exceed a small number. Report per-tenant status, and retry failed tenants after fixing.</li>
<li><b>Application deploys</b> gate features on the tenant's schema version where needed, or deploy only after all tenants reach the expanded schema.</li>
</ul>`,
keys:["Per-tenant version tracking and registry","Backward-compatible migrations as core safety","Waves: canary → batches, throttled per server","Idempotent, retryable migrations","Error thresholds and per-tenant status"],
trade:["Waves reduce blast radius but lengthen rollout","Database-per-tenant isolates tenants but multiplies migration and operations cost"],
fu:[{q:"One huge tenant needs a 2-hour backfill. How do you fit it in?",a:"Split the migration: the fast DDL (expand) goes out in the normal wave. The backfill runs as a separate throttled background job for that tenant, and the contract step waits until it completes. The tenant stays on the compatible schema throughout."}],
rf:["Runs all 300 at once in parallel","Non-backward-compatible migrations","No per-tenant tracking"]},

{id:"Q073",skill:"Schema Evolution & Migrations",level:"Advanced",type:"Concept",
q:"After a data migration or large backfill, how do you prove the data is correct before switching over?",
a:`<p>Agree <b>acceptance criteria</b> before running the migration, then check several layers:</p>
<ul>
<li><b>Completeness:</b> row counts per table, and per meaningful partition (per tenant, per month), between source and target. Count rows still missing the new value (<code>WHERE new_col IS NULL</code>).</li>
<li><b>Content equality:</b> hash aggregates over ranges of rows (for example an MD5 or <code>CHECKSUM_AGG</code> of concatenated key and value columns, bucketed by key range), compared between source and target, then drilling into mismatched buckets. Within one database, <code>EXCEPT</code> queries in both directions find differing rows exactly.</li>
<li><b>Transformation rules:</b> targeted assertions on the transformed fields (no negative amounts, units converted correctly, enum mappings complete), and reconciliation of business totals (sum of order amounts per month must match).</li>
<li><b>Sampling with eyes:</b> a random sample reviewed by someone who knows the domain. That catches semantic errors that checks pass.</li>
<li><b>Shadow reads:</b> the application reads from both old and new paths for a period, logs mismatches, and serves the old result.</li>
</ul>
<p>Automate the checks as a repeatable script, so they run on rehearsal and real cutover alike, and keep the results as evidence.</p>`,
keys:["Acceptance criteria defined upfront","Counts by partition, NULL checks","Bucketed hash comparisons; EXCEPT both ways","Business-total reconciliation and rule assertions","Shadow reads; automated, repeatable evidence"],
fu:[{q:"Hash totals match, but users report wrong data. How?",a:"The checks compared fields that weren't transformed, or the transformation itself was wrong consistently on both sides (if the check ran against output of the same logic). Validate transformed fields against independent rules or the original source, not the migrated copy."}],
rf:["Only row counts","No predefined acceptance criteria","Manual spot checks only"]},

{id:"Q074",skill:"Caching (Redis)",level:"Advanced",type:"Concept",
q:"How durable and consistent is Redis replication? If the team wants to store data in Redis that must not be lost, what are the options?",
a:`<p>Redis replication is <b>asynchronous</b>. The primary acknowledges a write to the client before replicas receive it. If the primary fails, a replica is promoted (ElastiCache or Sentinel failover), and writes not yet replicated are <b>lost</b>, even though clients were told they succeeded. Persistence (RDB or AOF) on the failed primary doesn't help if the node is replaced.</p>
<ul>
<li><b><code>WAIT numreplicas timeout</code></b> blocks until a number of replicas acknowledge the write. That reduces the loss window, but it isn't a full consensus guarantee: a failover can still choose a replica that lacks the write in some scenarios.</li>
<li><b>AOF with <code>appendfsync always</code></b> protects against process crashes on the same node, at a large throughput cost. It doesn't help with node loss.</li>
<li><b>Amazon MemoryDB:</b> Redis/Valkey-compatible, with a <b>multi-AZ durable transaction log</b>. Writes are acknowledged only after being persisted to it, so it can be a primary database. Higher write latency and cost than ElastiCache.</li>
<li><b>Design so loss is acceptable:</b> keep the source of truth in a durable database, and let Redis be a cache or derived store that can be rebuilt (leaderboards rebuilt from the DB, sessions re-established by re-login).</li>
</ul>`,
keys:["Async replication, acknowledged writes can be lost","WAIT reduces but doesn't eliminate risk","AOF fsync trade-off; doesn't cover node loss","MemoryDB for durable primary use","Design Redis data as rebuildable"],
fu:[{q:"Is a distributed lock in Redis safe across a failover?",a:"Not fully. A lock acquired on the primary may not have replicated before failover, so the new primary doesn't know about it and another client can acquire the same lock. Use fencing tokens or a consensus-based store when correctness depends on the lock."}],
rf:["Assumes ElastiCache replication is synchronous","Stores orders only in Redis","Thinks AOF alone guarantees durability"]},

{id:"Q075",skill:"Caching (Redis)",level:"Advanced",type:"Architecture",
q:"Design a leaderboard for 10 million users with Redis: global rank, top 100, 'players around me', and weekly resets. How do you make it reliable?",
a:`<p><b>Core structure:</b> a <b>sorted set</b> per leaderboard (<code>lb:weekly:2026-W42</code>), with member = userId and score = points.</p>
<ul>
<li>Update: <code>ZINCRBY</code> (atomic), O(log N).</li>
<li>Top 100: <code>ZREVRANGE key 0 99 WITHSCORES</code>.</li>
<li>My rank: <code>ZREVRANK key userId</code>, O(log N).</li>
<li>Around me: get my rank r, then <code>ZREVRANGE key r-5 r+5</code>.</li>
<li>Hydrate display names and avatars with a pipelined <code>MGET</code> or <code>HMGET</code> from a cache of profiles.</li>
</ul>
<p><b>Ties:</b> encode a tie-breaker into the score (for example points × 10^6 plus an inverted timestamp component, within double precision limits) so equal scores are ordered by who reached them first.</p>
<p><b>Weekly reset:</b> use a new key per period (keyed by week), so there's no reset operation. Set a TTL on old keys after the results are archived.</p>
<p><b>Reliability:</b> the <b>source of truth is the database</b> (score events or per-user totals). Redis is derived. On data loss or corruption, rebuild the sorted set from the DB with a batch job. Score updates flow from the DB transaction via an outbox or stream, so Redis can't diverge permanently.</p>
<p><b>Scale:</b> 10 million members in one sorted set is fine memory-wise (on the order of a gigabyte), but it lives on <b>one shard</b>, so all leaderboard traffic hits one node. Add read replicas for rank reads, cache the top 100 for a few seconds, and if needed split by region or bracket.</p>`,
keys:["Sorted set operations and complexity","Tie-break encoding in score","Key per period instead of reset","DB as source of truth, rebuildable Redis","Single-shard hot key; replicas and caching"],
trade:["Exact real-time ranks on one sorted set are simple but concentrate load on one shard","Bracketed or regional boards scale horizontally but complicate the 'global rank' feature"],
fu:[{q:"How would you show an approximate global percentile cheaply for every user?",a:"Compute rank once via ZREVRANK and divide by ZCARD (both cheap), cache it per user for a minute, or precompute score-bucket histograms periodically and show percentile ranges instead of exact ranks."}],
rf:["SQL ORDER BY on every request for 10M rows","Treats Redis as the only copy of scores","Deletes and repopulates the key for resets"]},

{id:"Q076",skill:"Caching (Redis)",level:"Advanced",type:"Scenario",
q:"A bot hammers the API with random, non-existent product IDs. Each request misses the cache and queries the database, which is now struggling. How do you defend against cache penetration?",
a:`<p>Cache-aside only caches things that exist. Requests for IDs that don't exist <b>always miss</b> and always reach the database, so an attacker (or a buggy client) can bypass the cache entirely.</p>
<p><b>Defences, used together:</b></p>
<ul>
<li><b>Negative caching:</b> cache "not found" results (<code>product:{id} → NULL</code> marker) with a <b>short TTL</b> (seconds to minutes), so repeated lookups of the same missing ID are absorbed. It doesn't help against <i>unique</i> random IDs, and can fill memory, so keep TTLs short and values tiny.</li>
<li><b>Bloom filter</b> of existing IDs (kept in Redis via a Bloom filter module, or in process, rebuilt periodically and updated on creates). If the filter says "definitely not present", reject the request without touching the cache or DB. False positives fall through to the normal path, which is fine.</li>
<li><b>Validate early:</b> reject malformed IDs (wrong format, out of range) before any lookup.</li>
<li><b>Rate limiting</b> per client, IP or API key, plus <b>WAF or bot rules</b> for abusive patterns.</li>
<li><b>Protect the DB</b> with a concurrency limit on this endpoint's DB calls, so an attack degrades only this path.</li>
</ul>`,
keys:["Explains penetration (misses on non-existent keys)","Negative caching with short TTL and its limits","Bloom filter for existence checks","Input validation, rate limiting, WAF","DB concurrency protection"],
trade:["Negative caching is simple but doesn't stop unique random keys and uses memory","Bloom filters stop most bogus lookups but need maintenance and accept false positives"],
fu:[{q:"How do you keep a Bloom filter correct when products are deleted?",a:"Standard Bloom filters can't remove items. Deleted IDs remain 'maybe present' and fall through to the DB, which is acceptable if deletions are rare. Rebuild the filter periodically from the source, or use a counting or cuckoo filter variant if deletions matter."}],
rf:["Caches nothing for misses","Blocks the endpoint entirely","Long TTLs on negative entries (new products invisible)"]},

{id:"Q077",skill:"Caching (Redis)",level:"Advanced",type:"Concept",
q:"Redis Streams vs Kafka vs SQS for background work and events: how do Redis Streams work, and when are they an appropriate choice?",
a:`<p><b>Redis Streams</b> are append-only logs (<code>XADD</code>) with IDs ordered by time. <b>Consumer groups</b> (<code>XREADGROUP</code>) distribute entries among consumers. Each delivered entry sits in the group's <b>pending entries list (PEL)</b> until acknowledged with <code>XACK</code>. Unacknowledged entries from crashed consumers can be reclaimed with <code>XAUTOCLAIM</code> after an idle time, which gives at-least-once processing. Streams are trimmed by length or ID (<code>MAXLEN ~ N</code>, <code>MINID</code>) to bound memory.</p>
<p><b>Compared with alternatives:</b></p>
<ul>
<li><b>vs SQS:</b> SQS is fully managed and durable, with built-in visibility timeouts, DLQs and effectively unlimited backlog. Redis Streams are faster with lower latency and support multiple consumer groups and replay, but are memory-bound, and their durability equals your Redis setup (async replication can lose recent entries on failover).</li>
<li><b>vs Kafka:</b> Kafka gives durable disk-based retention, partitions for parallel ordered processing, huge throughput and an ecosystem (Connect, stream processing). Redis Streams are much simpler to operate if you already run Redis, but have no partitions within one stream (one key on one shard), limited retention, and fewer tools.</li>
</ul>
<p><b>Good fit:</b> moderate-volume internal events or job queues where Redis already exists, low latency matters, and losing the occasional message on failover is tolerable or covered by an outbox or retry upstream. Real-time fan-out (the Socket.IO streams adapter) is another good use. <b>Not a fit:</b> long retention, guaranteed durability, very high throughput, or many independent teams consuming.</p>`,
keys:["XADD/XREADGROUP/XACK, PEL, XAUTOCLAIM","Trimming to bound memory","Durability tied to Redis replication","Comparisons with SQS and Kafka","Clear fit/non-fit criteria"],
fu:[{q:"How do you implement a dead-letter behaviour with Redis Streams?",a:"Track delivery counts (XPENDING shows the delivery count per entry). When an entry exceeds a threshold, XADD it to a dead-letter stream with error details and XACK it in the original group, so it stops being redelivered."}],
rf:["Uses Pub/Sub thinking it's durable","No trimming, so memory grows forever","No handling of pending entries from crashed consumers"]},
/* ================= LEAD ================= */
{id:"Q078",skill:"SQL Server",level:"Lead",type:"Architecture",
q:"SQL Server Enterprise licensing is a large line item. Finance asks whether you really need Enterprise. How do you answer with evidence?",
a:`<p><b>Inventory feature usage</b> against what Standard edition now offers. Since SQL Server 2016 SP1, many former Enterprise-only features are available in Standard (with resource limits): columnstore, in-memory OLTP, partitioning, data compression, row-level security, dynamic data masking, Always Encrypted, and basic availability groups.</p>
<p><b>What still typically requires Enterprise:</b></p>
<ul>
<li><b>Online index operations</b> (rebuilds and creates without blocking).</li>
<li><b>Readable secondaries</b> and multi-replica availability groups (Standard's basic AGs have one non-readable secondary per group).</li>
<li>Resource Governor, and some advanced high-availability, performance and security features.</li>
<li>Scale beyond Standard's <b>compute and memory caps</b> (a limited number of cores and a buffer pool memory cap).</li>
</ul>
<p><b>Process:</b></p>
<ol>
<li>Query feature usage (<code>sys.dm_db_persisted_sku_features</code> lists edition-specific features persisted in each database) and review operational practices (online rebuilds, readable secondaries for reports).</li>
<li>Measure CPU and memory needs against Standard's caps.</li>
<li>Price alternatives:
  <ul>
  <li>Standard plus workarounds (offline maintenance windows, reporting moved to another store).</li>
  <li>Fewer licensed cores through query tuning and consolidation.</li>
  <li>Moving read workloads to cheaper replicas or caches.</li>
  <li>Longer term, PostgreSQL for new services.</li>
  </ul></li>
<li>Present options with cost, risk and effort, not a single answer.</li>
</ol>`,
keys:["Knows the 2016 SP1 feature changes","Features and limits still requiring Enterprise","Evidence via DMVs and capacity measurement","Priced alternatives incl. tuning to reduce cores","Options with cost/risk/effort for finance"],
trade:["Downgrading saves licence cost but may need maintenance windows and lose readable secondaries","Reducing cores via tuning is often the cheapest saving but requires engineering time","It depends on: HA requirements, workload size, maintenance tolerance"],
fu:[{q:"What's a quick licence saving that doesn't change editions?",a:"Right-size the core count. Many servers are licensed for far more cores than their measured CPU use requires. Query tuning and moving reporting off the primary can reduce cores further. On cloud, check licence-included vs bring-your-own options and their actual price."}],
rf:["Answers from memory without checking usage","Assumes everything needs Enterprise","Proposes migration to PostgreSQL as the only option"],
verify:"Standard edition core/memory caps and feature availability differ by SQL Server version (2019 vs 2022 vs 2025); check the edition comparison for your version."},

{id:"Q079",skill:"SQL Server",level:"Lead",type:"Scenario",
q:"You discover that most developers have sysadmin access to production databases and regularly run ad-hoc UPDATEs to 'fix data'. Last month one of those fixes wiped a column for 2,000 customers. How do you change this without killing the team's ability to respond?",
a:`<p>Ad-hoc writes in production are a risk to data integrity, audit and compliance. But removing access abruptly creates a support bottleneck, so replace it with safer paths first.</p>
<ul>
<li><b>Read access for investigation:</b> developers get read-only access to a replica, or a masked copy, with personal data masked where needed. That covers most "I need to look at production" needs.</li>
<li><b>Data fixes as code:</b> fixes go through a small pipeline. A script in a PR, reviewed by a second engineer, tested against a recent copy, run by automation with a transaction and expected row-count check (abort if the count differs), with the before-state backed up (affected rows copied to a table) and logged.</li>
<li><b>Admin tooling:</b> recurring fixes become admin features in the application, with validation and audit, instead of SQL.</li>
<li><b>Break-glass access:</b> for real emergencies, time-limited elevated access granted on request, automatically logged and reviewed afterwards.</li>
<li><b>Remove standing sysadmin rights</b> once those paths exist. Use least-privilege roles, and turn on auditing of writes by human accounts.</li>
</ul>
<p>Introduce it with the team, explaining the incident cost and showing that the new path is fast, so it isn't experienced as bureaucracy.</p>`,
keys:["Replace access with safer paths before removing it","Read-only replica/masked copy","Reviewed, automated data-fix pipeline with row-count guard and backup","Admin tooling for recurring fixes","Break-glass with audit; least privilege"],
trade:["Controls slow down one-off fixes slightly but prevent costly data incidents","Too much friction drives people to workarounds; keep the safe path fast"],
fu:[{q:"An urgent production bug needs a data fix within 15 minutes. How does the new process handle it?",a:"Through break-glass: the on-call engineer requests time-boxed access (approved by a second person), runs the reviewed script with a row-count check and backup of affected rows, and the action is logged and reviewed in the postmortem. The process allows speed, but not anonymity or zero review."}],
rf:["Revokes all access overnight","Keeps the status quo after a data-loss incident","Adds approvals with no tooling, making fixes take days"]},

{id:"Q080",skill:"SQL Server",level:"Lead",type:"Architecture",
q:"Your organisation has no dedicated DBA. Teams own their services end to end, but database incidents keep happening. How do you divide responsibilities between product teams and a platform function?",
a:`<p><b>Product teams own</b> what only they understand: schema design, queries and indexes for their access patterns, migrations (expand and contract, reviewed), data correctness, and their service's database SLOs. "You build it, you run it" includes the database.</p>
<p><b>A platform or data-reliability function</b> (even one or two people, or a rotating guild) provides what shouldn't be reinvented per team:</p>
<ul>
<li><b>Provisioning:</b> templates (Terraform modules) with backups, PITR, encryption, parameter groups, monitoring and alerting configured correctly by default.</li>
<li><b>Observability:</b> dashboards and alerts for slow queries, blocking, replication lag, storage, connections and long transactions, delivered to the owning team.</li>
<li><b>Guardrails:</b> migration linting in CI, connection pooling patterns, a backup restore-test schedule, version upgrade planning.</li>
<li><b>Expertise:</b> office hours, design reviews for new data models, and incident support for deep engine issues.</li>
<li><b>Fleet tasks:</b> major version upgrades, cost reviews and capacity planning across all databases.</li>
</ul>
<p>Measure it: database-related incidents, time to detect, restore-test success, and the number of databases on supported versions.</p>`,
keys:["Clear split: teams own schema/queries/migrations","Platform owns templates, observability, guardrails","Expertise via reviews and office hours","Fleet-wide upgrades, restore tests, cost","Metrics to track effectiveness"],
trade:["A central DBA team gives deep expertise but becomes a bottleneck and removes team ownership","Pure team ownership is fast but repeats mistakes; a thin platform layer balances both"],
fu:[{q:"How often should backups be restore-tested, and why does it matter?",a:"Automatically and regularly (for example monthly per critical database), restoring to a scratch instance and running validation queries. Untested backups regularly turn out to be incomplete, misconfigured or too slow to restore within the RTO, and you learn that during the disaster otherwise."}],
rf:["Hires one DBA to own all databases","Leaves each team to figure out backups","No restore testing"]},

{id:"Q081",skill:"SQL Server",level:"Lead",type:"Scenario",
q:"Production databases hold 10 years of data. Storage and backup costs are climbing, queries are slowing, and legal says some data must be kept for 7 years while GDPR requires deleting personal data sooner. Design a data retention and archival approach.",
a:`<ol>
<li><b>Classify the data</b> with legal and compliance: each data category's purpose, legal retention period (invoices and tax records, medical records), and personal-data status. You'll often find different rules for the same table's columns (keep invoice amounts for 7 years, but erase the customer's name earlier by anonymising).</li>
<li><b>Define tiers:</b>
  <ul>
  <li><b>Hot:</b> recent, operational, in the OLTP database.</li>
  <li><b>Warm:</b> older, queryable occasionally. A separate archive database or partitioned, compressed partitions.</li>
  <li><b>Cold:</b> legal hold only, exported to object storage (Parquet in S3 with lifecycle rules, Object Lock where immutability is required), queryable with Athena if needed.</li>
  </ul></li>
<li><b>Automate movement and deletion:</b> scheduled jobs using partition switching or batched moves, logged and verified. Deletion and anonymisation follow the classification, with exceptions for legal holds that suspend deletion for specific records.</li>
<li><b>Handle backups:</b> backup retention must align with the policy too, or "deleted" data lives on in backups indefinitely. Document how erasure applies to backups (re-applied on restore).</li>
<li><b>Product impact:</b> agree what the application shows for archived data (for example "orders older than 2 years available on request"), and update queries to stop scanning the archive.</li>
</ol>`,
keys:["Classification with legal by category and column","Hot/warm/cold tiers","Automated partition-based movement and deletion","Legal holds and GDPR anonymisation","Backup retention alignment; product expectations"],
trade:["Aggressive archiving cuts cost and speeds queries but makes old data slower to reach","Keeping everything is simple but increases cost, breach exposure and GDPR risk"],
fu:[{q:"How do you reconcile 'keep invoices 7 years' with a GDPR erasure request?",a:"Retain what the legal obligation requires (invoice amounts, dates, tax details, and identity data only as far as the law requires) and erase or anonymise everything else. Record the legal basis for what's retained. The obligation to keep financial records generally overrides erasure for that specific data."}],
rf:["Deletes old data without legal input","Keeps everything forever","Forgets backups"]},

{id:"Q082",skill:"PostgreSQL",level:"Lead",type:"Architecture",
q:"A new service is being designed. Teams argue between PostgreSQL, DynamoDB and MongoDB. How do you run the decision?",
a:`<p>Start from requirements, not preferences:</p>
<ul>
<li><b>Access patterns:</b> known and stable (DynamoDB fits), or ad-hoc, relational and changing (PostgreSQL fits). Is there reporting or search?</li>
<li><b>Consistency and integrity:</b> multi-entity transactions, constraints and foreign keys favour PostgreSQL. DynamoDB transactions exist but are limited and costly.</li>
<li><b>Scale and latency profile:</b> very high, spiky throughput with single-digit-millisecond latency at any size favours DynamoDB. Most services sit comfortably within one PostgreSQL instance plus replicas for years.</li>
<li><b>Operations:</b> DynamoDB is serverless with almost no operations. PostgreSQL needs vacuum, upgrades, connection management and sizing (much of it handled by RDS or Aurora).</li>
<li><b>Team skills</b> and existing platform support (templates, monitoring, backups).</li>
<li><b>Cost</b> modelled for expected traffic, including GSIs, and replicas or I/O for PostgreSQL.</li>
<li><b>MongoDB:</b> flexible documents. It needs a clear reason it beats PostgreSQL JSONB plus relational columns, plus a plan for running it (Atlas, or DocumentDB with compatibility caveats).</li>
</ul>
<p><b>Process:</b> list the top 10 access patterns and the non-functional requirements, prototype the hardest two or three on the leading candidates, and write an <b>ADR</b> with the decision, the alternatives and what would make us revisit. Default to the organisation's existing standard unless requirements clearly justify another engine; every extra engine is an operational cost forever.</p>`,
keys:["Requirements-first criteria","Access pattern stability as key differentiator","Integrity/transactions vs scale/ops trade-off","Prototype hardest patterns; ADR","Bias toward existing standard; cost of extra engines"],
trade:["PostgreSQL: flexible querying and integrity, more operational responsibility","DynamoDB: predictable scale and low ops, rigid access patterns and analytics workarounds","It depends on: access pattern stability, scale, team skills"],
fu:[{q:"What would make you revisit the decision later?",a:"Write the triggers into the ADR: for example 'single-node write throughput above X', 'more than N new access patterns per quarter needing GSIs', or 'operational incidents attributable to the engine'. That turns 'should we migrate?' into a measurable question."}],
rf:["Picks the engine the loudest engineer likes","No prototypes for hard patterns","Adds a new engine without operational plan"]},

{id:"Q083",skill:"PostgreSQL",level:"Lead",type:"Scenario",
q:"Projections show your main PostgreSQL primary hitting its largest instance size in about 12 months. Leadership asks, 'Do we need to shard?' How do you approach it?",
a:`<p><b>First, check whether the projection is about the right resource,</b> and buy time cheaply:</p>
<ul>
<li>Profile what's driving load: a few queries often dominate (pg_stat_statements). Tuning, indexing and fixing N+1 patterns can cut load by large factors.</li>
<li>Offload reads to replicas, and caching for read-heavy endpoints.</li>
<li>Move analytics and reporting to a separate store.</li>
<li>Archive cold data and partition big tables to shrink working sets.</li>
<li>Move workloads that don't belong (queues in tables, high-volume logs or events) to fitting systems.</li>
</ul>
<p>Each of these may push the limit out by years.</p>
<p><b>If write scale truly exceeds one node,</b> sharding options:</p>
<ul>
<li><b>Application-level sharding by tenant</b> (B2B fits well): route each tenant to one of several databases via a directory. Cross-tenant queries and rebalancing become your problem.</li>
<li><b>Distributed PostgreSQL:</b> Citus (an extension; distributed tables by shard key) or AWS's Aurora PostgreSQL Limitless Database. Less application change, but you still choose shard keys carefully, cross-shard transactions and joins have costs, and you take on vendor or feature constraints.</li>
<li><b>Split by domain:</b> move separate bounded contexts to their own databases. Often the simplest "sharding".</li>
</ul>
<p>Present a plan with the cheap levers first, measured headroom gained, and a decision point (a trigger metric) for committing to sharding, with a prototype of the shard key.</p>`,
keys:["Verify driver of load; tune first","Read replicas, caching, archiving, offloading","Domain split as simplest scaling","Tenant sharding vs Citus/Limitless trade-offs","Plan with triggers and prototypes"],
trade:["Sharding scales writes but adds permanent complexity (routing, cross-shard queries, rebalancing)","Vertical and offloading strategies are cheaper and often sufficient for years","It depends on: write growth, tenancy model, query patterns"],
fu:[{q:"How do you pick a shard key?",a:"The key must appear in almost every query and transaction (so most work stays on one shard), spread load evenly (no giant tenant on one shard, or a plan for isolating it), and rarely change. For B2B SaaS, tenant ID is usually the natural choice."}],
rf:["Starts sharding immediately","Doesn't profile the workload","Ignores cross-shard query needs"],
verify:"Aurora PostgreSQL Limitless Database availability, regions and limitations; check current docs."},

{id:"Q084",skill:"PostgreSQL",level:"Lead",type:"Scenario",
q:"A release ran a migration that dropped a column still read by a background job. The job crashed, and before anyone noticed, a fallback path wrote nulls into a related table for 6 hours. You lead the incident and postmortem. What do you do?",
a:`<p><b>During the incident:</b></p>
<ol>
<li>Stop the damage: pause the job and the faulty fallback.</li>
<li>Assess the data impact: which rows were written with nulls, and since when.</li>
<li>Recover the dropped column's data: PITR restore to a separate instance just before the migration, then extract the column.</li>
<li>Repair the affected rows with a reviewed, conditional script. Don't clobber legitimate updates made since.</li>
<li>Restore the column (expand) so the old job works, or deploy a fixed job.</li>
<li>Communicate status to stakeholders and any affected customers.</li>
</ol>
<p><b>Postmortem (blameless) findings likely include:</b></p>
<ul>
<li>The drop happened in the same release as the code change, <b>violating expand and contract</b>. There was no check that nothing else read the column.</li>
<li>Migration review didn't flag destructive DDL.</li>
<li>The job's fallback silently wrote bad data instead of failing loudly.</li>
<li>Monitoring didn't catch the crash or the null writes for 6 hours.</li>
</ul>
<p><b>Actions:</b></p>
<ul>
<li>Migration linting in CI that blocks or flags destructive operations (drops, renames, type changes). Squawk does this for PostgreSQL.</li>
<li>A required "contract" checklist: usage of the column verified as zero, for example from pg_stat_statements text search, or by revoking the column for a while first.</li>
<li>Jobs fail closed instead of writing defaults.</li>
<li>Alerts on job failures and data-quality checks (unexpected null rates).</li>
<li>Restore rehearsals, so recovery is quick next time.</li>
</ul>`,
keys:["Stop damage, assess, PITR-based recovery, conditional repair","Communication","Root causes: expand/contract violation, review gap, fail-open fallback, monitoring gap","Migration linting for destructive DDL","Fail-closed jobs and data-quality alerts"],
fu:[{q:"How can you verify a column is truly unused before dropping it?",a:"Search code across all repositories, check query statistics for statements referencing it over a full business cycle, and for extra safety rename it or revoke privileges on it for a period. If nothing breaks, drop it in a later release."}],
rf:["Blames the engineer who wrote the migration","Restores the whole database over current data","No process change"]},

{id:"Q085",skill:"DynamoDB",level:"Lead",type:"Architecture",
q:"A team proposes moving the chat and feed data from PostgreSQL to DynamoDB 'for scale'. Current PostgreSQL load is moderate. How do you evaluate the proposal?",
a:`<p><b>Clarify the problem first:</b> is there an actual scaling or latency issue today, or a projected one? With moderate load, PostgreSQL with good indexes, keyset pagination, partitioning for messages, read replicas and caching handles very large chat and feed workloads. A migration is expensive: dual-writing, backfill, cutover, and re-implementing queries.</p>
<p><b>Where DynamoDB would genuinely help:</b> very high write rates for messages, unpredictable spikes, predictable single-digit-millisecond latency at any size, and zero database operations. Chat history fits DynamoDB's model well (append-only, accessed by conversation and time).</p>
<p><b>Where it hurts:</b></p>
<ul>
<li>Features needing flexible queries: search in messages, moderation queries, analytics, admin tools. These need extra pipelines (Streams to OpenSearch, exports).</li>
<li>Transactions across many items.</li>
<li>Team experience with access-pattern-first modelling.</li>
<li>Two databases to operate during and after the migration.</li>
</ul>
<p><b>Decision approach:</b></p>
<ol>
<li>Load test the PostgreSQL design at projected peak (for example 10×).</li>
<li>If it falls short, prototype the DynamoDB model for the hardest access patterns and price it.</li>
<li>Consider a partial move (message history only) rather than everything.</li>
<li>Write an ADR with a migration plan (dual-write, backfill, shadow reads) only if the data supports it.</li>
</ol>`,

{id:"Q086",skill:"DynamoDB",level:"Lead",type:"Scenario",
q:"DynamoDB spend has tripled over two quarters across 40 tables owned by different teams. You're asked to get it under control. What do you do?",
a:`<ol>
<li><b>Attribute it:</b> tag tables by team and service, and use Cost Explorer by usage type (read and write request units, storage, GSIs, backups, streams, data transfer) per table. Find the top tables, which usually account for most of the cost.</li>
<li><b>Common findings and fixes:</b>
  <ul>
  <li><b>Capacity mode:</b> steady high-traffic tables on on-demand can be much cheaper on provisioned capacity with auto scaling (plus reserved capacity for the baseline). Spiky or low-traffic tables may be cheaper on on-demand.</li>
  <li><b>GSIs:</b> unused indexes, or <code>ALL</code> projections duplicating large items. Every write is paid again per GSI.</li>
  <li><b>Item size:</b> large items (big attributes, verbose names) multiply read and write units. Move blobs to S3.</li>
  <li><b>Scans</b> in code paths or jobs: replace them with queries or exports.</li>
  <li><b>Storage:</b> no TTL on expiring data, or tables of rarely accessed data that could use the <b>Standard-IA table class</b>.</li>
  <li>Strongly consistent reads where eventual consistency would do (2×).</li>
  <li>Excessive backups or on-demand backups kept forever.</li>
  </ul></li>
<li><b>Make it stick:</b> per-team cost dashboards, budgets and anomaly alerts, a design-review checklist for new tables (capacity mode, GSIs, item size, TTL), and a quarterly review of the top tables.</li>
</ol>`,
keys:["Tag-based attribution, usage-type breakdown","Capacity mode fit per table","GSI projection and usage review","Item size, scans, consistency level","TTL, Standard-IA, backups; ongoing governance"],
trade:["Provisioned capacity is cheaper for steady load but risks throttling on unexpected spikes","Removing GSIs saves money but may break rarely used features; verify usage first"],
fu:[{q:"How do you check whether a GSI is actually used?",a:"Look at the GSI's consumed read capacity metrics over a full business cycle. Zero or near-zero reads with ongoing write consumption means it's a cost with no benefit. Confirm with the owning team and code search before deleting."}],
rf:["Switches everything to provisioned blindly","No attribution","One-off cleanup with no governance"]},

{id:"Q087",skill:"DynamoDB",level:"Lead",type:"Architecture",
q:"A product built on DynamoDB now needs flexible filtering, text search, and business reporting. Some engineers say 'we should never have used DynamoDB' and want to migrate everything to PostgreSQL. What's your recommendation?",
a:`<p>Separate <b>operational access</b> from <b>search and analytics</b>. DynamoDB may still be the right store for the product's core, key-based access patterns. The new needs are classic read-side requirements that most architectures serve from <b>purpose-built secondary stores</b>, whatever the primary database.</p>
<p><b>Recommended direction:</b></p>
<ul>
<li><b>Search and flexible filtering:</b> stream changes (DynamoDB Streams, or the zero-ETL integration) into <b>OpenSearch</b>, with versioned, idempotent indexing. The product's list and search screens query OpenSearch, and detail pages read DynamoDB.</li>
<li><b>Reporting:</b> exports or zero-ETL into a warehouse (Redshift, or S3 plus Athena), modelled for analytics.</li>
<li><b>Keep DynamoDB</b> for writes and key-based reads, where it performs well.</li>
</ul>
<p><b>When migrating the core would be right:</b> if the <i>transactional</i> access patterns themselves have become relational and fluid (many-to-many updates, complex consistency rules, frequent new access patterns requiring GSIs). Then the core model fights DynamoDB daily, not just the reporting.</p>
<p>Decide with evidence: list current pain points and classify them as read-side or write-side. Estimate the cost of adding search and analytics stores vs a full migration (dual-write, backfill, re-implementation, risk). Address the frustration directly. Hindsight debates don't help, but a clear decision record does.</p>`,
keys:["Distinguish OLTP access from search/analytics","OpenSearch via streams/zero-ETL for search","Warehouse for reporting","Criteria for when core migration is justified","Evidence-based comparison; handle team frustration"],
trade:["Adding read stores keeps the working core and adds pipelines and eventual consistency","Full migration simplifies to one store but costs months and risk","It depends on: where the pain is (read vs write side)"],
fu:[{q:"Would PostgreSQL alone solve search and reporting?",a:"Partly. Moderate filtering and full-text search work in PostgreSQL, but at scale heavy reporting still moves to a separate store to protect OLTP. Migrating might not remove the need for additional stores, which weakens the case for migration."}],
rf:["Migrates everything without analysis","Builds 15 GSIs for ad-hoc filters","Dismisses the team's concerns"]},

{id:"Q088",skill:"Schema Evolution & Migrations",level:"Lead",type:"Architecture",
q:"Teams use EF Core migrations, Drizzle, hand-written SQL scripts and Flyway across services. Migration incidents keep happening. Define an organisation-wide migration standard without forcing one tool on everyone.",
a:`<p>Standardise the <b>rules and pipeline</b>, not necessarily the tool:</p>
<ul>
<li><b>Versioned, reviewed migrations:</b> every schema change is a versioned file in the service's repo. The generated SQL is reviewed in the PR (the actual DDL, not just ORM model changes). No manual or "push" changes to shared environments.</li>
<li><b>Backward compatibility rule:</b> every migration must work with the currently deployed application version (expand and contract). Destructive steps go in a later release, with evidence of no usage.</li>
<li><b>Pipeline step:</b> migrations run as a separate, idempotent pipeline stage before the application rollout, using a dedicated DDL identity. App identities get no DDL rights.</li>
<li><b>Automated checks in CI:</b>
  <ul>
  <li>Migrations apply from an empty database and from a production-schema snapshot.</li>
  <li>The ORM model has no pending changes.</li>
  <li>A <b>linter</b> flags dangerous operations: non-concurrent index creation, adding NOT NULL without the validate pattern, type changes, drops and renames, missing lock timeouts. Squawk covers PostgreSQL, and custom checks cover SQL Server.</li>
  </ul></li>
<li><b>Runtime safety:</b> lock timeouts set in migrations, long-running backfills as separate jobs, and a checklist for large-table changes.</li>
<li><b>Tool choice:</b> the team's ORM tooling is fine if it meets these rules. New services use the recommended tool per stack.</li>
</ul>
<p>Roll it out with a shared pipeline template and linter config, and track migration-related incidents to show the effect.</p>`,
keys:["Standardise rules/pipeline, not the tool","Review actual SQL; no manual changes","Backward-compat rule; deferred destructive steps","CI: apply from empty + prod snapshot, pending changes, linting","Lock timeouts, separate backfills; measure incidents"],
trade:["One mandated tool simplifies support but forces costly migrations of existing services","Rule-based standards preserve autonomy but need good shared templates to be followed"],
fu:[{q:"How do you test migrations against production-like schemas without copying production data?",a:"Keep a schema-only snapshot (pg_dump --schema-only, or a DACPAC or script for SQL Server) refreshed regularly from production, plus a synthetic dataset at realistic volume for tables where locking and duration matter."}],
rf:["Mandates rewriting all services to one tool","No CI checks","Allows destructive changes in the same release"]},

{id:"Q089",skill:"Caching (Redis)",level:"Lead",type:"Architecture",
q:"After Redis's licence changes, your organisation must choose a direction for caching and Redis-based features: Redis OSS or Redis' own offerings, Valkey (ElastiCache or self-managed), or MemoryDB. How do you decide?",
a:`<p><b>Background:</b> in 2024 Redis moved from the BSD licence to source-available licences (RSAL/SSPL), prompting the Linux Foundation fork <b>Valkey</b>, now supported by AWS ElastiCache and MemoryDB, typically at lower prices than their Redis OSS engine options. Redis later added an OSI-approved AGPL option for newer versions. For most teams using a <i>managed</i> service, the licence rarely affects you directly. It does matter for self-hosting, redistribution, and long-term ecosystem direction.</p>
<p><b>Decision criteria:</b></p>
<ul>
<li><b>Compatibility:</b> do you use features or modules that exist only in one ecosystem (Redis Stack modules like JSON, search or time series vs Valkey's own modules)? Client library compatibility is generally preserved with the Redis protocol.</li>
<li><b>Durability needs:</b> pure cache (ElastiCache, either engine) vs primary data store needing durability (MemoryDB).</li>
<li><b>Cost:</b> compare node and serverless pricing for each engine at your usage.</li>
<li><b>Operations:</b> managed vs self-hosted, upgrade paths, and support.</li>
<li><b>Licence compliance</b> if you self-host or distribute.</li>
</ul>
<p>A typical outcome for AWS-based services using Redis purely as a cache: move ElastiCache clusters to Valkey at the next maintenance cycle after compatibility testing, for cost savings, with no application change. Use MemoryDB only where durability is required.</p>`,

{id:"Q090",skill:"Caching (Redis)",level:"Lead",type:"Scenario",
q:"Several teams respond to every slow endpoint by adding a Redis cache. Now there are stale-data bugs, unexplained cache incidents, and nobody knows what's cached where. How do you lead the team to a healthier approach?",
a:`<p><b>Reset the default:</b> caching is a <b>last step</b> after fixing the underlying cause (missing indexes, N+1 queries, over-fetching, chatty service calls). A cache over a slow query adds staleness and a new failure mode without removing the slowness, which reappears on every miss and during cache outages.</p>
<p><b>Guidelines:</b></p>
<ul>
<li>Before adding a cache: a profile showing why it's slow, and the fixes tried.</li>
<li><b>Each cache entry has an owner and a documented contract:</b> what's cached, key format, TTL, invalidation trigger, acceptable staleness, and behaviour when Redis is down (fail open to the DB with a concurrency limit, or serve stale).</li>
<li>Prefer caching <b>entities</b> with explicit invalidation over caching composed responses.</li>
<li><b>Observability:</b> hit ratio, latency and error rate per cache namespace. A cache with a 10% hit ratio is pure overhead.</li>
</ul>
<p><b>Clean up the current state:</b></p>
<ul>
<li>Inventory existing keys by namespace (key prefixes, sampled with SCAN) and map them to owners.</li>
<li>Remove caches with low hit ratios or no clear owner.</li>
<li>Fix invalidation where stale bugs occurred.</li>
<li>Put the guidelines into code review and the service template (a standard caching helper with metrics and timeouts).</li>
</ul>
<p>Lead with data: show the stale-data incidents and hit ratios. That persuades better than rules.</p>`,
keys:["Fix root cause before caching","Owner + documented contract per cache","Failure behaviour when Redis is down","Per-namespace metrics; remove low-value caches","Standard helper; data-driven persuasion"],
trade:["Caches reduce load and latency when hit ratios are high, but add staleness and operational risk","Removing caches may raise DB load; measure before and after"],

rf:["Adds more caching","Bans caching entirely","No ownership or metrics"]}

/* ---------- state ---------- */
const KEY="data-bank-reviewed-v1";
let reviewed={};
try{reviewed=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){reviewed={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(reviewed))}catch(e){}}

const state={text:"",skill:"all",status:"all",levels:new Set(),types:new Set()};
const $=s=>document.querySelector(s);

/* ---------- controls ---------- */
const skills=[...new Set(QS.map(x=>x.skill))];
$("#skill").innerHTML=`<option value="all">All skills</option>`+skills.map(s=>`<option value="${s}">${s}</option>`).join("");
function chipRow(el,items,set){
  el.innerHTML=items.map(i=>`<button type="button" class="chip" aria-pressed="false" data-v="${i}">${i}</button>`).join("");
  el.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;const v=b.dataset.v;
    if(set.has(v)){set.delete(v);b.setAttribute("aria-pressed","false")}else{set.add(v);b.setAttribute("aria-pressed","true")}render()});
}
chipRow($("#levels"),LEVELS,state.levels);
chipRow($("#types"),TYPES,state.types);
$("#q").addEventListener("input",e=>{state.text=e.target.value.trim().toLowerCase();render()});
$("#skill").addEventListener("change",e=>{state.skill=e.target.value;render()});
$("#status").addEventListener("change",e=>{state.status=e.target.value;render()});
let allOpen=false;
$("#toggleAll").addEventListener("click",()=>{allOpen=!allOpen;
  document.querySelectorAll("details.ans").forEach(d=>d.open=allOpen);
  $("#toggleAll").textContent=allOpen?"Close all answers":"Open all answers"});

/* ---------- stats ---------- */
function count(key,vals){return vals.map(v=>`${v} <b>${QS.filter(x=>x[key]===v).length}</b>`).join(" · ")}
$("#stats").innerHTML=`<span><b>${QS.length}</b> questions loaded</span><span>${count("level",LEVELS)}</span><span>${count("type",TYPES.filter(t=>t!=="Behavioral"))}</span><span>${PARTS}</span>`;

/* ---------- render ---------- */
const strip=h=>h.replace(/<[^>]+>/g," ");
function matches(x){
  if(state.skill!=="all"&&x.skill!==state.skill)return false;
  if(state.levels.size&&!state.levels.has(x.level))return false;
  if(state.types.size&&!state.types.has(x.type))return false;
  if(state.status==="done"&&!reviewed[x.id])return false;
  if(state.status==="todo"&&reviewed[x.id])return false;
  if(state.text){const hay=(x.id+" "+x.q+" "+x.skill+" "+strip(x.a)+" "+(x.keys||[]).join(" ")+" "+(x.fu||[]).map(f=>f.q+" "+f.a).join(" ")).toLowerCase();
    if(!hay.includes(state.text))return false}
  return true;
}
const ul=arr=>`<ul>${arr.map(i=>`<li>${i}</li>`).join("")}</ul>`;
function item(x,i){
  const done=!!reviewed[x.id];
  return `<li class="q${done?" done":""}" id="${x.id}">
    <div class="qhead"><span class="num">${x.id}</span><div>
      <p class="qtext">${x.q}</p>
      <div class="tags"><span class="tag">${x.skill}</span><span class="tag lv lv-${x.level}">${x.level}</span><span class="tag">${x.type}</span>${x.verify?`<span class="tag verify">VERIFY</span>`:""}
        <label class="check"><input type="checkbox" data-id="${x.id}" ${done?"checked":""}> Reviewed</label></div>
    </div></div>
    <div class="body">
      <details class="ans"><summary>Model answer, key points and red flags</summary><div class="dbody">
        ${x.a}
        ${x.tools?`<h4>Tools and metrics to check</h4>${ul(x.tools)}`:""}
        <h4>What the interviewer listens for</h4>${ul(x.keys)}
        ${x.trade?`<h4>Trade-offs and "it depends on"</h4>${ul(x.trade)}`:""}
        <h4 class="rf">Red flags</h4>${ul(x.rf)}
        ${x.verify?`<p class="note">[VERIFY] ${x.verify}</p>`:""}
      </div></details>
      ${(x.fu||[]).map(f=>`<details class="fu ans"><summary><span class="fl">FOLLOW-UP</span><span>${f.q}</span></summary><div class="dbody"><p>${f.a}</p></div></details>`).join("")}
    </div></li>`;
}
function render(){
  const list=QS.filter(matches);
  $("#list").innerHTML=list.length?list.map(item).join(""):`<li class="empty">No questions match these filters.</li>`;
  if(allOpen)document.querySelectorAll("details.ans").forEach(d=>d.open=true);
  const n=QS.filter(x=>reviewed[x.id]).length;
  $("#ptext").textContent=`${n} / ${QS.length} reviewed · ${list.length} shown`;
  $("#pfill").style.width=(QS.length?n/QS.length*100:0)+"%";
}
$("#list").addEventListener("change",e=>{const c=e.target.closest("input[data-id]");if(!c)return;
  const id=c.dataset.id;if(c.checked)reviewed[id]=1;else delete reviewed[id];save();
  c.closest("li.q").classList.toggle("done",c.checked);
  const n=QS.filter(x=>reviewed[x.id]).length;const shown=document.querySelectorAll("li.q").length;
  $("#ptext").textContent=`${n} / ${QS.length} reviewed · ${shown} shown`;$("#pfill").style.width=(n/QS.length*100)+"%";});
try{const m=location.hash.match(/^#q=([^&]+)/);if(m){const v=decodeURIComponent(m[1]);$("#q").value=v;state.text=v.trim().toLowerCase();}}catch(e){}
render();
</script>
