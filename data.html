keys:["Notifications only to connected listeners; no durability","No ack/retry; payload limit; pooler incompatibility","Job table as source of truth","SKIP LOCKED claiming + polling fallback","Libraries or real queue via outbox"],
fu:[{q:"Why is SKIP LOCKED important for a jobs table?",a:"Several workers can each claim different rows without blocking on rows another worker has locked. Without it, they queue on the same top rows and effectively process one at a time."}],
rf:["Adds reconnection logic and calls it fixed","Puts job data in the NOTIFY payload","No retry or failure state"]},

{id:"Q038",skill:"PostgreSQL",level:"Intermediate",type:"Scenario",
q:"When many users comment on a popular post, updates to that post row (editing the title, and a counter update done with SELECT … FOR UPDATE) start blocking and timing out. Comments have a foreign key to posts. What's the locking interaction?",
a:`<p>Inserting a child row with a foreign key takes a <b><code>FOR KEY SHARE</code></b> lock on the referenced parent row, so the parent can't be deleted or have its key changed until the child insert commits. Many concurrent comment inserts mean the post row is almost continuously key-share locked.</p>
<p>PostgreSQL's row lock modes (strongest to weakest): <code>FOR UPDATE</code>, <code>FOR NO KEY UPDATE</code>, <code>FOR SHARE</code>, <code>FOR KEY SHARE</code>.</p>
<ul>
<li>A plain <code>UPDATE</code> that doesn't change key columns takes <b><code>FOR NO KEY UPDATE</code></b>, which <b>doesn't conflict</b> with <code>FOR KEY SHARE</code>. Ordinary title edits coexist with comment inserts.</li>
<li>Explicit <code>SELECT … FOR UPDATE</code> <b>does</b> conflict with <code>FOR KEY SHARE</code>, so the read-then-update counter code waits behind every in-flight comment insert, and comment inserts wait behind it.</li>
</ul>
<p><b>Fixes:</b></p>
<ul>
<li>Use <code>FOR NO KEY UPDATE</code> instead of <code>FOR UPDATE</code> when you won't change the key.</li>
<li>Better: replace read-modify-write counters with an atomic <code>UPDATE posts SET comment_count = comment_count + 1 WHERE id = $1</code>, or move the counter off the hot row (a separate counters table, or async aggregation).</li>
<li>Keep the comment-insert transactions short.</li>
</ul>`,
keys:["FK insert takes FOR KEY SHARE on parent","Lock mode compatibility (NO KEY UPDATE vs UPDATE)","SELECT FOR UPDATE as the conflicting pattern","Atomic UPDATE instead of read-modify-write","Move hot counters off the row"],
fu:[{q:"How do you see these lock waits in PostgreSQL?",a:"pg_stat_activity shows wait_event_type = Lock, and pg_blocking_pids(pid) gives the blockers. Join with pg_locks for lock modes and the relation, and enable log_lock_waits to log waits longer than deadlock_timeout."}],
rf:["Drops the foreign key","Thinks FKs don't take locks","Keeps FOR UPDATE everywhere by habit"]},

{id:"Q039",skill:"DynamoDB",level:"Intermediate",type:"Architecture",
q:"How do DynamoDB Streams work, and how would you use them to keep a search index and an aggregate table in sync? What guarantees and limits do you design around?",
a:`<p><b>DynamoDB Streams</b> capture item-level changes (with keys only, new image, old image, or both) and retain them for <b>24 hours</b>. Records for a given item appear in the order the changes happened, and each change appears once in the stream. A <b>Lambda event source mapping</b> reads shards in batches, processing each shard in order.</p>
<p><b>Design around:</b></p>
<ul>
<li><b>At-least-once processing:</b> Lambda retries failed batches, so handlers must be idempotent. Use the item version or the stream's sequence number to skip stale updates when writing to OpenSearch (external versioning) or an aggregates table (conditional writes).</li>
<li><b>Poison records block the shard:</b> configure bisect-on-error, maximum retry attempts, maximum record age, and an on-failure destination (SQS or SNS), or one bad record stops all later changes in that shard.</li>
<li><b>Monitor <code>IteratorAge</code>:</b> if processing falls more than 24 hours behind, records are lost.</li>
<li>Use event filtering to invoke only for relevant item types (helpful with single-table design).</li>
<li>Streams allow only a small number of concurrent readers per shard (two is the recommended maximum). For more consumers, fan out through EventBridge Pipes or SNS, or use <b>Kinesis Data Streams for DynamoDB</b>: longer retention and more consumers, but records can arrive duplicated or out of order, so consumers must handle both.</li>
</ul>`,
keys:["24h retention, per-item ordering","Idempotent, version-aware consumers","Bisect, retries, max age, on-failure destination","IteratorAge monitoring","Reader limits; Kinesis option and its ordering caveat"],
trade:["Streams + Lambda: simple and ordered per item, but limited consumers and retention","Kinesis Data Streams: more consumers and retention, weaker ordering and dedup guarantees","It depends on: number of consumers, replay needs"],
fu:[{q:"How do you rebuild the search index from scratch, since Streams only keep 24 hours?",a:"Do a full export (DynamoDB export to S3, or a parallel scan) into a new index, while also applying stream changes to it, then swap aliases when caught up. The stream handles the delta during the rebuild."}],
rf:["No idempotency","Default retry forever on poison records","Unaware of the 24-hour window"]},

{id:"Q040",skill:"DynamoDB",level:"Intermediate",type:"Scenario",
q:"Sessions are stored in DynamoDB with a TTL attribute. Users report being logged in with sessions that should have expired hours ago. Is TTL broken? How should you use it?",
a:`<p>TTL is working as designed: <b>deletion isn't immediate</b>. DynamoDB removes expired items in the background, typically within a few days of expiry, not at the exact second. Until then, expired items are still returned by reads, queries and scans.</p>
<p><b>Correct usage:</b></p>
<ul>
<li>TTL is a <b>cost and storage clean-up mechanism, not an expiry enforcement</b>. The application must check expiry itself: add a filter (<code>expiresAt &gt; :now</code>) in queries, or check after <code>GetItem</code>, and treat expired items as absent.</li>
<li>The TTL attribute must be a Number holding a Unix epoch time in <b>seconds</b>. Milliseconds is a common bug: those items are effectively never expired.</li>
<li>TTL deletions appear in DynamoDB Streams with a service principal as the user identity, so you can archive expired items to S3 or trigger clean-up elsewhere.</li>
<li>For sessions, also support <b>explicit revocation</b> (logout, password reset) by deleting or flagging the item, rather than waiting for expiry.</li>
</ul>`,
keys:["TTL deletion is delayed (days)","App must enforce expiry on read","Epoch seconds, not milliseconds","TTL deletes visible in Streams","Explicit revocation for sessions"],
fu:[{q:"Do TTL deletes consume write capacity?",a:"No. TTL deletions are free of write capacity charges, which is why TTL is a good clean-up tool. Stream records for them are still produced if streams are enabled."}],
rf:["Assumes TTL is exact","Stores TTL in milliseconds","No application-level expiry check"]},

{id:"Q041",skill:"DynamoDB",level:"Intermediate",type:"Concept",
q:"What consistency and transaction guarantees does DynamoDB provide? When do strongly consistent reads and transactions apply, and what do they cost?",
a:`<ul>
<li><b>Reads:</b> eventually consistent by default (may briefly miss a just-completed write). <b>Strongly consistent reads</b> (<code>ConsistentRead: true</code>) return the latest committed write, at double the read cost and only on the base table and LSIs. <b>GSIs only support eventually consistent reads.</b> Global tables replicate across regions asynchronously, with last-writer-wins conflict resolution (newer multi-region strong-consistency options exist; check current availability).</li>
<li><b>Single-item writes</b> are atomic, and <b>condition expressions</b> make them conditional (optimistic locking with a version attribute, "create only if not exists").</li>
<li><b>Transactions</b> (<code>TransactWriteItems</code>/<code>TransactGetItems</code>): up to 100 items across tables, all-or-nothing, with conditions. They cost twice the capacity of plain operations. They fail with <code>TransactionCanceledException</code> (containing per-item reasons) if a condition fails or a concurrent transaction touches the same items. A <code>ClientRequestToken</code> makes a write transaction idempotent for about 10 minutes, which is useful for retries after network errors.</li>
<li>Transactions are <b>serializable</b> with respect to each other, but non-transactional reads can still see items written mid-transaction from other operations' perspective, depending on read type. Design reads accordingly.</li>
</ul>`,
keys:["Eventual default; strong reads cost 2x and not on GSIs","Global tables async, last writer wins","Conditional single-item writes","Transaction limits, cost, cancellation reasons","ClientRequestToken idempotency"],
fu:[{q:"You need 'username must be unique' in DynamoDB. How?",a:"Write a separate uniqueness item (PK = USERNAME#alice) with attribute_not_exists in the same transaction as the user item. If the username exists, the condition fails and the whole transaction cancels. A GSI can't enforce uniqueness."}],
rf:["Strongly consistent reads on a GSI","Thinks transactions are free","Uses a GSI to enforce uniqueness"],
verify:"DynamoDB global tables' multi-region strong consistency option is newer; check current availability and constraints."},

{id:"Q042",skill:"DynamoDB",level:"Intermediate",type:"Scenario",
q:"Product wants a group page to show 'N posts' and 'M members', but the data is in DynamoDB. A developer uses Query with Select=COUNT on every page view. Costs are climbing. What should you do?",
a:`<p>DynamoDB has no cheap <code>COUNT</code>. <code>Select=COUNT</code> still <b>reads every matching item</b> (paginating through 1 MB pages) and consumes read capacity for all of them. It just doesn't return the attributes. For groups with thousands of posts, every page view pays to read them all.</p>
<p><b>Maintain counters instead:</b></p>
<ul>
<li>Keep <code>postCount</code> and <code>memberCount</code> attributes on the group metadata item.</li>
<li>Update them <b>in the same transaction</b> as the create or delete (<code>TransactWriteItems</code>: put the post plus <code>ADD postCount :1</code> on the group), for exact counts.</li>
<li>Or update them <b>asynchronously from DynamoDB Streams</b> (an idempotent consumer). That's cheaper on the write path, and eventually consistent.</li>
<li>For extremely hot groups, shard the counter (see the hot-partition question).</li>
</ul>
<p>Then the page reads one item. Decide with product whether a count that lags by a second is acceptable; it usually is.</p>`,
keys:["Select=COUNT still reads all items","Denormalised counters on parent item","Transactional vs stream-based updates","Sharded counters for hot items","Agree staleness tolerance"],
trade:["Transactional counters are exact but double write cost and can contend on hot items","Stream-based counters are cheap on writes but eventually consistent and need idempotency"],
fu:[{q:"How do you correct counters that drift (for example after a bug)?",a:"Run a periodic or on-demand reconciliation job that recounts from the source items (via a scan of the collection or an export) and fixes the counter, ideally with a conditional write so it doesn't overwrite a concurrent update incorrectly."}],
rf:["Caches the COUNT query and calls it solved","Scans the table for counts","No plan for drift"]},

{id:"Q043",skill:"Schema Evolution & Migrations",level:"Intermediate",type:"Scenario",
q:"You added a new column and must backfill it for 300 million existing rows in a busy production table. How do you do it without hurting the live system?",
a:`<p>Never run one <code>UPDATE … SET new_col = …</code> over the whole table. It's one huge transaction: it holds locks, creates massive log or WAL (and in PostgreSQL, 300 million new tuple versions, so bloat), causes replica lag, and can't be paused or resumed.</p>
<p><b>Batched, resumable backfill:</b></p>
<ul>
<li>Iterate by <b>primary key ranges</b> (<code>WHERE id &gt; @last AND id &lt;= @last + 10000 AND new_col IS NULL</code>), each batch in its own short transaction. Keyset iteration, not OFFSET.</li>
<li>Make it <b>idempotent and resumable:</b> store progress (the last processed ID) in a table, and skip rows already filled.</li>
<li><b>Throttle:</b> sleep between batches, and adapt to load. Pause when replica lag, CPU, lock waits or latency exceed thresholds.</li>
<li>Run it as a background job or worker, not inside the deploy migration step.</li>
<li><b>Meanwhile,</b> the application already writes <code>new_col</code> for new and updated rows (dual-write), so the backfill only has to catch up on the old ones.</li>
<li>After it completes, verify with a <code>count(*) WHERE new_col IS NULL</code> check, then add NOT NULL (with the <code>NOT VALID</code>/<code>VALIDATE</code> pattern in PostgreSQL) in a later release.</li>
<li>In PostgreSQL, let autovacuum keep up (or vacuum between chunks), since every updated row creates a dead tuple.</li>
</ul>`,
keys:["No single giant UPDATE","Keyset batches, short transactions","Idempotent, resumable with progress tracking","Throttling on replica lag/latency","Dual-write first; constraints after; vacuum awareness"],
fu:[{q:"How do you decide the batch size?",a:"Start small (for example 1,000–10,000 rows), measure per-batch time and impact (lock waits, replica lag, p99 latency of the app), and adjust. Aim for batches that finish in well under a second so locks are short."}],
rf:["One UPDATE statement","OFFSET-based batching","No ability to pause or resume"]},

{id:"Q044",skill:"Schema Evolution & Migrations",level:"Intermediate",type:"Scenario",
q:"An orders table's int identity primary key is at 1.9 billion, and the maximum is about 2.147 billion. Several tables reference it. Plan the migration to bigint without downtime.",
a:`<p>First, <b>estimate the runway</b> (current insert rate means weeks or months left) and treat it as an incident-in-waiting with an owner. When the key overflows, every insert fails.</p>
<p><b>Why not just ALTER:</b> changing an int primary key to bigint is a <b>size-of-data</b> operation. It rewrites the table and every index, and requires dropping and recreating the primary key and foreign keys, with long blocking on large tables. (Some small or quiet tables can tolerate it in a maintenance window.)</p>
<p><b>Online approach (expand and contract):</b></p>
<ol>
<li>Add <code>Id_new bigint</code> (nullable), plus <code>bigint</code> columns in referencing tables.</li>
<li>Keep them in sync for new and updated rows: a trigger, or application dual-writes.</li>
<li>Backfill existing rows in batches (as in the backfill question).</li>
<li>Build the new unique index and the indexes on the new FK columns, online or concurrently.</li>
<li>In a short maintenance step: swap names (or swap to a new table via a view or synonym), switch the primary key and foreign keys to the new columns, and set the identity or sequence to continue above the current maximum.</li>
<li>Deploy application code that uses <code>long</code>/<code>bigint</code> everywhere, including DTOs, client apps, and JavaScript clients (which are safe up to 2^53).</li>
<li>Drop the old columns later.</li>
</ol>
<p><b>Short-term escape hatch</b> if time is very short: reseed the identity to start at negative values (−2,147,483,648 upward), which buys roughly as much time again. That's only safe if no code assumes positive IDs.</p>`,
keys:["Runway estimation and urgency","ALTER is size-of-data with FK rebuilds","Expand/contract with sync + backfill + swap","Application and client type changes","Negative reseed as emergency option with caveats"],
trade:["Online migration is safe but takes weeks of engineering","A maintenance-window ALTER is simpler but may need hours of downtime on big tables","Negative reseed buys time but can break assumptions in code and reports"],
fu:[{q:"How do you make sure this never happens again?",a:"Use bigint for all new surrogate keys by default, and monitor identity and sequence headroom (current value against type maximum) for every table, with alerts at for example 70% usage."}],
rf:["Plans an ALTER COLUMN at peak time","Forgets referencing foreign keys","Forgets client code using 32-bit ints"]},

{id:"Q045",skill:"Schema Evolution & Migrations",level:"Intermediate",type:"Concept",
q:"Should every database migration have a 'down' migration for rollback? What's a safer rollback strategy?",
a:`<p>Down migrations look safe, but they're often <b>untested and destructive</b>. Reversing "add column" drops the column and the data written to it since the deploy. Reversing a data migration may be impossible: you can't un-merge rows or un-transform values. And running a down migration under pressure during an incident is risky.</p>
<p><b>Safer strategy:</b></p>
<ul>
<li><b>Make application rollback independent of the schema:</b> every migration is <b>backward compatible</b> with the previous app version (expand and contract). If the new release misbehaves, you roll back the <i>code</i> and leave the schema, which the old code can still use.</li>
<li><b>Separate destructive steps</b> (drop column, drop table) into a later release, after the new code has proven itself. By then nothing needs them.</li>
<li><b>Roll forward</b> to fix schema mistakes: write a new migration that corrects the problem, reviewed and tested like any other.</li>
<li>For risky data migrations, <b>keep the original data</b> (a copy table or old column) until verified, and take a backup or snapshot before the step.</li>
<li>Down migrations remain useful in <b>development</b> for iterating locally.</li>
</ul>`,
keys:["Down migrations often destructive/untested","Backward-compatible migrations decouple code rollback","Destructive steps deferred","Roll forward fixes","Keep original data for risky changes; downs for dev"],
fu:[{q:"A migration in today's release renamed a column, and the release must be rolled back. What happens?",a:"The old code expects the old column name and fails. That's why renames must go through expand and contract (add new, dual-write, switch reads, drop old later), so any single release can be rolled back without schema changes."}],
rf:["Relies on down migrations in production incidents","Renames and drops in the same release as code changes","No backups before data migrations"]},

{id:"Q046",skill:"Schema Evolution & Migrations",level:"Intermediate",type:"Scenario",
q:"Two services (and a reporting tool) read the same customers table. You need to split it into customers and customer_addresses. How do you restructure it without coordinated downtime?",
a:`<ol>
<li><b>Find every reader and writer</b> of the table: query logs, Query Store or pg_stat_statements, code search, and the BI tool's queries. Shared tables always have unknown consumers.</li>
<li><b>Create the new structure</b> (<code>customer_addresses</code>) alongside the old one, and keep it in sync. Either the owning service dual-writes, or a trigger copies changes, while the old columns stay authoritative.</li>
<li><b>Backfill</b> the new table in batches.</li>
<li><b>Provide a compatibility layer:</b> once the owning service writes the new structure natively, keep the old shape available as a <b>view</b> (named as the old table, after renaming the base table) so unchanged readers keep working. In SQL Server, views or synonyms. In PostgreSQL, views, which are updatable for simple cases.</li>
<li><b>Migrate consumers</b> one by one to the new tables, or better, to the owning service's API, which removes the shared-table coupling.</li>
<li><b>Remove</b> the compatibility view and old columns once usage reaches zero.</li>
</ol>
<p>The long-term fix is ownership: one service owns customer data, and others use its API or events instead of reading its tables.</p>`,
keys:["Discover all consumers","Parallel structure with sync and backfill","Views/synonyms as compatibility layer","Consumer-by-consumer migration","Fix ownership: API/events instead of shared tables"],
trade:["Views keep old readers working but can hide performance costs and delay migration","Dual writes are simple but can diverge on partial failure; triggers keep it in the DB but add hidden logic"],
fu:[{q:"How do you know when the compatibility view is no longer used?",a:"Monitor queries referencing it (Query Store or pg_stat_statements text search, or Extended Events in SQL Server) over a full business cycle, including month-end reporting, before dropping it."}],
rf:["Coordinated big-bang change across teams","Ignores the reporting tool","Leaves shared-table ownership as is"]},

{id:"Q047",skill:"Caching (Redis)",level:"Intermediate",type:"Concept",
q:"How do you design cache keys and invalidation when one change affects many cached entries, for example a user renames a group that appears in thousands of cached feeds?",
a:`<p><b>Key design:</b> namespaced, versioned, deterministic keys, such as <code>app:v3:group:{groupId}</code> or <code>app:v3:feed:{userId}:page:{cursor}</code>. Include every input that changes the value (locale, permission tier), and nothing that doesn't, or you get duplicate entries.</p>
<p><b>Invalidating many entries:</b></p>
<ul>
<li><b>Cache by entity, assemble at read time:</b> instead of caching fully rendered feeds containing group names, cache feed <i>item IDs</i>, and cache each group or user entity separately. Renaming a group then invalidates one key (<code>group:{id}</code>), and every feed picks it up on the next assembly. This is usually the best answer.</li>
<li><b>Generational keys:</b> keep a version counter per entity or namespace (<code>group:{id}:ver</code>) and include it in dependent keys. Bumping the counter makes old entries unreachable, and they expire by TTL. No mass delete needed.</li>
<li><b>Tag sets:</b> track dependent keys in a Redis set per tag and delete them on change. Workable, but sets grow and need clean-up.</li>
<li>Rely on <b>short TTLs</b> for aggregates where slight staleness is acceptable.</li>
</ul>
<p>Avoid <code>KEYS pattern*</code> or <code>SCAN</code>-and-delete for invalidation on hot paths.</p>`,
keys:["Namespaced, versioned, complete keys","Cache entities and compose at read","Generational/version-counter invalidation","Tag sets with their cost","Avoid pattern scans for invalidation"],
fu:[{q:"What's the downside of composing at read time?",a:"More cache lookups per request (one for the list plus one per entity), mitigated with MGET or pipelining, and an in-process L1 cache for very hot entities. It's usually far cheaper than stale data or mass invalidation."}],
rf:["Caches denormalised blobs and tries to find/patch them","Uses KEYS to invalidate","Keys missing inputs like locale"]},

{id:"Q048",skill:"Caching (Redis)",level:"Intermediate",type:"Scenario",
q:"After moving from a single Redis node to Redis Cluster (or ElastiCache cluster mode), some operations fail with CROSSSLOT errors, one shard runs hot while others idle, and a Lua rate limiter broke. Explain and fix.",
a:`<p>Redis Cluster splits the keyspace into <b>16,384 hash slots</b> spread across shards. A key's slot comes from a hash of the key.</p>
<ul>
<li><b>CROSSSLOT:</b> multi-key operations (<code>MGET</code>, <code>MSET</code>, transactions, Lua scripts, <code>SUNION</code>) require <b>all keys in the same slot</b>. Fix with <b>hash tags</b>: only the part inside <code>{…}</code> is hashed, so <code>{user:42}:profile</code> and <code>{user:42}:settings</code> land in the same slot. The rate limiter's Lua script must receive all its keys via <code>KEYS[]</code>, sharing a hash tag. Or split operations per key, or use client-side pipelining across nodes.</li>
<li><b>Hot shard:</b> either a hash tag that's too broad (<code>{global}</code> on everything puts it all in one slot), a few very hot keys (a global counter, a popular entity), or big keys concentrated on one shard. Fixes: narrower hash tags, sharding hot keys across several keys, read replicas for read-heavy hot keys, or an in-process cache in front.</li>
<li><b>Client:</b> use a cluster-aware client that follows <code>MOVED</code>/<code>ASK</code> redirects and refreshes topology during resharding or failover.</li>
</ul>
<p>Also, <code>SELECT</code> (multiple databases) isn't supported in cluster mode. Use key prefixes.</p>`,
keys:["16,384 hash slots across shards","Multi-key ops need same slot; hash tags","Lua scripts must declare keys","Hot shards from broad tags/hot keys/big keys","Cluster-aware clients; no SELECT"],
trade:["Hash tags enable atomic multi-key work but concentrate keys on one shard","More shards add throughput but multi-key logic gets harder"],
fu:[{q:"How do you find big or hot keys?",a:"redis-cli --bigkeys and --hotkeys (with an LFU eviction policy), MEMORY USAGE on suspects, per-shard CPU and memory metrics in ElastiCache, and client-side metrics of the most-accessed keys."}],
rf:["Puts {app} hash tag on every key","Uses a non-cluster client","Unaware of slot rules for Lua"]},

{id:"Q049",skill:"Caching (Redis)",level:"Intermediate",type:"Scenario",
q:"Redis normally answers in under 1 ms, but every so often all clients see 200 ms+ spikes and timeouts. How do you diagnose it?",
a:`<p>Redis executes commands on <b>one main thread</b>, so any slow command blocks everyone. Check:</p>
<ul>
<li><b><code>SLOWLOG GET</code>:</b> lists commands exceeding the slowlog threshold. Typical offenders:
  <ul>
  <li><b>O(N) commands on big keys:</b> <code>HGETALL</code>/<code>SMEMBERS</code>/<code>LRANGE 0 -1</code> on collections with millions of elements, <code>KEYS *</code>, <code>SORT</code>.</li>
  <li><b>Deleting big keys</b> with <code>DEL</code>, which frees memory synchronously. Use <code>UNLINK</code> (asynchronous) or enable lazy-free options.</li>
  <li>Long-running <b>Lua scripts</b>.</li>
  </ul></li>
<li><b>Big keys:</b> <code>redis-cli --bigkeys</code>, and <code>MEMORY USAGE</code> on suspects. Restructure them: paginate with <code>HSCAN</code>/<code>SSCAN</code>, or split by bucket.</li>
<li><b>Persistence forks:</b> RDB snapshots and AOF rewrites <code>fork()</code> the process. With a large dataset the fork itself can stall for tens or hundreds of milliseconds, and copy-on-write doubles memory pressure. Check <code>INFO persistence</code> (<code>latest_fork_usec</code>) and line up the spike times with backups.</li>
<li><b>Expiry storms:</b> many keys expiring at the same moment (identical TTLs). Add jitter.</li>
<li><b>Network or client side:</b> connection storms, client pool exhaustion (looks like Redis latency but is client queueing), and noisy neighbours on small instance types.</li>
</ul>
<p>Redis's <code>LATENCY DOCTOR</code> and the latency monitor help correlate the events.</p>`,
keys:["Single main thread: one slow command blocks all","SLOWLOG and O(N) commands","Big keys; UNLINK vs DEL","Fork latency from persistence","Expiry storms, client-side pool issues"],
fu:[{q:"How do you safely delete a hash with 10 million fields?",a:"UNLINK it (memory is freed in a background thread), or delete it incrementally with HSCAN plus HDEL in small batches. Then fix whatever let one key grow that large."}],
rf:["Scales up the instance without checking SLOWLOG","Uses KEYS in production code","Doesn't consider persistence forks"]},

{id:"Q050",skill:"Caching (Redis)",level:"Intermediate",type:"Architecture",
q:"Redis round trips add measurable latency for a few very hot entities (feature flags, app config, popular group metadata). Design a two-tier cache (in-process plus Redis) and keep the tiers consistent.",
a:`<p><b>Tiers:</b></p>
<ul>
<li><b>L1:</b> an in-process memory cache per instance (an LRU with a size limit and short TTL). Nanosecond access, no network.</li>
<li><b>L2:</b> Redis, shared across instances, as today.</li>
<li><b>Source of truth:</b> the database.</li>
</ul>
<p>Reads check L1, then L2, then the DB, populating on the way back.</p>
<p><b>Consistency:</b> L1 copies on different instances can disagree. Options, in increasing strength:</p>
<ul>
<li><b>Short L1 TTLs</b> (seconds) for data that can be slightly stale (popular group metadata). Simple, with bounded staleness.</li>
<li><b>Invalidation broadcast:</b> on write, delete from L2 and publish an invalidation message (Redis pub/sub channel) that every instance listens to and uses to evict its L1 entry. Pub/sub is fire-and-forget, so keep a TTL as a safety net for missed messages.</li>
<li><b>Redis client-side caching</b> (Redis 6+ tracking): the server notifies clients when keys they've read change. That depends on client library support.</li>
</ul>
<p><b>Apply L1 selectively:</b> small, very hot, read-mostly data. Not large or user-specific data, which would blow up memory per instance. Use request coalescing so a burst of misses on one key loads it once. Libraries such as .NET's <code>HybridCache</code> implement much of this pattern.</p>`,
keys:["L1 in-process + L2 Redis + DB","Bounded staleness via short TTL","Pub/sub invalidation with TTL safety net","Client-side caching option","Selective use; coalescing; memory bounds"],
trade:["L1 removes network latency but introduces per-instance inconsistency and memory pressure","Invalidation broadcasts tighten consistency but are best-effort and add moving parts","It depends on: staleness tolerance, read volume, data size"],
fu:[{q:"Feature flags must change for all instances within 2 seconds. How do you meet that?",a:"L1 TTL under 2 seconds, or pub/sub invalidation plus a TTL of a few seconds as backstop. Measure propagation time in tests. Flag services or SDKs often use streaming updates for exactly this."}],
rf:["L1 for large per-user data","No invalidation or TTL on L1","Relies only on pub/sub without TTL fallback"]},
/* ================= ADVANCED ================= */
{id:"Q051",skill:"SQL Server",level:"Advanced",type:"Scenario",
q:"In a multi-tenant SQL Server database, the 'orders for tenant' query is fast for most tenants but takes 40 seconds for the three largest, or the reverse, depending on which tenant ran first after a plan was cached. How do you handle this kind of skew?",
a:`<p>This is a <b>parameter-sensitive</b> query. The cached plan suits the tenant whose value compiled it: a seek with nested loops is right for a tenant with 200 rows, and disastrous for one with 20 million, where a scan or hash join wins. One plan can't serve both.</p>
<p><b>Options, with their trade-offs:</b></p>
<ul>
<li><b><code>OPTION (RECOMPILE)</code></b> on this statement: a fresh plan per execution, always right for the value. It costs compile CPU every time, which is fine for moderate-frequency queries and bad for thousands per second.</li>
<li><b>Parameter Sensitive Plan optimisation</b> (SQL Server 2022, compatibility level 160): the optimiser keeps several plan variants for different cardinality ranges of an equality predicate. It's automatic, but only applies in specific cases, so verify it actually kicks in for this query.</li>
<li><b>Branch by tenant size:</b> the application or procedure calls different statements for "large" vs "normal" tenants (for example with different hints or separate procedures), so each gets its own cached plan.</li>
<li><b><code>OPTIMIZE FOR</code></b> a representative value, or <code>OPTIMIZE FOR UNKNOWN</code> (density-based average). Predictable, but mediocre for both ends.</li>
<li><b>Query Store plan forcing</b> of the plan that's acceptable for everyone. Often that plan doesn't exist.</li>
<li><b>Structural:</b> index changes that make one plan good across sizes, or moving the very largest tenants to separate databases or partitions.</li>
</ul>`,
keys:["Explains parameter sensitivity with tenant skew","RECOMPILE trade-off by execution frequency","PSP optimisation (2022) and its limits","Branching by tenant size","Structural options (indexes, tenant isolation)"],
trade:["RECOMPILE: correct plans, compile cost","OPTIMIZE FOR UNKNOWN: stable but average","Size-based branching: good plans for both, more code to maintain","It depends on: execution frequency, skew severity, SQL Server version"],
fu:[{q:"How do you prove a plan is parameter-sensitive rather than just a bad plan?",a:"Query Store shows multiple plans for the same query with very different durations, or one plan whose runtime varies widely by execution. Comparing actual plans for a small and a large tenant (estimated vs actual rows) confirms it."}],
rf:["Clears the plan cache on a schedule","Adds RECOMPILE to every query","Doesn't know PSP optimisation"]},

{id:"Q052",skill:"SQL Server",level:"Advanced",type:"Concept",
q:"What are columnstore indexes, how do they achieve their speed, and when would you add one to an OLTP database?",
a:`<p>A columnstore index stores data <b>by column</b> in compressed <b>rowgroups</b> (about a million rows each). Each column's segment carries min/max metadata. Analytical queries benefit from:</p>
<ul>
<li>Reading only the columns they need.</li>
<li><b>Heavy compression</b> (similar values together), so far less I/O.</li>
<li><b>Segment elimination:</b> skipping rowgroups whose min/max can't match the filter.</li>
<li><b>Batch mode execution:</b> operators process around 900 rows at a time with vectorised code, instead of row by row. Since SQL Server 2019, batch mode can also run on rowstore tables.</li>
</ul>
<p><b>Types:</b></p>
<ul>
<li><b>Clustered columnstore:</b> the table itself, for data warehouses and fact tables.</li>
<li><b>Nonclustered columnstore on a rowstore OLTP table</b> ("operational analytics"): real-time reporting over live transactional data without an ETL pipeline. New rows land in a <b>delta store</b> (rowstore) and are compressed later by the tuple mover.</li>
</ul>
<p><b>When to add one to OLTP:</b> large tables with heavy aggregate reporting (sum or count over millions of rows) that currently scan rowstore indexes, where moving to a separate warehouse isn't justified yet.</p>
<p><b>Costs:</b> extra write overhead, delta-store fragmentation with frequent updates and deletes (rows are marked deleted rather than removed), and point lookups that are worse than with B-trees. A filtered nonclustered columnstore over "cold" rows reduces interference with hot updates.</p>`,
keys:["Columnar storage, compression, rowgroups","Segment elimination","Batch mode (and on rowstore from 2019)","Operational analytics with NCCI and delta store","Costs: updates/deletes, writes, point lookups"],
fu:[{q:"Why do frequent updates hurt columnstore?",a:"An update is a delete plus an insert. Deleted rows are tracked in a delete bitmap, not removed, and new rows go to the delta store. Over time compressed rowgroups carry many deleted rows, which hurts compression and scans until a reorganise or rebuild cleans them up."}],
rf:["Columnstore for point lookups","Unaware of delta store","Thinks columnstore replaces all reporting design"]},

{id:"Q053",skill:"SQL Server",level:"Advanced",type:"Architecture",
q:"You want to move read traffic to Always On availability group readable secondaries. Design it, and explain what the application must handle.",
a:`<p><b>Setup:</b> an availability group with one or more readable secondaries, and <b>read-only routing</b> configured on the listener. Read connections use <code>ApplicationIntent=ReadOnly</code> (a separate connection string or <code>DbContext</code> for reads) and are routed to a secondary. Writes and consistency-critical reads go to the primary.</p>
<p><b>What the application must handle:</b></p>
<ul>
<li><b>Replication lag:</b> asynchronous-commit secondaries can lag seconds or more under load. Even synchronous-commit secondaries <i>harden</i> the log synchronously but <i>redo</i> it asynchronously, so a read immediately after a write can miss it. Read-your-writes flows (show the order I just placed) must read from the primary.</li>
<li><b>Isolation:</b> queries on secondaries run under snapshot isolation automatically (hints are effectively ignored), which adds version-store load on the primary.</li>
<li><b>Statistics:</b> secondaries can't update statistics in the database, so they create temporary statistics in tempdb. Plans can differ from the primary's.</li>
<li><b>Failover:</b> routing changes when roles change, and connection pools must handle reconnects.</li>
<li><b>Licensing:</b> readable secondaries need licensing (Enterprise edition, licensed cores).</li>
</ul>
<p><b>Use it for:</b> reports, exports, search-like listing pages, and dashboards where a second of staleness is fine. Monitor redo queue size and secondary lag, and remove a secondary from read rotation if it falls too far behind.</p>`,
keys:["Read-only routing with ApplicationIntent","Redo lag even with synchronous commit","Read-your-writes to primary","Snapshot isolation and temp statistics on secondaries","Licensing, failover, lag monitoring"],
trade:["Read scale-out offloads the primary but introduces staleness and per-flow routing decisions","Synchronous commit reduces data-loss risk but adds write latency; it doesn't eliminate read lag"],
fu:[{q:"How do you route reads in an EF Core app?",a:"Register two DbContext types (or one context with two connection strings via a factory): a read-only one with ApplicationIntent=ReadOnly and no-tracking, used by query handlers that tolerate staleness, and the default one for commands and read-your-writes queries. Make the choice explicit per handler."}],
rf:["Routes all reads to secondaries","Assumes synchronous commit means no lag","Ignores licensing"]},

{id:"Q054",skill:"SQL Server",level:"Advanced",type:"Concept",
q:"What is In-Memory OLTP (memory-optimised tables) in SQL Server, and when is it worth using?",
a:`<p>Memory-optimised tables live entirely in memory, with lock-free and latch-free data structures (multi-version optimistic concurrency, hash and range indexes). <b>Natively compiled stored procedures</b> compile T-SQL to machine code for very fast execution. Durability options:</p>
<ul>
<li><code>SCHEMA_AND_DATA</code>: logged and checkpointed, survives restarts.</li>
<li><code>SCHEMA_ONLY</code>: no logging, data lost on restart. Very fast.</li>
</ul>
<p><b>Good fits:</b></p>
<ul>
<li><b>Hot contention points:</b> extremely high-rate inserts or updates on a few tables (session state, rate counters, ingestion staging) where latch contention limits throughput.</li>
<li><b><code>SCHEMA_ONLY</code> tables</b> for transient data and ETL staging.</li>
<li><b>Memory-optimised table types</b> to replace temp tables or table variables in hot procedures, avoiding tempdb.</li>
</ul>
<p><b>Costs and limitations:</b></p>
<ul>
<li>Memory sizing: the data, indexes and row versions must fit in memory, with headroom.</li>
<li>Feature limitations (some data types, constraints and cross-database queries).</li>
<li>Optimistic concurrency conflicts need retry logic.</li>
<li>Hash index bucket counts must be sized.</li>
<li>A filegroup that can't be removed once added.</li>
<li>Operational unfamiliarity.</li>
</ul>
<p>It's a targeted tool for measured bottlenecks, not a general speed-up.</p>`,
keys:["Lock/latch-free, MVCC optimistic","Native compilation","Durability options incl. SCHEMA_ONLY","Fits: hot contention, staging, table types","Memory, feature limits, retry needs"],
fu:[{q:"What's a common quick win with In-Memory OLTP that doesn't require migrating core tables?",a:"Memory-optimised table types (table-valued parameters or variables) and SCHEMA_ONLY tables for staging or session-like data. They relieve tempdb contention and give speed-ups without the risk of moving core transactional tables."}],
rf:["Moves all tables in-memory","No retry logic for conflicts","Ignores memory sizing"]},

{id:"Q055",skill:"SQL Server",level:"Advanced",type:"Scenario",
q:"An event-ingestion table with an identity clustered key tops out at about 8,000 inserts per second. Wait stats show heavy PAGELATCH_EX on the table's last page. Explain and fix.",
a:`<p>With an ever-increasing key (identity, sequential date), every insert targets the <b>same last page</b> of the clustered index. Concurrent inserts must take an exclusive latch on that page one at a time. That's <b>last-page insert contention</b>: throughput is limited by latch handoff, not CPU or disk.</p>
<p><b>Options:</b></p>
<ul>
<li><b><code>OPTIMIZE_FOR_SEQUENTIAL_KEY = ON</code></b> (SQL Server 2019+): flow control that improves throughput under this pattern, reducing convoy effects. It's the cheapest change, but it mitigates rather than removes the hotspot.</li>
<li><b>Spread inserts:</b> a non-sequential clustering key (GUID), or a hash-partitioning scheme (partition on <code>hash(id) % N</code>) so inserts land on N different last pages. The cost is page splits and fragmentation for random keys, and partitioning complexity.</li>
<li><b>Memory-optimised table</b> for ingestion (no latches), periodically moved into disk-based tables.</li>
<li><b>Batch inserts</b> from the application (a TVP or bulk copy of 500 rows), so far fewer latch acquisitions are needed per row.</li>
<li>Or ingest through a queue and write in batches from a few workers.</li>
</ul>
<p>Measure each change with the same load test, watching the PAGELATCH waits and the insert rate.</p>`,
keys:["Last-page insert contention mechanism","OPTIMIZE_FOR_SEQUENTIAL_KEY (2019)","Spreading inserts (GUID/hash partition) and its costs","In-Memory OLTP option","Batching inserts"],
trade:["Random keys remove the hotspot but add page splits and fragmentation","Batching reduces latch traffic but adds latency and app complexity"],
fu:[{q:"Why is this PAGELATCH and not PAGEIOLATCH?",a:"The page is already in memory, and sessions are waiting to modify it, not to read it from disk. PAGEIOLATCH would mean waiting for I/O. Adding faster storage won't help."}],
rf:["Adds faster disks","Removes the clustered index","Doesn't measure after the change"]},

{id:"Q056",skill:"SQL Server",level:"Advanced",type:"Scenario",
q:"You need to raise a database's compatibility level from 130 to 160 as part of a SQL Server upgrade. Last time a similar change caused regressions. How do you do it safely?",
a:`<p>Compatibility level changes the <b>cardinality estimator</b> version and enables optimiser features (intelligent query processing: adaptive joins, memory grant feedback, PSP optimisation, and more). Most queries improve, and a few regress.</p>
<p><b>Safe process</b> (Microsoft's recommended Query Store workflow):</p>
<ol>
<li>Upgrade the engine but <b>keep the old compatibility level</b> at first.</li>
<li>Enable <b>Query Store</b> and collect a baseline over a representative period (including month-end jobs).</li>
<li>Raise the compatibility level in a pre-production copy with replayed or representative workload if possible, then in production at a quiet time.</li>
<li>Use Query Store's <b>Regressed Queries</b> view to find queries that got slower, and <b>force the previous plan</b> for them immediately. Enable automatic plan correction (<code>FORCE_LAST_GOOD_PLAN</code>) as a safety net.</li>
<li>Fix forced plans properly over time (indexes, query rewrites) and unforce them.</li>
</ol>
<p><b>Fallbacks:</b> the database-scoped configuration <code>LEGACY_CARDINALITY_ESTIMATION = ON</code> keeps the old estimator while getting other features, and per-query hints (<code>USE HINT('FORCE_LEGACY_CARDINALITY_ESTIMATION')</code>) handle stubborn cases. SSMS's Query Tuning Assistant automates parts of this.</p>`,
keys:["Compat level changes CE and IQP features","Baseline with Query Store before change","Regressed queries + plan forcing / automatic correction","LEGACY_CARDINALITY_ESTIMATION and query hints as fallbacks","Fix forced plans properly later"],
fu:[{q:"Why not just stay on the old compatibility level forever?",a:"You miss optimiser improvements that benefit most queries, and newer features gated on compatibility level. Very old levels may also lose support in future versions. It's a short-term safety measure, not a strategy."}],
rf:["Changes compat level at peak with no baseline","Rolls back the whole engine upgrade for a few regressions","Unaware of Query Store workflow"]},

{id:"Q057",skill:"SQL Server",level:"Advanced",type:"Concept",
q:"Compare Row-Level Security, Dynamic Data Masking and Always Encrypted in SQL Server. What does each protect against, and what doesn't it?",
a:`<ul>
<li><b>Row-Level Security (RLS):</b> a security policy with inline predicate functions filters rows per session context (for example <code>SESSION_CONTEXT('TenantId')</code>), and blocks writes that violate it. It protects against application bugs that forget tenant filters. It doesn't protect against users with elevated permissions (db_owner) or against side-channel inference through carefully crafted queries. The application must set the session context reliably on every pooled connection.</li>
<li><b>Dynamic Data Masking (DDM):</b> masks column values in query results for non-privileged users (for example <code>XXXX-1234</code>). It's a <b>convenience to reduce accidental exposure</b>, not a security boundary: users with ad-hoc query access can infer values through filters (<code>WHERE Salary &gt; 100000</code>), and the data is unencrypted underneath.</li>
<li><b>Always Encrypted:</b> encryption happens <b>in the client driver</b> with keys the database server never sees, so DBAs, the server and backups can't read plaintext. Deterministic encryption allows equality lookups. Randomised encryption allows nothing server-side, unless <b>secure enclaves</b> (2019+) are used for richer operations. The costs: limited querying, key management, and changes to application and driver configuration.</li>
</ul>
<p>Also relevant: <b>TDE</b> (encryption at rest, which protects files and backups but not anyone with query access) and column-level encryption managed by the application.</p>`,
keys:["RLS: predicate-based row filtering; session context; privileged users","DDM: cosmetic, inference attacks","Always Encrypted: client-side keys, query limits, enclaves","TDE at-rest scope","Choose by threat model"],
fu:[{q:"Which would you use to keep DBAs from reading patients' national ID numbers?",a:"Always Encrypted (or application-level encryption) on that column, with keys held outside the database team's control. RLS and DDM don't stop privileged database users, and TDE only protects data files and backups."}],
rf:["Calls DDM a security control","Thinks TDE hides data from DBAs","RLS without reliable session context setting"]},

{id:"Q058",skill:"SQL Server",level:"Advanced",type:"Scenario",
q:"A search procedure accepts 8 optional filters and uses WHERE (@Name IS NULL OR Name = @Name) AND (@City IS NULL OR City = @City) … It's slow for almost every combination. Why, and how do you fix it?",
a:`<p>This "catch-all" or "kitchen-sink" query compiles <b>one plan</b> that must be correct for every combination of supplied filters. The optimiser can't seek on <code>Name</code> when <code>@Name</code> might be NULL, so it usually picks a scan, and the plan cached for the first combination is reused for all the others.</p>
<p><b>Fixes:</b></p>
<ul>
<li><b><code>OPTION (RECOMPILE)</code>:</b> with recompile, SQL Server embeds the actual parameter values at compile time (the parameter embedding optimisation), simplifies away the <code>@x IS NULL OR</code> branches, and produces a plan using the right indexes for this call. That's simple and effective when the procedure runs at a moderate rate.</li>
<li><b>Dynamic SQL, parameterised:</b> build the WHERE clause with only the supplied filters, and execute with <code>sp_executesql</code> and parameters (never by concatenating values). Each filter combination becomes a separate cached plan, with no recompile cost after the first run. Safe from injection because values remain parameters, and column names come only from fixed code.</li>
</ul>
<pre><code>DECLARE @sql nvarchar(max) = N'SELECT … FROM dbo.Customers WHERE 1 = 1';
IF @Name IS NOT NULL SET @sql += N' AND Name = @Name';
IF @City IS NOT NULL SET @sql += N' AND City = @City';
EXEC sp_executesql @sql, N'@Name nvarchar(100), @City nvarchar(50)', @Name, @City;</code></pre>
<p>Then make sure indexes exist for the common filter combinations. The same applies to ORMs: build LINQ conditionally (<code>if (name != null) q = q.Where(…)</code>) rather than <code>Where(x =&gt; name == null || x.Name == name)</code>.</p>`,
keys:["One plan for all combinations explained","RECOMPILE with parameter embedding","Parameterised dynamic SQL via sp_executesql","Injection safety; plan per combination","ORM equivalent: conditional query building"],
trade:["RECOMPILE: simplest, CPU per call","Dynamic SQL: best plan reuse, more code and needs careful security review"],
fu:[{q:"How does this pattern show up in EF Core code?",a:"Writing .Where(x => filter.Name == null || x.Name == filter.Name) produces the same catch-all SQL. Composing the query conditionally adds only the needed predicates, so EF generates different SQL per combination."}],
rf:["Concatenates parameter values into dynamic SQL","Adds an index per column and hopes","Keeps catch-all with no recompile"]},

{id:"Q059",skill:"SQL Server",level:"Advanced",type:"Architecture",
q:"You need to capture data changes from SQL Server for downstream systems and audit: Change Data Capture, Change Tracking, temporal tables, or triggers? Compare them and choose for (a) syncing a search index and (b) a 7-year audit history.",
a:`<ul>
<li><b>Change Tracking:</b> lightweight. Records <i>which</i> rows changed (keys plus version), not the old or new values. Consumers query changes since a version and read the current row. Good for "sync what changed" when intermediate states don't matter.</li>
<li><b>Change Data Capture (CDC):</b> reads the transaction log asynchronously and writes full before and after images into change tables. Captures every change with values, so it's the feed for Debezium or AWS DMS into Kafka or other systems. Costs: capture and cleanup jobs (SQL Agent), change table storage, and some log retention coupling.</li>
<li><b>Temporal (system-versioned) tables:</b> the engine keeps every prior row version in a history table with validity periods, so <code>FOR SYSTEM_TIME AS OF</code> queries are built in. Great for "what did this row look like then". Retention policies are possible. They don't record <i>who</i> made the change unless you add columns for it.</li>
<li><b>Triggers:</b> fully custom, synchronous within the transaction, so they add write latency and hidden logic. A last resort, or for small, specific needs.</li>
</ul>
<p><b>(a) Search index sync:</b> an outbox (best, with business-level events), or CDC through Debezium or DMS if you need table-level change streams. Change Tracking also works for a simple periodic sync.</p>
<p><b>(b) 7-year audit:</b> temporal tables for data history, plus application audit logs for who and why, with history moved to cheaper storage or archived tables per retention policy. Check that the history design meets regulatory needs (tamper evidence may require more).</p>`,
keys:["Change Tracking: keys only, lightweight","CDC: log-based full images, feeds Debezium/DMS","Temporal tables: built-in history and AS OF queries","Triggers: synchronous, hidden, last resort","Choices per use case incl. who/why gap"],
trade:["CDC gives complete change streams but adds operational jobs and storage","Temporal tables give easy history but store full row copies; plan retention","It depends on: whether intermediate states, values, or actor identity are needed"],
fu:[{q:"Why is an outbox often better than CDC for integration events?",a:"CDC exposes table-level row changes, coupling consumers to your schema and losing business intent. An outbox publishes explicit domain events that you version deliberately. CDC can still be the transport that carries outbox rows."}],
rf:["Triggers for everything","Change Tracking for audit values","Unaware temporal tables lack 'who'"]},

{id:"Q060",skill:"PostgreSQL",level:"Advanced",type:"Concept",
q:"Compare physical (streaming) and logical replication in PostgreSQL. What is logical replication used for, and what are its limitations?",
a:`<p><b>Physical (streaming) replication</b> ships the WAL byte for byte to standbys, which are exact copies of the whole cluster: same major version, read-only, all databases. It's used for high availability and read replicas, and it's what RDS and Aurora replicas build on.</p>
<p><b>Logical replication</b> decodes WAL into row-level changes per table, published via <code>PUBLICATION</code> and subscribed via <code>SUBSCRIPTION</code>. The subscriber is a normal, writable database that may run a <b>different major version</b> and may receive only some tables.</p>
<p><b>Uses:</b></p>
<ul>
<li>Near-zero-downtime <b>major version upgrades</b> (replicate to a new-version cluster, then cut over).</li>
<li>Migrating between hosts or providers.</li>
<li>Selective replication to a reporting database.</li>
<li><b>CDC</b>: Debezium and similar tools read logical decoding output.</li>
</ul>
<p><b>Limitations:</b></p>
<ul>
<li><b>DDL isn't replicated</b>, so schema changes must be applied on both sides in the right order.</li>
<li><b>Sequence values aren't replicated</b>; set them manually at cutover.</li>
<li>Tables need a <b>replica identity</b> (normally a primary key) for UPDATE and DELETE.</li>
<li>Large objects aren't supported.</li>
<li>Replication slots retain WAL until consumed. A stalled subscriber can fill the primary's disk, so monitor slot lag.</li>
<li>Initial copy of large tables takes time, and conflicts on the subscriber stop replication until resolved.</li>
</ul>`,
keys:["Physical: byte-level, whole cluster, same version","Logical: row changes per table, cross-version, writable target","Uses: upgrades, migrations, CDC","Limitations: DDL, sequences, replica identity","Slot WAL retention risk"],
fu:[{q:"In a logical-replication-based upgrade, what do you do at cutover?",a:"Stop writes to the old primary, wait for the subscriber to catch up (zero lag), set sequences on the new cluster above the old values, run a few validation checks, switch application connection strings, and then drop the subscription and old slots."}],
rf:["Thinks logical replication copies DDL","Forgets sequences","No slot monitoring"]},

{id:"Q061",skill:"PostgreSQL",level:"Advanced",type:"Scenario",
q:"Production runs RDS PostgreSQL 13, which is reaching end of standard support. You need to get to 16 or newer with minimal downtime. Compare the approaches and plan the upgrade.",
a:`<p><b>Options:</b></p>
<ul>
<li><b>In-place major version upgrade</b> (RDS uses <code>pg_upgrade</code>): simple, but the instance is unavailable for the duration (minutes to longer, depending on the number of objects), and rollback means restoring from a snapshot.</li>
<li><b>RDS Blue/Green Deployments:</b> RDS creates a "green" copy kept in sync using logical replication, which you upgrade and test. Switchover takes about a minute, with guardrails. The constraints come from logical replication (DDL and sequence handling, tables needing primary keys or replica identity, some unsupported features).</li>
<li><b>Manual logical replication</b> to a new-version instance: full control, more steps.</li>
</ul>
<p><b>Plan:</b></p>
<ol>
<li>Check extension compatibility (PostGIS, pg_partman and so on) and target versions, read the release notes for behaviour changes, and test the application against the new version in staging.</li>
<li>Make sure every replicated table has a primary key. Freeze schema changes during the window.</li>
<li>Rehearse on a production snapshot and measure timings.</li>
<li>Upgrade, either Blue/Green or in place during a maintenance window.</li>
<li><b>Run <code>ANALYZE</code></b> on the new cluster immediately. Historically, <code>pg_upgrade</code> doesn't carry optimiser statistics, and bad plans right after an upgrade are a classic incident. Newer versions preserve some statistics, but verify.</li>
<li>Monitor query performance against the pre-upgrade baseline (pg_stat_statements), and keep the old environment until stable.</li>
</ol>`,
keys:["In-place vs Blue/Green vs manual logical replication","Logical replication constraints (PKs, DDL, sequences)","Extension and behaviour compatibility testing","Rehearsal on snapshot","ANALYZE after upgrade; baseline comparison"],
trade:["In-place: simplest, longest downtime, rollback via restore","Blue/Green: short switchover, needs logical-replication-compatible schema","Manual logical: most control, most effort"],
fu:[{q:"Why can queries be slow right after pg_upgrade?",a:"Planner statistics haven't been collected on the new cluster, so estimates fall back to defaults and choose poor plans until ANALYZE runs. vacuumdb --analyze-in-stages gets rough statistics quickly, then refines them."}],
rf:["Upgrades production without rehearsal","Forgets ANALYZE","Ignores extension compatibility"],
verify:"Whether pg_upgrade preserves optimizer statistics depends on version (newer releases added this); and RDS Blue/Green constraints evolve. Check current docs."},

{id:"Q062",skill:"PostgreSQL",level:"Advanced",type:"Concept",
q:"Aurora PostgreSQL vs RDS PostgreSQL: what's actually different, and how do you choose?",
a:`<p><b>Storage architecture:</b> Aurora separates compute from a distributed storage layer that keeps <b>six copies across three AZs</b> and writes log records rather than full pages. Consequences:</p>
<ul>
<li><b>Faster failover</b> (typically well under a minute), with no separate replica storage. Up to 15 read replicas share the same storage, with low replica lag (often milliseconds).</li>
<li>Storage grows automatically. Crash recovery is fast.</li>
<li>Features like <b>Global Database</b> (cross-region replicas with fast failover), fast cloning, Backtrack-like capabilities (on Aurora MySQL), and <b>Serverless v2</b> (fine-grained autoscaling of capacity).</li>
</ul>
<p><b>Costs and differences:</b></p>
<ul>
<li>Pricing includes I/O in the Standard configuration, which can be expensive for I/O-heavy workloads. <b>I/O-Optimized</b> trades a higher instance and storage price for no I/O charges.</li>
<li>It's still PostgreSQL for the application, with the same SQL, MVCC and vacuum needs, but some extensions and parameters differ, and new PostgreSQL versions arrive slightly later.</li>
</ul>
<p><b>RDS PostgreSQL:</b> standard PostgreSQL on EBS with Multi-AZ (one standby, or the Multi-AZ cluster option with two readable standbys). Predictable pricing and often cheaper for steady, moderate workloads.</p>
<p><b>Choose Aurora</b> for many read replicas, fast failover, global or DR requirements, or spiky load (Serverless v2). <b>Choose RDS</b> for cost-sensitive steady workloads that don't need those features. Model I/O costs with real metrics before deciding.</p>`,
keys:["Distributed storage, six copies across three AZs","Replicas share storage: low lag, fast failover","Global Database, Serverless v2","I/O pricing and I/O-Optimized","Still PostgreSQL semantics; extension/version lag"],
fu:[{q:"Does Aurora remove the need to manage vacuum?",a:"No. MVCC and dead tuples work the same way, so autovacuum tuning, long-transaction monitoring and bloat management still apply."}],
rf:["\"Aurora is just RDS with a different name\"","Assumes Aurora is always cheaper","Thinks Aurora needs no vacuum"]},

{id:"Q063",skill:"PostgreSQL",level:"Advanced",type:"Scenario",
q:"Long reports on a PostgreSQL read replica keep failing with 'canceling statement due to conflict with recovery'. A teammate wants to turn on hot_standby_feedback. What's happening, and what are the trade-offs?",
a:`<p>The replica continuously replays WAL from the primary. When the primary vacuums away row versions that a long query on the replica still needs, or takes conflicting locks, replay would invalidate the replica's snapshot. PostgreSQL must either <b>delay replay</b> or <b>cancel the query</b>. <code>max_standby_streaming_delay</code> (30 seconds by default) bounds the delay, and after that queries are cancelled.</p>
<p><b>Options:</b></p>
<ul>
<li><b><code>hot_standby_feedback = on</code>:</b> the replica tells the primary which row versions it still needs, so the primary's vacuum doesn't remove them. Queries stop being cancelled, but long replica queries now cause <b>bloat on the primary</b>, since dead tuples can't be cleaned. That's exactly the cost you don't want on a busy OLTP primary.</li>
<li><b>Raise <code>max_standby_streaming_delay</code></b> on the replica: queries get more time, but replication lag grows during long reports, and the replica serves increasingly stale data. It's acceptable for a <b>dedicated reporting replica</b>, not for one serving the application.</li>
<li><b>Separate replicas:</b> one for low-latency app reads (default settings) and one for reports (large delay allowed). Or move heavy reporting to an analytics store fed by CDC.</li>
<li><b>Make reports shorter:</b> better indexes, incremental reports, pre-aggregated tables.</li>
</ul>`,
keys:["Replay vs query snapshot conflict","max_standby_streaming_delay behaviour","hot_standby_feedback causes primary bloat","Dedicated reporting replica with large delay","Analytics store / shorter queries"],
trade:["Feedback protects queries at the primary's expense","Delay protects queries at the cost of replica freshness","It depends on: whether the replica serves app reads or reports"],
fu:[{q:"Does Aurora PostgreSQL have the same issue?",a:"Aurora replicas share storage but still need consistent snapshots. Long queries on Aurora replicas can similarly be cancelled or cause the writer to retain old versions, and Aurora has its own related parameters and behaviours. Same trade-off, different mechanics."}],
rf:["Turns on hot_standby_feedback without considering primary bloat","Runs reports on the primary instead","Doesn't separate reporting from app replicas"]},

{id:"Q064",skill:"PostgreSQL",level:"Advanced",type:"Concept",
q:"When would you use pgvector for vector search instead of a dedicated vector store, and what are the indexing and filtering pitfalls?",
a:`<p><b>pgvector</b> adds a <code>vector</code> type, distance operators (<code>&lt;-&gt;</code> L2, <code>&lt;=&gt;</code> cosine, <code>&lt;#&gt;</code> inner product) and approximate-nearest-neighbour indexes. Its advantages: embeddings live <b>next to the relational data</b>, with transactional consistency, joins and normal SQL filters, backups, and no extra system to run. It's a good fit up to a few million vectors per index with moderate query rates, which covers many RAG and recommendation features.</p>
<p><b>Indexes:</b></p>
<ul>
<li><b>HNSW:</b> better speed and recall trade-off, no training step, but slower builds and more memory.</li>
<li><b>IVFFlat:</b> faster builds and smaller, but needs data present before building (lists from k-means), and recall depends on the <code>probes</code> setting.</li>
</ul>
<p>Tune <code>ef_search</code> or <code>probes</code> for recall vs latency, and give index builds enough <code>maintenance_work_mem</code>.</p>
<p><b>Filtering pitfall:</b> ANN indexes return the nearest <i>k</i> candidates first, and a <code>WHERE tenant_id = …</code> or <code>category = …</code> filter applied afterwards can leave fewer than k results, or none. Mitigations:</p>
<ul>
<li>Iterative index scans in newer pgvector versions.</li>
<li>Partial indexes or partitions per tenant or category.</li>
<li>Raising <code>ef_search</code>.</li>
<li>Exact search (no index) for small, filtered subsets.</li>
</ul>
<p><b>Move to a dedicated engine</b> (OpenSearch, or a vector database) for very large collections, high QPS, sophisticated hybrid ranking, or when vector search load would compete with OLTP.</p>`,
keys:["Co-located with relational data; transactional","HNSW vs IVFFlat trade-offs","Recall tuning parameters","Post-filtering recall pitfall and mitigations","Criteria for a dedicated engine"],
fu:[{q:"How do you combine keyword and vector relevance in PostgreSQL?",a:"Run a full-text query (tsvector rank) and a vector query separately, then merge with Reciprocal Rank Fusion in SQL or the application. That gives hybrid search without a separate engine, at modest scale."}],
rf:["Unaware of filtered-search recall loss","Builds IVFFlat on an empty table","Uses exact search on millions of rows at high QPS"],
verify:"pgvector features (iterative index scans, quantization types) depend on version; check the version available on RDS/Aurora."},

{id:"Q065",skill:"PostgreSQL",level:"Advanced",type:"Scenario",
q:"Deleting a single user (GDPR request) takes 40 seconds and blocks other operations. The users table has about 15 tables referencing it with ON DELETE CASCADE or RESTRICT. What's wrong?",
a:`<p>PostgreSQL <b>does not automatically index foreign-key columns</b> on the referencing side. When a parent row is deleted (or its key updated), PostgreSQL must check or cascade to child rows in every referencing table. Without an index on <code>child.user_id</code>, each check is a <b>sequential scan</b> of the child table. Fifteen tables, some with millions of rows, means 40 seconds of scanning, while holding locks on the rows being deleted.</p>
<p><b>Find them:</b> query the catalogue for foreign keys whose columns don't have a matching leading index (there are well-known queries joining <code>pg_constraint</code> with <code>pg_index</code>). Or run <code>EXPLAIN ANALYZE DELETE …</code> inside a transaction and roll back. Trigger time per constraint shows where the time goes.</p>
<p><b>Fix:</b></p>
<ul>
<li>Create indexes on the referencing columns (<code>CREATE INDEX CONCURRENTLY</code>). They also help joins from parent to child.</li>
<li>For very large cascades (a user with millions of events), avoid a single huge cascading delete. Delete or anonymise child data in batches first, then delete the parent, or anonymise the user row instead, where retention rules allow.</li>
</ul>
<p>The same applies to SQL Server, which also doesn't create indexes for foreign keys.</p>`,
keys:["FK columns not auto-indexed","Parent delete scans each child table","Catalog query / EXPLAIN ANALYZE to find culprits","Index referencing columns concurrently","Batch large cascades; anonymisation alternative"],
fu:[{q:"Why can ON DELETE CASCADE be dangerous on large data even with indexes?",a:"It runs as one transaction deleting potentially millions of rows across tables: long locks, huge WAL, replica lag, and no way to pause. For large dependents, batch the deletion explicitly."}],
rf:["Disables foreign keys","Assumes PostgreSQL indexes FKs automatically","One huge cascading delete for heavy users"]},

{id:"Q066",skill:"DynamoDB",level:"Advanced",type:"Architecture",
q:"Model group chat in DynamoDB: messages per conversation with pagination, each user's conversation list sorted by latest activity, and unread counts.",
a:`<p><b>Messages</b> (one item collection per conversation):</p>
<ul>
<li><code>PK = CONV#{convId}</code>, <code>SK = MSG#{sequenceOrTimeUlid}</code>. Query newest-first with <code>ScanIndexForward = false</code> and <code>Limit</code>, paginating with <code>LastEvaluatedKey</code>.</li>
<li>Use a server-assigned, sortable ID (ULID, or a per-conversation sequence from a counter item with an atomic <code>ADD</code>), so order is consistent.</li>
<li>Very busy conversations can approach per-partition throughput. Bucket by time (<code>CONV#{id}#2026-10</code>) if needed.</li>
</ul>
<p><b>Conversation list per user (inbox):</b></p>
<ul>
<li>Membership items <code>PK = USER#{userId}</code>, <code>SK = CONV#{convId}</code> holding <code>lastMessageAt</code>, a preview and <code>unreadCount</code>.</li>
<li>A GSI on <code>PK</code> with sort key <code>lastMessageAt</code> (for example <code>GSI1PK = USER#{userId}</code>, <code>GSI1SK = {lastMessageAt}</code>) lists conversations by latest activity.</li>
</ul>
<p><b>On new message:</b> write the message, then update each member's membership item (<code>lastMessageAt</code>, preview, <code>ADD unreadCount 1</code> for others). For small groups, do it synchronously in a batch. For large groups, do it <b>asynchronously from the stream</b>, since fan-out writes scale with member count.</p>
<p><b>Read receipts:</b> on open, set <code>unreadCount = 0</code> and store <code>lastReadSeq</code>, which also lets the client compute unread messages exactly.</p>`,
keys:["Conversation item collection with sortable message IDs","Inbox via membership items + GSI on lastMessageAt","Fan-out updates sync for small, async for large groups","Unread counters with atomic ADD; lastReadSeq","Hot conversation bucketing"],
trade:["Updating every member's inbox on each message is write amplification proportional to group size; async fan-out spreads it out","Time-bucketed partitions spread hot conversations but make pagination span buckets"],
fu:[{q:"How do you show unread counts across all of a user's conversations cheaply?",a:"Keep a per-user total counter item updated with the same deltas (or recomputed on read from the first page of inbox items if the list is short). Avoid summing over all conversations on every app open."}],
rf:["Scan for messages","Relational join thinking (separate queries per conversation to find latest message)","Synchronous fan-out to 5,000 members on every message"]},

{id:"Q067",skill:"DynamoDB",level:"Advanced",type:"Scenario",
q:"Product and analytics teams want ad-hoc queries over a large DynamoDB table ('posts per group per week', 'top users by reactions'). Someone has started running Scans against production. What do you set up instead?",
a:`<p>Scans against production consume capacity (throttling real traffic), are slow, and still can't do joins or aggregations, which end up in scripts. DynamoDB is built for known access patterns, not ad-hoc analytics.</p>
<p><b>Options:</b></p>
<ul>
<li><b>Export to S3</b> (requires point-in-time recovery enabled): full exports, and incremental exports of changes over a time window. It doesn't consume table read capacity. Query with <b>Athena</b> (in DynamoDB JSON or Ion format, or after transforming to Parquet with Glue) for ad-hoc SQL. Good for daily or hourly analytics.</li>
<li><b>Zero-ETL integrations</b> to Amazon Redshift or OpenSearch Service: managed, near-real-time replication into a warehouse (SQL analytics) or a search engine (full-text, aggregations).</li>
<li><b>DynamoDB Streams to a pipeline</b> (Lambda, Kinesis Firehose to S3 or a warehouse) for near-real-time custom transformations.</li>
</ul>
<p><b>Governance:</b> remove the production Scan scripts, give analysts read access to the analytics copy only, document freshness, and pseudonymise personal data in the exported dataset.</p>`,
keys:["Scans hurt production and can't aggregate well","Export to S3 (PITR) + Athena","Zero-ETL to Redshift/OpenSearch","Streams-based pipelines","Governance: access, freshness, PII"],
trade:["Daily exports are cheap but stale","Zero-ETL is near-real-time but adds the cost of a warehouse or cluster","It depends on: freshness needs, query complexity, budget"],
fu:[{q:"An analyst needs one-off data within an hour for an incident. What's acceptable?",a:"A rate-limited parallel scan against a PITR-restored copy of the table, or a fresh export. Never an unthrottled scan of the production table during peak."}],
rf:["Allows production scans with filters","Builds GSIs for every analytical question","No PII handling in exports"],
verify:"DynamoDB zero-ETL integration targets and incremental export capabilities evolve; check current availability."},

{id:"Q068",skill:"DynamoDB",level:"Advanced",type:"Architecture",
q:"The app needs to serve users in two regions with local write latency, using DynamoDB global tables. How do global tables handle concurrent writes, and how do you design to avoid problems?",
a:`<p>Global tables replicate each table across regions. Each region accepts reads and writes locally, and changes replicate <b>asynchronously</b>, typically in about a second.</p>
<p><b>Concurrency:</b> in the default (multi-region eventual consistency) mode, if the same item is written in two regions before replication, <b>last writer wins</b> by timestamp. One write silently disappears. Conditional writes and transactions are only evaluated within the region where they run, so "create if not exists" in two regions at once can both succeed locally.</p>
<p><b>Design to avoid conflicts:</b></p>
<ul>
<li><b>Region ownership:</b> each user's data is written only in their home region (a home-region attribute, with routing at the edge). Other regions read replicated data. Ownership moves deliberately, for example when the user relocates or during failover.</li>
<li><b>Commutative or additive updates</b> where possible: append-only items (each message is its own item) don't conflict. Counters are trickier, since increments in two regions still race at the item level, so shard them per region and sum.</li>
<li>Avoid global uniqueness constraints across regions, or route those writes to one region.</li>
<li><b>Failover:</b> after a region fails, writes may be lost if replication hadn't completed (RPO greater than zero).</li>
</ul>
<p>AWS also introduced a <b>multi-region strong consistency</b> mode for global tables, with synchronous writes, higher write latency and specific region constraints. It's useful when an RPO of zero matters more than write latency.</p>`,
keys:["Async replication, local writes","Last-writer-wins and region-local conditions","Region ownership pattern","Append-only/commutative design; per-region counters","Failover RPO; strong-consistency mode trade-off"],
trade:["Eventual mode: low latency, conflict risk and RPO > 0","Strong-consistency mode: no lost writes, higher latency and constraints","It depends on: conflict likelihood, latency needs, RPO"],
fu:[{q:"A user's profile is edited from both regions at the same time. What happens and how would you prevent it?",a:"Under last-writer-wins, one edit silently overwrites the other. Prevent it by routing a user's writes to their home region, or by splitting the profile into independently updated items so concurrent edits rarely touch the same item."}],
rf:["Assumes conditions are global","Active-active with no conflict strategy","Ignores RPO"],
verify:"Global tables multi-region strong consistency (MRSC) availability and region constraints; check current docs."},

{id:"Q069",skill:"DynamoDB",level:"Advanced",type:"Scenario",
q:"A bad deploy three hours ago overwrote an attribute on about 50,000 DynamoDB items with wrong values. New, valid writes have happened since. How do you recover?",
a:`<ol>
<li><b>Stop the damage:</b> roll back or disable the faulty code path, and confirm no more bad writes are happening.</li>
<li><b>Identify affected items:</b> from application logs or the stream (if you archive stream records), or by a marker such as the deploy version written on the items. Or scan for the bad pattern.</li>
<li><b>Restore a copy:</b> with <b>point-in-time recovery</b> (35-day window), restore the table to a timestamp just before the bad deploy. Restores always create a <b>new table</b>; they never overwrite the live one.</li>
<li><b>Repair selectively:</b> for each affected item, read the correct attribute value from the restored copy and write it to the live table, using a <b>condition</b> that the current value is still the bad one (or that the item's version hasn't changed since the incident). That way you don't overwrite legitimate newer updates. Process in batches with rate limiting.</li>
<li><b>Verify</b> counts and samples, then delete the restored table.</li>
</ol>
<p>Afterwards: make sure PITR is enabled on all important tables, archive streams to S3 for forensic replay, enable deletion protection, and add canary or feature-flag rollout for code that writes data.</p>`,
keys:["Stop further damage first","Identify affected items","PITR restore to new table","Conditional selective repair to avoid clobbering newer writes","Prevention: PITR, stream archive, deletion protection, canaries"],
fu:[{q:"Why not just restore the whole table and switch the application to it?",a:"It would lose every valid write made in the three hours since the restore point. A selective repair keeps newer data and fixes only what was damaged."}],
rf:["Restores and swaps the whole table","Overwrites items unconditionally","Doesn't stop the faulty writes first"]},

{id:"Q070",skill:"DynamoDB",level:"Advanced",type:"Concept",
q:"What DynamoDB operation limits shape application code (page sizes, batch operations, item size), and how do you handle partial results correctly?",
a:`<ul>
<li><b>Query and Scan</b> return at most <b>1 MB</b> of data per call (before filters). <code>Limit</code> caps items <i>evaluated</i>, not items returned after filtering. Always loop on <code>LastEvaluatedKey</code>. A response with fewer items than requested doesn't mean you've reached the end.</li>
<li><b>BatchGetItem:</b> up to 100 items (16 MB) per call. <b>BatchWriteItem:</b> up to 25 puts or deletes (16 MB), with no conditions and no updates. Both can return <b><code>UnprocessedKeys</code>/<code>UnprocessedItems</code></b> when throttled, so you must retry those with exponential backoff, or data is silently not written or read. SDK high-level helpers may not do this for you.</li>
<li><b>Transactions:</b> up to 100 actions and 4 MB aggregate.</li>
<li><b>Item size:</b> 400 KB maximum, including attribute names.</li>
<li><b>Partition throughput</b> limits apply per key, as discussed in the hot-partition question.</li>
<li><b>Parallel Scan</b> (<code>Segment</code>/<code>TotalSegments</code>) speeds up full-table jobs, but multiplies capacity use. Rate-limit it.</li>
</ul>
<p>Wrap these in a small data-access layer with tested pagination and unprocessed-item retry logic, so every team doesn't reimplement them, and occasionally get them wrong.</p>`,
keys:["1 MB pages; Limit evaluates before filter; loop on LastEvaluatedKey","Batch limits and Unprocessed retries","Transaction and item size limits","Parallel scan cost","Shared data-access helpers"],
fu:[{q:"A batch import 'succeeds' but 3% of items are missing. Most likely cause?",a:"BatchWriteItem returned UnprocessedItems under throttling and the code didn't retry them. Check the import code's handling of that field, and add backoff retries plus a final verification count."}],
rf:["Assumes one Query returns all results","Ignores UnprocessedItems","Uses Limit expecting post-filter counts"]},

{id:"Q071",skill:"Schema Evolution & Migrations",level:"Advanced",type:"Architecture",
q:"Plan a migration of a 3 TB on-premises SQL Server database to Amazon RDS for SQL Server with under 15 minutes of downtime.",
a:`<p><b>Assess first:</b> RDS limitations (no sysadmin, some features unsupported or restricted: certain cross-database features, linked servers, SQL Agent jobs that touch the OS, CLR restrictions), edition and licensing (license-included vs BYOL constraints), instance size and storage IOPS, network bandwidth from on-prem (Direct Connect or VPN), and collation, logins and jobs to recreate.</p>
<p><b>Data movement options:</b></p>
<ul>
