<script>
const LEVELS=["Basic","Intermediate","Advanced","Lead"];
const TYPES=["Concept","Scenario","Architecture","Behavioral"];
const PARTS="Complete: all 4 parts loaded.";

const QS=[

/* ================= BASIC ================= */
{id:"Q001",skill:"SQL Server",level:"Basic",type:"Concept",
q:"Explain clustered vs nonclustered indexes in SQL Server. What is a key lookup, and why does it matter?",
a:`<p>Both are <b>B-trees</b>. A <b>clustered index</b> <i>is</i> the table: its leaf level holds the full data rows, ordered by the clustering key. There can be only one per table, and without one the table is a <b>heap</b>. A <b>nonclustered index</b> is a separate B-tree whose leaf rows hold the index key columns, any <code>INCLUDE</code>d columns, and a <b>row locator</b>: the clustering key (or a RID for heaps).</p>
<p>A <b>key lookup</b> happens when a query uses a nonclustered index to find rows but needs columns the index doesn't contain. For <i>each</i> matching row, SQL Server navigates the clustered index to fetch the rest. That's cheap for a few rows and very expensive for thousands. Past a certain point the optimiser switches to a clustered index scan instead.</p>
<p>A good clustering key is narrow, unique, static and ever-increasing (an <code>int</code>/<code>bigint</code> identity, or a sequential GUID). A wide or random key bloats every nonclustered index, because each carries the clustering key, and random inserts cause page splits.</p>`,
keys:["Clustered = the table itself; one per table; heap otherwise","Nonclustered leaf carries the clustering key","Key lookup per row and its cost","Clustering key choice: narrow, unique, static, increasing"],
fu:[{q:"Why is a random GUID a poor clustering key?",a:"New rows insert at random positions, causing page splits and fragmentation, and the 16-byte key is copied into every nonclustered index. Use NEWSEQUENTIALID(), a sequential GUID scheme, or an integer surrogate key for clustering, keeping the GUID as a unique nonclustered column if needed externally."}],
rf:["Thinks a primary key must be clustered","Can't explain key lookups","Clusters on a wide composite natural key without reason"]},

{id:"Q002",skill:"SQL Server",level:"Basic",type:"Concept",
q:"What is a covering index, and how do you choose the column order of a composite index?",
a:`<p>A <b>covering index</b> contains every column a query needs, so the query is answered from the index alone, with no key lookups. In SQL Server, key columns define the order, and <code>INCLUDE</code> columns are stored only at the leaf level: they're there to cover, not to seek or sort on.</p>
<pre><code>-- Query: orders for a customer in a date range, newest first
SELECT OrderId, Total, Status
FROM Orders
WHERE CustomerId = @c AND CreatedAt &gt;= @from
ORDER BY CreatedAt DESC;

CREATE INDEX IX_Orders_Customer_Created
ON Orders (CustomerId, CreatedAt DESC)
INCLUDE (Total, Status);</code></pre>
<p><b>Column order rules of thumb:</b></p>
<ul>
<li>Equality predicates first.</li>
<li>Then the range or sort column.</li>
<li>Anything needed only for output goes in <code>INCLUDE</code>.</li>
</ul>
<p>An index on <code>(A, B)</code> supports seeks on A, or on A and B, but not on B alone. Order matters far more than the selectivity folklore ("most selective first").</p>
<p>Don't cover everything: each index costs write time, storage and memory. Cover the hot, frequent queries.</p>`,
keys:["Covering = no lookups","Key vs INCLUDE columns","Equality first, then range/sort","Left-prefix rule","Write and storage cost of indexes"],
fu:[{q:"How do you find indexes that are never used?",a:"sys.dm_db_index_usage_stats shows seeks, scans, lookups and updates per index since the last restart. Indexes with many updates and no reads are candidates for removal, after checking over a full business cycle (month-end reports) and across replicas."}],
rf:["Puts the most selective column first regardless of query shape","Indexes every column individually","Unaware of INCLUDE"]},

{id:"Q003",skill:"SQL Server",level:"Basic",type:"Scenario",
q:"A query filtering WHERE YEAR(OrderDate) = 2025 AND Status = 'Open' does a full scan even though OrderDate is indexed. Why, and how do you fix it?",
a:`<p>The predicate isn't <b>SARGable</b> (searchable by argument). Wrapping the column in a function means SQL Server must compute <code>YEAR()</code> for every row before comparing, so it can't seek into the index on <code>OrderDate</code>.</p>
<p><b>Rewrite as a range on the bare column:</b></p>
<pre><code>WHERE OrderDate &gt;= '2025-01-01' AND OrderDate &lt; '2026-01-01'
  AND Status = 'Open'</code></pre>
<p>Other common non-SARGable patterns:</p>
<ul>
<li><code>LIKE '%term'</code> (leading wildcard).</li>
<li><code>ISNULL(col, 0) = @x</code>.</li>
<li>Arithmetic on the column (<code>Price * 1.2 &gt; @x</code>).</li>
<li><b>Implicit conversions</b> where the column side is converted (an <code>nvarchar</code> parameter against a <code>varchar</code> column).</li>
<li>Some <code>OR</code> combinations across columns.</li>
</ul>
<p>Also check the index: for this query, <code>(Status, OrderDate)</code> fits better, with equality first and range second. If the function is genuinely needed, a <b>persisted computed column</b> with an index on it works.</p>`,
keys:["Defines SARGability","Range rewrite on bare column","Lists other non-SARGable patterns incl. implicit conversion","Index column order for the query","Computed column alternative"],
fu:[{q:"How do you spot implicit conversions in a plan?",a:"The plan shows a CONVERT_IMPLICIT warning on the predicate (a yellow triangle in SSMS), and the seek turns into a scan. Fix the parameter type to match the column."}],
rf:["Adds another index on OrderDate","Thinks functions are fine because the column is indexed","Uses LIKE '%x%' and expects a seek"]},

{id:"Q004",skill:"SQL Server",level:"Basic",type:"Concept",
q:"Explain SQL Server's transaction isolation levels, including RCSI and SNAPSHOT. What does each prevent, and what does it cost?",
a:`<ul>
<li><b>READ UNCOMMITTED</b> (<code>NOLOCK</code>): no shared locks. It can read uncommitted data that later rolls back, and it can even miss or double-read rows during page splits.</li>
<li><b>READ COMMITTED</b> (default, locking): reads take short shared locks, so readers and writers block each other. Non-repeatable reads and phantoms are possible.</li>
<li><b>READ COMMITTED SNAPSHOT (RCSI)</b>, a database option: READ COMMITTED reads use <b>row versions</b> (from the version store in tempdb, or in-row with Accelerated Database Recovery). Readers see the last committed version as of each <i>statement</i> and don't block writers or get blocked by them. It's on by default in Azure SQL.</li>
<li><b>REPEATABLE READ:</b> holds shared locks until commit, so rows read can't change. Phantoms are still possible.</li>
<li><b>SERIALIZABLE:</b> range locks prevent phantoms. Highest blocking and deadlock risk.</li>
<li><b>SNAPSHOT</b> (requires <code>ALLOW_SNAPSHOT_ISOLATION</code>): a consistent view as of <i>transaction</i> start. Writes that conflict with concurrent committed changes fail with an update-conflict error (3960). Write skew is still possible.</li>
</ul>
<p><b>Costs</b> of versioning: version store growth (tempdb), slightly more write overhead, and long-running transactions keeping versions alive.</p>`,
keys:["Each level's guarantees and anomalies","RCSI statement-level vs SNAPSHOT transaction-level","Readers/writers blocking under locking READ COMMITTED","Version store cost","NOLOCK hazards"],
fu:[{q:"Would you turn on RCSI for an existing OLTP database?",a:"Usually yes, as it removes most reader/writer blocking. But test first: code that relied on blocking for correctness (reading then updating based on what it read) can behave differently, and tempdb version-store capacity needs monitoring."}],
rf:["\"NOLOCK just makes reads faster\"","Confuses RCSI and SNAPSHOT","Unaware of version-store cost"]},

{id:"Q005",skill:"SQL Server",level:"Basic",type:"Concept",
q:"Explain window functions. Show how to get each customer's most recent order and a running total of sales per day.",
a:`<p>Window functions compute a value over a set of rows related to the current row (the <code>OVER</code> clause) <b>without collapsing rows</b>, unlike <code>GROUP BY</code>. <code>PARTITION BY</code> defines the groups, <code>ORDER BY</code> defines the order within each group, and frame clauses (<code>ROWS BETWEEN</code>) define which rows are included.</p>
<pre><code>-- Latest order per customer
WITH ranked AS (
  SELECT o.*, ROW_NUMBER() OVER (PARTITION BY CustomerId ORDER BY CreatedAt DESC, OrderId DESC) AS rn
  FROM Orders o
)
SELECT * FROM ranked WHERE rn = 1;

-- Running total of daily sales
SELECT SaleDate, DailyTotal,
       SUM(DailyTotal) OVER (ORDER BY SaleDate ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS RunningTotal
FROM DailySales;</code></pre>
<p>Others to know:</p>
<ul>
<li><code>RANK</code> (gaps after ties) and <code>DENSE_RANK</code> (no gaps).</li>
<li><code>LAG</code>/<code>LEAD</code> for comparing with the previous or next row (day-over-day change).</li>
<li><code>NTILE</code> for buckets.</li>
<li><code>FIRST_VALUE</code>/<code>LAST_VALUE</code>. With <code>LAST_VALUE</code>, mind the default frame.</li>
</ul>
<p>Specify <code>ROWS</code> explicitly for running totals. The default frame with ORDER BY is <code>RANGE</code>, which is slower in SQL Server and treats ties differently.</p>`,
keys:["Rows not collapsed; PARTITION/ORDER/frame","ROW_NUMBER for top-1 per group with tie-breaker","Running total with explicit ROWS frame","RANK vs DENSE_RANK; LAG/LEAD","Default RANGE frame pitfall"],
fu:[{q:"How do you index to support the 'latest order per customer' query?",a:"An index on (CustomerId, CreatedAt DESC, OrderId DESC), covering the selected columns, lets SQL Server read each partition in order without a sort. For very many customers, a CROSS APPLY with TOP (1) per customer can be faster than ROW_NUMBER."}],
rf:["Self-joins with MAX() subqueries for everything","No tie-breaker in ROW_NUMBER ordering","Doesn't know frames"]},

{id:"Q006",skill:"SQL Server",level:"Basic",type:"Concept",
q:"How do you read an execution plan? What do you look for first when a query is slow?",
a:`<p>Use the <b>actual</b> execution plan (it includes runtime row counts), not only the estimated one. Then look for:</p>
<ul>
<li><b>Estimated vs actual rows</b> on each operator. Large mismatches (estimated 10, actual 500,000) mean bad cardinality estimates, from stale statistics, parameter sniffing, table variables, or complex predicates. That leads to wrong join types and memory grants.</li>
<li><b>Scans</b> on large tables where you expected seeks, and <b>key lookups</b> executed many times.</li>
<li><b>Expensive operators:</b> sorts and hash operations, especially with <b>spill warnings</b> (insufficient memory grant, so spilling to tempdb).</li>
<li><b>Warnings:</b> implicit conversions, missing index suggestions (treat them as hints, not orders), no-join-predicate.</li>
<li><b>Join choice:</b> nested loops over huge inputs, or hash joins over tiny ones, usually mean an estimate is wrong.</li>
<li>For parallel plans, uneven distribution across threads.</li>
</ul>
<p>Read from right to left (data flow) and follow the thick arrows (many rows). Pair the plan with <code>SET STATISTICS IO, TIME ON</code> to see logical reads per table. Logical reads are a better measure of work than duration alone.</p>`,
keys:["Actual vs estimated plans","Estimate vs actual row mismatch as key signal","Scans, lookups, sorts, spills, warnings","Logical reads via STATISTICS IO","Missing-index hints are suggestions"],
fu:[{q:"How do you capture the actual plan of a query that's slow only in production?",a:"Query Store keeps plans and runtime statistics per query. Extended Events can capture actual plans for specific queries. sys.dm_exec_query_plan_stats (SQL Server 2019+, with lightweight profiling) gives the last actual plan for cached queries."}],
rf:["Only looks at estimated cost percentages","Creates every missing index suggestion","Measures only duration"]},

{id:"Q007",skill:"PostgreSQL",level:"Basic",type:"Concept",
q:"Explain MVCC in PostgreSQL. How do reads avoid locks, what do UPDATE and DELETE actually do, and why does VACUUM exist?",
a:`<p>PostgreSQL keeps <b>multiple versions of each row</b> (tuples). Each tuple records the transaction that created it (<code>xmin</code>) and the one that deleted or replaced it (<code>xmax</code>). A query sees a <b>snapshot</b>: only tuples committed before the snapshot and not deleted within it. So <b>readers never block writers and writers never block readers</b>; only conflicting writes on the same row wait.</p>
<p>An <b>UPDATE</b> doesn't overwrite in place. It writes a <b>new tuple version</b> and marks the old one with <code>xmax</code>. A <b>DELETE</b> just marks <code>xmax</code>. Old versions become <b>dead tuples</b> once no running transaction can see them.</p>
<p><b>VACUUM</b> (and autovacuum) reclaims dead tuples' space for reuse, updates the visibility map (which enables index-only scans), and freezes old transaction IDs to prevent <b>transaction ID wraparound</b>. Without it, tables bloat and, in the extreme, the database stops accepting writes to protect itself.</p>
<p><b>HOT updates</b> (heap-only tuples): if no indexed column changes and there's free space on the same page, the new version goes on the same page and indexes don't need updating. A lower <code>fillfactor</code> on update-heavy tables helps.</p>`,
keys:["Tuple versions with xmin/xmax and snapshots","Readers/writers don't block","UPDATE = new version; DELETE = mark","VACUUM: reclaim, visibility map, freeze/wraparound","HOT updates and fillfactor"],
fu:[{q:"How is this different from SQL Server's row versioning under RCSI?",a:"PostgreSQL stores old versions in the table itself (the heap), cleaned up by VACUUM. SQL Server keeps the current row in place and puts prior versions in a version store (tempdb, or in-row with ADR), cleaned up automatically. That's why PostgreSQL has table bloat to manage and SQL Server has version-store growth."}],
rf:["Thinks UPDATE modifies rows in place","Doesn't know why VACUUM matters","Never heard of wraparound"]},

{id:"Q008",skill:"PostgreSQL",level:"Basic",type:"Concept",
q:"What index types does PostgreSQL offer, and when would you use partial and expression indexes?",
a:`<ul>
<li><b>B-tree</b> (default): equality, ranges, sorting, and prefix <code>LIKE 'abc%'</code> (with the right collation or operator class). It covers most cases.</li>
<li><b>GIN:</b> for values containing many elements, such as JSONB (<code>@&gt;</code>, key existence), arrays, and full-text search (<code>tsvector</code>). Fast lookups, slower writes.</li>
<li><b>GiST / SP-GiST:</b> geometric and range types, nearest-neighbour searches, exclusion constraints (no overlapping bookings).</li>
<li><b>BRIN:</b> tiny block-range summaries for huge tables whose values follow physical order, such as append-only time-series by timestamp.</li>
<li><b>Hash:</b> equality only. Rarely better than B-tree.</li>
</ul>
<p><b>Partial index:</b> indexes only rows matching a predicate, so it's smaller and faster. For example <code>CREATE INDEX … ON orders (created_at) WHERE status = 'pending'</code> when queries target the small pending subset. It's also used for conditional uniqueness.</p>
<p><b>Expression index:</b> indexes a computed value, such as <code>CREATE INDEX … ON users (lower(email))</code>, used when queries filter on the same expression.</p>
<p><code>INCLUDE</code> columns (PG 11+) enable covering, index-only scans.</p>`,
keys:["B-tree default use cases","GIN for JSONB/arrays/FTS","GiST for ranges/exclusion, BRIN for ordered big tables","Partial indexes for subsets and conditional uniqueness","Expression indexes; INCLUDE for covering"],
fu:[{q:"Why might an index-only scan still visit the table?",a:"PostgreSQL must check tuple visibility. If the visibility map doesn't mark the page all-visible (recently modified, not yet vacuumed), it visits the heap. Well-vacuumed tables get true index-only scans."}],
rf:["B-tree for JSONB containment queries","Unaware of partial indexes","Indexes every column"]},

{id:"Q009",skill:"PostgreSQL",level:"Basic",type:"Concept",
q:"When would you store data in a JSONB column instead of relational columns, and what are the pitfalls?",
a:`<p><b>Good uses for JSONB:</b></p>
<ul>
<li>Data with a variable or evolving shape that you mostly store and retrieve as a whole: user preferences, third-party webhook payloads, per-type attributes in a product catalogue, feature-flag configs.</li>
<li>Sparse attributes where most columns would be null.</li>
</ul>
<p>JSONB is binary and indexable (GIN), with operators: <code>-&gt;</code>/<code>-&gt;&gt;</code> to extract, <code>@&gt;</code> for containment, and <code>?</code> for key existence.</p>
<p><b>Keep relational columns</b> for anything you filter, join, sort or aggregate on regularly, anything needing constraints (NOT NULL, foreign keys, CHECK, unique), and core business data.</p>
<p><b>Pitfalls:</b></p>
<ul>
<li><b>No schema enforcement:</b> typos and type drift (<code>"price": "10"</code> vs <code>10</code>). Validate in the application or with CHECK constraints.</li>
<li>Planner statistics inside JSONB are weak, so estimates can be poor.</li>
<li>Updating one key rewrites the whole value (a new tuple), so large documents are costly to update.</li>
<li>A GIN index with the default operator class supports many operators but is large. <code>jsonb_path_ops</code> is smaller but supports containment only.</li>
<li>Fields that are queried often can be extracted into <b>generated columns</b> with normal B-tree indexes.</li>
</ul>`,
keys:["Fit: variable shape, store/retrieve whole","Relational for filtered/joined/constrained data","Operators and GIN indexing incl. jsonb_path_ops","Schema drift, weak stats, whole-value rewrite","Generated columns for hot fields"],
fu:[{q:"A JSONB attribute becomes a frequent filter. What do you do?",a:"Either add an expression or generated column for it (attributes->>'colour') with a B-tree index, or migrate it to a real column once its shape is stable. Both give better statistics and simpler queries than GIN containment."}],
rf:["Stores everything in JSONB 'for flexibility'","No validation on JSON content","Updates large documents frequently"]},

{id:"Q010",skill:"PostgreSQL",level:"Basic",type:"Scenario",
q:"Login does WHERE lower(email) = lower($1). It's slow on a 5-million-row users table even though email has a unique index. Duplicate accounts with different capitalisation also exist. Fix both.",
a:`<p><b>Slowness:</b> the index is on <code>email</code>, but the query filters on <code>lower(email)</code>, so the B-tree on the raw column can't be used and PostgreSQL scans. Create an <b>expression index</b>:</p>
<pre><code>CREATE UNIQUE INDEX CONCURRENTLY users_email_lower_uq ON users (lower(email));</code></pre>
<p>The query's expression must match the index expression exactly.</p>
<p><b>Duplicates:</b> the existing unique index on <code>email</code> treats <code>A@x.com</code> and <code>a@x.com</code> as different. Making the expression index <b>unique</b> enforces case-insensitive uniqueness. But first <b>clean up the existing duplicates</b>, or the index build fails: find them with <code>GROUP BY lower(email) HAVING count(*) &gt; 1</code>, then merge or resolve the accounts with product.</p>
<p><b>Alternatives:</b></p>
<ul>
<li>The <code>citext</code> type (case-insensitive text).</li>
<li>A nondeterministic ICU collation (PG 12+). Note that it doesn't support <code>LIKE</code> in older versions.</li>
<li>Normalising emails to lowercase on write, and storing the normalised value.</li>
</ul>
<p>Normalising on write is the simplest and most portable approach.</p>`,
keys:["Expression must match index","Unique expression index for case-insensitive uniqueness","Clean duplicates before creating it","CONCURRENTLY for live table","citext / collation / normalise-on-write alternatives"],
fu:[{q:"What does CREATE INDEX CONCURRENTLY do if it fails partway?",a:"It leaves an INVALID index that still adds write overhead but isn't used for reads. Check pg_index.indisvalid, drop the invalid index (DROP INDEX CONCURRENTLY), fix the cause (often duplicates for a unique index), and retry."}],
rf:["Adds another index on email","Ignores existing duplicates","Builds the index without CONCURRENTLY on a busy table"]},

{id:"Q011",skill:"DynamoDB",level:"Basic",type:"Concept",
q:"Explain DynamoDB's primary keys: partition key, sort key, item collections. What's the difference between Query and Scan?",
a:`<p>Every item has a <b>primary key</b>: either a <b>partition key</b> alone, or a partition key plus a <b>sort key</b>. DynamoDB hashes the partition key to decide which physical partition stores the item. All items with the same partition key form an <b>item collection</b>, stored together and ordered by sort key.</p>
<p><b>Query</b> requires an exact partition key and can filter the sort key with conditions (<code>=</code>, <code>&lt;</code>, <code>BETWEEN</code>, <code>begins_with</code>), reading items in sort order, forwards or backwards. It touches only the items in that collection, so it's efficient and predictable.</p>
<p><b>Scan</b> reads <b>every item in the table</b> (or index), page by page. A <code>FilterExpression</code> removes items <i>after</i> they're read, so you're still charged for everything scanned. Scans are for exports and maintenance, not request paths.</p>
<p>The design consequence: model keys around <b>access patterns</b>. For example <code>PK = USER#123</code>, <code>SK = ORDER#2026-10-13#A91</code> lets "orders for user 123, newest first, in a date range" be a single Query.</p>`,
keys:["PK hashed to partitions; SK orders the collection","Query = one partition key, sort-key conditions","Scan reads everything; filters after read and still charged","Design keys from access patterns"],
fu:[{q:"What's the item size limit, and what do you do with large data?",a:"400 KB per item, including attribute names. Store large blobs in S3 and keep the object key in DynamoDB. Also keep attribute names short in high-volume tables, since names count toward size and capacity."}],
rf:["Uses Scan with filters in APIs","Designs tables like relational schemas first, access patterns later","Thinks filters reduce read cost"]},

{id:"Q012",skill:"DynamoDB",level:"Basic",type:"Concept",
q:"Global secondary indexes vs local secondary indexes in DynamoDB: what's the difference, and when do you use each?",
a:`<p><b>GSI:</b> a different partition key (and optional sort key) from the base table, so it enables entirely new access patterns ("orders by status", "user by email"). It can be added or removed at any time. It's updated <b>asynchronously</b>, so reads are <b>eventually consistent only</b>. It has its own capacity (provisioned mode); if a GSI is throttled, writes to the base table get throttled too.</p>
<p><b>LSI:</b> the <b>same partition key</b>, with a different sort key ("a user's orders sorted by total instead of date"). It must be <b>created with the table</b> and can't be added later. It supports strongly consistent reads and shares the table's capacity. With LSIs, each partition key's item collection is limited to <b>10 GB</b>.</p>
<p><b>Projections:</b> <code>KEYS_ONLY</code>, <code>INCLUDE</code> specific attributes, or <code>ALL</code>. Project only what the query needs. Fetching unprojected attributes means another read against the base table.</p>
<p>In practice, GSIs are used far more often. LSIs only when you need strongly consistent alternate sort orders and can accept the 10 GB limit and the create-time constraint.</p>`,
keys:["GSI: new partition key, async, eventual consistency","LSI: same partition key, creation-time only, strong reads","10 GB item collection limit with LSIs","GSI throttling back-pressures base writes","Projection choices"],
fu:[{q:"Why can a hot GSI throttle writes to the base table?",a:"Every base-table write that affects the GSI must also be written to the index. If the GSI's partition or capacity can't absorb those writes, DynamoDB throttles the base-table write to keep the index consistent."}],
rf:["Thinks GSIs are strongly consistent","Plans to add an LSI later","Projects ALL by default on large items"]},

{id:"Q013",skill:"DynamoDB",level:"Basic",type:"Concept",
q:"Explain DynamoDB capacity: RCUs, WCUs, on-demand vs provisioned mode. How do item size and consistency affect cost?",
a:`<ul>
<li><b>1 RCU</b> = one strongly consistent read per second of an item up to 4 KB, or two eventually consistent reads. Transactional reads cost double.</li>
<li><b>1 WCU</b> = one write per second of an item up to 1 KB. Transactional writes cost double.</li>
<li>Sizes round <b>up</b>: a 4.1 KB strongly consistent read costs 2 RCUs, and a 1.5 KB write costs 2 WCUs. A Query consumes capacity based on the total size of items read (before filters), not per item.</li>
</ul>
<p><b>On-demand mode:</b> pay per request, with no capacity planning. It scales automatically, with some limits on very sudden jumps above previous peaks. Best for unpredictable, spiky or new workloads.</p>
<p><b>Provisioned mode</b> (with auto scaling): you set RCU and WCU targets, which is cheaper for steady, predictable load, especially with reserved capacity. But auto scaling reacts in minutes, so sudden spikes get throttled.</p>
<p><b>Cost levers:</b> smaller items (short attribute names, large data moved to S3), eventually consistent reads where acceptable, lean GSI projections, and avoiding scans.</p>`,
keys:["RCU/WCU definitions and rounding","Strong vs eventual vs transactional cost","Query capacity counted before filters","On-demand vs provisioned trade-offs","Cost levers"],
fu:[{q:"A team switched to on-demand and the bill tripled. When does provisioned make sense?",a:"When traffic is steady and predictable enough to keep utilisation high. Provisioned capacity with auto scaling (and reserved capacity for the baseline) is substantially cheaper per request than on-demand at sustained load. Compare using actual consumed-capacity metrics."}],
rf:["Doesn't know size rounding","Thinks filters reduce consumed capacity","Chooses mode without looking at traffic shape"]},

{id:"Q014",skill:"DynamoDB",level:"Basic",type:"Scenario",
q:"An endpoint lists a user's orders using Scan with FilterExpression userId = :u. It was fine in testing but now takes seconds and costs a lot. What's wrong and how do you redesign it?",
a:`<p>Scan reads <b>every item in the table</b>, and the filter discards non-matching items <b>after</b> reading, so cost and latency grow with table size, not with the result size. Each Scan page returns at most 1 MB of data <i>before</i> filtering, so the code may also loop through many nearly empty pages.</p>
<p><b>Redesign around the access pattern</b> "orders for a user, newest first, paginated":</p>
<ul>
<li>If you're designing the table: <code>PK = USER#{userId}</code>, <code>SK = ORDER#{createdAt}#{orderId}</code>, then <code>Query</code> with <code>ScanIndexForward = false</code> and <code>Limit</code>, paginating with <code>LastEvaluatedKey</code>.</li>
<li>If the table is keyed by <code>orderId</code>: add a <b>GSI</b> with partition key <code>userId</code> and sort key <code>createdAt</code>, projecting the fields the list shows.</li>
</ul>
<p>Backfill isn't needed for a GSI: DynamoDB builds it from existing items. Then switch the endpoint to Query and monitor consumed capacity.</p>`,
keys:["Scan cost scales with table, not result","Filter after read; 1 MB pages","Query with PK/SK designed for the pattern","GSI option for existing table","Pagination with LastEvaluatedKey"],
fu:[{q:"How do you paginate a Query for an API client?",a:"Return LastEvaluatedKey encoded as an opaque cursor (for example base64 JSON, possibly signed or encrypted to avoid exposing keys), and pass it back as ExclusiveStartKey on the next request. DynamoDB has no offsets."}],
rf:["Adds parallel scan to make it faster","Keeps Scan and adds caching","Exposes raw keys as cursors without thought"]},

{id:"Q015",skill:"Schema Evolution & Migrations",level:"Basic",type:"Concept",
q:"Which schema changes are cheap online operations, and which ones lock or rewrite a large table, in SQL Server and PostgreSQL?",
a:`<p><b>Usually cheap (metadata-only):</b></p>
<ul>
<li>Adding a <b>nullable</b> column with no default, in both.</li>
<li>Adding a column <b>with a constant default</b>: PostgreSQL 11+ stores the default in the catalogue without rewriting the table. SQL Server 2012+ Enterprise edition makes NOT NULL columns with a runtime-constant default metadata-only.</li>
<li>Dropping a column (marked dropped, space reclaimed later). Renames are metadata changes too, but they break running code.</li>
</ul>
<p><b>Expensive or locking:</b></p>
<ul>
<li><b>Changing a column type</b> that needs conversion: rewrites the table, with a strong lock for the duration. (Some changes, like widening <code>varchar</code> length in PostgreSQL, are metadata-only.)</li>
<li><b>Adding NOT NULL</b> to an existing column: a full validation scan. In PostgreSQL, add a <code>CHECK (col IS NOT NULL) NOT VALID</code> constraint, then <code>VALIDATE CONSTRAINT</code>, which takes a weaker lock, then set NOT NULL (PG 12+ uses the validated check to skip the scan).</li>
<li><b>Adding a foreign key:</b> validation scan. In PostgreSQL, use <code>NOT VALID</code> then <code>VALIDATE</code>. In SQL Server, use <code>WITH NOCHECK</code> then check later.</li>
<li><b>Creating an index</b> without <code>CONCURRENTLY</code> (PostgreSQL) or <code>ONLINE = ON</code> (SQL Server Enterprise/Azure) blocks writes.</li>
</ul>
<p>Even "instant" DDL needs a brief exclusive lock, and it can queue behind a long-running query, while all new queries queue behind it. Set a <b>lock timeout</b> on migrations (<code>SET lock_timeout</code> in PostgreSQL, <code>SET LOCK_TIMEOUT</code> in SQL Server) and retry.</p>`,
keys:["Metadata-only operations by version/edition","Type changes rewrite","NOT VALID / VALIDATE pattern","Online/concurrent index creation","Lock queueing danger; lock_timeout"],
fu:[{q:"Why can a 'fast' ALTER TABLE take the whole application down?",a:"The ALTER waits for an exclusive lock behind a long-running query, and every new query on that table queues behind the waiting ALTER. Traffic piles up even though the ALTER itself would take milliseconds. A short lock_timeout makes the migration fail fast instead, so you retry later."}],
rf:["Assumes all ALTERs are instant","No lock timeout in migrations","Changes column types on big tables in place during peak"]},

{id:"Q016",skill:"Schema Evolution & Migrations",level:"Basic",type:"Scenario",
q:"A migration added an index to a 200-million-row table during business hours. Writes blocked for 25 minutes and the API went down. How should it have been done?",
a:`<p>A plain <code>CREATE INDEX</code> takes a lock that blocks writes for the whole build (a SHARE lock in PostgreSQL; an offline build in SQL Server), and on a big table that's a long time.</p>
<p><b>PostgreSQL:</b> <code>CREATE INDEX CONCURRENTLY</code> builds without blocking writes. It takes longer, can't run inside a transaction block (so migration tools need a "no transaction" flag for that migration), and on failure leaves an <code>INVALID</code> index to drop and retry.</p>
<p><b>SQL Server:</b> <code>CREATE INDEX … WITH (ONLINE = ON)</code> (Enterprise edition and Azure SQL) allows reads and writes during the build, with brief locks at start and end. <code>RESUMABLE = ON</code> (SQL Server 2019+ for creation) lets you pause and resume, or survive a failover. Standard edition doesn't support online builds, so schedule a maintenance window.</p>
<p><b>Process:</b></p>
<ul>
<li>Run long index builds outside peak hours.</li>
<li>Set a lock timeout.</li>
<li>Monitor progress (<code>pg_stat_progress_create_index</code>, or <code>sys.index_resumable_operations</code>).</li>
<li>Check disk space for the build and the log.</li>
<li>Review migrations for locking behaviour in the PR, with a checklist of dangerous DDL.</li>
</ul>`,
keys:["Plain CREATE INDEX blocks writes","CONCURRENTLY constraints (no tx, invalid on failure)","ONLINE / RESUMABLE in SQL Server; edition limits","Off-peak, lock timeouts, progress monitoring","Migration review checklist"],
fu:[{q:"Your migration tool wraps every migration in a transaction. How do you run CREATE INDEX CONCURRENTLY?",a:"Most tools have an option to disable the transaction for a specific migration (for example a per-migration no-transaction flag), or run it as a separate step. Keep that migration to the single statement so a failure is easy to handle."}],
rf:["Accepts downtime as normal for indexes","Unaware of CONCURRENTLY/ONLINE","No monitoring of long builds"]},

{id:"Q017",skill:"Caching (Redis)",level:"Basic",type:"Concept",
q:"Explain cache-aside, read-through, write-through and write-behind caching. Which do you use by default, and how do you keep the cache correct?",
a:`<ul>
<li><b>Cache-aside</b> (lazy loading): the app checks the cache; on a miss it reads the DB, then populates the cache with a TTL. On writes, it updates the DB and <b>deletes</b> the cache key, so the next read reloads it. This is the most common default: simple, and the cache only holds data that's actually read.</li>
<li><b>Read-through:</b> the cache layer (a library or provider) loads from the DB on a miss itself. The same idea as cache-aside, encapsulated.</li>
<li><b>Write-through:</b> writes go to the cache and the DB synchronously. The cache is always warm for written data, but writes are slower, and data that's never read still occupies cache.</li>
<li><b>Write-behind</b> (write-back): writes go to the cache and are flushed to the DB asynchronously. Fast writes, but data is lost if the cache fails before flushing. Rarely appropriate for business data.</li>
</ul>
<p><b>Correctness:</b></p>
<ul>
<li>Prefer <b>delete on write</b> over updating the cached value. It avoids races where two writers update the cache in the wrong order.</li>
<li>Always set a <b>TTL</b> as a safety net for missed invalidations.</li>
<li>Version keys when the cached shape changes (<code>user:v2:{id}</code>).</li>
<li>Decide per data type how stale it may be.</li>
</ul>`,
keys:["Four patterns described correctly","Cache-aside as default","Delete-on-write vs update","TTL as safety net; key versioning","Staleness tolerance per data type"],
fu:[{q:"Even with delete-on-write, cache-aside can briefly store stale data. How?",a:"A reader misses and reads the old value from the DB, then a writer updates the DB and deletes the key, then the slow reader writes the old value into the cache. The TTL bounds how long that lasts. Short TTLs, versioned values, or a short delay before a second delete narrow the window."}],
rf:["Updates cache and DB in separate steps without thinking about ordering","No TTLs","Write-behind for orders or payments"]},

{id:"Q018",skill:"Caching (Redis)",level:"Basic",type:"Concept",
q:"Beyond a key-value cache, what Redis data structures and features do you use, and what should you know about eviction and persistence?",
a:`<p><b>Structures and typical uses:</b></p>
<ul>
<li><b>Strings:</b> cached values, counters (<code>INCR</code>), simple locks or idempotency keys (<code>SET NX EX</code>).</li>
<li><b>Hashes:</b> objects with fields updated individually (a session, user preferences).</li>
<li><b>Lists:</b> simple queues or recent items (capped with <code>LTRIM</code>).</li>
<li><b>Sets:</b> unique membership (online user IDs, tags).</li>
<li><b>Sorted sets:</b> leaderboards, time-ordered feeds, rate-limit windows, delayed job schedules.</li>
<li><b>Streams:</b> append-only logs with consumer groups and acknowledgements. A lightweight message queue.</li>
<li><b>HyperLogLog:</b> approximate unique counts. <b>Pub/Sub:</b> fire-and-forget broadcast.</li>
</ul>
<p><b>Eviction</b> (when <code>maxmemory</code> is reached): <code>noeviction</code> (writes fail), <code>allkeys-lru</code>/<code>allkeys-lfu</code> (evict any key, the usual choice for pure caches), and <code>volatile-*</code> (only keys with a TTL). Using one Redis for both cache data and must-keep data (sessions, queues) with the wrong policy means important keys get evicted. Separate them, or choose the policy deliberately.</p>
<p><b>Persistence:</b> RDB snapshots (periodic, can lose recent writes) and AOF (an append-only log with configurable fsync). Even with persistence, treat Redis as a cache unless you've designed for durability.</p>`,
keys:["Matches structures to use cases","Sorted sets and streams beyond caching","Eviction policies and mixed-use risk","RDB vs AOF trade-offs","Redis as cache vs source of truth"],
fu:[{q:"Why is the KEYS command dangerous in production?",a:"It scans every key in one blocking operation. Redis executes commands on a single main thread, so it stalls every other client. Use SCAN, which iterates in small batches, or keep explicit index sets of the keys you need."}],
rf:["Uses KEYS * in production","Stores sessions in a cache with allkeys-lru unknowingly","Treats Redis as durable storage by default"]},

/* ================= INTERMEDIATE (part 1) ================= */
{id:"Q019",skill:"SQL Server",level:"Intermediate",type:"Concept",
q:"What are statistics in SQL Server, how and when do they update, and how do stale or misleading statistics hurt query plans?",
a:`<p>Statistics are histograms (up to 200 steps) plus density information about column value distributions. The optimiser uses them to <b>estimate how many rows</b> each operation returns, which drives join types, index choice and memory grants.</p>
<p><b>Updates:</b> with auto-update on, statistics are refreshed when enough rows change. Historically the threshold was 20% of the table plus 500 rows. With compatibility level 130+ (SQL Server 2016), large tables use a dynamic, lower threshold (roughly the square root of 1,000 × rows). Updates normally sample rather than read every row.</p>
<p><b>Problems:</b></p>
<ul>
<li><b>Ascending keys:</b> new rows (today's dates, the newest IDs) fall beyond the histogram's last step, so the optimiser estimates very few rows for "recent" queries. Newer cardinality estimators handle this better, but not perfectly.</li>
<li><b>Sampling misses skew</b> in heavily skewed columns.</li>
<li><b>Correlated columns:</b> estimates assume some independence between predicates.</li>
<li>Bulk loads followed immediately by queries, before statistics refresh.</li>
</ul>
<p><b>Remedies:</b></p>
<ul>
<li>Scheduled <code>UPDATE STATISTICS</code> (with <code>FULLSCAN</code> where skew matters) after big loads.</li>
<li>Filtered statistics for skewed subsets.</li>
<li>Asynchronous auto-update for latency-sensitive workloads.</li>
<li>Checking estimated vs actual rows in plans to find which statistics mislead.</li>
</ul>`,
keys:["Histogram/density drive cardinality estimates","Auto-update thresholds by compat level","Ascending key problem","Sampling and skew; correlation","Manual/FULLSCAN/filtered stats; async update"],
fu:[{q:"After a nightly bulk load, the morning's first reports are slow and later ones fast. Why?",a:"Statistics were stale after the load, so the first queries compiled plans with bad estimates, or triggered a synchronous statistics update during compilation. Updating statistics as the last step of the load job fixes it."}],
rf:["Thinks statistics are the same as indexes","Rebuilds all indexes nightly as a cure-all","Never compares estimated vs actual rows"]},

{id:"Q020",skill:"SQL Server",level:"Intermediate",type:"Scenario",
q:"Report queries use WITH (NOLOCK) everywhere 'for performance'. Finance says totals sometimes don't match, and occasionally a row appears twice. Explain why, and what to do instead.",
a:`<p><code>NOLOCK</code> (READ UNCOMMITTED) reads without shared locks. That allows:</p>
<ul>
<li><b>Dirty reads:</b> data from transactions that later roll back.</li>
<li><b>Missing or duplicate rows:</b> with allocation-order scans, rows can be read twice or skipped when concurrent inserts cause <b>page splits</b> that move rows to pages already read, or not yet read.</li>
<li>Occasional errors (error 601, data movement during a NOLOCK scan).</li>
</ul>
<p>So reports can be wrong in ways that can't be reproduced, which is exactly what finance sees.</p>
<p><b>Instead:</b></p>
<ul>
<li>Enable <b>READ COMMITTED SNAPSHOT (RCSI)</b>: readers get consistent committed data without blocking writers. That's the problem people were trying to solve with NOLOCK, without the wrong answers.</li>
<li>For multi-statement reports needing one consistent view, use <b>SNAPSHOT</b> isolation for that session.</li>
<li>Move heavy reporting to a readable secondary or a reporting store.</li>
<li>Remove NOLOCK hints gradually, with search and review. Test performance after enabling RCSI and monitor tempdb version-store usage.</li>
</ul>`,
keys:["Dirty reads","Duplicate/missing rows via page splits","RCSI as correct alternative","SNAPSHOT for consistent multi-statement reports","Offload reporting; staged removal"],
fu:[{q:"Is NOLOCK ever acceptable?",a:"For rough, approximate monitoring queries where occasional wrong numbers don't matter (for example a quick row-count estimate in an admin tool), arguably. Never for financial, transactional or user-facing data."}],
rf:["\"NOLOCK only risks seeing uncommitted data\" (misses duplicates)","Keeps NOLOCK and adds DISTINCT","Doesn't know RCSI"]},

{id:"Q021",skill:"SQL Server",level:"Intermediate",type:"Concept",
q:"Temp tables, table variables and CTEs: how do they differ in SQL Server, and when do you use each?",
a:`<ul>
<li><b>Temp tables (<code>#t</code>):</b> real tables in tempdb, with <b>statistics</b> and indexes, and they can cause recompiles as data changes. Good for intermediate results of meaningful size that later queries join or filter, because the optimiser gets real row counts.</li>
<li><b>Table variables (<code>@t</code>):</b> also in tempdb, but historically <b>no statistics</b>, and the optimiser assumed 1 row (or 100 in some versions), producing poor plans for large contents. SQL Server 2019 (compatibility 150) added <b>deferred compilation</b>, using the actual row count at first execution, which helps but still gives no column statistics. Good for small sets, and where fewer recompiles matter. They also survive a rollback, which is useful for logging.</li>
<li><b>CTEs:</b> named subqueries, <b>not materialised</b> in SQL Server. Each reference is expanded inline, so referencing an expensive CTE twice computes it twice. Great for readability and recursion, not for caching intermediate results.</li>
</ul>
<p>Rule of thumb: CTEs for structure, temp tables for staging intermediate results that drive later joins, and table variables for small sets or table-valued parameters. PostgreSQL differs: since version 12 CTEs are inlined by default, unless you write <code>MATERIALIZED</code>.</p>`,
keys:["Temp tables have stats and indexes","Table variables: no stats; 2019 deferred compilation","CTEs not materialised in SQL Server","Choosing by size and reuse","PostgreSQL CTE behaviour difference"],
fu:[{q:"A stored procedure loads 200,000 rows into a table variable and joins it. Plans are terrible. Fix?",a:"Switch to a temp table so the optimiser has statistics, add an index on the join key if it helps, and compare plans. Or check compatibility level 150+ for deferred compilation, which improves the row estimate but still lacks column statistics."}],
rf:["Thinks CTEs are cached","Uses table variables for large data by default","Doesn't know version differences"]},

{id:"Q022",skill:"PostgreSQL",level:"Intermediate",type:"Scenario",
q:"PostgreSQL chooses a sequential scan for a query even though there's an index on the filter column. How do you work out why?",
a:`<p>Run <code>EXPLAIN (ANALYZE, BUFFERS)</code> and compare estimated with actual rows. Then check the usual reasons:</p>
<ul>
<li><b>It's the right choice:</b> the filter matches a large share of the table (more than roughly 5–10%), and reading sequentially is cheaper than random index access plus heap visits.</li>
<li><b>Bad estimates:</b> statistics are stale (run <code>ANALYZE</code>), or the column is skewed and the default <code>default_statistics_target</code> (100) is too coarse. Raise the target for that column. For correlated columns, use extended statistics (<code>CREATE STATISTICS</code>).</li>
<li><b>The index can't be used:</b> a function or cast on the column, a type mismatch between parameter and column, a leading-wildcard <code>LIKE</code>, a collation that doesn't support prefix matching (use <code>text_pattern_ops</code>), or a predicate that doesn't match a partial index's condition.</li>
<li><b>Cost settings:</b> <code>random_page_cost</code> defaults to 4.0, tuned for spinning disks. On SSD storage (RDS, Aurora), something around 1.1 makes index scans correctly look cheaper.</li>
<li><b>Generic plans for prepared statements:</b> after several executions, a cached generic plan may not fit specific parameter values.</li>
</ul>
<p>For diagnosis only, <code>SET enable_seqscan = off</code> shows what the index plan would cost, but never ship that.</p>`,
keys:["EXPLAIN ANALYZE with BUFFERS","Seq scan can be correct","Statistics, skew, extended statistics","Index usability issues","random_page_cost on SSD; generic plans"],
fu:[{q:"What do the BUFFERS numbers tell you?",a:"shared hit means pages found in PostgreSQL's cache, and read means pages fetched from disk or the OS cache. High read counts explain slow first runs, and comparing them between plans shows the real I/O work each plan does."}],
rf:["Forces index usage with settings in production","Never runs ANALYZE","Doesn't consider that the seq scan may be optimal"]},

{id:"Q023",skill:"PostgreSQL",level:"Intermediate",type:"Concept",
q:"How do PostgreSQL's isolation levels work, and what must application code do differently at REPEATABLE READ and SERIALIZABLE?",
a:`<ul>
<li><b>READ COMMITTED</b> (default): each <i>statement</i> sees a fresh snapshot of committed data. Two reads in one transaction can see different data. If an UPDATE finds that a target row was changed by a concurrent committed transaction, it re-evaluates against the new version and continues. READ UNCOMMITTED behaves the same; PostgreSQL never allows dirty reads.</li>
<li><b>REPEATABLE READ:</b> a snapshot taken at the transaction's <i>first statement</i> and kept for all its reads (snapshot isolation, stricter than the SQL standard's minimum). If the transaction tries to update a row a concurrent transaction has changed, it fails with a <b>serialization error (SQLSTATE 40001)</b>. Write skew is still possible.</li>
<li><b>SERIALIZABLE:</b> Serializable Snapshot Isolation (SSI) tracks read and write dependencies and aborts transactions with 40001 when the combined outcome couldn't have happened serially. That prevents write skew, without blocking locks.</li>
</ul>
<p><b>What application code must do:</b> at REPEATABLE READ and SERIALIZABLE, <b>retry the whole transaction</b> on 40001 (with a retry limit and jitter). That means the transaction logic must be re-runnable, with no external side effects inside it. Keep these transactions short, since long ones increase conflicts. Use explicit <code>SELECT … FOR UPDATE</code> locks at READ COMMITTED when you only need to protect specific rows.</p>`,
keys:["Statement vs transaction snapshots","40001 serialization failures","SSI prevents write skew without blocking","Retry entire transaction; idempotent bodies","FOR UPDATE as alternative at READ COMMITTED"],
fu:[{q:"Give a write-skew example that SERIALIZABLE prevents.",a:"An on-call rule says at least one doctor must be on call. Two doctors each check that the other is on call, then both go off call in concurrent transactions. Under snapshot isolation both succeed and nobody is on call. SERIALIZABLE aborts one with 40001."}],
rf:["Uses SERIALIZABLE without retry logic","Thinks PostgreSQL has dirty reads","Sends emails inside retryable transactions"]},

{id:"Q024",skill:"DynamoDB",level:"Intermediate",type:"Architecture",
q:"What is DynamoDB single-table design? Walk through modelling users, groups and memberships, and say when you would not use single-table design.",
a:`<p>Single-table design stores several entity types in one table, with <b>generic key attributes</b> (<code>PK</code>, <code>SK</code>, <code>GSI1PK</code>, <code>GSI1SK</code>) holding prefixed values. Related items share a partition key, so one Query fetches them together, replacing joins. You start from the list of <b>access patterns</b>, not from entities.</p>
<p><b>Example access patterns:</b> get a user, get a group, list a group's members, list a user's groups.</p>
<pre><code>Item                 PK              SK                 GSI1PK          GSI1SK
User profile         USER#u1         PROFILE
Group metadata       GROUP#g1        METADATA
Membership           GROUP#g1        MEMBER#u1          USER#u1         GROUP#g1
</code></pre>
<ul>
<li>Members of g1: Query <code>PK = GROUP#g1 AND begins_with(SK, 'MEMBER#')</code>.</li>
<li>Groups of u1: Query <code>GSI1</code> where <code>GSI1PK = USER#u1</code>. That's an inverted index on the membership item.</li>
</ul>
<p>Denormalise the attributes needed for display (group name on the membership item) and update them when they change.</p>
<p><b>When not to use it:</b></p>
<ul>
<li>Access patterns are unknown or change often.</li>
<li>Heavy ad-hoc querying or analytics.</li>
<li>Teams unfamiliar with it, since the learning curve and readability cost are real.</li>
<li>Entities with unrelated lifecycles where separate tables are simpler to operate (backups, streams, permissions).</li>
</ul>
<p>Many teams use a few tables, one per bounded context, each designed around its access patterns.</p>`,
keys:["Access patterns first","Generic PK/SK with prefixes; item collections","Inverted GSI for many-to-many","Denormalisation and update cost","Clear criteria for not using it"],
trade:["Single-table: fewest round trips and very predictable performance, harder to evolve and read","Multiple tables: simpler mental model, more requests per screen","It depends on: stability of access patterns, team experience, analytics needs"],
fu:[{q:"A new access pattern appears: 'list groups by creation date across all users'. What do you do?",a:"Add a GSI keyed for it. A single partition key value for all groups would be hot, so shard the GSI partition key (for example GROUPS#2026-10, or a random suffix) and merge results. Or serve that admin-style query from an analytics copy (export to S3 and query with Athena) if it's infrequent."}],
rf:["Models like relational tables with joins in code","Ignores access-pattern-first design","Single-table everywhere as dogma"]},

{id:"Q025",skill:"DynamoDB",level:"Intermediate",type:"Scenario",
q:"A DynamoDB table is throttling writes even though consumed capacity is far below the table's provisioned or on-demand level. What's going on, and how do you fix it?",
a:`<p>This points to a <b>hot partition</b>. Capacity is spread across physical partitions, and each partition supports at most about <b>3,000 RCU and 1,000 WCU per second</b>. If one partition key receives a disproportionate share (a celebrity's posts, a global counter, a date-only partition key like <code>2026-10-13</code> for all of today's events), requests to it throttle while the table overall looks underused.</p>
<p><b>Confirm it:</b> CloudWatch Contributor Insights for DynamoDB shows the most-accessed and most-throttled keys. Throttle events in metrics while table-level consumption stays low are the giveaway.</p>
<p><b>Fixes:</b></p>
<ul>
<li><b>Better key choice:</b> a high-cardinality partition key that spreads traffic (user ID, device ID, not a date or status).</li>
<li><b>Write sharding:</b> append a suffix (<code>EVENTS#2026-10-13#7</code> from 0–N) to spread writes, and read all N shards in parallel and merge.</li>
<li><b>Aggregate before writing:</b> buffer counter increments in memory or SQS and write periodic batches, instead of one write per event to a single item.</li>
<li><b>Caching</b> for hot reads: DAX or an application cache.</li>
</ul>
<p>DynamoDB's adaptive capacity and split-for-heat help by moving or splitting hot items, but a single item still has per-item limits. Design for spread.</p>`,
keys:["Per-partition limits (~3,000 RCU / 1,000 WCU)","Contributor Insights to identify hot keys","High-cardinality keys","Write sharding and read merge","Aggregation, caching; adaptive capacity limits"],
trade:["Sharding spreads writes but makes reads fan out across shards","Aggregating writes reduces load but adds delay and a component that can lose buffered data"],
fu:[{q:"How would you design a 'likes' counter for a viral post on DynamoDB?",a:"Shard the counter across N items (POST#123#LIKES#0..9), increment a random shard, and sum them on read (cached). Or aggregate likes through a stream or queue and update the counter in batches. The individual like records still go to their own items keyed by user."}],
rf:["Raises table capacity","Uses date or status as partition key","Doesn't know per-partition limits"]},

{id:"Q026",skill:"SQL Server",level:"Intermediate",type:"Scenario",
q:"Users report timeouts across several screens. The database shows low CPU, but many sessions are waiting. How do you find the blocking chain and its root cause?",
a:`<ol>
<li><b>See who's blocked by whom:</b> <code>sys.dm_exec_requests</code> (<code>blocking_session_id</code>, <code>wait_type</code>, <code>wait_time</code>), or <code>sp_WhoIsActive</code> with <code>@find_block_leaders = 1</code>. Follow the chain to the <b>head blocker</b>: the session blocking others while not itself blocked.</li>
<li><b>Inspect the head blocker:</b> often it's <b>not running anything</b>. Its status is <code>sleeping</code> with <code>open_transaction_count &gt; 0</code>. That's an application that began a transaction and then went off to do something else: an HTTP call, waiting for user input, an exception path that skipped commit or rollback, or a client timeout that left the transaction open. Get its last statement (<code>sys.dm_exec_input_buffer</code> or <code>most_recent_sql_handle</code>), host and program name to find the code.</li>
<li><b>If it's actively running,</b> it's a long or expensive statement holding locks. Check its plan: is it scanning and locking far more than needed?</li>
<li><b>Mitigate:</b> kill the head blocker if safe (its transaction rolls back, which also takes time).</li>
<li><b>Fix:</b> keep transactions short and free of external calls, make sure every code path commits or rolls back (<code>using</code> plus explicit transactions), set <code>XACT_ABORT ON</code>, add indexes so statements lock fewer rows, and consider RCSI to remove reader/writer blocking.</li>
</ol>
<p>Set up the <code>blocked process report</code> (Extended Events, with a threshold of a few seconds) so future blocking is captured automatically.</p>`,
keys:["Find head blocker via DMVs/sp_WhoIsActive","Sleeping session with open transaction pattern","Trace back to app code via input buffer/host","Short transactions, no external calls inside","Blocked process report for ongoing capture"],
trade:["Killing the head blocker restores service but rolls back its work (possibly long)","RCSI removes most reader blocking but not writer/writer conflicts"],
fu:[{q:"Why can a client command timeout leave a transaction open?",a:"On timeout the client sends an attention signal, and SQL Server stops the current batch. With XACT_ABORT OFF, an open transaction is not rolled back, so it keeps holding locks until the connection is reused, closed or explicitly rolled back. XACT_ABORT ON makes the transaction roll back on attention."}],
rf:["Restarts the SQL Server service","Adds NOLOCK everywhere","Only looks at CPU"]},

{id:"Q027",skill:"SQL Server",level:"Intermediate",type:"Concept",
q:"What are memory grants in SQL Server? How do over- and under-estimated grants hurt performance, and what does memory grant feedback do?",
a:`<p>Operators like <b>sorts and hash joins or aggregates</b> need workspace memory. Before execution, a query requests a <b>memory grant</b> sized from the estimated row counts and row sizes.</p>
<ul>
<li><b>Under-estimated grant:</b> the operator runs out of memory and <b>spills to tempdb</b> (the plan shows sort or hash spill warnings). Spills are much slower than in-memory work.</li>
<li><b>Over-estimated grant:</b> the query reserves memory it never uses. Under concurrency, other queries wait for memory with <code>RESOURCE_SEMAPHORE</code> waits, which shows up as throughput collapsing while CPU is idle. Large varchar columns (estimated at half their declared size) and inflated estimates often cause this.</li>
</ul>
<p><b>Memory grant feedback</b> (SQL Server 2017 for batch mode, 2019 for row mode, and percentile-based plus persisted in Query Store in 2022) adjusts a cached plan's grant on later executions based on actual usage.</p>
<p><b>Other fixes:</b> better estimates (statistics, simpler predicates), reducing the rows sorted (indexes that provide order), avoiding unnecessarily wide columns in sorted outputs, and as a last resort query hints (<code>MIN_GRANT_PERCENT</code>/<code>MAX_GRANT_PERCENT</code>) or Resource Governor limits.</p>`,
keys:["Sorts/hashes need grants from estimates","Spills from under-grant","RESOURCE_SEMAPHORE waits from over-grant","Memory grant feedback by version","Fix estimates, avoid sorts, column width; hints as last resort"],
fu:[{q:"How do you spot memory-grant pressure server-wide?",a:"Look for RESOURCE_SEMAPHORE in wait statistics, queued requests in sys.dm_exec_query_memory_grants (grant_time NULL), and queries whose granted memory far exceeds used memory."}],
rf:["Adds RAM as the only fix","Doesn't connect spills to estimates","Unaware of RESOURCE_SEMAPHORE"]},

{id:"Q028",skill:"SQL Server",level:"Intermediate",type:"Architecture",
q:"An audit-events table in SQL Server has 2 billion rows and grows 5 million a day. Someone suggests partitioning it 'for performance'. When does partitioning help, and how would you design it?",
a:`<p>Partitioning is mainly a <b>data-management</b> feature, not an automatic performance feature.</p>
<p><b>Where it helps:</b></p>
<ul>
<li><b>Sliding-window retention:</b> archive or delete a month of data in seconds by <b>switching</b> a partition out to a staging table (a metadata operation), instead of deleting millions of rows. Or truncate a single partition (SQL Server 2016+).</li>
<li><b>Partition elimination</b> for queries that filter on the partitioning key (by date range).</li>
<li>Per-partition index maintenance and compression (older partitions compressed or read-only).</li>
</ul>
<p><b>Where it doesn't help, or hurts:</b> queries that don't filter on the partition key must touch every partition, often slower than a single well-indexed table. Good indexes usually matter more for point lookups.</p>
<p><b>Design:</b></p>
<ul>
<li>Partition by <code>EventTime</code> monthly (a partition function and scheme). Indexes are <b>aligned</b> (partitioned the same way) so switching works.</li>
<li>Include the partition column in the clustered key, for example <code>(EventTime, EventId)</code>.</li>
<li>A job pre-creates future partitions (split an empty partition) and switches out expired ones.</li>
<li>Check that the main queries actually filter by time.</li>
</ul>`,
keys:["Partitioning primarily for manageability/retention","Partition switching for fast archival","Elimination only when filtering by key","Aligned indexes, partition key in clustered key","Maintenance job for future/old partitions"],
trade:["Big win for time-based retention; little or negative effect for queries not filtering by the key","Adds operational complexity (functions, schemes, jobs)","It depends on: retention requirements, query patterns, edition and version"],
fu:[{q:"Why should you split only empty partitions?",a:"Splitting a partition that contains data physically moves rows, which is slow, heavily logged and takes strong locks. Pre-create future boundaries ahead of time so splits always happen on empty ranges."}],
rf:["Partitions by a column queries don't filter on","Expects faster point lookups","Non-aligned indexes preventing switching"]},

{id:"Q029",skill:"SQL Server",level:"Intermediate",type:"Scenario",
q:"A nightly job runs DELETE FROM Logs WHERE CreatedAt < @cutoff, removing about 20 million rows. While it runs, the application can't write logs, and the transaction log fills up. Fix it.",
a:`<p><b>What's happening:</b></p>
<ul>
<li>One giant DELETE takes millions of row locks. SQL Server <b>escalates</b> to a table lock (around 5,000 locks on one object in a statement), blocking all writes.</li>
<li>It's a single transaction, so the <b>whole delete must be logged and kept active</b> until commit. The log can't truncate, so it fills.</li>
<li>If <code>CreatedAt</code> isn't indexed, it also scans the table.</li>
</ul>
<p><b>Fix: delete in small batches</b>, each its own transaction:</p>
<pre><code>WHILE 1 = 1
BEGIN
    DELETE TOP (4000) FROM dbo.Logs
    WHERE CreatedAt &lt; @cutoff;          -- index on CreatedAt
    IF @@ROWCOUNT = 0 BREAK;
    WAITFOR DELAY '00:00:00.200';         -- give other work room, let log truncate
END</code></pre>
<ul>
<li>Batch size under the escalation threshold keeps locks at row or page level.</li>
<li>Each commit lets log space be reused (with log backups in FULL recovery).</li>
<li>Run off-peak, and monitor log usage and replica lag.</li>
</ul>
<p><b>Better long term:</b> partition by date and switch or truncate old partitions, so retention costs seconds.</p>`,
keys:["Lock escalation explained","Single transaction logs everything; log can't truncate","Batched deletes below escalation threshold","Supporting index; pacing; log backups","Partitioning for retention as structural fix"],
trade:["Smaller batches mean less blocking but a longer total runtime","Disabling lock escalation on the table avoids table locks but can consume a lot of lock memory"],
fu:[{q:"What about availability-group replicas during a big delete?",a:"Every deleted row is shipped to secondaries. A huge transaction can build redo backlog and replica lag, and delay log truncation on the primary. Batching and pacing keep replicas in step."}],
rf:["Runs the delete in one statement with a bigger log","Uses TRUNCATE when only some rows should go","No index on the filter column"]},

{id:"Q030",skill:"SQL Server",level:"Intermediate",type:"Concept",
q:"Index fragmentation: does it still matter on modern storage? How should index maintenance be approached?",
a:`<p>"Rebuild above 30%, reorganise between 5–30%" dates from spinning disks, where logical fragmentation (out-of-order pages) hurt sequential read-ahead. On SSD and cloud storage, <b>logical fragmentation matters much less</b>. Microsoft's current guidance moves away from fixed fragmentation thresholds.</p>
<p>What still matters:</p>
<ul>
<li><b>Page density</b> (how full pages are). Low density from page splits or deletes means more pages to read and more memory used in the buffer pool. Check <code>avg_page_space_used_in_percent</code>.</li>
<li><b>Statistics freshness.</b> Many of the "rebuild fixed it" stories are really the statistics update that a rebuild does as a side effect.</li>
</ul>
<p><b>Approach:</b></p>
<ul>
<li>Measure whether maintenance improves performance for your workload before running heavy nightly rebuilds of everything. Rebuilds generate lots of log, replica traffic and I/O.</li>
<li>Update statistics on a schedule appropriate to change rates.</li>
<li>Rebuild selectively where page density is low and the index is read heavily. Set a <b>fill factor</b> below 100 only for indexes with frequent random inserts that cause page splits.</li>
<li>Use <code>ONLINE</code> and <code>RESUMABLE</code> rebuilds where available.</li>
</ul>`,
keys:["Logical fragmentation less relevant on SSD","Page density matters","Stats update as hidden benefit of rebuilds","Measure before heavy maintenance","Selective rebuilds, fill factor, online/resumable"],
fu:[{q:"Should you lower fill factor everywhere to prevent page splits?",a:"No. Lower fill factor means emptier pages, so more pages and memory for every read. Use it only for indexes with random insert patterns (like GUID keys) that split frequently, and measure the trade-off."}],
rf:["Rebuilds every index nightly by habit","Uses fixed thresholds without measuring","Sets fill factor 70 globally"]},

{id:"Q031",skill:"SQL Server",level:"Intermediate",type:"Scenario",
q:"Under load, a workload that creates many temp tables shows high PAGELATCH_UP and PAGELATCH_EX waits on tempdb pages like 2:1:1 and 2:1:3. What's the problem and the fix?",
a:`<p>These are latch waits on tempdb's <b>allocation pages</b> (PFS, GAM and SGAM) or on <b>system metadata</b> pages. Many concurrent sessions creating and dropping temp tables all have to update the same allocation bitmaps and catalogue rows. That's in-memory contention, not disk I/O.</p>
<p><b>Fixes:</b></p>
<ul>
<li><b>Multiple equally sized tempdb data files:</b> typically one per logical core up to 8, then add more in steps of 4 if contention remains. Allocations are spread round-robin across files, so contention on each file's allocation pages drops. Since SQL Server 2016, setup configures this, and the old trace flags 1117 and 1118 behaviours are default for tempdb.</li>
<li><b>Memory-optimised tempdb metadata</b> (SQL Server 2019+) removes contention on the system tables tracking temp objects. It requires a restart.</li>
<li><b>Reduce churn in code:</b> avoid creating and dropping temp tables at very high frequency. Table variables or temp-table caching (when the definition stays the same and isn't altered after creation) can help, as can avoiding <code>SELECT INTO #t</code> patterns in extremely hot procedures.</li>
</ul>`,
keys:["Allocation page/metadata latch contention, not I/O","Multiple equal-size data files","2016 defaults; 2019 memory-optimised metadata","Temp table caching rules; reduce churn"],
fu:[{q:"How do you tell latch contention from tempdb I/O problems?",a:"PAGELATCH_* waits are in-memory latch contention. PAGEIOLATCH_* waits mean waiting on disk reads or writes. They have different causes and different fixes."}],
rf:["Moves tempdb to faster disks for PAGELATCH waits","One big tempdb file","Doesn't know the page IDs refer to allocation pages"]},

{id:"Q032",skill:"SQL Server",level:"Intermediate",type:"Concept",
q:"How should transactions and error handling be written in T-SQL stored procedures? What do XACT_ABORT, TRY/CATCH and @@TRANCOUNT each do?",
a:`<pre><code>CREATE OR ALTER PROCEDURE dbo.TransferStock @From int, @To int, @Qty int
AS
BEGIN
    SET NOCOUNT ON;
    SET XACT_ABORT ON;              -- most errors (and client attention) abort and roll back
    BEGIN TRY
        BEGIN TRANSACTION;
            UPDATE dbo.Stock SET Qty = Qty - @Qty WHERE ProductId = @From AND Qty &gt;= @Qty;
            IF @@ROWCOUNT = 0 THROW 50001, 'Insufficient stock', 1;
            UPDATE dbo.Stock SET Qty = Qty + @Qty WHERE ProductId = @To;
        COMMIT;
    END TRY
    BEGIN CATCH
        IF @@TRANCOUNT &gt; 0 ROLLBACK;
        THROW;                      -- rethrow original error to the caller
    END CATCH
END</code></pre>
<ul>
<li><b><code>XACT_ABORT ON</code>:</b> without it, many runtime errors abort only the failing <i>statement</i>, and the transaction continues, so partial work can commit. A client timeout can also leave the transaction open. With it, those errors abort and roll back the whole transaction.</li>
<li><b>TRY/CATCH:</b> handles errors in one place. Always check <code>@@TRANCOUNT</code> (or <code>XACT_STATE()</code>) before rolling back, then <code>THROW</code> to preserve the original error. Don't swallow it.</li>
<li><b><code>@@TRANCOUNT</code>:</b> nested <code>BEGIN TRAN</code> only increments a counter. There are no real nested transactions, and a <code>ROLLBACK</code> anywhere rolls back everything. Use savepoints only when you truly need partial rollback.</li>
</ul>`,
keys:["XACT_ABORT ON and why","TRY/CATCH with @@TRANCOUNT/XACT_STATE check","THROW to rethrow","No true nested transactions","Atomic conditional update pattern"],
fu:[{q:"What's XACT_STATE() = -1?",a:"The transaction is uncommittable (doomed): an error occurred that prevents committing, and you can only roll back. Code in CATCH must roll back in that state rather than attempt more work."}],
rf:["No XACT_ABORT; assumes errors roll back everything","Swallows errors in CATCH","Thinks nested BEGIN TRAN creates independent transactions"]},

{id:"Q033",skill:"SQL Server",level:"Intermediate",type:"Concept",
q:"varchar vs nvarchar, collations and UTF-8 in SQL Server: what do they affect, and what goes wrong when they're chosen carelessly?",
a:`<ul>
<li><b>nvarchar</b> stores UTF-16 (2 bytes per character for most characters). It handles all languages. <b>varchar</b> stores single-byte characters in a code page determined by the collation, so characters outside that code page become <code>?</code>. SQL Server 2019 added <b>UTF-8 collations</b> (<code>…_UTF8</code>), letting <code>varchar</code> store full Unicode as UTF-8. That's compact for mostly-ASCII text, though variable width complicates length reasoning.</li>
<li><b>Collation</b> controls sorting and comparison: case sensitivity (<code>CI</code>/<code>CS</code>), accent sensitivity (<code>AI</code>/<code>AS</code>), and the code page. With a CI collation, <code>'ABC' = 'abc'</code>, and unique indexes enforce case-insensitive uniqueness.</li>
</ul>
<p><b>What goes wrong:</b></p>
<ul>
<li><b>Implicit conversions:</b> an <code>nvarchar</code> parameter against a <code>varchar</code> column converts the column side, so index seeks become scans (ORMs send nvarchar by default).</li>
<li><b>Collation conflicts</b> joining columns or temp tables with different collations (tempdb uses the server default collation). That causes errors, or forced conversions that block index use.</li>
<li><b>Data loss:</b> names in other scripts stored in <code>varchar</code> with a Latin code page.</li>
<li>Behaviour differences when moving to PostgreSQL, which is case-sensitive by default.</li>
</ul>`,
keys:["Unicode coverage of each type","UTF-8 collations from 2019","Collation controls case/accent comparison and uniqueness","Implicit conversion performance trap","Collation conflicts incl. tempdb; migration implications"],
fu:[{q:"How do you avoid collation conflicts with temp tables?",a:"Declare string columns in temp tables with COLLATE DATABASE_DEFAULT, or create them with SELECT INTO from the source table so they inherit its collation."}],
rf:["varchar for user names in a multilingual app without thought","Unaware of implicit conversion costs","Doesn't know collations affect uniqueness"]},

{id:"Q034",skill:"PostgreSQL",level:"Intermediate",type:"Scenario",
q:"Concurrent requests that 'get or create' a tag sometimes fail with unique-constraint violations, and an earlier fix (SELECT, then INSERT if missing) still produces errors. Implement it correctly in PostgreSQL.",
a:`<p>Check-then-insert races: two transactions both see "not found", and both insert. The unique constraint correctly rejects one of them, so the code must handle that atomically.</p>
<p><b>Use <code>INSERT … ON CONFLICT</code></b> (needs a unique index or constraint on the conflict target):</p>
<pre><code>-- create-or-return, race-free
INSERT INTO tags (name) VALUES ($1)
ON CONFLICT (name) DO UPDATE SET name = EXCLUDED.name   -- no-op update so RETURNING yields the row
RETURNING id;</code></pre>
<ul>
<li><code>ON CONFLICT DO NOTHING RETURNING id</code> returns <b>no row</b> when the tag already exists, so you'd need a follow-up SELECT, which can itself race with a concurrent delete. The no-op <code>DO UPDATE</code> always returns the row, at the cost of a write, a new tuple version and some WAL. For hot rows, prefer <code>DO NOTHING</code> plus a SELECT.</li>
<li>For true upserts, <code>DO UPDATE SET count = tags.count + 1</code> updates atomically.</li>
<li><code>MERGE</code> (PostgreSQL 15+) is more flexible, but it doesn't give <code>ON CONFLICT</code>'s guarantees against concurrent inserts. It can still raise unique violations, so prefer <code>ON CONFLICT</code> for get-or-create.</li>
</ul>`,
keys:["Check-then-insert race","ON CONFLICT with unique constraint","DO NOTHING returns nothing; DO UPDATE trick and its cost","Atomic upsert counters","MERGE lacks ON CONFLICT concurrency guarantees"],
fu:[{q:"How do you do the same in SQL Server?",a:"There's no ON CONFLICT. Use a single statement with locking hints (INSERT … SELECT … WHERE NOT EXISTS (SELECT … WITH (UPDLOCK, HOLDLOCK))), or try the insert and catch duplicate-key errors 2601/2627 and then select. MERGE in SQL Server also needs HOLDLOCK to be safe under concurrency."}],
rf:["Wraps check-then-insert in a transaction at READ COMMITTED and thinks it's safe","Removes the unique constraint to stop errors","Uses MERGE assuming it's race-free"]},

{id:"Q035",skill:"PostgreSQL",level:"Intermediate",type:"Architecture",
q:"Design storage for an append-heavy activity-events table in PostgreSQL (about 50 million rows a month, kept 13 months, queried mostly by user and recent time). Would you partition it, and how?",
a:`<p><b>Yes, declarative range partitioning by time</b> (monthly) fits well:</p>
<ul>
<li><b>Retention</b> becomes <code>DROP TABLE</code> (or <code>DETACH PARTITION … CONCURRENTLY</code> first) of the oldest month: instant, with no huge DELETE, no bloat and no vacuum storm.</li>
<li><b>Partition pruning</b> limits recent-time queries to one or two partitions.</li>
<li>Vacuum and indexes work per partition, so maintenance stays bounded.</li>
</ul>
<p><b>Design details:</b></p>
<ul>
<li>Partition key <code>occurred_at</code>. Indexes defined on the parent propagate to partitions, for example <code>(user_id, occurred_at DESC)</code> for "a user's recent activity".</li>
<li><b>Unique constraints and primary keys must include the partition key</b>: <code>PRIMARY KEY (id, occurred_at)</code>. Global uniqueness on <code>id</code> alone isn't enforceable, so use UUIDv7 or a sequence and accept that.</li>
<li>Automate creating future partitions and dropping old ones (pg_partman or a scheduled job). A missing future partition makes inserts fail, unless a default partition exists, which then must be split later.</li>
<li>Queries that don't filter by time hit every partition. Make sure the main access paths include a time bound.</li>
<li>Consider BRIN on <code>occurred_at</code> within partitions for range scans, and the TimescaleDB extension if time-series features matter.</li>
</ul>`,
keys:["Time-range partitioning for retention and pruning","Drop/detach partitions instead of deletes","PK/unique must include partition key","Automated partition lifecycle; default partition caveat","Queries must include time bound"],
trade:["Partitioning simplifies retention and maintenance but adds planning overhead and constraints on uniqueness","Too many small partitions slow planning; monthly is a common balance at this volume","It depends on: query patterns, retention rules, write rate"],
fu:[{q:"What happens to foreign keys referencing a partitioned table?",a:"PostgreSQL supports foreign keys referencing partitioned tables (since version 12), but the referenced key must include the partition key. Events tables are often leaf data with outgoing foreign keys only, which avoids the issue."}],
rf:["Monthly DELETE of 50M rows instead","Partition by user_id hash for time-based retention","No automation for future partitions"]},

{id:"Q036",skill:"PostgreSQL",level:"Intermediate",type:"Concept",
q:"Can PostgreSQL full-text search replace a dedicated search engine like OpenSearch? How does it work, and where are its limits?",
a:`<p>PostgreSQL full-text search converts text to a <code>tsvector</code> (normalised lexemes with positions, using a language configuration for stemming and stop words) and matches it against a <code>tsquery</code> (<code>to_tsquery</code>, <code>websearch_to_tsquery</code>). Store the vector in a <b>generated column</b> and index it with <b>GIN</b>. <code>ts_rank</code> provides relevance ranking, and the <code>pg_trgm</code> extension adds trigram similarity for fuzzy matching and <code>ILIKE</code> acceleration.</p>
<p><b>Good enough when:</b> moderate data size, search over a few fields, simple ranking, and transactional consistency with the data (search sees committed changes immediately, with no sync pipeline). That's often the right choice for an admin search or a mid-sized app.</p>
<p><b>Limits that push you to OpenSearch or Elasticsearch:</b></p>
<ul>
<li>Advanced relevance tuning (BM25 with field boosts, function scoring, learning to rank).</li>
<li>Facets and aggregations at scale.</li>
<li>Typo tolerance, synonyms and autocomplete across large catalogues.</li>
<li>Multi-language analysis.</li>
<li>Vector or hybrid search at scale (although pgvector covers many vector needs).</li>
<li>Search load you don't want competing with OLTP.</li>
</ul>
<p>The cost of a search engine is a separate cluster, a sync pipeline (outbox or CDC) and eventual consistency.</p>`,
keys:["tsvector/tsquery, generated column + GIN","ts_rank, pg_trgm for fuzzy","Strength: consistency, no pipeline","Limits: relevance, facets, scale, languages","Cost of a separate engine"],
fu:[{q:"Search results must include a product immediately after it's created. Which approach makes that easier?",a:"PostgreSQL full-text search, since it's transactionally consistent. With OpenSearch you need a refresh (near-real-time, about 1 second by default) after an async sync, so you either accept a delay or write-through with an explicit refresh on critical paths."}],
rf:["LIKE '%term%' as search","Adds OpenSearch for 10k rows without need","Unaware of pg_trgm"]},

{id:"Q037",skill:"PostgreSQL",level:"Intermediate",type:"Scenario",
q:"A team triggers background workers with PostgreSQL LISTEN/NOTIFY. Jobs occasionally never run, especially around deploys. Why, and what would you use instead?",
a:`<p>LISTEN/NOTIFY is a <b>non-durable signal</b>:</p>
<ul>
<li>Notifications go only to sessions <b>currently listening</b>. If the worker is restarting, deploying or disconnected, the notification is simply lost. That explains "around deploys".</li>
<li>Payloads are small (under 8,000 bytes by default) and there's no acknowledgement or retry.</li>
<li>It doesn't work through PgBouncer in transaction-pooling mode, since LISTEN needs a dedicated session.</li>
<li>A notification is delivered at commit, which is good, but a very high NOTIFY rate can fill the notification queue.</li>
</ul>
<p><b>Fix:</b> make the <b>job table the source of truth</b> and use NOTIFY only as an optional wake-up hint:</p>
<ul>
<li>Insert a row into a <code>jobs</code> table in the same transaction as the business change.</li>
<li>Workers claim jobs with <code>SELECT … FOR UPDATE SKIP LOCKED LIMIT n</code>, mark them done or failed, and retry with backoff.</li>
<li>Workers also <b>poll</b> periodically, so missed notifications only delay work, never lose it.</li>
<li>Or use a library built on this pattern (Graphile Worker or pg-boss in Node), or a real queue (SQS) fed by an outbox.</li>
</ul>`,
