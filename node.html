{id:"J029",skill:"Node.js Runtime",level:"Advanced",type:"Scenario",
q:"A NestJS service's memory grows steadily for two days until the container is OOM-killed. How do you find the leak in Node.js?",
a:`<ol>
<li><b>Confirm what's growing:</b> <code>process.memoryUsage()</code> as metrics. <code>heapUsed</code> growing means a JavaScript object leak. RSS or <code>external</code>/<code>arrayBuffers</code> growing means buffers or native memory.</li>
<li><b>Take heap snapshots</b> at intervals under load. Start Node with <code>--heapsnapshot-signal=SIGUSR2</code> to capture one on demand, or use <code>v8.writeHeapSnapshot()</code> from an admin endpoint, or attach the inspector. Compare two snapshots in Chrome DevTools (the Comparison view) and look at which constructors grow, then follow the <b>retainers</b> path to see what holds them.</li>
<li><b>Common Node leaks:</b>
  <ul>
  <li>Module-level <code>Map</code>s or arrays used as caches, with no eviction.</li>
  <li><b>Event listeners</b> added per request and never removed (watch for <code>MaxListenersExceededWarning</code>).</li>
  <li>Closures captured by timers or intervals that are never cleared.</li>
  <li>Per-socket state not cleaned up on disconnect.</li>
  <li>Large objects kept in AsyncLocalStorage context beyond the request.</li>
  <li>Unresolved promises piling up.</li>
  </ul></li>
<li><b>Fix and guard:</b> use an LRU with a max size and TTL instead of raw maps, clean up in <code>disconnect</code> and <code>onModuleDestroy</code> handlers, and use <code>WeakMap</code> for metadata keyed by objects. Add a memory-growth alert and a soak test in CI.</li>
</ol>`,
keys:["heapUsed vs RSS/external distinction","Heap snapshots with comparison and retainers","Typical leak sources incl. listeners and socket state","LRU/WeakMap/cleanup fixes","Soak tests and alerts"],
trade:["Heap snapshots pause the process and use a lot of memory; take them on one instance pulled from the load balancer, or at low traffic","Raising memory limits only delays the crash"],
fu:[{q:"RSS grows but heapUsed is flat. What do you look at?",a:"Buffers and native memory: large Buffer allocations retained (file uploads, image processing), native addons, or memory fragmentation in the allocator. Check external and arrayBuffers, and track allocations in the Buffer-heavy code paths."}],
rf:["Restarts the service nightly as the fix","Increases --max-old-space-size and moves on","Never takes a heap snapshot"]},

{id:"J030",skill:"Node.js Runtime",level:"Advanced",type:"Concept",
q:"What is AsyncLocalStorage, how does it carry context across awaits, and what are its pitfalls when used for request context in NestJS?",
a:`<p><code>AsyncLocalStorage</code> (from <code>node:async_hooks</code>) stores a value that follows the <b>asynchronous execution flow</b>: anything started inside <code>als.run(store, fn)</code>, including promise continuations, timers and callbacks, sees the same store through <code>als.getStore()</code>. It works like a thread-local for async code. Recent Node versions reimplemented it on a more efficient mechanism (AsyncContextFrame) and made that the default.</p>
<p><b>Uses:</b> request ID and user for logging (pino with a mixin), tenant context, OpenTelemetry context propagation, and transactional context, so repositories pick up the active transaction. Libraries such as <b>nestjs-cls</b> wrap it, setting the store in middleware or an interceptor so singleton services can read request context without request-scoped providers.</p>
<p><b>Pitfalls:</b></p>
<ul>
<li>Context can be <b>lost</b> with libraries that queue callbacks themselves (some connection pools, custom thenables, older callback APIs). Test the paths you rely on.</li>
<li><code>enterWith()</code> changes context for the rest of the synchronous execution and can leak into unrelated work. Prefer <code>run()</code>.</li>
<li>It's an <b>implicit dependency</b>, which makes code harder to reason about and test. Keep its use to a few cross-cutting concerns.</li>
<li>Large objects in the store live as long as any async work started in that context.</li>
<li>Background work started in a request inherits the request's context unless you deliberately run it in a fresh one.</li>
</ul>`,
keys:["Context follows async flow via run()","Use cases: logging, tenant, tracing, transactions","nestjs-cls avoids request-scope cost","Context loss with some libraries; enterWith risk","Implicit dependency and lifetime concerns"],
fu:[{q:"Why is ALS better than request-scoped providers for a request ID?",a:"Request scope makes every dependent provider be re-created per request (the scope bubbles up), which costs CPU and memory. ALS keeps providers as singletons and makes the request ID readable anywhere in the async flow at low cost."}],
rf:["Uses global variables for request context","Unaware of context-loss cases","Puts the whole request object in the store and keeps it alive"],
verify:"AsyncContextFrame became the default ALS implementation in recent Node versions (24+); confirm for your runtime."},

{id:"J031",skill:"Node.js Runtime",level:"Advanced",type:"Scenario",
q:"Every deploy of the NestJS API on ECS causes a burst of 502s, dropped WebSocket messages and half-finished Kafka batches. Design graceful shutdown properly.",
a:`<p>First, make sure the process actually <b>receives SIGTERM</b>. If the container's entry point is <code>npm start</code> or a shell script, the signal may not be forwarded to Node. And Node running as PID 1 with no SIGTERM handler doesn't exit on it, so ECS waits and then sends SIGKILL. Run <code>node dist/main.js</code> directly (exec form <code>CMD</code>), or use an init process (<code>--init</code> or tini), and register handlers.</p>
<p><b>Shutdown sequence</b> (<code>app.enableShutdownHooks()</code> in Nest, logic in <code>beforeApplicationShutdown</code>/<code>onApplicationShutdown</code>):</p>
<ol>
<li><b>Fail readiness</b> so the load balancer stops sending new requests, and wait briefly for deregistration to propagate. The ALB deregistration delay should cover in-flight requests.</li>
<li><b>Stop accepting connections:</b> <code>server.close()</code>, plus closing idle keep-alive connections (<code>closeIdleConnections()</code> in modern Node) so sockets don't hold the server open.</li>
<li><b>WebSockets:</b> tell clients to reconnect (to another instance) with jitter, then close sockets.</li>
<li><b>Consumers:</b> stop fetching new Kafka or SQS messages, finish the in-flight batch, commit offsets or delete messages, then disconnect.</li>
<li><b>Close resources:</b> DB pools, Redis, flush logs and telemetry.</li>
<li><b>Exit</b> before ECS's <code>stopTimeout</code> (30 seconds by default, configurable up to 120). Use a hard timeout in code as a safety net.</li>
</ol>`,
keys:["Signal delivery: PID 1, exec form, init process","Readiness fail + deregistration delay first","server.close + idle keep-alive handling","Consumers finish, commit, disconnect","Fit within stopTimeout; enableShutdownHooks"],
trade:["Longer drain windows reduce errors but slow deploys","Aggressive socket closing on deploy causes reconnect storms; stagger with jitter"],
fu:[{q:"How do you verify graceful shutdown works?",a:"Run a load test while doing a rolling deploy in staging, and assert zero 5xx responses, no duplicate or lost messages (compare produced vs processed counts), and that tasks exit before SIGKILL (ECS stopped reason and exit code 0, not 137)."}],
rf:["CMD [\"npm\", \"start\"] with no signal handling","Closes the DB pool before in-flight requests finish","Ignores consumer offset commits"]},

{id:"J032",skill:"NestJS",level:"Advanced",type:"Architecture",
q:"For Kafka in a NestJS service, would you use @nestjs/microservices' Kafka transport or a Kafka client directly? How does the Node Kafka client landscape affect that?",
a:`<p><b>@nestjs/microservices Kafka transport:</b> decorators (<code>@EventPattern</code>, <code>@MessagePattern</code>), Nest-style handlers with pipes, guards and interceptors, and a quick start. Limitations show in production:</p>
<ul>
<li>Less control over offset commits, batching and pausing partitions.</li>
<li>Retries and dead-letter topics need custom work.</li>
<li>Its request-response pattern over Kafka adds reply topics and coupling.</li>
</ul>
<p><b>Using a client directly</b> inside a Nest provider (started in <code>onModuleInit</code>, stopped in shutdown hooks) gives explicit control of consumer config, manual commits after processing, pause and resume for backpressure, retry and DLT routing, and metrics. It's more code, but production behaviour is easier to see.</p>
<p><b>Client landscape:</b> KafkaJS, the long-time default (and what Nest's transport builds on), has had little maintenance for several years. Confluent now publishes an official JavaScript client (<code>@confluentinc/kafka-javascript</code>, built on librdkafka) with a KafkaJS-compatible API option, which makes migration easier. For new services I'd choose an actively maintained client and wrap it in our own small consumer abstraction (idempotency, retries, DLT, tracing), so the transport can be swapped.</p>`,
keys:["Nest transport convenience vs control","Offsets, batching, DLT, backpressure needs","Direct client wrapped in provider + lifecycle hooks","KafkaJS maintenance status; Confluent JS client","Own thin abstraction for swappability"],
trade:["Nest transport: fast to start, limited control later","Direct client: more code, full control","librdkafka-based clients add a native dependency (build and image considerations)"],
fu:[{q:"What would your consumer wrapper provide to every team?",a:"Manual commit after successful processing, idempotency hooks keyed on event ID, bounded retry with backoff then DLT, W3C trace context extraction from headers, structured logging with topic/partition/offset, lag and processing-time metrics, and graceful shutdown."}],
rf:["Unaware of KafkaJS maintenance status","Auto-commit with async processing","Uses Kafka request-reply for synchronous APIs"],
verify:"KafkaJS maintenance status and the Confluent JavaScript client's maturity change; check current state before recommending."},

{id:"J033",skill:"NestJS",level:"Advanced",type:"Scenario",
q:"The app fails at startup with 'Nest can't resolve dependencies… circular dependency'. Developers have been adding forwardRef() everywhere. What's the real fix?",
a:`<p><code>forwardRef()</code> resolves the injection order but leaves the <b>design problem</b>: two modules (or providers) depend on each other, so neither can be understood, tested or extracted independently. As forwardRefs accumulate, startup order becomes fragile, and some cycles produce <code>undefined</code> injections at runtime.</p>
<p><b>Real fixes</b> depend on why the cycle exists:</p>
<ul>
<li><b>Shared logic in both directions:</b> extract it into a third module both depend on (for example <code>GroupsModule</code> and <code>PostsModule</code> both need membership checks, so create <code>MembershipModule</code>).</li>
<li><b>A reacts to B and B reacts to A:</b> replace one direction with <b>events</b> (<code>@nestjs/event-emitter</code> in process, or Kafka between services). <code>PostsService</code> emits <code>PostCreated</code>, and notifications subscribe, so posts no longer call notifications directly.</li>
<li><b>Wrong boundaries:</b> if two modules always change together and call each other constantly, merge them.</li>
<li><b>Dependency inversion:</b> define an interface (token) in the lower module and implement it in the higher one.</li>
</ul>
<p>Prevent recurrence with a dependency-graph check in CI (madge or dependency-cruiser) that fails on new cycles.</p>`,
keys:["forwardRef treats symptom","Extract shared module","Events to break bidirectional calls","Merge or invert dependencies","CI cycle detection"],
fu:[{q:"Is in-process event emitting a good default for decoupling?",a:"It decouples code, but adds indirection and gives no delivery guarantees: if the process crashes after the DB commit, the handler never runs. Use it for best-effort side effects, and an outbox plus broker for anything that must happen."}],
rf:["forwardRef everywhere","Moves everything into one giant module","No cycle detection"]},

{id:"J034",skill:"NestJS",level:"Advanced",type:"Concept",
q:"In a multi-tenant NestJS app, each tenant has its own database connection. Making providers request-scoped is slow. What are durable providers, and how do they help?",
a:`<p>Request-scoped providers are re-created for <b>every request</b>, along with everything that depends on them. With a per-tenant DB connection behind a request-scoped provider, the app pays object construction (and possibly connection setup) on every request.</p>
<p><b>Durable providers</b> (NestJS 9+) let you group requests by a key, typically the tenant. A custom <code>ContextIdStrategy</code>, registered with <code>ContextIdFactory.apply()</code>, maps each request to a context ID based on, say, a tenant header or claim. Providers marked <code>durable: true</code> are created <b>once per tenant</b> and reused across all of that tenant's requests, rather than once per request. Non-durable request-scoped providers still get the per-request payload.</p>
<p><b>Cautions:</b></p>
<ul>
<li>Tenant resolution must come from trusted data (validated token claims).</li>
<li>Durable instances live indefinitely, so with many tenants you need to bound connection pools per tenant (or use a shared pool with schema switching or RLS).</li>
<li>Per-user data must not be stored in tenant-durable providers.</li>
</ul>
<p>Alternatives: a connection manager singleton with a tenant-keyed pool map (LRU), with tenant context from AsyncLocalStorage. That's often simpler.</p>`,
keys:["Request scope cost explained","ContextIdStrategy and durable: true","Instance per tenant, not per request","Bound pools; trusted tenant source","Singleton connection manager + ALS alternative"],
fu:[{q:"With 2,000 tenants, each with its own database, what breaks first?",a:"Connections: 2,000 pools × N connections per instance × number of instances exceeds database and proxy limits. You need pooled connections per tenant with small limits, idle eviction, a proxy, or a move to shared databases with tenant isolation by schema or row-level security."}],
rf:["Request-scoped everything for tenancy","Tenant from an unvalidated header","Unbounded per-tenant pools"]},

{id:"J035",skill:"NestJS",level:"Advanced",type:"Scenario",
q:"Load tests show the NestJS API hitting a throughput ceiling. A teammate proposes switching from the Express adapter to Fastify. How do you evaluate that?",
a:`<p>First find where the time goes. In most real APIs, the framework adapter is a small share of latency compared to DB queries, external calls, serialisation and validation. Profile a request (<code>--cpu-prof</code>, Clinic Flame) under load. If the CPU profile shows framework routing and middleware as significant, the switch can help. If it's dominated by the database, class-transformer and class-validator work, or JSON serialisation of large objects, fix those first.</p>
<p><b>Fastify benefits:</b> faster routing and lower overhead, and schema-based serialisation (fast-json-stringify) when you provide response schemas. Gains are measurable in micro-benchmarks and for small, high-RPS endpoints.</p>
<p><b>Costs:</b></p>
<ul>
<li>Express middleware and libraries may not work unchanged; some need Fastify plugin equivalents.</li>
<li>Request and response objects differ (code touching <code>req</code>/<code>res</code> directly breaks).</li>
<li>File uploads, sessions and some auth libraries need Fastify-specific packages.</li>
<li>Recent Nest versions moved to Express 5, which also changed some behaviour.</li>
</ul>
<p><b>Decision:</b> prototype the switch on one service, rerun the same load test, and compare p99 and throughput per CPU. Adopt it if the gain is real and the migration is contained. Otherwise optimise the actual hot spots.</p>`,
keys:["Profile before switching","Framework overhead usually not dominant","Fastify benefits incl. schema serialisation","Compatibility costs of the switch","Prototype + same load test as decision basis"],
trade:["Fastify: higher ceiling and lower overhead, migration and ecosystem friction","Staying on Express: familiar and compatible, possibly leaving performance on the table for very high RPS"],
fu:[{q:"What else commonly limits NestJS throughput?",a:"class-validator and class-transformer on large payloads (relatively CPU-heavy), returning whole entities and serialising unneeded fields, interceptors doing heavy work per request, synchronous logging, and too-small DB pools causing queueing."}],
rf:["Switches frameworks without profiling","Assumes Fastify fixes database latency","No load-test comparison"]},

{id:"J036",skill:"TypeScript",level:"Advanced",type:"Concept",
q:"Because TypeScript is structural, a UserId and a GroupId (both strings) are interchangeable, and mixed-up IDs have caused bugs. How do you get nominal-style safety? Where do satisfies and template literal types help?",
a:`<p><b>Branded types</b> add a phantom property so structurally identical primitives become incompatible:</p>
<pre><code>declare const brand: unique symbol;
type Brand&lt;T, B&gt; = T &amp; { readonly [brand]: B };
type UserId  = Brand&lt;string, 'UserId'&gt;;
type GroupId = Brand&lt;string, 'GroupId'&gt;;

function addMember(groupId: GroupId, userId: UserId) {}
addMember(userId, groupId);   // compile error: arguments swapped</code></pre>
<p>Create branded values only at boundaries, in validation (a zod <code>.brand()</code> schema) or when reading from the DB, so the brand means "validated". At runtime it's still a plain string, with zero cost.</p>
<p><b><code>satisfies</code></b> (TS 4.9) checks that a value conforms to a type <i>without widening</i> its inferred type. That's useful for config objects and lookup tables, where you want validation and still keep literal keys and values.</p>
<p><b>Template literal types</b> describe string patterns (<code>\`group:\${string}\`</code>, event names like <code>\`\${Entity}.\${Action}\`</code>), giving checked cache keys, event names and route strings.</p>`,
keys:["Structural typing problem for IDs","Branded types via unique symbol intersection","Brand at validation boundaries","satisfies validates without widening","Template literal types for string formats"],
fu:[{q:"Do branded IDs cause friction with ORMs and JSON?",a:"Some. Values from the DB or JSON arrive as plain strings, so you need a mapping step (Drizzle's $type<UserId>() on a column helps) and validation on input. The friction is usually worth it for IDs that are frequently confused."}],
rf:["Uses classes wrapping strings everywhere (runtime cost) without considering brands","Casts to brands anywhere, defeating the purpose","Unaware of satisfies"]},

{id:"J037",skill:"TypeScript",level:"Advanced",type:"Architecture",
q:"How do you share API types between the NestJS backend, a React web app and a React Native app, given that old mobile app versions stay in use for months?",
a:`<p><b>Options:</b></p>
<ul>
<li><b>Shared package in a monorepo</b> (DTO types or zod schemas imported by all apps). There's one source of truth and refactors are instant. The catch: it encourages changes that compile everywhere at once, but <b>old mobile builds don't get recompiled</b>, so a "safe" refactor can break production clients.</li>
<li><b>OpenAPI-generated clients:</b> the backend publishes a spec (Nest's Swagger module, generated from DTOs), and clients generate types (openapi-typescript) at build time. Contract changes are explicit and diffable.</li>
<li><b>Contract-first libraries</b> (ts-rest, or zod-based contracts; tRPC for TypeScript-only stacks): an end-to-end typed contract with runtime validation on both sides.</li>
</ul>
<p><b>What I'd do:</b> define contracts once (zod schemas or OpenAPI), generate or import types for web and mobile, and add a <b>CI contract diff</b> that fails on breaking changes to the published API. Apply backward-compatibility rules for mobile: additive changes only, never remove or retype fields that supported app versions use, and use explicit versioning plus a minimum-supported-version check for breaking changes.</p>`,
keys:["Shared package vs codegen vs contract libraries","Old mobile builds aren't recompiled","Single source of truth with runtime validation","CI breaking-change detection","Mobile backward-compat rules and min version"],
trade:["Monorepo shared types: fastest DX, false sense of safety for released clients","OpenAPI codegen: explicit contracts, generation step and some type fidelity loss","tRPC: excellent DX for TS-only, couples clients to server implementation and weaker for public APIs"],
fu:[{q:"How do you know which fields old app versions still use?",a:"Log the app version per request (a header) and measure traffic by version. Combine that with the contract history to know which fields each supported version relies on. Remove a field only when traffic from versions using it is effectively zero."}],
rf:["Imports backend entity types into the mobile app","Assumes all clients update together","No breaking-change detection"]},

{id:"J038",skill:"Drizzle ORM",level:"Advanced",type:"Scenario",
q:"A feed endpoint uses Drizzle's relational query API to load posts with author, reactions and the latest comments. It's fast with test data but takes 2 seconds in production. How do you investigate and fix it?",
a:`<ol>
<li><b>Get the SQL:</b> enable Drizzle's logger, or call <code>.toSQL()</code> on the query. For PostgreSQL, the relational API builds a <b>single query</b> using lateral subqueries and JSON aggregation for nested <code>with</code> relations. That avoids N+1, but a nested relation like "all reactions" can aggregate thousands of rows per post into JSON before limiting.</li>
<li><b>Run <code>EXPLAIN (ANALYZE, BUFFERS)</code></b> on that SQL with production-like data: look for sequential scans on <code>reactions</code> or <code>comments</code>, and for large aggregations.</li>
<li><b>Fixes:</b>
  <ul>
  <li><b>Load what the screen needs:</b> reaction <i>counts</i> (from a denormalised counter column or a grouped count), not every reaction row. Limit nested relations (<code>limit</code> and <code>orderBy</code> inside <code>with</code>).</li>
  <li><b>Indexes</b> matching the access patterns: <code>(post_id, created_at DESC)</code> on comments, <code>(group_id, created_at DESC, id)</code> on posts for keyset pagination.</li>
  <li>For the hottest path, write it with the <b>SQL-like builder</b> or raw <code>sql</code>, controlling joins precisely, or split it into a few targeted queries batched with <code>inArray</code>.</li>
  <li>Cache author profiles and counts.</li>
  </ul></li>
</ol>`,
keys:["Inspect generated SQL","Relational API single-query with JSON aggregation behaviour","EXPLAIN ANALYZE on prod-like data","Fetch counts not rows; limit nested relations","Targeted indexes; drop to builder/raw SQL for hot paths"],
trade:["One big query avoids round trips but can do huge aggregation work","Several targeted queries add round trips but each is cheap and index-friendly"],
fu:[{q:"How do you prevent this type of regression?",a:"Seed test or staging data at realistic volumes for hot tables, run EXPLAIN checks or query-time budgets on key endpoints in CI, and monitor slow queries (pg_stat_statements) per endpoint in production."}],
rf:["Adds more instances","Assumes ORM queries are always optimal","No EXPLAIN"],
verify:"How Drizzle's relational queries are translated (lateral joins + JSON aggregation) varies by version and dialect; check your version's output."},

{id:"J039",skill:"Drizzle ORM",level:"Advanced",type:"Scenario",
q:"After autoscaling to 20 tasks (plus some Lambda functions), PostgreSQL starts rejecting connections with 'too many clients'. How do you design connection management for Node services?",
a:`<p>Each Node process has its own <code>pg</code> pool (say max 20). Twenty tasks gives 400 connections, and every Lambda execution environment opens its own connections. That easily exceeds <code>max_connections</code>. Each PostgreSQL connection is a backend process with real memory cost, so simply raising the limit doesn't scale.</p>
<p><b>Design:</b></p>
<ul>
<li><b>Size pools from the database's budget:</b> total = tasks × pool max, kept well under the limit, with headroom for migrations and admin. Node is single-threaded, so a small pool (5–10) per process is usually enough. Many concurrent queries per process just queue anyway.</li>
<li><b>Add a pooler:</b> <b>RDS Proxy</b> (managed, IAM auth, works well with Lambda) or <b>PgBouncer</b> in transaction mode, multiplexing many client connections onto few server connections.</li>
<li><b>Know the transaction-mode caveats:</b> session state (<code>SET</code>, advisory locks, <code>LISTEN</code>) doesn't persist across transactions. Prepared statements needed special support (PgBouncer added it in 1.21 via <code>max_prepared_statements</code>). With <code>SET LOCAL</code> for RLS tenant context it works, because it's transaction-scoped.</li>
<li><b>Lambda:</b> create the client outside the handler for reuse, keep the pool max at 1–2, and always go through RDS Proxy.</li>
<li>Monitor connection counts, pool wait time and proxy metrics, and alert before the limit.</li>
</ul>`,
keys:["Pools multiply with instances and Lambda","Small pools for single-threaded Node","RDS Proxy / PgBouncer transaction mode","Session-state and prepared-statement caveats","Lambda client reuse; monitoring"],
trade:["A proxy adds a hop and cost but makes autoscaling safe","Transaction pooling maximises sharing but breaks session-level features"],
fu:[{q:"Why not just raise max_connections to 2,000?",a:"Each connection consumes memory (work_mem per operation, backend process overhead), and PostgreSQL's performance degrades with very many active connections because of contention. A pooler with fewer server connections gives better throughput."}],
rf:["Raises max_connections","Pool max 100 per Node process","Lambda creating a new pool per invocation"]},

{id:"J040",skill:"WebSockets & Real-time",level:"Advanced",type:"Architecture",
q:"Design presence (online / last seen) for a social app with group chat: users have several devices, and presence must update in near real time without flooding everyone.",
a:`<p><b>Storage:</b> Redis, keyed per user with a set of active connections or devices, each with a heartbeat-refreshed TTL (for example <code>presence:{userId}</code> as a hash or sorted set of <code>connectionId → lastHeartbeat</code>). A user is online if any device has a fresh heartbeat. TTLs handle crashed instances, whose sockets never send a clean disconnect.</p>
<p><b>Updates:</b></p>
<ul>
<li>On connect, disconnect or heartbeat expiry, compute the user's <b>aggregate</b> state and emit an event only when it <b>changes</b> (online ↔ offline). Debounce brief disconnects (for example, 30 seconds before announcing offline) so network blips don't flap.</li>
<li><b>Fan-out only to interested users:</b> members of groups currently open on their screen, or contacts, not everyone. Clients subscribe to presence for the users they can currently see; the server tracks those subscriptions.</li>
<li>"Last seen" is written to the database on offline transitions, not on every heartbeat.</li>
</ul>
<p><b>Privacy:</b> respect settings (hide online status), and never reveal presence to blocked users or non-members.</p>
<p><b>Scale:</b> presence events go through the adapter or pub/sub. For very large groups, show approximate counts ("120 online") rather than individual updates.</p>`,
keys:["Per-device heartbeats with TTL in Redis","Aggregate state, emit on change, debounce","Subscription-based fan-out","Last seen persisted on transitions","Privacy rules; large group approximation"],
trade:["Shorter heartbeats give fresher presence but cost battery and server load","Precise per-user presence in big groups is expensive; counts are cheaper"],
fu:[{q:"A server instance crashes. What happens to presence for its 10,000 users?",a:"Their heartbeats stop, so TTLs expire within the heartbeat window and they show offline, unless they reconnect to another instance first, in which case they stay online. Without TTLs, they'd appear online forever."}],
rf:["Broadcasts presence to all users","No TTL, relies on disconnect events","Updates DB on every heartbeat"]},

{id:"J041",skill:"WebSockets & Real-time",level:"Advanced",type:"Scenario",
q:"After a deploy, 60,000 connected clients reconnect within seconds. The auth service and database spike, the new instances become unhealthy, and the deploy rolls back. How do you fix this?",
a:`<p>This is a <b>reconnect storm</b>. Every client's reconnection does an auth check, a membership load, presence updates and a catch-up query at the same moment.</p>
<p><b>Client side:</b></p>
<ul>
<li>Reconnect with <b>exponential backoff and full jitter</b>, starting from a random initial delay.</li>
<li>If the server sends a "please reconnect" message during drain, include a suggested delay window so clients spread out.</li>
</ul>
<p><b>Server side:</b></p>
<ul>
<li><b>Drain gradually:</b> during shutdown, close existing sockets in batches over the drain window, not all at once.</li>
<li><b>Roll out slowly:</b> a smaller batch of tasks at a time (ECS minimum healthy percent and maximum percent tuned), so only a fraction of connections move at once.</li>
<li><b>Admission control:</b> limit new connections per second per instance, and reject excess with a retry hint rather than accepting and falling over.</li>
<li><b>Make reconnection cheap:</b> cache token validation (verify JWTs locally instead of calling an auth service), cache membership lists in Redis, and make catch-up incremental (since the last sequence).</li>
<li><b>Health checks</b> shouldn't fail just because the instance is busy accepting connections. Use separate liveness from readiness.</li>
</ul>`,
keys:["Names reconnect storm","Jittered backoff on clients","Batched drain and slower rollout","Admission control on new connections","Cheap reconnect path (local JWT verify, caches, incremental catch-up)"],
trade:["Slower rollouts reduce risk but lengthen deploys","Admission control protects instances but delays some users' reconnection"],
fu:[{q:"How do you test this before production?",a:"Simulate tens of thousands of connections in staging with a load tool (k6 with WebSocket support, or Artillery), trigger a rolling deploy mid-test, and measure reconnection time, error rate and backend load."}],
rf:["Adds more instances only","Clients reconnect immediately on disconnect","Calls an auth service per reconnect with no caching"]},

{id:"J042",skill:"WebSockets & Real-time",level:"Advanced",type:"Architecture",
q:"Should the real-time socket layer run inside the same NestJS API service, or as a separate gateway tier? Design the real-time architecture for a growing social app.",
a:`<p>Early on, a gateway inside the API service is simplest. As usage grows, the two have <b>different scaling and deployment profiles</b>:</p>
<ul>
<li>The API is request/response, stateless and deployed often.</li>
<li>Sockets are long-lived, memory-heavy per connection, and every deploy disconnects users.</li>
</ul>
<p><b>Separate real-time gateway tier:</b></p>
<ul>
<li><b>Gateway service:</b> holds connections, handles auth at handshake, manages rooms and subscriptions, and forwards client actions to the API (or publishes commands). It has no business logic, so it changes and deploys rarely, which minimises disconnects.</li>
<li><b>Business services</b> persist data, then publish events (message created, reaction added) to a bus (Redis Streams, Kafka, SNS/SQS).</li>
<li><b>Gateway instances subscribe</b> to the bus and push to the relevant connected sockets, using a routing map of user or room to gateway instances (via an adapter, or a Redis registry).</li>
</ul>
<p><b>Benefits:</b> independent scaling (connections vs requests), fewer reconnect storms because the gateway is rarely deployed, and a clear separation of concerns. <b>Costs:</b> another service, an event pipeline, and end-to-end latency to monitor.</p>
<p>The split is worth it when connection counts or deploy frequency start to hurt. Managed options (API Gateway WebSocket APIs, AppSync Events) can also replace the gateway tier.</p>`,
keys:["Different scaling/deploy profiles","Thin gateway with no business logic","Persist then publish events; gateway subscribes and routes","Routing map of user/room to instance","When to split; managed alternatives"],
trade:["Split tier: stable connections and independent scaling, more moving parts","In-process gateway: simplest, but every API deploy disconnects users and scaling is coupled"],
fu:[{q:"How does a gateway know which instance holds a given user's sockets?",a:"Either broadcast via the adapter to all instances and let each deliver locally (simple, more traffic), or keep a registry in Redis mapping userId to gateway instance and publish to that instance's channel (targeted, but must handle stale entries with TTLs)."}],
rf:["Business logic in socket handlers","Socket servers deployed with every API change","No event pipeline"]},

{id:"J043",skill:"WebSockets & Real-time",level:"Advanced",type:"Scenario",
q:"Users report 'my message never arrived' but logs show nothing wrong. Real-time flows are hard to debug. What observability do you build for the WebSocket layer?",
a:`<p><b>Trace a message end to end:</b> every message gets an ID at creation (client message ID plus server ID). Log it with structured fields at each hop: received from sender, persisted, event published, gateway received, emitted to socket X, client ack received. Searching by message ID then shows exactly where it stopped. Propagate trace context through the event bus as well (OpenTelemetry), so the persist and publish spans connect.</p>
<p><b>Metrics:</b></p>
<ul>
<li>Active connections per instance, connects and disconnects per second, disconnect reasons.</li>
<li>Messages in and out per second, and per-socket buffered bytes.</li>
<li><b>Delivery latency</b> (persisted → client ack) as a histogram, and the ack-timeout rate.</li>
<li>Catch-up requests after reconnect and their size, which shows how often live delivery fails.</li>
<li>Adapter or pub/sub lag, and event bus consumer lag.</li>
</ul>
<p><b>Client telemetry:</b> the app reports connection state changes, reconnect attempts and acks, sampled. Many "lost" messages are really clients that were silently disconnected.</p>
<p><b>SLO:</b> for example, "99% of messages delivered to online recipients within 1 second", with an alert on burn rate.</p>`,
keys:["Message ID logged at each hop","Trace context across the bus","Delivery latency and ack-timeout metrics","Disconnect reasons and buffer metrics","Client-side telemetry; delivery SLO"],
fu:[{q:"How do you avoid logging volume exploding with per-message logs?",a:"Log hop events at debug level with sampling, and always log failures and slow deliveries. Keep metrics for aggregates. For a specific investigation, temporarily raise logging for one conversation or user via a feature flag."}],
rf:["Only server error logs","No delivery latency metric","No client-side signal"]},

{id:"J044",skill:"Node.js Runtime",level:"Lead",type:"Architecture",
q:"Your organisation runs both .NET and NestJS services. A new service is being planned. How do you decide which stack to use, and should the organisation standardise on one?",
a:`<p><b>Per-service decision factors:</b></p>
<ul>
<li><b>Team:</b> who builds and operates it, and their depth in each stack. On-call skills matter as much as development speed.</li>
<li><b>Workload:</b> I/O-bound APIs and real-time gateways work well on Node. CPU-heavy processing, complex domain logic with strong typing needs, or high-throughput computation lean toward .NET (better multi-core use in one process, mature performance tooling).</li>
<li><b>Ecosystem fit:</b> the libraries needed, for example SDKs, AI tooling, or sharing TypeScript types with React/React Native clients.</li>
<li><b>Existing platform:</b> templates, CI, observability and security baselines already built for each stack.</li>
</ul>
<p><b>Organisation level:</b> two stacks double the platform work: templates, CI pipelines, dependency governance, observability libraries, security patching, hiring, and on-call knowledge. I'd keep both only if each has a clear domain ("Node for real-time and BFF services, .NET for core domain services"), written down so each new service doesn't relitigate it. With a small engineering organisation, I'd lean toward one primary stack with explicit exceptions.</p>`,
keys:["Team and operability first","Workload characteristics per stack","Ecosystem/type sharing considerations","Cost of two stacks at org level","Written decision rule"],
trade:["One stack: simpler platform, hiring and mobility; may be a poorer fit for some workloads","Two stacks: best fit per workload, double platform and knowledge cost","It depends on: org size, existing expertise, workload mix"],
fu:[{q:"A team wants to write a new CPU-heavy image service in Node because they know it best. What do you say?",a:"Look at the actual workload: if it's mostly calling a native library (sharp/libvips) or a managed service, Node is fine. If it's heavy custom computation, test the throughput per vCPU and the cost. Team familiarity counts for a lot, but should be weighed against measured cost."}],
rf:["Picks by personal preference","Allows any stack per team without platform cost consideration","Claims one runtime is always faster"]},

{id:"J045",skill:"NestJS",level:"Lead",type:"Scenario",
q:"You inherit a NestJS codebase: fat controllers with DB queries inline, no tests, inconsistent errors, and features shipping with frequent regressions. The business wants features to continue. What's your plan?",
a:`<ol>
<li><b>Assess quickly (1–2 weeks):</b> which modules change most and break most (git history plus incident list), and the critical user journeys. That's where improvements pay off first.</li>
<li><b>Safety net first:</b> e2e tests through the real app (supertest plus Testcontainers PostgreSQL) for the critical journeys. They protect behaviour while you refactor, without needing a good internal structure first.</li>
<li><b>Cheap global fixes</b> with wide effect:
  <ul>
  <li>A global <code>ValidationPipe</code> and exception filter (consistent errors).</li>
  <li>Strict lint rules (no-floating-promises) and CI that runs tests on every PR.</li>
  <li>Structured logging with request IDs.</li>
  </ul></li>
<li><b>Refactor as you go (boy-scout rule):</b> every feature touching a module moves its DB access into a repository and business logic into a service, with tests. Don't run a separate rewrite project.</li>
<li><b>Agree conventions</b> in a short document with examples (module structure, DTOs, errors, tests) and enforce them in review.</li>
<li><b>Show progress</b> with regression rate, escaped bugs and lead time, to keep business support.</li>
</ol>`,
keys:["Prioritise by change frequency and incidents","E2E tests before refactoring","High-leverage global fixes","Incremental refactor with feature work","Conventions + measurable progress"],
trade:["Pausing features for a cleanup sprint gives faster structural change but loses business trust","Incremental improvement is slower but sustainable and visible"],
fu:[{q:"A senior dev wants to rewrite the whole thing in a new architecture over 3 months. How do you respond?",a:"Ask what problem the rewrite solves that incremental change can't, and point to the delivery risk of a long freeze. Offer a middle path: they define the target structure and apply it to the highest-churn module first as a pilot. If it proves faster to work in, it spreads naturally."}],
rf:["Freezes features for a rewrite","Starts with unit tests of messy internals","No metrics to show improvement"]},

{id:"J046",skill:"NestJS",level:"Lead",type:"Architecture",
q:"The team has NestJS services, a React web app, a React Native app and shared libraries in separate repos. Someone proposes a monorepo (Nx or Turborepo). How do you evaluate it?",
a:`<p><b>Benefits:</b></p>
<ul>
<li>Atomic changes across backend, shared types and clients in one PR.</li>
<li>Shared tooling (lint, tsconfig, test setup) in one place, and one dependency version policy.</li>
<li>Easier code sharing (DTOs, validation schemas, utilities).</li>
<li><b>Affected-only builds and tests</b> with caching (Nx or Turborepo remote cache) keep CI fast.</li>
</ul>
<p><b>Costs and risks:</b></p>
<ul>
<li>Tooling complexity: build graph, caching configuration, and React Native's Metro bundler quirks in monorepos.</li>
<li>CI must be set up well, or every change rebuilds everything.</li>
<li>Repository permissions are coarser.</li>
<li>The temptation to change shared code assuming all consumers update at once, which isn't true for released mobile apps or independently deployed services.</li>
</ul>
<p><b>How I'd decide:</b> how often do changes span repos today? How much code is duplicated or version-skewed? Do the teams have capacity to own the build tooling? If cross-repo changes are frequent and painful, pilot the monorepo with the backend and web app first, measure PR cycle time and CI duration, then bring mobile in.</p>`,
keys:["Atomic cross-cutting changes and shared tooling","Affected builds with caching","Tooling complexity incl. React Native","Shared code ≠ simultaneous deployment","Evidence-based decision and phased pilot"],
trade:["Monorepo: easier refactors and consistency, more build-tool investment","Polyrepo: simpler per-repo tooling, versioning friction and duplication","It depends on: frequency of cross-cutting changes, team size, tooling capacity"],
fu:[{q:"How do you keep independently deployed services safe in a monorepo when shared code changes?",a:"Treat shared contracts as versioned, enforce backward compatibility with contract tests, and deploy services independently even though the code lives together. The monorepo shares source, not release trains."}],
rf:["Monorepo as a cure-all","Ignores mobile release realities","No CI caching strategy"]},

{id:"J047",skill:"TypeScript",level:"Lead",type:"Scenario",
q:"A strong senior engineer writes very advanced generic types: conditional and recursive types, deep inference. Others can't modify that code, compile times have grown, and type errors are pages long. How do you handle it?",
a:`<ul>
<li><b>Acknowledge the value:</b> the types probably prevent real bugs. The aim is to keep the safety while making it maintainable, not to ban sophistication.</li>
<li><b>Make the cost visible with data:</b> measure compile time (<code>tsc --extendedDiagnostics</code>, <code>--generateTrace</code> to find expensive types), and gather concrete examples of teammates blocked or adding <code>as any</code> to get past errors.</li>
<li><b>Agree a team guideline together:</b>
  <ul>
  <li>Advanced types live in a small, documented library with type-level tests (<code>expect-type</code>).</li>
  <li>Application code consumes simple, named types.</li>
  <li>Prefer runtime-schema-derived types (zod) over hand-rolled type-level programming.</li>
  <li>A complexity limit, judged in review by "could another engineer change this confidently?"</li>
  </ul></li>
<li><b>Pair them</b> with others to simplify the worst offenders. That spreads knowledge and turns the engineer into a teacher rather than a bottleneck.</li>
<li>Recognise the behaviour change publicly when it happens.</li>
</ul>
<p>If it continues after agreement, it's a direct performance conversation about team impact, not about TypeScript.</p>`,
keys:["Respects the value, targets maintainability","Measures compile cost and team impact","Co-created guideline: isolated library + type tests","Pairing to spread knowledge","Escalation path if behaviour persists"],
trade:["Very precise types catch more bugs but raise the bar to contribute","Simpler types are easier to maintain but may let some errors through; tests cover the gap"],
fu:[{q:"How do you find which types slow compilation?",a:"Run tsc with --generateTrace and inspect it (with @typescript/analyze-trace or the Perfetto viewer), which shows the most expensive type checks and their locations. --extendedDiagnostics gives overall check time and instantiation counts."}],
rf:["Bans generics","Does nothing because the engineer is senior","Makes it personal"]},

{id:"J048",skill:"Drizzle ORM",level:"Lead",type:"Architecture",
q:"Your Node services use Drizzle, Prisma and raw pg in different places. Should you standardise? What would you choose, and how do you handle migration ownership?",
a:`<p><b>Why standardise:</b> one approach to schema definition, migrations, transactions, connection management and query logging makes services easier to move between, review and operate. Three ORMs also mean three migration workflows, which is where production incidents come from.</p>
<p><b>Choice criteria:</b> SQL transparency, type-safety from the schema, migration reliability, performance on the hot paths, serverless and cold-start behaviour, team familiarity, and the project's maintenance health.</p>
<ul>
<li><b>Drizzle:</b> SQL-transparent, lightweight, inferred types, good PostgreSQL feature access. Younger, and its APIs have changed between versions.</li>
<li><b>Prisma:</b> high-level and mature tooling, a strong migration workflow. More abstraction, and historically heavier runtime.</li>
<li><b>Kysely or raw SQL:</b> maximum control and type-safe builders; you assemble migrations and tooling yourself.</li>
</ul>
<p>For a PostgreSQL-heavy, performance-sensitive Nest codebase, I'd lean toward Drizzle as the default, with raw <code>sql</code> allowed for hot queries.</p>
<p><b>Migration:</b> don't rewrite working services. New services use the standard, and existing ones convert when they're substantially changed.</p>
<p><b>Migration ownership:</b> each service owns its schema and migrations, generated, reviewed in PRs and applied by the pipeline. No shared database between services. The platform provides a common migration step and CI checks.</p>`,
keys:["Why standardise (operability, migration risk)","Explicit criteria","Honest comparison of options","Opportunistic migration, not rewrite","Service-owned schemas; pipeline-applied migrations"],
trade:["A single standard reduces variety but may be a poorer fit for some services; allow documented exceptions","Rewriting to the standard costs effort with no user value; convert opportunistically"],
fu:[{q:"How do you protect against breaking API changes in a young library like Drizzle?",a:"Pin versions, upgrade deliberately with release notes and a test suite covering data access, and keep data access in repositories so changes are contained. Track the project's release cadence and changelog as part of dependency governance."}],
rf:["Mandates immediate rewrites","Picks by popularity","Shared database across services"]},

{id:"J049",skill:"WebSockets & Real-time",level:"Lead",type:"Architecture",
q:"Build or buy for real-time: keep running your own Socket.IO cluster, or move to a managed service such as API Gateway WebSocket APIs, AppSync Events, or a vendor like Ably or Pusher? How do you decide?",
a:`<p><b>Self-hosted Socket.IO</b> gives full control and features (rooms, acks, recovery), with no per-message vendor cost. You own scaling, adapters, deploy disconnects, reconnect storms, load balancer tuning and on-call.</p>
<p><b>AWS API Gateway WebSocket APIs:</b> managed connections, with your backend invoked per message (often Lambda) and pushes sent via the management API using connection IDs. You build rooms, presence and fan-out yourself (connection registry in DynamoDB). Watch its limits: maximum connection duration, idle timeouts, message size, and per-message cost at high volume.</p>
<p><b>AppSync Events:</b> managed pub/sub over WebSockets with channels. Less to build for broadcast-style fan-out.</p>
<p><b>Vendors (Ably, Pusher, and others):</b> global edge, presence, history and delivery guarantees out of the box, but the highest per-message or per-connection cost and a data-processing relationship for user content.</p>
<p><b>Decide on:</b></p>
<ul>

a:`<p><b>Likely chain of causes:</b></p>

/* ---------- state ---------- */
const KEY="node-bank-reviewed-v1";
let reviewed={};
try{reviewed=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){reviewed={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(reviewed))}catch(e){}}

const state={text:"",skill:"all",status:"all",levels:new Set(),types:new Set()};
const $=s=>document.querySelector(s);

/* ---------- controls ---------- */
const skills=[...new Set(QS.map(x=>x.skill))];
$("#skill").innerHTML=`<option value="all">All skills</option>`+skills.map(s=>`<option value="${s}">${s}</option>`).join("");
function chipRow(el,items,set){
  el.innerHTML=items.map(i=>`<button type="button" class="chip" aria-pressed="false" data-v="${i}">${i}</button>`).join("");
  el.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;const v=b.dataset.v;
    if(set.has(v)){set.delete(v);b.setAttribute("aria-pressed","false")}else{set.add(v);b.setAttribute("aria-pressed","true")}render()});
}
chipRow($("#levels"),LEVELS,state.levels);
chipRow($("#types"),TYPES,state.types);
$("#q").addEventListener("input",e=>{state.text=e.target.value.trim().toLowerCase();render()});
$("#skill").addEventListener("change",e=>{state.skill=e.target.value;render()});
$("#status").addEventListener("change",e=>{state.status=e.target.value;render()});
let allOpen=false;
$("#toggleAll").addEventListener("click",()=>{allOpen=!allOpen;
  document.querySelectorAll("details.ans").forEach(d=>d.open=allOpen);
  $("#toggleAll").textContent=allOpen?"Close all answers":"Open all answers"});

/* ---------- stats ---------- */
function count(key,vals){return vals.map(v=>`${v} <b>${QS.filter(x=>x[key]===v).length}</b>`).join(" · ")}
$("#stats").innerHTML=`<span><b>${QS.length}</b> questions loaded</span><span>${count("level",LEVELS)}</span><span>${count("type",TYPES.filter(t=>t!=="Behavioral"))}</span><span>${PARTS}</span>`;

/* ---------- render ---------- */
const strip=h=>h.replace(/<[^>]+>/g," ");
function matches(x){
  if(state.skill!=="all"&&x.skill!==state.skill)return false;
  if(state.levels.size&&!state.levels.has(x.level))return false;
  if(state.types.size&&!state.types.has(x.type))return false;
  if(state.status==="done"&&!reviewed[x.id])return false;
  if(state.status==="todo"&&reviewed[x.id])return false;
  if(state.text){const hay=(x.id+" "+x.q+" "+x.skill+" "+strip(x.a)+" "+(x.keys||[]).join(" ")+" "+(x.fu||[]).map(f=>f.q+" "+f.a).join(" ")).toLowerCase();
    if(!hay.includes(state.text))return false}
  return true;
}
const ul=arr=>`<ul>${arr.map(i=>`<li>${i}</li>`).join("")}</ul>`;
function item(x,i){
  const done=!!reviewed[x.id];
  return `<li class="q${done?" done":""}" id="${x.id}">
    <div class="qhead"><span class="num">${x.id}</span><div>
      <p class="qtext">${x.q}</p>
      <div class="tags"><span class="tag">${x.skill}</span><span class="tag lv lv-${x.level}">${x.level}</span><span class="tag">${x.type}</span>${x.verify?`<span class="tag verify">VERIFY</span>`:""}
        <label class="check"><input type="checkbox" data-id="${x.id}" ${done?"checked":""}> Reviewed</label></div>
    </div></div>
    <div class="body">
      <details class="ans"><summary>Model answer, key points and red flags</summary><div class="dbody">
        ${x.a}
        ${x.tools?`<h4>Tools and metrics to check</h4>${ul(x.tools)}`:""}
        <h4>What the interviewer listens for</h4>${ul(x.keys)}
        ${x.trade?`<h4>Trade-offs and "it depends on"</h4>${ul(x.trade)}`:""}
        <h4 class="rf">Red flags</h4>${ul(x.rf)}
        ${x.verify?`<p class="note">[VERIFY] ${x.verify}</p>`:""}
      </div></details>
      ${(x.fu||[]).map(f=>`<details class="fu ans"><summary><span class="fl">FOLLOW-UP</span><span>${f.q}</span></summary><div class="dbody"><p>${f.a}</p></div></details>`).join("")}
    </div></li>`;
}
function render(){
  const list=QS.filter(matches);
  $("#list").innerHTML=list.length?list.map(item).join(""):`<li class="empty">No questions match these filters.</li>`;
  if(allOpen)document.querySelectorAll("details.ans").forEach(d=>d.open=true);
  const n=QS.filter(x=>reviewed[x.id]).length;
  $("#ptext").textContent=`${n} / ${QS.length} reviewed · ${list.length} shown`;
  $("#pfill").style.width=(QS.length?n/QS.length*100:0)+"%";
}
$("#list").addEventListener("change",e=>{const c=e.target.closest("input[data-id]");if(!c)return;
  const id=c.dataset.id;if(c.checked)reviewed[id]=1;else delete reviewed[id];save();
  c.closest("li.q").classList.toggle("done",c.checked);
  const n=QS.filter(x=>reviewed[x.id]).length;const shown=document.querySelectorAll("li.q").length;
  $("#ptext").textContent=`${n} / ${QS.length} reviewed · ${shown} shown`;$("#pfill").style.width=(n/QS.length*100)+"%";});
try{const m=location.hash.match(/^#q=([^&]+)/);if(m){const v=decodeURIComponent(m[1]);$("#q").value=v;state.text=v.trim().toLowerCase();}}catch(e){}
render();
</script>
