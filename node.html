/* ================= BASIC ================= */
{id:"J001",skill:"Node.js Runtime",level:"Basic",type:"Concept",
q:"Explain the Node.js event loop. Where do promises, process.nextTick, timers and I/O callbacks run, and what does the libuv thread pool do?",
a:`<p>Node runs JavaScript on <b>one main thread</b>. The event loop, implemented by libuv, cycles through phases:</p>
<ul>
<li><b>timers:</b> <code>setTimeout</code> and <code>setInterval</code> callbacks that are due.</li>
<li><b>pending callbacks</b> for some system operations.</li>
<li><b>poll:</b> waits for and runs I/O callbacks (sockets, files).</li>
<li><b>check:</b> <code>setImmediate</code> callbacks.</li>
<li><b>close</b> callbacks.</li>
</ul>
<p>Between each callback, Node drains the <b>microtask queues</b>: first <code>process.nextTick</code>, then promise reactions (<code>.then</code>, continuations after <code>await</code>). A long chain of microtasks can therefore starve I/O.</p>
<p>Network I/O uses the OS's non-blocking mechanisms (epoll, kqueue), so it needs no extra threads. Some work can't be done that way: file system operations, DNS lookups via <code>dns.lookup</code>, crypto such as <code>pbkdf2</code> and <code>scrypt</code>, and zlib. That work runs on the <b>libuv thread pool</b>, 4 threads by default (<code>UV_THREADPOOL_SIZE</code>).</p>
<p>The key consequence: any synchronous CPU work in your JavaScript <b>blocks every request</b> on that process.</p>`,
keys:["Single JS thread, event loop phases","Microtasks drained between callbacks; nextTick before promises","Network I/O non-blocking, no thread per request","libuv pool (4 by default) for fs/dns/crypto/zlib","Sync CPU work blocks everyone"],
fu:[{q:"Twenty concurrent requests each hash a password with bcrypt (async) and responses slow down a lot. Why?",a:"Async bcrypt and crypto work run on the libuv pool, which has only 4 threads by default, so requests queue for a pool thread. Options: raise UV_THREADPOOL_SIZE (it's a per-process setting), tune the hash cost, or move hashing to dedicated workers if load is high."}],
rf:["\"Node is single-threaded so it can't do concurrent I/O\"","Unaware of the libuv pool","Thinks await creates a thread"]},

{id:"J002",skill:"Node.js Runtime",level:"Basic",type:"Concept",
q:"CommonJS vs ES modules in Node.js: what are the differences, and what practical problems do they cause in a NestJS/TypeScript service?",
a:`<p><b>CommonJS</b> (<code>require</code>/<code>module.exports</code>) loads synchronously and resolves at runtime; <code>require</code> can be called anywhere. <b>ES modules</b> (<code>import</code>/<code>export</code>) are statically analysable, load asynchronously, support top-level <code>await</code>, and are the JavaScript standard. Node decides per file: <code>.mjs</code>/<code>.cjs</code> extensions, or the <code>"type"</code> field in <code>package.json</code>.</p>
<p><b>Practical problems:</b></p>
<ul>
<li>NestJS projects compile TypeScript to <b>CommonJS</b> by default. More and more npm packages ship <b>ESM-only</b>. Historically, <code>require()</code> of an ESM package threw <code>ERR_REQUIRE_ESM</code>, forcing dynamic <code>import()</code> workarounds or pinning old versions. Recent Node versions (22.12+, and backported to 20.19) allow <code>require()</code> of synchronous ESM by default, which eases this a lot.</li>
<li>TypeScript's <code>module</code>/<code>moduleResolution</code> settings (<code>NodeNext</code>) must match what Node actually does. In ESM, relative imports need file extensions.</li>
<li>Test tooling (Jest) has needed extra configuration for ESM. Some teams switch to Vitest for that reason.</li>
</ul>`,
keys:["Sync/dynamic vs static/async","How Node decides module type","ESM-only packages in CJS Nest apps","require(esm) availability in newer Node","tsconfig module settings and test tooling"],
fu:[{q:"How would you consume an ESM-only package from a CommonJS NestJS app on an older Node version?",a:"Use dynamic import() inside an async function, or a provider factory that awaits the import at startup, and make sure TypeScript doesn't transpile the import() into require() (with module NodeNext, it preserves dynamic imports). Or pin the last CommonJS version of the package as a stopgap."}],
rf:["Doesn't know packages can be ESM-only","Sets random tsconfig options until it compiles"],
verify:"require(esm) default enablement by Node version (22.12+, 20.19+); confirm for your runtime."},

{id:"J003",skill:"NestJS",level:"Basic",type:"Concept",
q:"How do NestJS modules, providers and dependency injection work? What are the injection scopes?",
a:`<p>A <b>module</b> (<code>@Module</code>) groups related controllers and <b>providers</b> (services, repositories, factories) and declares:</p>
<ul>
<li><code>imports</code>: other modules whose exported providers it needs.</li>
<li><code>providers</code>: what it creates.</li>
<li><code>exports</code>: what it makes available to importers.</li>
</ul>
<p>Nest builds a DI container per application. It resolves constructor parameters by type or token (<code>@Inject(TOKEN)</code> for interfaces and values), and supports custom providers: <code>useClass</code>, <code>useValue</code>, <code>useFactory</code> (with async factories for setup like DB connections), and <code>useExisting</code>.</p>
<p><b>Scopes:</b></p>
<ul>
<li><b>DEFAULT</b> (singleton): one instance shared across the app. Most providers should be this.</li>
<li><b>REQUEST:</b> a new instance per request. The scope <b>bubbles up</b>: anything depending on a request-scoped provider also becomes request-scoped, which has a performance cost.</li>
<li><b>TRANSIENT:</b> a new instance for each consumer that injects it.</li>
</ul>`,
keys:["imports/providers/exports","Custom providers and tokens","Async factory providers","Three scopes; singleton default","Request scope bubbles up and costs performance"],
fu:[{q:"How do you get per-request data (user, tenant, correlation ID) without making half the app request-scoped?",a:"Use AsyncLocalStorage (for example through nestjs-cls) to hold request context that singleton services can read, set in middleware. Alternatively pass context explicitly as method arguments. Both avoid the request-scope bubbling cost."}],
rf:["Makes everything request-scoped","Doesn't know scope bubbling","Circular imports fixed with forwardRef everywhere"]},

{id:"J004",skill:"NestJS",level:"Basic",type:"Concept",
q:"Describe the NestJS request lifecycle. In which order do middleware, guards, interceptors, pipes and exception filters run?",
a:`<ol>
<li><b>Middleware:</b> global, then module-bound. Express- or Fastify-style functions for raw request concerns such as logging, correlation IDs, and body parsing tweaks.</li>
<li><b>Guards:</b> global, then controller, then route. They decide whether the request may proceed (authentication and authorization) and have access to the execution context and route metadata.</li>
<li><b>Interceptors (before):</b> global, controller, route. They wrap the handler, for timing, caching, or transforming the request.</li>
<li><b>Pipes:</b> validate and transform handler arguments (DTO validation, <code>ParseIntPipe</code>).</li>
<li><b>Route handler</b> (controller method).</li>
<li><b>Interceptors (after),</b> in reverse order: transform the response via the RxJS stream.</li>
<li><b>Exception filters:</b> route, controller, then global. They catch exceptions thrown anywhere above and shape the error response.</li>
</ol>
<p>Choosing the right hook matters. Auth belongs in guards, not middleware, because guards know which handler and metadata (<code>@Roles()</code>) apply. Validation belongs in pipes. Cross-cutting response shaping goes in interceptors.</p>`,
keys:["Correct order","Guards have handler metadata, middleware doesn't","Pipes for argument validation/transform","Interceptors wrap via RxJS","Filters catch and shape errors"],
fu:[{q:"Where would you put request timing that should include guard time?",a:"Middleware, or a global interceptor if you only want handler time. Interceptors run after guards, so they don't include guard time; middleware runs first and sees the whole request."}],
rf:["Does auth in middleware without route metadata","Validates manually inside every handler","Can't place pipes in the order"]},

{id:"J005",skill:"NestJS",level:"Basic",type:"Scenario",
q:"Clients send extra fields like role: 'admin' in a profile update, and they end up saved in the database. How do you fix input validation in NestJS?",
a:`<p>This is <b>mass assignment</b>: the request body is passed straight into the database update.</p>
<p><b>Fix with DTOs and a global <code>ValidationPipe</code>:</b></p>
<pre><code>// main.ts
app.useGlobalPipes(new ValidationPipe({
  whitelist: true,             // strip properties without decorators
  forbidNonWhitelisted: true,  // or reject them with 400
  transform: true,             // instantiate DTO classes, convert types
}));

// update-profile.dto.ts
export class UpdateProfileDto {
  @IsOptional() @IsString() @MaxLength(80) displayName?: string;
  @IsOptional() @IsUrl() avatarUrl?: string;
}</code></pre>
<ul>
<li>Use separate DTOs per operation (create vs update). Never reuse the database model type as the input type.</li>
<li>Map explicitly from the DTO to the update object in the service, so only intended columns can change.</li>
<li>Privileged fields (role, verified) only change through dedicated, authorised endpoints.</li>
</ul>
<p>Alternatives: zod schemas with a zod validation pipe, which also gives inferred TypeScript types.</p>`,
keys:["Names mass assignment","ValidationPipe whitelist/forbidNonWhitelisted/transform","DTO per operation, not DB model","Explicit mapping in service","Privileged fields via dedicated endpoints"],
fu:[{q:"What does transform: true change, and is there any risk?",a:"It converts plain objects into DTO class instances and primitive route or query values into declared types (string to number). Implicit conversion can surprise you: an empty string may become 0. Prefer explicit @Type() decorators or pipes where it matters."}],
rf:["Spreads req.body into an ORM update","Validates only on the client","Uses the DB schema type as request type"]},

{id:"J006",skill:"TypeScript",level:"Basic",type:"Concept",
q:"Explain type vs interface, structural typing, and the difference between any, unknown and never.",
a:`<p>TypeScript is <b>structurally typed</b>: a value is compatible with a type if it has the required shape, regardless of its declared name or class.</p>
<p><b>interface vs type:</b> both describe object shapes. Interfaces can be <b>merged</b> by redeclaring (useful for augmenting library types) and extended with <code>extends</code>. Type aliases can express <b>unions, intersections, mapped and conditional types</b>, and primitives. Common practice: interfaces for object contracts, types for unions and computed types. Consistency matters more than which you pick.</p>
<p><b>any</b> switches type checking off for that value, and it spreads. <b>unknown</b> is the safe "could be anything": you must narrow it (typeof, instanceof, a validation function) before use. Use it for external input and caught errors. <b>never</b> is the type with no values: functions that always throw, impossible branches, and exhaustiveness checks.</p>`,
keys:["Structural typing","Interface merging vs type alias expressiveness","any disables checking and spreads","unknown requires narrowing; use for external data","never for impossible cases / exhaustiveness"],
fu:[{q:"What type is the error in catch (e) under strict settings, and how should you handle it?",a:"With useUnknownInCatchVariables (part of strict), it's unknown. Narrow it: if (e instanceof Error) use e.message, otherwise convert safely. Anything can be thrown in JavaScript, not only Error objects."}],
rf:["Uses any for external data","Thinks TypeScript is nominally typed like C#","Can't explain unknown"]},

{id:"J007",skill:"TypeScript",level:"Basic",type:"Scenario",
q:"A function typed to receive User with a non-optional email crashes in production with 'Cannot read properties of undefined'. The code compiles cleanly. How is that possible, and how do you prevent it?",
a:`<p>TypeScript types are <b>erased at compile time</b>. Nothing checks them at runtime. If data comes from outside (an HTTP body, a queue message, a third-party API, a DB row with a nullable column typed as non-null, or <code>JSON.parse</code>), the type is just an <b>assertion</b> the compiler trusts. Common sources:</p>
<ul>
<li><code>as User</code> casts.</li>
<li><code>any</code> leaking in from untyped libraries or <code>JSON.parse</code>.</li>
<li>Non-null assertions (<code>!</code>).</li>
<li>Hand-written types that don't match the real schema.</li>
</ul>
<p><b>Prevention:</b></p>
<ul>
<li><b>Validate at every boundary</b> with a runtime schema: zod, valibot, or class-validator for Nest DTOs. With zod, derive the type from the schema (<code>z.infer</code>), so the type and the validation can't drift apart.</li>
<li>Derive DB types from the schema definition (Drizzle infers row types, including nullability).</li>
<li>Turn on <code>strict</code>, ban <code>as</code> casts and <code>any</code> via ESLint (<code>@typescript-eslint/no-explicit-any</code>, <code>no-unsafe-*</code> rules), and review <code>!</code> usage.</li>
</ul>`,
keys:["Types erased at runtime","Casts, any and ! as escape hatches","Runtime validation at boundaries","Types derived from schemas","Strict mode and lint rules"],
fu:[{q:"Is validating every internal function call necessary?",a:"No. Validate where untrusted or external data enters (HTTP, queues, files, third-party APIs, the DB edge). Inside the boundary, rely on the compiler. Validating everywhere costs performance and adds noise."}],
rf:["\"TypeScript guarantees types at runtime\"","Casts JSON.parse results with as","No validation library"]},

{id:"J008",skill:"Drizzle ORM",level:"Basic",type:"Concept",
q:"What is Drizzle ORM, how does it differ from Prisma or TypeORM, and how does its migration workflow work?",
a:`<p>Drizzle defines the schema <b>in TypeScript</b> (<code>pgTable('users', { id: uuid().primaryKey(), … })</code>) and infers row and insert types from it. It offers two query styles:</p>
<ul>
<li>A <b>SQL-like query builder</b> (<code>db.select().from(users).where(eq(users.id, id))</code>), which maps closely to SQL, so you know what's generated.</li>
<li>A <b>relational queries API</b> (<code>db.query.users.findMany({ with: { posts: true } })</code>) for nested loads.</li>
</ul>
<p>It's lightweight, with no code generation step and no query engine binary, which is good for serverless start-up.</p>
<ul>
<li><b>Prisma:</b> its own schema language plus a generated client, with a very high-level API. Historically it shipped a separate query engine (moved toward a TypeScript-based engine in newer versions).</li>
<li><b>TypeORM:</b> decorator-based entities with active-record or data-mapper patterns, more "classic ORM" behaviour, and a history of rough edges.</li>
</ul>
<p><b>Migrations</b> with <code>drizzle-kit</code>:</p>
<ul>
<li><code>generate</code> diffs the TypeScript schema against prior snapshots and writes SQL migration files for review.</li>
<li><code>migrate</code> applies them, tracked in a migrations table.</li>
<li><code>push</code> syncs the schema directly without migration files, which is for prototyping only.</li>
<li><code>pull</code> introspects an existing database.</li>
</ul>`,
keys:["Schema in TS, inferred types","SQL-like builder + relational API","Lightweight, serverless-friendly","Comparison to Prisma/TypeORM","generate/migrate vs push"],
fu:[{q:"Why might a team choose Drizzle over Prisma for a new PostgreSQL service?",a:"SQL transparency (queries look like SQL, which makes performance reasoning easier), no generation step or engine binary, good TypeScript inference, and easy access to PostgreSQL-specific features. Prisma offers a higher-level API and mature tooling, which some teams prefer."}],
rf:["Uses drizzle-kit push in production","Doesn't know how types are inferred","Can't compare with other ORMs"],
verify:"Prisma's engine architecture changed in recent versions; check current state before comparing."},

{id:"J009",skill:"WebSockets & Real-time",level:"Basic",type:"Concept",
q:"WebSockets, Server-Sent Events or long polling: how do you choose for a real-time feature?",
a:`<ul>
<li><b>WebSockets:</b> full-duplex, persistent connection over one TCP connection after an HTTP Upgrade. The right choice when the client also sends frequent messages: chat, typing indicators, presence, collaborative editing. It costs connection state on the server, load balancer configuration, scaling across instances, and reconnection handling.</li>
<li><b>Server-Sent Events (SSE):</b> a one-way stream from server to client over plain HTTP (<code>text/event-stream</code>), with automatic browser reconnection and <code>Last-Event-ID</code> resume built in. Simpler and proxy-friendly. Good for notifications, live feeds and LLM token streaming. The client sends data with normal HTTP requests. Under HTTP/1.1, browsers limit concurrent connections per domain.</li>
<li><b>Long polling:</b> the client makes a request that the server holds until data arrives, then the client asks again. It works everywhere and suits low-frequency updates, but has higher latency and overhead.</li>
<li><b>Mobile push</b> (APNs or FCM) for when the app is in the background. Sockets don't survive that.</li>
</ul>
<p>Choose by direction and frequency of messages, client types, and infrastructure.</p>`,
keys:["Bidirectional vs server-to-client","SSE auto-reconnect and Last-Event-ID","Long polling as fallback","Push notifications for backgrounded mobile apps","Operational cost of persistent connections"],
fu:[{q:"For streaming LLM responses to a web client, which would you use and why?",a:"Usually SSE, or a streamed HTTP response read with fetch. The flow is one-way, it works through standard HTTP infrastructure, and it's simple. WebSockets add complexity without benefit unless the app already maintains a socket."}],
rf:["WebSockets for everything","Unaware of SSE","Expects sockets to work while mobile app is backgrounded"]},

{id:"J010",skill:"WebSockets & Real-time",level:"Basic",type:"Concept",
q:"How does a WebSocket connection get established, and how do you authenticate it? What's the difference between raw WebSockets and Socket.IO?",
a:`<p>The client sends an HTTP request with <code>Upgrade: websocket</code> and a <code>Sec-WebSocket-Key</code>. The server responds <code>101 Switching Protocols</code>, and the TCP connection then carries WebSocket frames in both directions.</p>
<p><b>Authentication options:</b></p>
<ul>
<li>The browser <code>WebSocket</code> API <b>can't set custom headers</b> such as <code>Authorization</code>. Common approaches:
  <ul>
  <li>A cookie sent automatically with the upgrade request. Then check the <code>Origin</code> header to prevent cross-site WebSocket hijacking.</li>
  <li>A short-lived, single-use ticket in the query string, obtained from an authenticated HTTP endpoint just before connecting. Avoid long-lived tokens in URLs, because they end up in logs.</li>
  <li>An auth message as the first frame, with the server closing the connection if it doesn't arrive in time.</li>
  </ul></li>
<li>Native mobile clients can usually set headers.</li>
<li>Socket.IO lets clients send an <code>auth</code> payload during the handshake, which the server validates in middleware.</li>
</ul>
<p><b>Socket.IO vs raw <code>ws</code>:</b> Socket.IO is a protocol <i>on top of</i> WebSockets (with an HTTP long-polling fallback). It adds rooms, namespaces, acknowledgements, automatic reconnection, multiplexing, and adapters for scaling across servers. A Socket.IO client can't talk to a plain WebSocket server, or vice versa. Raw <code>ws</code> is lighter and standard, but you build those features yourself.</p>`,
keys:["Upgrade handshake and 101","No custom headers in browser API","Cookie+Origin, short-lived ticket, or first-message auth","Socket.IO is its own protocol with features","Trade-off of raw ws vs Socket.IO"],
fu:[{q:"Why is checking the Origin header important with cookie-based WebSocket auth?",a:"Browsers send cookies on the upgrade request from any site, and the same-origin policy doesn't block WebSocket connections. A malicious page could open a socket using the victim's cookies. Validating Origin against an allowlist prevents that."}],
rf:["Puts long-lived JWTs in the WebSocket URL","Doesn't know the browser can't set headers","Thinks Socket.IO is plain WebSockets"]},

{id:"J011",skill:"Node.js Runtime",level:"Intermediate",type:"Scenario",
q:"A NestJS API shows p99 spikes of several seconds, and health checks occasionally time out, but CPU averages only 40%. You suspect the event loop is being blocked. How do you confirm it and find the cause?",
a:`<p><b>Confirm:</b> measure <b>event loop delay</b> (<code>perf_hooks.monitorEventLoopDelay()</code>) and <b>event loop utilisation</b> (<code>performance.eventLoopUtilization()</code>), exported as metrics. Spikes of hundreds of milliseconds that line up with the latency spikes confirm blocking. Average CPU hides it: one second of blocking every 30 seconds looks idle on average.</p>
<p><b>Find it:</b></p>
<ul>
<li>Take a CPU profile during the problem (<code>node --cpu-prof</code>, the inspector attached, or Clinic.js Doctor/Flame) and look for long synchronous frames.</li>
<li>Log slow handlers with timing, around suspected code.</li>
</ul>
<p><b>Usual culprits:</b></p>
<ul>
<li>Sync crypto (<code>bcrypt.hashSync</code>, <code>pbkdf2Sync</code>).</li>
<li><code>JSON.parse</code>/<code>stringify</code> of multi-megabyte payloads.</li>
<li>Regular expressions with catastrophic backtracking on user input (ReDoS).</li>
<li>Sync file system calls (<code>readFileSync</code>) in request paths.</li>
<li>Large array sorts or transformations.</li>
<li>Image or PDF processing in process.</li>
</ul>
<p><b>Fix:</b> use the async API variants, cap payload sizes, stream large JSON, rewrite risky regexes (or use RE2), and move CPU-heavy work to <code>worker_threads</code> or a separate worker service via a queue.</p>`,
keys:["Event loop delay/utilisation metrics","Average CPU hides short blocking","CPU profiling tools","Common blocking culprits incl. ReDoS","worker_threads / offload as fix"],
trade:["worker_threads keep work in-process with lower overhead than a separate service, but share the container's CPU and memory","A separate worker service isolates load but adds a queue and deployment"],
fu:[{q:"Why do health checks fail when the event loop is blocked, even though the app is 'alive'?",a:"The health endpoint's handler also needs the event loop. If it's blocked for longer than the health-check timeout, the check fails, and the orchestrator may restart a process that would have recovered. That's another reason liveness checks need sensible timeouts and blocking needs fixing."}],
rf:["Adds more instances without measuring","Doesn't know event loop lag metrics","Moves CPU work into Promise.resolve() thinking it's async"]},

{id:"J012",skill:"Node.js Runtime",level:"Intermediate",type:"Concept",
q:"Explain streams and backpressure in Node.js. How do you stream a large file or query result to an HTTP response safely?",
a:`<p>Streams process data in chunks instead of loading it all into memory. There are four kinds: Readable, Writable, Duplex and Transform.</p>
<p><b>Backpressure:</b> when a writable's buffer exceeds its <code>highWaterMark</code>, <code>write()</code> returns <code>false</code>. The producer must stop until the <code>'drain'</code> event fires. If you ignore it, a fast source (a database cursor, a file) feeding a slow consumer (a mobile client) buffers everything in memory, defeating the purpose.</p>
<p><b>Use <code>stream.pipeline</code></b> (or <code>pipeline</code> from <code>stream/promises</code>). It wires streams together, handles backpressure, and on error or client disconnect <b>destroys all streams</b> and reports one error. Plain <code>.pipe()</code> doesn't forward errors or clean up properly.</p>
<pre><code>import { pipeline } from 'node:stream/promises';
await pipeline(
  s3Object.Body as Readable,   // source
  createGzip(),                // transform
  res,                         // HTTP response
);</code></pre>
<p>For query results, use a cursor or streaming query and transform rows to CSV or NDJSON as they come. In NestJS, return a <code>StreamableFile</code> or write to the underlying response.</p>`,
keys:["Chunked processing, four stream types","write() false / drain = backpressure","pipeline over pipe for errors and cleanup","Streaming from S3/DB to response","Nest StreamableFile"],
fu:[{q:"Async iterators can also consume streams (for await…of). Do they handle backpressure?",a:"Yes, on the reading side: the loop pulls the next chunk only after your body finishes. When writing inside the loop, you still need to respect write() returning false, or use pipeline with an async generator as a transform."}],
rf:["Reads whole files into memory to send","Uses pipe() without error handling","Doesn't know what backpressure is"]},

{id:"J013",skill:"Node.js Runtime",level:"Intermediate",type:"Scenario",
q:"The service restarts several times a day. Logs show 'unhandledRejection' right before each crash, pointing at different places. What's happening and how do you fix it?",
a:`<p>Since Node 15, an <b>unhandled promise rejection terminates the process</b> by default. The usual cause is a <b>floating promise</b>: an async call without <code>await</code> or <code>.catch</code>. Examples: <code>this.audit.log(...)</code> fire-and-forget, an async callback passed to <code>forEach</code>, an <code>async</code> event emitter listener, or <code>setTimeout(async () =&gt; …)</code>. When it rejects, nobody handles it.</p>
<p><b>Fix:</b></p>
<ul>
<li>Turn on <code>@typescript-eslint/no-floating-promises</code> and <code>no-misused-promises</code> as errors. That finds them statically.</li>
<li>For intentional fire-and-forget work, attach an explicit <code>.catch()</code> that logs, or better, send the work to a queue.</li>
<li>Replace <code>forEach(async …)</code> with <code>for…of</code> plus <code>await</code>, or <code>Promise.all</code>/<code>Promise.allSettled</code>.</li>
<li>Register <code>process.on('unhandledRejection')</code> and <code>uncaughtException</code> handlers that <b>log with context and then exit</b>. Don't keep running in an unknown state; let the orchestrator restart it.</li>
</ul>`,
keys:["Node 15+ default crash on unhandled rejection","Floating promise patterns","Lint rules to catch them","Explicit catch or queue for fire-and-forget","Global handler logs then exits"],
fu:[{q:"Why not just add a global handler that logs and keeps the process running?",a:"After an unexpected rejection you don't know what state the app is in: half-finished operations, held locks, broken connections. Crashing and restarting is safer. Handle expected failures where they occur instead."}],
rf:["Sets --unhandled-rejections=warn to stop crashes","Wraps everything in try/catch without awaiting","forEach with async callbacks"]},

{id:"J014",skill:"Node.js Runtime",level:"Intermediate",type:"Architecture",
q:"How should you run Node.js services on ECS or Kubernetes: one process per container, or the cluster module / PM2? How do you size CPU and memory?",
a:`<p>In containers, the norm is <b>one Node process per container</b>, scaling horizontally with more tasks. The orchestrator already provides what the cluster module and PM2 were built for: restarts, multiple instances and load balancing, plus health checks and per-instance metrics. Running PM2 or <code>cluster</code> inside a container adds a second supervisor, hides crashes from the orchestrator, and makes memory limits harder to reason about.</p>
<p><b>Sizing:</b></p>
<ul>
<li><b>CPU:</b> one process uses about one core for JavaScript (plus the libuv pool and GC threads). Tasks with 4 vCPU running one process waste most of it. Use about 1 vCPU per task (0.5–1 for I/O-heavy APIs) and scale out.</li>
<li><b>Memory:</b> set V8's old-space limit explicitly (<code>--max-old-space-size</code>) to roughly 70–80% of the container limit, leaving room for buffers, native memory and stacks. Otherwise the heap may grow until the container is killed, or GC may thrash.</li>
<li><b>CPU-bound work:</b> <code>worker_threads</code> inside the process, or separate worker services.</li>
</ul>
<p>Exceptions where cluster mode can make sense: VMs or bare hosts without an orchestrator, or very large hosts where you deliberately want several processes per machine.</p>`,
keys:["One process per container; orchestrator handles supervision","PM2/cluster duplicates orchestration","CPU sizing for single-threaded runtime","Explicit heap limit vs container memory","worker_threads for CPU-heavy work"],
trade:["Many small tasks: better isolation and scaling granularity, more per-task overhead","Few big tasks with cluster: fewer containers but hidden failures and harder memory management","It depends on: orchestrator, workload CPU profile"],
fu:[{q:"A task keeps getting OOM-killed although the heap graph looks fine. What else uses memory?",a:"Buffers (outside the V8 heap), native addons, large numbers of open sockets and their buffers, and the libuv pool. Monitor RSS rather than only heap, check process.memoryUsage().external and arrayBuffers, and set the heap limit with headroom for these."}],
rf:["PM2 with 4 workers in a 1 vCPU container","No heap limit configured","Gives Node tasks 4 vCPU each for one process"]},

{id:"J015",skill:"NestJS",level:"Intermediate",type:"Concept",
q:"How do you implement authentication and role-based authorization in NestJS so that every route is protected by default?",
a:`<ul>
<li><b>Authentication guard:</b> a JWT guard (with <code>@nestjs/passport</code> and passport-jwt, or a custom guard using <code>jose</code>) that validates signature, issuer, audience and expiry, and attaches the user to the request.</li>
<li><b>Protect by default:</b> register it as a <b>global guard</b> (<code>APP_GUARD</code> provider). Mark exceptions with a custom <code>@Public()</code> decorator, which the guard checks via <code>Reflector</code>. A forgotten decorator then means "protected", not "open".</li>
<li><b>Authorization:</b> a <code>RolesGuard</code> reading <code>@Roles('admin')</code> metadata with <code>Reflector.getAllAndOverride</code> (handler first, then class), comparing with the user's roles or scopes.</li>
<li><b>Resource ownership</b> ("can this user edit this group?") belongs in the service or a policy layer (for example CASL), after loading the resource. Guards don't have the resource.</li>
</ul>
<pre><code>@Injectable()
export class JwtAuthGuard extends AuthGuard('jwt') {
  constructor(private reflector: Reflector) { super(); }
  canActivate(ctx: ExecutionContext) {
    const isPublic = this.reflector.getAllAndOverride&lt;boolean&gt;(IS_PUBLIC, [ctx.getHandler(), ctx.getClass()]);
    return isPublic ? true : super.canActivate(ctx);
  }
}</code></pre>`,
keys:["Global guard with @Public opt-out","Reflector metadata for roles","Token validation details","Ownership checks after loading resource","CASL/policy option"],
fu:[{q:"How do you apply the same auth to WebSocket gateways?",a:"Guards also work on gateways, but they get a WebSocket execution context: read the token from the handshake (client.handshake.auth) and throw WsException. Better still, authenticate once at connection time and disconnect unauthorised sockets."}],
rf:["Per-route guards with no default","Role checks hard-coded in each handler","No ownership checks"]},

{id:"J016",skill:"NestJS",level:"Intermediate",type:"Scenario",
q:"Error responses are inconsistent: some return stack traces, some return 500 for validation problems, and the mobile team can't parse errors reliably. How do you standardise error handling in NestJS?",
a:`<ul>
<li><b>One global exception filter</b> (<code>APP_FILTER</code>) that catches everything:
  <ul>
  <li><code>HttpException</code> subclasses keep their status.</li>
  <li><b>Domain errors</b> (your own classes such as <code>NotFoundError</code>, <code>ConflictError</code>, <code>BusinessRuleError</code>) map to 404, 409 and 422.</li>
  <li>Database errors map where meaningful: a PostgreSQL unique violation (<code>23505</code>) becomes 409.</li>
  <li>Everything else becomes a generic 500 <b>without internal details</b>, with the full error logged server-side.</li>
  </ul></li>
<li><b>One response shape</b> for all errors, ideally Problem Details style: <code>type</code>, <code>title</code>, <code>status</code>, a stable machine-readable <code>code</code>, field errors for validation, and <code>traceId</code>.</li>
<li>Have <code>ValidationPipe</code>'s <code>exceptionFactory</code> produce the same shape with field-level errors.</li>
<li>Services throw domain errors, not <code>HttpException</code>, which keeps HTTP concerns out of business logic and reusable from queue consumers.</li>
<li>Document the error codes in the OpenAPI spec. The mobile app switches on <code>code</code>, never on message text.</li>
</ul>`,
keys:["Global filter catching all","Domain errors mapped centrally","DB error mapping (23505 → 409)","Single documented shape with codes and traceId","No stack traces to clients"],
fu:[{q:"Why shouldn't services throw HttpException?",a:"It ties business logic to HTTP. The same service called from a Kafka consumer or cron job then throws HTTP-specific errors that make no sense there. Domain errors mapped at the edge keep each transport responsible for its own representation."}],
rf:["Returns err.stack in responses","Each controller formats its own errors","Clients parse message strings"]},

{id:"J017",skill:"NestJS",level:"Intermediate",type:"Concept",
q:"What are NestJS interceptors good for? Give examples, and explain how their RxJS-based design works.",
a:`<p>An interceptor implements <code>intercept(context, next)</code>. Code before <code>next.handle()</code> runs before the handler. <code>next.handle()</code> returns an <b>Observable</b> of the handler's result, which the interceptor can transform with RxJS operators, so it wraps both sides.</p>
<p>Typical uses:</p>
<ul>
<li><b>Timing and logging:</b> record start, then <code>tap()</code> to log duration on completion.</li>
<li><b>Response shaping:</b> <code>map()</code> to wrap responses in an envelope or strip fields. Use sparingly; consistent DTOs are often cleaner.</li>
<li><b>Timeouts:</b> <code>timeout(5000)</code> plus <code>catchError</code>, converting to a 503 or 504 when the handler runs too long. This doesn't cancel the underlying work unless you pass an abort signal down.</li>
<li><b>Caching:</b> return a cached Observable (<code>of(cached)</code>) without calling <code>next.handle()</code>. Nest's <code>CacheInterceptor</code> does this.</li>
<li><b>Error mapping</b> with <code>catchError</code> for specific routes.</li>
</ul>
<pre><code>intercept(ctx: ExecutionContext, next: CallHandler) {
  const start = performance.now();
  return next.handle().pipe(
    tap(() =&gt; this.metrics.observe(routeOf(ctx), performance.now() - start)),
  );
}</code></pre>`,
keys:["Wraps before and after via Observable","tap/map/timeout/catchError uses","Short-circuit for caching","Timeout doesn't cancel underlying work","Prefer DTOs over heavy response mutation"],
fu:[{q:"Interceptor vs middleware for request logging: which would you use?",a:"Middleware sees every request (including ones rejected by guards or unmatched routes) and is framework-agnostic. An interceptor knows the handler and can log the result. Often both are used: middleware for access logs, interceptors for handler-level metrics."}],
rf:["Thinks timeout() aborts the DB query","Uses interceptors for auth","Can't explain next.handle()"]},

{id:"J018",skill:"NestJS",level:"Intermediate",type:"Scenario",
q:"A deploy went out with a missing environment variable. The app started fine, then failed on the first request needing it, 20 minutes later. How should configuration work in a NestJS service?",
a:`<ul>
<li><b>Validate at startup and fail fast:</b> <code>ConfigModule.forRoot({ validate })</code> with a zod or Joi schema covering every variable (types, formats, required). The app refuses to start with clear errors, so the deploy's health check fails and the rollout stops before traffic arrives.</li>
<li><b>Typed config access:</b> namespaced config (<code>registerAs('db', …)</code>) injected as a typed object, instead of <code>process.env.X</code> scattered across the code.</li>
<li><b>Secrets:</b> load from AWS Secrets Manager or SSM Parameter Store at bootstrap (an async config factory), or inject via ECS task definition <code>secrets</code>, which map Secrets Manager or SSM values into environment variables at container start. Never bake secrets into images or commit <code>.env</code> files.</li>
<li><b>Per-environment differences</b> live in deployment config (task definitions, Terraform), not in code branches.</li>
<li>Prefer dependency injection of config into providers, so tests can supply values.</li>
</ul>`,
keys:["Schema validation at startup","Fail before traffic (health check blocks rollout)","Typed namespaced config","Secrets via Secrets Manager/SSM/ECS secrets","No secrets in images or repos"],
fu:[{q:"How do you rotate a secret without redeploying when ECS injects it as an environment variable?",a:"Environment variables are fixed at container start, so rotation needs new tasks (a forced redeployment), or the app must read the secret at runtime through the SDK with caching and refresh. For frequently rotated database credentials, runtime retrieval or IAM authentication avoids redeploys."}],
rf:["process.env reads throughout the code","Defaults that hide missing config","Secrets in the Docker image"]},

{id:"J019",skill:"TypeScript",level:"Intermediate",type:"Concept",
q:"How do you use discriminated unions and exhaustiveness checking to model domain states in TypeScript?",
a:`<p>A <b>discriminated union</b> is a union of object types sharing a literal "tag" property. TypeScript <b>narrows</b> to the right member when you check the tag:</p>
<pre><code>type Payment =
  | { status: 'pending';   createdAt: Date }
  | { status: 'captured';  capturedAt: Date; providerRef: string }
  | { status: 'failed';    reason: string };

function label(p: Payment): string {
  switch (p.status) {
    case 'pending':  return 'Waiting';
    case 'captured': return 'Paid ' + p.providerRef;   // narrowed
    case 'failed':   return 'Failed: ' + p.reason;
    default: {
      const unreachable: never = p;   // compile error if a status is added and not handled
      return unreachable;
    }
  }
}</code></pre>
<p>Benefits: impossible states can't be represented (a failed payment can't have a <code>providerRef</code>), fields are only accessible in the right state, and adding a new state forces every switch to handle it at compile time.</p>
<p>Use them for API responses, events, state machines and result types (<code>{ ok: true; value } | { ok: false; error }</code>).</p>`,
keys:["Literal tag + narrowing","never-based exhaustiveness check","Make impossible states unrepresentable","Use cases: events, states, results"],
fu:[{q:"How do you validate an incoming event payload into such a union at runtime?",a:"With a zod discriminatedUnion('type', [...]) schema (or equivalent), which validates and returns the correctly narrowed type. That keeps runtime validation and compile-time types in one definition."}],
rf:["Uses optional fields for every state","Doesn't know the never trick","Casts to the expected member"]},

{id:"J020",skill:"TypeScript",level:"Intermediate",type:"Concept",
q:"Show how generics and utility types help you build a type-safe API client or service layer. Which utility types do you use most?",
a:`<p><b>Generics</b> let one implementation work over many types while keeping the relationship between input and output types:</p>
<pre><code>type Endpoints = {
  'GET /groups/:id': { params: { id: string }; response: GroupDto };
  'POST /posts':     { body: CreatePostDto;     response: PostDto };
};

async function call&lt;K extends keyof Endpoints&gt;(
  route: K,
  input: Omit&lt;Endpoints[K], 'response'&gt;,
): Promise&lt;Endpoints[K]['response']&gt; { /* … */ }

const group = await call('GET /groups/:id', { params: { id } }); // typed as GroupDto</code></pre>
<p><b>Common utility types:</b></p>
<ul>
<li><code>Partial&lt;T&gt;</code> and <code>Required&lt;T&gt;</code> for update shapes.</li>
<li><code>Pick</code> and <code>Omit</code> for derived DTOs.</li>
<li><code>Record&lt;K, V&gt;</code> for maps.</li>
<li><code>Readonly&lt;T&gt;</code>.</li>
<li><code>ReturnType</code>, <code>Parameters</code> and <code>Awaited</code> to derive types from functions.</li>
<li><code>NonNullable</code>.</li>
<li>Conditional types with <code>infer</code> for extracting inner types.</li>
</ul>
<p>The aim is to derive types from one source of truth (a schema, a route map, an OpenAPI spec) instead of writing parallel definitions that drift. Generating clients from the backend's OpenAPI spec (openapi-typescript) is often better than hand-maintained maps.</p>`,
keys:["Generics preserve input/output relationships","Keyed route map pattern","Practical utility types","Single source of truth / codegen","Avoid parallel hand-written types"],
fu:[{q:"When do complex generic types become a liability?",a:"When teammates can't read or modify them, error messages become pages long, or compile times grow. Keep advanced types inside a small library with tests (expect-type or tsd), and expose simple types to the rest of the code."}],
rf:["Duplicates DTO types by hand everywhere","Uses any in generics","Over-engineered types nobody understands"]},

{id:"J021",skill:"TypeScript",level:"Intermediate",type:"Scenario",
q:"A two-year-old TypeScript codebase has strict off, hundreds of anys, and frequent undefined errors in production. How do you raise type safety without stopping feature work?",
a:`<ol>
<li><b>Measure the baseline:</b> count <code>any</code>s (typescript-coverage-report or similar) and the errors you'd get under <code>strict</code>.</li>
<li><b>Enable strict flags one at a time,</b> in order of value. <code>strictNullChecks</code> catches the undefined errors you're seeing, and gives the most value. Then <code>noImplicitAny</code>, <code>strictFunctionTypes</code>, and later <code>noUncheckedIndexedAccess</code> (array and record indexing returns <code>T | undefined</code>).</li>
<li><b>Ratchet, don't block:</b>
  <ul>
  <li>Apply the stricter config to new or touched files (a separate tsconfig for strict paths, or a tool like betterer that records current errors and fails only on new ones).</li>
  <li>Add ESLint rules (<code>no-explicit-any</code>, <code>no-unsafe-*</code>) as warnings now, errors for new code.</li>
  <li>Track the count going down per sprint.</li>
  </ul></li>
<li><b>Fix boundaries first:</b> validate HTTP and queue inputs with schemas and derive types from them. Replace hand-written DB types with inferred ones. This is where most <code>undefined</code> surprises enter.</li>
</ol>`,
keys:["Baseline measurement","strictNullChecks first for undefined bugs","Ratcheting (betterer / per-path configs)","Lint rules for any","Fix boundaries with runtime validation"],
trade:["A big-bang strict switch gives safety fast but stalls delivery and invites ! and as hacks","Ratcheting is slower but sustainable"],
fu:[{q:"Developers 'fix' strict errors with ! and as casts. How do you stop that?",a:"Lint rules that flag non-null assertions and unsafe casts (allowed with an explanatory comment), review guidance, and making the right fix easy: helpers for narrowing, validated input types, and inferred DB types."}],
rf:["Turns on strict globally in one PR","Accepts ! everywhere","No measurement"]},

{id:"J022",skill:"Drizzle ORM",level:"Intermediate",type:"Scenario",
q:"A developer ran drizzle-kit push against staging, and later the same was done in production to 'quickly fix' a column. Now migrations fail with conflicts. How do you recover, and what process do you set?",
a:`<p><code>push</code> applies the schema diff directly <b>without writing migration files or recording history</b>. The database now differs from what the migration history says, so the next <code>migrate</code> tries to apply changes that already exist (or conflict), and fails.</p>
<p><b>Recover:</b></p>
<ol>
<li>Introspect the real production schema (<code>drizzle-kit pull</code>, or <code>pg_dump --schema-only</code>) and compare it with the schema the migrations would produce.</li>
<li>Write a reconciling migration that brings history and reality back in line. Sometimes that means marking a migration as applied in the migrations table, after verifying the change really is present. Test the full sequence on a copy of production.</li>
<li>Check that data wasn't lost: <code>push</code> may drop and recreate columns on some diffs.</li>
</ol>
<p><b>Process:</b></p>
<ul>
<li><code>push</code> only against local or ephemeral databases.</li>
<li>Shared environments change only through <code>generate</code>d migration files, reviewed in PRs (read the SQL) and applied by the pipeline (<code>migrate</code>) before the app deploy.</li>
<li>Production DB credentials with DDL rights are available only to the pipeline.</li>
<li>CI checks that the schema and migrations are in sync (<code>drizzle-kit check</code>, or generate and expect no diff).</li>
</ul>`,
keys:["push bypasses migration history","Introspect and reconcile carefully","Possible data loss check","generate + review + pipeline migrate","Least privilege; CI sync check"],
fu:[{q:"A generated migration renames a column. What do you check in the SQL before merging?",a:"Whether it generated a rename or a drop-and-add (which loses data); drizzle-kit asks interactively, but review the SQL anyway. Also check that old application versions still running during deploy can work with the new schema. If not, use expand and contract."}],
rf:["Keeps using push in production","Deletes the migrations folder and starts over","No review of generated SQL"]},

{id:"J023",skill:"WebSockets & Real-time",level:"Intermediate",type:"Scenario",
q:"Mobile users of your group chat say messages sometimes go missing or appear only after reopening the app. The socket server shows frequent disconnects. How do you make delivery reliable?",
a:`<p>Mobile connections drop constantly (network switches, background, tunnels), and a socket "send" isn't a delivery guarantee. Design for disconnects:</p>
<ul>
<li><b>Server-assigned order:</b> every message is persisted first, then gets a per-conversation <b>sequence number</b> (or a monotonic ID). Persistence is the source of truth; the socket is only a notification channel.</li>
<li><b>Resume on reconnect:</b> the client remembers the last sequence it has per conversation. After reconnecting, it asks for "messages after N" via the socket or an HTTP endpoint, and the server returns the gap. Socket.IO's connection-state recovery (v4.6+) helps for short disconnects, but a durable catch-up API is still needed for longer ones.</li>
<li><b>Client sends are idempotent:</b> the client generates a <code>clientMessageId</code>. The server acknowledges with the assigned sequence, and the client retries until acknowledged. The server deduplicates on the client ID.</li>
<li><b>Liveness:</b> heartbeats (ping/pong) at an interval shorter than load balancer and NAT idle timeouts (the ALB default is 60 seconds). Reconnect with exponential backoff and jitter.</li>
<li><b>Background:</b> when the app is backgrounded, deliver via push notification, and sync on resume.</li>
</ul>`,
keys:["Persist first; socket as notification","Per-conversation sequence numbers","Catch-up by last-seen sequence","Idempotent client sends with ack","Heartbeats under idle timeouts; backoff; push for background"],
trade:["Catch-up over HTTP is simple and cacheable; over the socket avoids an extra connection","Shorter heartbeats detect drops faster but cost battery and bandwidth on mobile"],
fu:[{q:"Two messages from different users arrive at nearly the same time. How do you keep a consistent order for all members?",a:"Let the server assign the order: a per-conversation sequence incremented atomically in the database (or the order of a single partition keyed by conversation ID). Clients sort by that sequence, never by their own clock."}],
rf:["Relies on the socket emit as delivery","Orders by client timestamps","No dedup on retries"]},

{id:"J024",skill:"WebSockets & Real-time",level:"Intermediate",type:"Architecture",
q:"Your NestJS Socket.IO gateway runs on one instance. You need to scale to six instances behind an ALB. What has to change?",
a:`<ul>
<li><b>Cross-instance delivery:</b> users in the same room may be connected to different instances. An emit on instance A only reaches sockets on A. Add an <b>adapter</b>: the Socket.IO Redis adapter (Redis pub/sub, or the Redis Streams adapter) broadcasts room emits to all instances. In NestJS, configure a custom <code>IoAdapter</code> that uses it.</li>
<li><b>Sticky sessions:</b> Socket.IO starts with HTTP long-polling by default before upgrading, so the polling requests of one session must reach the same instance. Enable ALB target-group stickiness, or configure clients to use the WebSocket transport only.</li>
<li><b>Load balancer:</b> the ALB supports WebSockets natively. Its idle timeout (60 seconds by default) closes silent connections, so heartbeats must be shorter.</li>
<li><b>State:</b> presence ("who's online"), typing indicators and per-user socket lookups can't live in process memory. Move them to Redis with TTLs.</li>
<li><b>Deploys:</b> rolling restarts disconnect everyone on the old tasks. Clients need jittered reconnect so they don't stampede, and tasks should drain gradually.</li>
</ul>`,
keys:["Adapter/backplane for cross-instance broadcasts","Sticky sessions or websocket-only transport","ALB idle timeout + heartbeats","Shared state (presence) in Redis","Reconnect storms on deploys"],
trade:["Redis pub/sub adapter is simple but fire-and-forget (no delivery if an instance is briefly disconnected); the streams adapter adds durability at some cost","WebSocket-only transport removes the stickiness need but drops the polling fallback for restrictive networks"],
fu:[{q:"How many concurrent connections can one Node instance hold?",a:"Tens of thousands of idle connections is feasible; the real limits are memory per connection, message throughput, CPU for serialisation and broadcast fan-out, and file-descriptor limits. Load test with realistic message rates rather than idle connections."}],
rf:["Scales out without an adapter","Keeps presence in memory","Doesn't consider deploy disconnects"]},

{id:"J025",skill:"WebSockets & Real-time",level:"Intermediate",type:"Concept",
q:"How do you handle authorization for WebSocket messages, not just the connection? What about tokens expiring on a connection that stays open for hours?",
a:`<ul>
<li><b>At connection:</b> authenticate in the handshake (Socket.IO middleware or a Nest gateway's <code>handleConnection</code>). Attach the user to the socket, or disconnect immediately.</li>
<li><b>Per action:</b> every <b>room join</b> checks membership ("is this user a member of group X?") on the server. Clients must never choose rooms freely. Every <b>emit from the client</b> (send message, react, delete) is authorised against current permissions, just like an HTTP endpoint. Validate payloads with the same DTO validation.</li>
<li><b>Membership changes:</b> when a user is removed from a group or blocked, the server must remove their sockets from that room immediately (<code>socketsLeave</code> across instances via the adapter). Otherwise they keep receiving messages.</li>
<li><b>Token expiry:</b> the connection outlives the access token. Either record the token expiry and have the server disconnect, or ask for re-auth when it passes, letting the client reconnect with a fresh token. Or support an in-band re-authentication message. Revoked sessions (logout, password reset) should trigger server-side disconnects.</li>
<li><b>Rate-limit</b> client emits per socket and per user to prevent spam.</li>
</ul>`,
keys:["Handshake auth plus per-action checks","Server-controlled room membership","Immediate removal on membership change","Token expiry / revocation handling","Validation and rate limits on emits"],
fu:[{q:"A user is removed from a private group while connected. Walk through what happens.",a:"The membership service updates the database, then publishes a MemberRemoved event. The socket layer calls socketsLeave for that user's sockets in that room via the adapter (all instances) and emits a 'removed' event to the user. Message fan-out also checks membership at send time as a safety net."}],
rf:["Trusts client-supplied room names","Checks auth only at connection","Ignores token expiry on long-lived sockets"]},

{id:"J026",skill:"NestJS",level:"Intermediate",type:"Concept",
q:"How do you test a NestJS application: unit tests for providers, and end-to-end tests of the HTTP layer with a real database?",
a:`<p><b>Unit tests:</b> build a small module with <code>Test.createTestingModule({ providers: [GroupsService, { provide: GroupsRepository, useValue: fakeRepo }] })</code>, then <code>compile()</code> and <code>get(GroupsService)</code>. Override only true boundaries (repositories, external clients, clock). Keep business logic in plain classes that need no Nest at all, so most unit tests are just <code>new Service(fakes)</code>.</p>
<p><b>End-to-end / integration tests:</b> create the <b>real <code>AppModule</code></b> with selective overrides (<code>.overrideProvider(PushClient).useValue(fake)</code>), call <code>app.init()</code>, and drive it with <code>supertest(app.getHttpServer())</code>. That exercises the real guards, pipes, filters and serialisation. Use a real PostgreSQL through Testcontainers, apply migrations once, and reset data between tests (truncate, or a transaction per test). Remember to apply the same global pipes, filters and prefixes as <code>main.ts</code>; a shared <code>configureApp(app)</code> function avoids drift.</p>`,
keys:["createTestingModule with targeted overrides","Plain classes for most logic","E2E through AppModule + supertest","Real Postgres via Testcontainers","Share bootstrap config with main.ts"],
fu:[{q:"E2E tests pass, but production rejects requests that tests accepted. What's a likely cause?",a:"The test app wasn't configured like main.ts: missing global ValidationPipe options, a global prefix, CORS or filters. Extract the setup into one function used by both main.ts and tests."}],
rf:["Mocks every provider including the database layer in 'e2e' tests","Duplicates bootstrap config in tests","No DB in tests"]},

{id:"J027",skill:"Drizzle ORM",level:"Intermediate",type:"Scenario",
q:"Creating a group writes the group row and the owner's membership row inside db.transaction(). Sometimes a group exists with no owner. The transaction looks correct. What's the bug?",
a:`<p>The classic mistake: inside <code>db.transaction(async (tx) =&gt; { … })</code>, some writes use <b><code>db</code></b> (the global client) instead of <b><code>tx</code></b>. Writes made through <code>db</code> run on a different pooled connection, <b>outside the transaction</b>. They commit independently, and a later failure rolls back only the <code>tx</code> writes. This happens easily when a service method called inside the transaction uses its injected <code>db</code>.</p>
<pre><code>await db.transaction(async (tx) =&gt; {
  const [group] = await tx.insert(groups).values(input).returning();
  await this.members.addOwner(group.id, userId, tx);   // pass tx through
});

// repository method accepts an optional executor
addOwner(groupId: string, userId: string, exec: DbOrTx = this.db) {
  return exec.insert(groupMembers).values({ groupId, userId, role: 'owner' });
}</code></pre>
<p><b>Fixes:</b></p>
<ul>
<li>Pass <code>tx</code> explicitly to every call inside the transaction, typed so repositories accept <code>db | tx</code>.</li>
<li>Or use a request or transaction context through AsyncLocalStorage (for example nestjs-cls with a transactional plugin), so repositories automatically pick up the active transaction.</li>
<li>Add a test that forces a failure after the first write and asserts nothing persisted.</li>
<li>Back invariants with constraints where possible, for example a deferred check or a job that flags groups without an owner.</li>
</ul>`,
keys:["Global db vs tx inside transaction","Different pooled connection = outside transaction","Pass executor explicitly or via ALS context","Failure-injection test","Constraints as backstop"],
fu:[{q:"What does a nested db.transaction inside an outer tx do in Drizzle?",a:"Calling tx.transaction() creates a savepoint, so the inner block can roll back on its own without aborting the outer transaction, while the outer rollback still undoes everything."}],
rf:["Blames the database","Adds retries","Doesn't consider connection pooling"]},

{id:"J028",skill:"WebSockets & Real-time",level:"Intermediate",type:"Concept",
q:"Some clients are on slow mobile networks and can't keep up with the message rate in busy groups. What happens on the server, and how do you handle slow consumers?",
a:`<p>Each socket has an outgoing buffer. If the server writes faster than the client reads, data piles up in memory per socket (<code>bufferedAmount</code> on the raw <code>ws</code> socket). With thousands of slow clients this becomes a memory problem for the whole process, and latency for those clients grows without bound.</p>
<p><b>Handling:</b></p>
<ul>
<li><b>Monitor</b> per-socket buffered bytes, and cap them. Above a threshold, stop sending non-essential events to that socket, or disconnect it so the client reconnects and catches up through the history API.</li>
<li><b>Classify messages:</b> durable messages (chat) are persisted, so they can be fetched later. Ephemeral events (typing, presence, live reaction counts) can be dropped. Socket.IO's <code>volatile</code> emits drop if the transport isn't ready.</li>
<li><b>Coalesce and batch:</b> send "12 new reactions" or a state snapshot periodically instead of every individual event.</li>
<li><b>Compress</b> where it helps (permessage-deflate costs CPU and memory per connection, so measure).</li>
</ul>`,
keys:["Per-socket buffers grow with slow readers","Process-wide memory risk","Cap and disconnect / degrade","Durable vs ephemeral messages; volatile emits","Coalescing/batching"],
fu:[{q:"Why can permessage-deflate hurt at scale?",a:"Each connection keeps compression context (zlib windows) in memory, and compression costs CPU per message. With tens of thousands of connections that adds up. Enable it selectively, tune window sizes, or compress only large payloads."}],
rf:["Assumes sends are free","Treats typing indicators like durable messages","No buffer monitoring"]},
